    <script>
        const CSV_URL = "projects.csv";

        const DEFAULT_EMOJIS = ["🦖", "🐱", "🐢", "🔮", "🧊", "🫧", "🐱", "🍳", "✨"];
        // 平時：柔和淺粉綠頂部橫條漸層
        const MINT_GRADIENTS = [
            "from-emerald-100 via-teal-100 to-green-100",
            "from-teal-100 via-emerald-100 to-cyan-100",
            "from-green-100 via-emerald-100 to-teal-100"
        ];
        // 平時：柔和粉綠標籤
        const MINT_BADGES = [
            "bg-emerald-100/80 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200",
            "bg-teal-100/80 text-teal-800 dark:bg-teal-900/50 dark:text-teal-200",
            "bg-green-100/80 text-green-800 dark:bg-green-900/50 dark:text-green-200"
        ];

        let projectsData = [];
        let currentAuthor = "全部";
        let currentSearchQuery = "";

        const dateSectionsContainer = document.getElementById("dateSectionsContainer");
        const authorFiltersContainer = document.getElementById("authorFilters");
        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const visibleCountEl = document.getElementById("visibleCount");
        const totalCountEl = document.getElementById("totalCount");
        const emptyState = document.getElementById("emptyState");
        const emptyTitle = document.getElementById("emptyTitle");
        const emptyDesc = document.getElementById("emptyDesc");
        const resetFilterBtn = document.getElementById("resetFilterBtn");
        const csvFileInput = document.getElementById("csvFileInput");
        const csvStatusText = document.getElementById("csvStatusText");

        const previewModal = document.getElementById("previewModal");
        const modalContainer = document.getElementById("modalContainer");
        const modalTitle = document.getElementById("modalTitle");
        const modalAuthor = document.getElementById("modalAuthor");
        const modalEmoji = document.getElementById("modalEmoji");
        const modalExternalLink = document.getElementById("modalExternalLink");
        const projectIframe = document.getElementById("projectIframe");
        const iframeLoader = document.getElementById("iframeLoader");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const reloadIframeBtn = document.getElementById("reloadIframeBtn");

        function inferTitleFromUrl(url, author, fallbackNum) {
            try {
                const decoded = decodeURIComponent(url.split("?")[0]);
                const fileName = decoded.split("/").pop() || "";
                const baseName = fileName.replace(/\.html?$/i, "").trim();
                if (!baseName) return `作品 #${fallbackNum}`;
                if (author) {
                    const cleaned = baseName
                        .replace(new RegExp(`[\\s_\\-]*${escapeRegExp(author)}$`), "")
                        .trim();
                    if (cleaned) return cleaned;
                }
                return baseName;
            } catch {
                return `作品 #${fallbackNum}`;
            }
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function parseDateScore(dateStr) {
            const raw = (dateStr || "").trim();
            if (!raw) return -Infinity;
            const normalized = raw.replace(/[./]/g, "-");
            const ts = Date.parse(normalized);
            if (!Number.isNaN(ts)) return ts;
            const digits = raw.replace(/\D/g, "");
            return digits ? Number(digits) : -Infinity;
        }

        function parseCSV(csvText) {
            const cleanText = csvText.replace(/^\uFEFF/, "");
            const rows = [];
            let currentRow = [];
            let currentField = "";
            let inQuotes = false;

            for (let i = 0; i < cleanText.length; i++) {
                const char = cleanText[i];
                const nextChar = cleanText[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        currentField += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ",") {
                        currentRow.push(currentField.trim());
                        currentField = "";
                    } else if (char === "\r" && nextChar === "\n") {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                        i++;
                    } else if (char === "\n" || char === "\r") {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                    } else {
                        currentField += char;
                    }
                }
            }

            if (currentField.length > 0 || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }

            const nonEmptyRows = rows.filter(row => row.some(cell => cell !== ""));
            if (nonEmptyRows.length < 2) return [];

            const headers = nonEmptyRows[0].map(h => h.trim().toLowerCase());
            const records = [];

            for (let r = 1; r < nonEmptyRows.length; r++) {
                const row = nonEmptyRows[r];
                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header] = row[idx] !== undefined ? row[idx] : "";
                });

                const author = obj.author || "未具名同學";
                const rawUrl = obj.url || obj.rawurl || "";
                const tag = obj.tag || "創意互動";
                const date = obj.date || "";

                if (!rawUrl && !obj.author) continue;

                const parsedId = Number(obj.id);
                const id = Number.isFinite(parsedId) && parsedId > 0 ? parsedId : r;
                const title = obj.title || inferTitleFromUrl(rawUrl, author, id);

                records.push({
                    id,
                    title,
                    author,
                    rawUrl,
                    tag,
                    date,
                    emoji: DEFAULT_EMOJIS[(id - 1) % DEFAULT_EMOJIS.length],
                    gradient: MINT_GRADIENTS[(id - 1) % MINT_GRADIENTS.length],
                    badgeBg: MINT_BADGES[(id - 1) % MINT_BADGES.length]
                });
            }

            return records;
        }

        function loadCSVString(csvText, sourceLabel = "projects.csv") {
            projectsData = parseCSV(csvText);
            currentAuthor = "全部";
            totalCountEl.textContent = projectsData.length;

            if (projectsData.length === 0) {
                csvStatusText.textContent = `⚠️ ${sourceLabel} 中沒有可用的作品資料，請確認欄位（id,author,url,tag,date）。`;
                authorFiltersContainer.innerHTML = "";
                visibleCountEl.textContent = "0";
                dateSectionsContainer.innerHTML = "";
                emptyTitle.textContent = "尚無可顯示的作品資料";
                emptyDesc.textContent = "請確認 CSV 包含標題列（id,author,url,tag,date）與作品資料列。";
                emptyState.classList.remove("hidden");
                return;
            }

            csvStatusText.textContent = `✅ 已從 ${sourceLabel} 載入 ${projectsData.length} 件作品`;
            initAuthorFilters();
            renderProjects();
        }

        async function fetchCSVFromServer() {
            try {
                const response = await fetch(`${CSV_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                loadCSVString(text, CSV_URL);
            } catch {
                csvStatusText.textContent = `ℹ️ 無法自動讀取 ${CSV_URL}，請點選右上角「📂 載入 CSV」選擇檔案。`;
                totalCountEl.textContent = "0";
                visibleCountEl.textContent = "0";
                emptyTitle.textContent = "尚未載入 projects.csv";
                emptyDesc.textContent = "請將 projects.csv 放在同一資料夾（透過網頁伺服器開啟），或點選上方「📂 載入 CSV」。";
                emptyState.classList.remove("hidden");
            }
        }

        function initAuthorFilters() {
            const uniqueAuthors = ["全部", ...new Set(projectsData.map(item => item.author))];

            authorFiltersContainer.innerHTML = uniqueAuthors.map(author => {
                const isActive = author === currentAuthor;
                const count = author === "全部"
                    ? projectsData.length
                    : projectsData.filter(p => p.author === author).length;

                return `
                    <button type="button" data-author="${author}"
                        class="author-filter-btn shrink-0 inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer active:scale-95 ${
                            isActive
                            ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-200 dark:bg-sky-400 dark:text-slate-950'
                            : 'bg-emerald-50/90 hover:bg-sky-100 hover:text-sky-800 text-emerald-800 dark:bg-emerald-900/60 dark:hover:bg-sky-900/70 dark:text-emerald-100'
                        }">
                        <span>${author === "全部" ? "🌿 全部" : author}</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full ${
                            isActive
                            ? 'bg-white/30 text-white dark:bg-slate-950/25 dark:text-slate-950'
                            : 'bg-emerald-200/70 text-emerald-800 dark:bg-emerald-800 dark:text-emerald-200'
                        }">${count}</span>
                    </button>
                `;
            }).join("");

            document.querySelectorAll(".author-filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentAuthor = btn.getAttribute("data-author");
                    initAuthorFilters();
                    renderProjects();
                });
            });
        }

        /**
         * 產生單張作品卡片：平時淺粉綠，滑鼠 hover / active 變鮮豔粉藍馬卡龍
         */
        function buildCompactCardHTML(project) {
            const safeUrl = encodeURI(project.rawUrl);

            return `
                <article class="project-card group relative flex flex-col justify-between bg-white/90 hover:bg-sky-50/95 active:bg-sky-100/95 dark:bg-emerald-950/75 dark:hover:bg-sky-950/85 backdrop-blur-md rounded-xl overflow-hidden border border-emerald-200/85 dark:border-emerald-400/20 shadow-sm">
                    <div>
                        <!-- 頂部封面條：平時淺粉綠，hover / active 轉鮮豔粉藍馬卡龍 -->
                        <div class="relative h-14 bg-gradient-to-r ${project.gradient} group-hover:from-sky-300 group-hover:via-cyan-300 group-hover:to-blue-300 group-active:from-sky-400 group-active:to-cyan-300 px-2.5 flex items-center justify-center overflow-hidden transition-all duration-300">
                            <span class="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded bg-white/80 text-emerald-800 group-hover:text-sky-700 text-[10px] font-extrabold transition-colors">
                                #${String(project.id).padStart(2, '0')}
                            </span>
                            <div class="w-8 h-8 rounded-xl bg-white/85 shadow-sm flex items-center justify-center text-lg transform group-hover:scale-110 transition-transform duration-200 select-none">
                                ${project.emoji}
                            </div>
                        </div>

                        <!-- 精簡卡片文字區 -->
                        <div class="p-2.5 pb-1.5">
                            <div class="mb-1">
                                <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold truncate max-w-full transition-colors ${project.badgeBg} group-hover:bg-sky-100 group-hover:text-sky-700 dark:group-hover:bg-sky-900/70 dark:group-hover:text-sky-200">
                                    ${project.tag}
                                </span>
                            </div>
                            <h2 class="text-xs sm:text-sm font-extrabold text-emerald-950 dark:text-emerald-50 group-hover:text-sky-700 dark:group-hover:text-sky-300 transition-colors truncate" title="${project.title}">
                                ${project.title}
                            </h2>
                            <div class="mt-1 flex items-center gap-1 text-[11px] font-bold text-emerald-800/80 dark:text-emerald-200/80 group-hover:text-sky-800 dark:group-hover:text-sky-200 truncate transition-colors">
                                <span>👤</span>
                                <span class="truncate">${project.author}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 雙按鈕區：平時柔和粉綠，滑鼠移入卡片或按鈕變鮮豔粉藍馬卡龍 -->
                    <div class="px-2.5 pb-2.5 pt-1 flex gap-1.5">
                        <button type="button" onclick="openPreviewModal(${project.id})"
                            class="flex-1 inline-flex items-center justify-center px-2 py-1.5 rounded-lg bg-emerald-400 group-hover:bg-sky-400 hover:!bg-sky-500 active:!bg-sky-500 text-white text-[11px] font-bold shadow-xs transition-all cursor-pointer active:scale-95">
                            <span>站內預覽</span>
                        </button>

                        <a href="${safeUrl}" target="_blank" rel="noopener noreferrer"
                            class="flex-1 inline-flex items-center justify-center px-2 py-1.5 rounded-lg bg-emerald-100/90 group-hover:bg-cyan-100 hover:!bg-cyan-200 active:!bg-cyan-200 dark:bg-emerald-900 dark:group-hover:bg-sky-900 text-emerald-900 group-hover:text-sky-900 dark:text-emerald-100 dark:group-hover:text-sky-100 text-[11px] font-bold border border-emerald-200/80 group-hover:border-sky-300 transition-all active:scale-95">
                            <span>開起作品</span>
                        </a>
                    </div>
                </article>
            `;
        }

        function renderProjects() {
            const keyword = currentSearchQuery.trim().toLowerCase();

            const sortedFiltered = projectsData
                .filter(project => {
                    const matchesAuthor = currentAuthor === "全部" || project.author === currentAuthor;
                    const matchesKeyword = !keyword ||
                        project.title.toLowerCase().includes(keyword) ||
                        project.author.toLowerCase().includes(keyword) ||
                        project.tag.toLowerCase().includes(keyword) ||
                        project.date.toLowerCase().includes(keyword) ||
                        String(project.id).includes(keyword);
                    return matchesAuthor && matchesKeyword;
                })
                .sort((a, b) => {
                    const scoreA = parseDateScore(a.date);
                    const scoreB = parseDateScore(b.date);
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return a.id - b.id;
                });

            visibleCountEl.textContent = sortedFiltered.length;
            totalCountEl.textContent = projectsData.length;

            if (sortedFiltered.length === 0) {
                dateSectionsContainer.innerHTML = "";
                emptyTitle.textContent = "找不到符合條件的作品";
                emptyDesc.textContent = "試試看輸入其他關鍵字，或點選下方按鈕顯示全部同學的作品！";
                emptyState.classList.remove("hidden");
                return;
            }

            emptyState.classList.add("hidden");

            const dateGroupsMap = new Map();
            for (const project of sortedFiltered) {
                const groupKey = project.date ? project.date : "未標記日期";
                if (!dateGroupsMap.has(groupKey)) {
                    dateGroupsMap.set(groupKey, []);
                }
                dateGroupsMap.get(groupKey).push(project);
            }

            dateSectionsContainer.innerHTML = Array.from(dateGroupsMap.entries()).map(([dateLabel, items], idx) => {
                const isLatestGroup = idx === 0 && dateLabel !== "未標記日期";
                const latestBadge = isLatestGroup
                    ? `<span class="px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 dark:bg-sky-900/60 dark:text-sky-200 text-[10px] font-extrabold">✨ 最新日期</span>`
                    : "";

                return `
                    <div class="pt-1">
                        <!-- 日期分隔列 -->
                        <div class="flex items-center gap-2.5 mb-3">
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/90 dark:bg-emerald-950/80 border border-emerald-200 dark:border-emerald-400/25 shadow-2xs">
                                <span class="text-xs">📅</span>
                                <span class="text-xs sm:text-sm font-extrabold text-emerald-700 dark:text-emerald-200">${dateLabel}</span>
                                <span class="text-[11px] font-bold text-emerald-500 dark:text-emerald-300/80">(${items.length})</span>
                            </div>
                            ${latestBadge}
                            <div class="flex-1 h-px bg-gradient-to-r from-emerald-200 via-teal-200/70 to-transparent dark:from-emerald-400/25 dark:to-transparent"></div>
                        </div>

                        <!-- 2~5 欄緊湊網格 -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5 sm:gap-3">
                            ${items.map(buildCompactCardHTML).join("")}
                        </div>
                    </div>
                `;
            }).join("");
        }

        window.openPreviewModal = function(projectId) {
            const project = projectsData.find(p => p.id === projectId);
            if (!project) return;

            const safeUrl = encodeURI(project.rawUrl);
            modalTitle.textContent = project.title;
            const datePart = project.date ? ` ｜ ${project.date}` : "";
            modalAuthor.textContent = `作者：${project.author} ｜ ${project.tag}${datePart}`;
            modalEmoji.textContent = project.emoji;
            modalExternalLink.href = safeUrl;

            iframeLoader.style.opacity = "1";
            iframeLoader.style.display = "flex";
            projectIframe.src = safeUrl;

            previewModal.classList.remove("hidden");
            previewModal.classList.add("flex");
            document.body.style.overflow = "hidden";

            requestAnimationFrame(() => {
                previewModal.classList.remove("opacity-0");
                modalContainer.classList.remove("scale-95");
                modalContainer.classList.add("scale-100");
            });
        };

        function closePreviewModal() {
            previewModal.classList.add("opacity-0");
            modalContainer.classList.remove("scale-100");
            modalContainer.classList.add("scale-95");

            setTimeout(() => {
                previewModal.classList.add("hidden");
                previewModal.classList.remove("flex");
                projectIframe.src = "about:blank";
                document.body.style.overflow = "";
            }, 250);
        }

        projectIframe.addEventListener("load", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.opacity = "0";
                setTimeout(() => {
                    iframeLoader.style.display = "none";
                }, 300);
            }
        });

        reloadIframeBtn.addEventListener("click", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.display = "flex";
                iframeLoader.style.opacity = "1";
                const currentSrc = projectIframe.src;
                projectIframe.src = "";
                setTimeout(() => {
                    projectIframe.src = currentSrc;
                }, 50);
            }
        });

        closeModalBtn.addEventListener("click", closePreviewModal);
        previewModal.addEventListener("click", (e) => {
            if (e.target === previewModal) closePreviewModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !previewModal.classList.contains("hidden")) {
                closePreviewModal();
            }
        });

        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value;
            clearSearchBtn.classList.toggle("hidden", currentSearchQuery.length === 0);
            renderProjects();
        });

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            currentSearchQuery = "";
            clearSearchBtn.classList.add("hidden");
            renderProjects();
            searchInput.focus();
        });

        resetFilterBtn.addEventListener("click", () => {
            currentAuthor = "全部";
            currentSearchQuery = "";
            searchInput.value = "";
            clearSearchBtn.classList.add("hidden");
            initAuthorFilters();
            renderProjects();
        });

        csvFileInput.addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                loadCSVString(String(event.target?.result || ""), file.name);
            };
            reader.readAsText(file, "UTF-8");
        });

        const themeToggleBtn = document.getElementById("themeToggle");
        const themeText = document.getElementById("themeText");
        const htmlEl = document.documentElement;

        function updateThemeUI(isDark) {
            if (isDark) {
                htmlEl.classList.add("dark");
                themeText.textContent = "淺色粉綠模式";
            } else {
                htmlEl.classList.remove("dark");
                themeText.textContent = "深色星空模式";
            }
        }

        try {
            const savedTheme = localStorage.getItem("115_1_5a_theme");
            if (savedTheme === "dark") {
                updateThemeUI(true);
            } else if (savedTheme === "light") {
                updateThemeUI(false);
            }
        } catch {}

        themeToggleBtn.addEventListener("click", () => {
            const nextDarkState = !htmlEl.classList.contains("dark");
            updateThemeUI(nextDarkState);
            try {
                localStorage.setItem("115_1_5a_theme", nextDarkState ? "dark" : "light");
            } catch {}
        });

        window.addEventListener("DOMContentLoaded", () => {
            fetchCSVFromServer();
        });
    </script>
</body>
</html>
