      ambientIcon.textContent = active ? '🌌' : '🔊';
    });

    const btnHideUi = document.getElementById('btn-hide-ui');
    const btnShowUi = document.getElementById('btn-show-ui');
    const uiLayers = document.querySelectorAll('.ui-layer');
    btnHideUi.addEventListener('click', () => {
      uiLayers.forEach(el => el.classList.add('ui-hidden'));
      btnShowUi.classList.remove('hidden');
    });
    btnShowUi.addEventListener('click', () => {
      uiLayers.forEach(el => el.classList.remove('ui-hidden'));
      btnShowUi.classList.add('hidden');
    });

    // Canvas 統一 Pointer 事件
    canvas.addEventListener('pointerdown', (e) => {
      audio.unlock();
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (currentMode === 'slime') {
        interactWithSlime(e.clientX, e.clientY, false, null);
      } else if (currentMode === 'nebula') {
        ripples.push({ x: e.clientX, y: e.clientY, r: 5, alpha: 0.7, double: true });
        audio.playStarChime(0.4);
      } else if (currentMode === 'jellyfish') {
        if (!checkJellyfishTap(e.clientX, e.clientY)) {
          spawnJellyBubbles(e.clientX, e.clientY, 5, false);
          audio.playBubblePop(1.0);
        }
      } else if (currentMode === 'chimes') {
        checkChimeInteraction(e.clientX, e.clientY, 0);
      } else if (currentMode === 'sand') {
        pourSandAt(e.clientX, e.clientY, 12);
      } else if (currentMode === 'bubbles') {
        checkBubbleHit(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const vx = e.clientX - prev.x;
      const vy = e.clientY - prev.y;
      const speed = Math.hypot(vx, vy);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (currentMode === 'slime') {
        interactWithSlime(e.clientX, e.clientY, true, prev);
      } else if (currentMode === 'nebula' && speed > 3) {
        audio.playStarChime(Math.min(1, speed / 35));
      } else if (currentMode === 'chimes') {
        checkChimeInteraction(e.clientX, e.clientY, vx);
      } else if (currentMode === 'bubbles') {
        checkBubbleHit(e.clientX, e.clientY);
      }
    });

    function handlePointerUp(e) {
      if (!pointers.has(e.pointerId)) return;
      const pt = pointers.get(e.pointerId);
      pointers.delete(e.pointerId);
      if (currentMode === 'nebula') {
        scatterStardust(pt.x, pt.y);
      }
    }

    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    /**
     * ============================================================================
     * 11. 視窗自適應與主動畫迴圈
     * ============================================================================
     */
    function resizeCanvas() {
      width = Math.max(300, window.innerWidth || 800);
      height = Math.max(300, window.innerHeight || 600);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      initBgStars();
      slime.cx = width / 2;
      slime.cy = height / 2 - 14;
      slime.baseRadius = Math.max(105, Math.min(width, height) * 0.255);

      if (currentMode === 'bubbles') initBubbles();
      if (currentMode === 'chimes') initWindChimes();
    }

    window.addEventListener('resize', resizeCanvas);

    let lastTimestamp = 0;
    function animate(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000 || 0.016);
      lastTimestamp = timestamp;
      const time = timestamp / 1000;

      ctx.clearRect(0, 0, width, height);
      updateAndDrawBgStars(time);

      if (currentMode === 'slime') {
        updateAndDrawSlime(time, dt);
      } else if (currentMode === 'nebula') {
        updateAndDrawNebula(time, dt);
      } else if (currentMode === 'jellyfish') {
        updateAndDrawJellyfish(time, dt);
      } else if (currentMode === 'chimes') {
        updateAndDrawWindChimes(time, dt);
      } else if (currentMode === 'sand') {
        updateAndDrawStarSand(time, dt);
      } else if (currentMode === 'bubbles') {
        updateAndDrawBubbles(time, dt);
      } else if (currentMode === 'breath') {
        updateAndDrawBreath(dt);
      }

      requestAnimationFrame(animate);
    }

    window.onload = function () {
      resizeCanvas();
      initSlime();
      initStardust();
      initJellyfish();
      initWindChimes();
      initStarSand();
      initBubbles();
      switchMode('slime');
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
