<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黑藍霓虹星海 · 深海微光紓壓空間</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      color: #ffffff;
      /* 黑到深藍動態流動漸層背景 */
      background: linear-gradient(-45deg, #000000, #050a1f, #0a1931, #001f4d, #020617);
      background-size: 400% 400%;
      animation: deepBlueFlow 18s ease infinite;
    }

    @keyframes deepBlueFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 純白文字搭配柔和深藍外發光 (Neon Blue Glow) */
    .neon-text {
      color: #ffffff;
      text-shadow:
        0 0 8px rgba(0, 170, 255, 0.85),
        0 0 18px rgba(0, 85, 255, 0.75),
        0 0 32px rgba(0, 40, 160, 0.6);
    }

    .neon-text-subtle {
      color: rgba(255, 255, 255, 0.92);
      text-shadow:
        0 0 6px rgba(0, 170, 255, 0.65),
        0 0 14px rgba(0, 85, 255, 0.5);
    }

    /* 極簡透明玻璃膠囊與深藍光暈邊框 */
    .glass-pill {
      background: rgba(5, 15, 38, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      box-shadow:
        0 0 20px rgba(0, 85, 255, 0.22),
        inset 0 0 12px rgba(0, 170, 255, 0.08);
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .glass-pill:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow:
        0 0 25px rgba(0, 140, 255, 0.42),
        inset 0 0 15px rgba(0, 170, 255, 0.18);
    }

    .mode-btn.active, .tool-btn.active {
      background: rgba(0, 102, 255, 0.42);
      border-color: rgba(125, 211, 252, 0.88);
      box-shadow:
        0 0 16px rgba(0, 170, 255, 0.7),
        inset 0 0 10px rgba(125, 211, 252, 0.38);
    }

    /* 隱藏捲軸但可橫向滑動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #zen-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    .ui-layer {
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .ui-hidden {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(-6px);
    }
  </style>
</head>
<body>

  <!-- 全螢幕互動 Canvas -->
  <canvas id="zen-canvas"></canvas>

  <!-- 頂部極簡控制列 -->
  <header id="top-ui" class="ui-layer fixed top-0 left-0 right-0 z-20 p-3 sm:p-5 flex items-center justify-between gap-2 pointer-events-none">
    <!-- 左側標題 -->
    <div class="pointer-events-auto flex items-center gap-2.5 px-4 py-2 rounded-full glass-pill">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-300 shadow-[0_0_10px_#38bdf8] animate-pulse"></span>
      <h1 class="text-sm sm:text-base font-medium tracking-wider neon-text">黑藍霓虹星海</h1>
    </div>

    <!-- 右側音效與沉浸模式開關 -->
    <div class="pointer-events-auto flex items-center gap-2">
      <button id="btn-ambient" class="glass-pill px-3 py-2 rounded-full text-xs sm:text-sm neon-text-subtle flex items-center gap-1.5 cursor-pointer" title="切換深海低頻環境音">
        <span>🌌</span>
        <span class="hidden sm:inline">深海環境音</span>
      </button>

      <button id="btn-sound" class="glass-pill px-3 py-2 rounded-full text-xs sm:text-sm neon-text-subtle flex items-center gap-1.5 cursor-pointer" title="開啟或靜音療癒音效">
        <span id="sound-icon">🔊</span>
        <span class="hidden sm:inline" id="sound-label">音效開啟</span>
      </button>

      <button id="btn-hide-ui" class="glass-pill px-3 py-2 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer" title="隱藏介面進入純粹放空模式">
        👁️
      </button>
    </div>
  </header>

  <!-- 恢復 UI 浮動小按鈕 -->
  <button id="btn-show-ui" class="hidden fixed top-4 right-4 z-30 glass-pill px-3.5 py-2 rounded-full text-xs neon-text-subtle opacity-75 hover:opacity-100 transition cursor-pointer">
    ✨ 顯示選單
  </button>

  <!-- 模式專屬工具列（位於底部導航列上方） -->
  <div id="mode-toolbar" class="ui-layer fixed bottom-20 left-0 right-0 z-20 px-3 flex flex-col items-center gap-2 pointer-events-none">
    
    <!-- 史萊姆專屬工具列 -->
    <div id="slime-tools" class="pointer-events-auto flex flex-wrap justify-center items-center gap-1.5 max-w-3xl">
      <div class="glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle flex items-center gap-2">
        <span>起泡度</span>
        <div class="w-16 sm:w-20 h-2 bg-slate-900/80 rounded-full overflow-hidden border border-sky-400/30">
          <div id="slime-foam-bar" class="h-full bg-gradient-to-r from-sky-500 to-cyan-200 transition-all duration-150" style="width: 0%"></div>
        </div>
        <span id="slime-foam-pct" class="font-mono text-sky-200">0%</span>
      </div>

      <button id="btn-slime-glaze" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">❄️ 淋上脆皮</button>
      <button id="btn-slime-popfoam" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🫧 一鍵壓泡爆破</button>
      <button id="btn-slime-texture" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🍮 Q彈果凍</button>
      <button id="btn-slime-glitter" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">✨ 撒入亮片</button>
      <button id="btn-slime-beads" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🍬 撒入糖果珠</button>
      <button id="btn-slime-jelly" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🍓 放上果凍配料</button>
      <button id="btn-slime-stamp" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">💖 蓋療癒印章</button>
      <button id="btn-slime-scraper" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🥄 舒壓刮刀</button>
      <button id="btn-slime-pick" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🖐️ 挑出配料</button>
      <button id="btn-slime-clear" class="tool-btn glass-pill px-3 py-1.5 rounded-full text-xs neon-text-subtle cursor-pointer">🧹 清空配料</button>
    </div>

    <!-- 水母專屬工具列 -->
    <div id="jelly-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <button id="btn-jelly-add" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">✨ 召喚新水母</button>
      <button id="btn-jelly-bubbles" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">🫧 釋放上升氣泡流</button>
    </div>

    <!-- 氣泡捏捏樂專屬工具列 -->
    <div id="bubble-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <div class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle">
        已釋放壓力：<span id="pop-counter" class="font-bold text-sky-200 neon-text">0</span> 顆氣泡
      </div>
      <button id="btn-pop-all" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text cursor-pointer">💥 一鍵全部戳破</button>
    </div>

    <!-- 星光流沙專屬工具列 -->
    <div id="sand-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <button id="btn-sand-wave" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text cursor-pointer">🌊 海浪撫平沙丘</button>
      <button id="btn-sand-color" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">💎 切換星砂色澤</button>
    </div>

    <!-- 深海風鈴專屬工具列 -->
    <div id="chime-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <button id="btn-chime-breeze" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">🌬️ 吹拂深海微風</button>
      <button id="btn-chime-lantern" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">🏮 放飛祈願水燈</button>
    </div>

    <!-- 靜謐深海雨夜專屬工具列 (新增模式 8) -->
    <div id="rain-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <button id="btn-rain-intensity" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">🌧️ 雨勢：溫柔細雨</button>
      <button id="btn-rain-ripple" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">💧 投下深藍水滴</button>
    </div>

    <!-- 星空連線冥想專屬工具列 (新增模式 9) -->
    <div id="constellation-tools" class="hidden pointer-events-auto flex flex-wrap justify-center items-center gap-2">
      <button id="btn-star-meteor" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">🌠 召喚許願流星</button>
      <button id="btn-star-clear" class="glass-pill px-4 py-1.5 rounded-full text-xs sm:text-sm neon-text-subtle cursor-pointer">✨ 清除星軌</button>
    </div>

    <!-- 溫柔提示文字 -->
    <p id="hint-text" class="text-[11px] sm:text-xs font-light tracking-wider text-sky-100/80 neon-text-subtle text-center px-2">
      史萊姆已穩固居中 · 點擊敲碎深藍冰晶脆皮，來回揉捏起泡，或挑出裡面的配料
    </p>
  </div>

  <!-- 呼吸模式專屬：中央溫柔引導文字 -->
  <div id="breath-guide" class="ui-layer hidden fixed inset-0 z-10 pointer-events-none flex flex-col items-center justify-center text-center px-6">
    <div id="breath-phase-text" class="text-2xl sm:text-4xl font-light tracking-[0.2em] neon-text mb-3 transition-all duration-700">
      準備放鬆身心
    </div>
    <div id="breath-sub-text" class="text-sm sm:text-base font-light tracking-widest text-sky-200/80 neon-text-subtle">
      跟隨深藍光環的節奏，慢慢調整呼吸
    </div>
    <div id="breath-timer-text" class="mt-4 text-lg sm:text-xl font-mono text-sky-300/90 neon-text-subtle">
      4 · 7 · 8
    </div>
  </div>

  <!-- 底部 9 大紓壓模式玻璃膠囊導航列 -->
  <nav id="bottom-nav" class="ui-layer fixed bottom-3 left-0 right-0 z-20 px-3 flex justify-center pointer-events-none">
    <div class="pointer-events-auto flex items-center gap-1.5 p-1.5 rounded-full glass-pill overflow-x-auto no-scrollbar max-w-full">
      <button data-mode="slime" class="mode-btn active whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🍮 起泡史萊姆
      </button>
      <button data-mode="nebula" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        ✨ 星塵引力
      </button>
      <button data-mode="jellyfish" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🪼 發光水母
      </button>
      <button data-mode="bubbles" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🫧 氣泡捏捏樂
      </button>
      <button data-mode="rain" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        💧 深海雨夜
      </button>
      <button data-mode="constellation" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🌌 星空連線
      </button>
      <button data-mode="chimes" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🎐 深海風鈴
      </button>
      <button data-mode="sand" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🏖️ 星光流沙
      </button>
      <button data-mode="breath" class="mode-btn whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium neon-text-subtle cursor-pointer">
        🌊 4-7-8 呼吸
      </button>
    </div>
  </nav>

  <script>
    /**
     * ============================================================================
     * 1. 全能療癒 ASMR 與五聲音階音效合成器 (Web Audio API + 安全防錯)
     * ============================================================================
     */
    class ZenAudioEngine {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
        this.ambientEnabled = false;
        this.ambientNodes = null;
        this.lastTriggerTime = 0;

        this.pentatonic = [
          261.63, 293.66, 329.63, 392.00, 440.00,
          523.25, 587.33, 659.25, 783.99, 880.00, 1046.50
        ];
      }

      unlock() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {}
      }

      canPlay(minInterval = 0.04) {
        if (!this.soundEnabled) return false;
        this.unlock();
        if (!this.ctx) return false;
        const now = this.ctx.currentTime;
        if (now - this.lastTriggerTime < minInterval) return false;
        this.lastTriggerTime = now;
        return true;
      }

      toggleSound() {
        this.unlock();
        this.soundEnabled = !this.soundEnabled;
        if (!this.soundEnabled && this.ambientEnabled) {
          this.stopAmbient();
          this.ambientEnabled = false;
        }
        return this.soundEnabled;
      }

      toggleAmbient() {
        this.unlock();
        this.ambientEnabled = !this.ambientEnabled;
        if (this.ambientEnabled) {
          if (!this.soundEnabled) this.soundEnabled = true;
          this.startAmbient();
        } else {
          this.stopAmbient();
        }
        return this.ambientEnabled;
      }

      startAmbient() {
        try {
          if (!this.ctx || this.ambientNodes) return;
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 3;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let lastOut = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = output[i];
            output[i] *= 2.4;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = noiseBuffer;
          noise.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(210, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.001, now);
          noiseGain.gain.linearRampToValueAtTime(0.11, now + 2.0);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);

          const padFreqs = [65.41, 98.00, 164.81];
          const oscs = padFreqs.map(freq => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.linearRampToValueAtTime(0.025, now + 2.5);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now);
            return { osc, g };
          });

          this.ambientNodes = { noise, noiseGain, oscs };
        } catch (e) {}
      }

      stopAmbient() {
        try {
          if (!this.ambientNodes || !this.ctx) return;
          const now = this.ctx.currentTime;
          const { noise, noiseGain, oscs } = this.ambientNodes;
          noiseGain.gain.setTargetAtTime(0.0001, now, 0.3);
          oscs.forEach(({ g }) => g.gain.setTargetAtTime(0.0001, now, 0.3));
          setTimeout(() => {
            try {
              noise.stop();
              oscs.forEach(({ osc }) => osc.stop());
            } catch (e) {}
          }, 900);
        } catch (e) {}
        this.ambientNodes = null;
      }

      // 史萊姆 Q 彈濕潤噗啾聲
      playSlimeSquish(foamRatio = 0) {
        if (!this.canPlay(0.06)) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const base = 170 + foamRatio * 90 + Math.random() * 40;
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.exponentialRampToValueAtTime(base * 1.75, now + 0.09);
          osc.frequency.exponentialRampToValueAtTime(base * 0.85, now + 0.18);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }

      // 冰晶脆皮清脆「喀啦」碎裂 ASMR
      playCrunch() {
        if (!this.canPlay(0.03)) return;
        try {
          const now = this.ctx.currentTime;
          const dur = 0.085;
          const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.35));
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2400 + Math.random() * 1400, now);
          filter.Q.setValueAtTime(2.8, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
        } catch (e) {}
      }

      // 氣泡破裂 / 挑出配料「啵啾」清脆水滴音
      playBubblePop(pitchBoost = 1) {
        if (!this.canPlay(0.025)) return;
        try {
          const now = this.ctx.currentTime;
          const freq = this.pentatonic[Math.floor(Math.random() * this.pentatonic.length)] * pitchBoost;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * 0.72, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.55, now + 0.085);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.21);
        } catch (e) {}
      }

      // 刮刀抹平絲滑音效
      playScrape() {
        if (!this.canPlay(0.08)) return;
        try {
          const now = this.ctx.currentTime;
          const dur = 0.14;
          const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.4;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(750, now);
          filter.frequency.linearRampToValueAtTime(1150, now + dur);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
        } catch (e) {}
      }

      // 空靈豎琴 / 水晶風鈴 / 雨滴泛音
      playChime(noteIndex = -1, duration = 1.2) {
        if (!this.canPlay(0.06)) return;
        try {
          const now = this.ctx.currentTime;
          const idx = noteIndex >= 0
            ? noteIndex % this.pentatonic.length
            : Math.floor(Math.random() * this.pentatonic.length);
          const freq = this.pentatonic[idx];

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.075, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0005, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.05);
        } catch (e) {}
      }

      // 海浪撫平沙丘音效
      playWaveWash() {
        if (!this.canPlay(0.3)) return;
        try {
          const now = this.ctx.currentTime;
          const dur = 1.5;
          const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(140, now);
          filter.frequency.linearRampToValueAtTime(520, now + 0.6);
          filter.frequency.linearRampToValueAtTime(120, now + dur);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.55);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
        } catch (e) {}
      }
    }

    const audio = new ZenAudioEngine();

    /**
     * ============================================================================
     * 2. 全螢幕 Canvas 與背景微光粒子
     * ============================================================================
     */
    const canvas = document.getElementById('zen-canvas');
    const ctx = canvas.getContext('2d');
    let width = Math.max(300, window.innerWidth);
    let height = Math.max(300, window.innerHeight);
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const bgStars = [];
    function initBgStars() {
      bgStars.length = 0;
      for (let i = 0; i < 95; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.6 + 0.4,
          phase: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 1.2
        });
      }
    }

    function drawBgStars(time) {
      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        const alpha = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(186, 230, 253, ${alpha})`;
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 3. 模式一：【起泡冰晶脆皮史萊姆 (穩固居中不亂動 + 可挑出配料)】
     * ============================================================================
     */
    const SLIME_POINTS = 56;
    const slimeState = {
      baseRadius: 138,
      foamLevel: 0,         // 0 ~ 100 起泡度
      glazeCoverage: 1.0,   // 0 ~ 1 冰晶脆皮完整度
      isCloudTexture: false,// false=Q彈果凍, true=綿密雲朵
      activeTool: 'knead',  // 'knead' | 'scraper' | 'pick'
      eyeLookX: 0,
      eyeLookY: 0,
      blinkTimer: 0,
      happyTimer: 0,
      vertices: [],
      glazeShards: [],
      foamBubbles: [],
      glitter: [],
      toppings: [],         // 糖果珠 & 果凍方塊 & 珍珠星 & 小貝殼（均可挑出！）
      poppedOutToppings: [],// 被拔出飛向畫面外的配料動畫
      stamps: [],
      scrapeTrails: [],
      draggedTopping: null
    };

    function initSlime() {
      slimeState.baseRadius = Math.min(width, height) * 0.24;
      slimeState.baseRadius = Math.max(105, Math.min(165, slimeState.baseRadius));
      slimeState.vertices = [];
      for (let i = 0; i < SLIME_POINTS; i++) {
        slimeState.vertices.push({
          angle: (i / SLIME_POINTS) * Math.PI * 2,
          disp: 0,
          vel: 0,
          hasGlaze: true
        });
      }
      // 預設撒一些晶瑩亮片與可愛配料
      slimeState.glitter = [];
      addSlimeGlitter(26);
      slimeState.toppings = [];
      addSlimeToppings('bead', 8);
      addSlimeToppings('jelly', 5);
    }

    function addSlimeGlitter(count = 20) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 0.78;
        slimeState.glitter.push({
          angle,
          dist,
          size: 1.5 + Math.random() * 2.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function addSlimeToppings(kind, count = 6) {
      const shapes = kind === 'bead'
        ? ['bead_blue', 'bead_cyan', 'bead_pearl']
        : ['jelly_cube', 'star_pearl', 'mini_shell'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 0.15 + Math.random() * 0.62;
        slimeState.toppings.push({
          id: Math.random().toString(36).slice(2),
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          angle,
          dist,
          rot: Math.random() * Math.PI * 2,
          size: kind === 'bead' ? 7.5 : 11.5,
          popScale: 1
        });
      }
    }

    function addSlimeStamp(x, y, cx, cy, currentR) {
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy) / currentR;
      if (dist > 0.78) return;
      const types = ['heart', 'smile', 'cat'];
      slimeState.stamps.push({
        angle: Math.atan2(dy, dx),
        dist,
        type: types[Math.floor(Math.random() * types.length)],
        alpha: 0.92
      });
      slimeState.happyTimer = 0.6;
      audio.playSlimeSquish(slimeState.foamLevel / 100);
    }

    function popOutSingleTopping(index, cx, cy, currentR) {
      const t = slimeState.toppings[index];
      if (!t) return;
      const tx = cx + Math.cos(t.angle) * t.dist * currentR;
      const ty = cy + Math.sin(t.angle) * t.dist * currentR;
      const outAngle = Math.atan2(ty - cy, tx - cx) || (Math.random() * Math.PI * 2);

      // 在拔出處製造向外的微彈力波紋
      applySlimeImpulse(tx, ty, cx, cy, currentR, 14, true);

      slimeState.poppedOutToppings.push({
        shape: t.shape,
        x: tx,
        y: ty,
        vx: Math.cos(outAngle) * (4.5 + Math.random() * 3.5),
        vy: Math.sin(outAngle) * (4.5 + Math.random() * 3.5) - 2.5,
        rot: t.rot,
        vrot: (Math.random() - 0.5) * 0.25,
        size: t.size,
        life: 1.0
      });

      slimeState.toppings.splice(index, 1);
      slimeState.happyTimer = 0.45;
      audio.playBubblePop(1.18);
    }

    function clearAllSlimeToppings() {
      const cx = width / 2;
      const cy = height / 2 - 20;
      const currentR = slimeState.baseRadius * (1 + (slimeState.foamLevel / 100) * 0.16);
      const total = slimeState.toppings.length;
      for (let i = total - 1; i >= 0; i--) {
        setTimeout(() => {
          if (slimeState.toppings.length > 0) {
            popOutSingleTopping(slimeState.toppings.length - 1, cx, cy, currentR);
          }
        }, (total - 1 - i) * 35);
      }
      slimeState.stamps = [];
      slimeState.glitter = [];
    }

    function popAllSlimeFoam() {
      if (slimeState.foamLevel <= 2 && slimeState.foamBubbles.length === 0) return;
      const cx = width / 2;
      const cy = height / 2 - 20;
      // 整顆向下壓扁回彈並連鎖爆破所有起泡
      for (let i = 0; i < SLIME_POINTS; i++) {
        const v = slimeState.vertices[i];
        v.vel -= 8 + Math.sin(v.angle * 3) * 4;
      }
      const count = Math.min(18, Math.max(5, Math.floor(slimeState.foamLevel / 5)));
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          audio.playBubblePop(1.05 + Math.random() * 0.25);
        }, i * 32);
      }
      slimeState.foamLevel = 0;
      slimeState.foamBubbles = [];
      slimeState.happyTimer = 0.8;
      updateSlimeFoamUI();
    }

    function updateSlimeFoamUI() {
      const pct = Math.round(slimeState.foamLevel);
      document.getElementById('slime-foam-bar').style.width = `${pct}%`;
      document.getElementById('slime-foam-pct').textContent = `${pct}%`;
    }

    // 施加局部形變衝量（方向受控且帶高阻尼，史萊姆不會亂飄）
    function applySlimeImpulse(px, py, cx, cy, currentR, strength = -14, outward = false) {
      const touchAngle = Math.atan2(py - cy, px - cx);
      for (let i = 0; i < SLIME_POINTS; i++) {
        const v = slimeState.vertices[i];
        let diff = Math.abs(v.angle - touchAngle);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff < 0.72) {
          const falloff = Math.cos((diff / 0.72) * (Math.PI / 2));
          v.vel += (outward ? Math.abs(strength) : strength) * falloff * 0.35;
        }
      }
    }

    function crackGlazeNear(px, py, cx, cy, currentR) {
      if (slimeState.glazeCoverage <= 0) return false;
      const touchAngle = Math.atan2(py - cy, px - cx);
      let crackedAny = false;
      let remaining = 0;

      for (let i = 0; i < SLIME_POINTS; i++) {
        const v = slimeState.vertices[i];
        if (v.hasGlaze) {
          let diff = Math.abs(v.angle - touchAngle);
          if (diff > Math.PI) diff = Math.PI * 2 - diff;
          if (diff < 0.58) {
            v.hasGlaze = false;
            crackedAny = true;
            // 生成飛濺冰晶碎片
            const sx = cx + Math.cos(v.angle) * currentR;
            const sy = cy + Math.sin(v.angle) * currentR;
            for (let k = 0; k < 2; k++) {
              slimeState.glazeShards.push({
                x: sx,
                y: sy,
                vx: Math.cos(v.angle + (Math.random() - 0.5) * 0.8) * (3 + Math.random() * 5),
                vy: Math.sin(v.angle + (Math.random() - 0.5) * 0.8) * (3 + Math.random() * 5) - 1.5,
                size: 5 + Math.random() * 7,
                rot: Math.random() * Math.PI * 2,
                vrot: (Math.random() - 0.5) * 0.25,
                life: 1.0
              });
            }
          } else {
            remaining++;
          }
        }
      }

      slimeState.glazeCoverage = remaining / SLIME_POINTS;
      if (crackedAny) {
        audio.playCrunch();
      }
      return crackedAny;
    }

    function handleSlimePointerDown(px, py) {
      const cx = width / 2;
      const cy = height / 2 - 20;
      const currentR = slimeState.baseRadius * (1 + (slimeState.foamLevel / 100) * 0.16);
      const distFromCenter = Math.hypot(px - cx, py - cy);

      slimeState.eyeLookX = Math.max(-6, Math.min(6, (px - cx) * 0.03));
      slimeState.eyeLookY = Math.max(-6, Math.min(6, (py - cy) * 0.03));

      if (distFromCenter > currentR * 1.25) return;

      // 1. 檢查是否點擊到配料（挑出配料模式 或 直接拖曳拔出）
      for (let i = slimeState.toppings.length - 1; i >= 0; i--) {
        const t = slimeState.toppings[i];
        const tx = cx + Math.cos(t.angle) * t.dist * currentR;
        const ty = cy + Math.sin(t.angle) * t.dist * currentR;
        if (Math.hypot(px - tx, py - ty) <= t.size + 14) {
          if (slimeState.activeTool === 'pick') {
            popOutSingleTopping(i, cx, cy, currentR);
            return;
          } else {
            slimeState.draggedTopping = t;
            return;
          }
        }
      }

      // 2. 若有脆皮，優先敲碎冰晶脆皮
      if (slimeState.glazeCoverage > 0 && crackGlazeNear(px, py, cx, cy, currentR)) {
        applySlimeImpulse(px, py, cx, cy, currentR, -10);
        return;
      }

      // 3. 刮刀模式
      if (slimeState.activeTool === 'scraper') {
        slimeState.scrapeTrails.push({ x: px, y: py, life: 1.0 });
        audio.playScrape();
        return;
      }

      // 4. 戳壓與起泡
      applySlimeImpulse(px, py, cx, cy, currentR, -16);
      slimeState.happyTimer = 0.35;
      slimeState.foamLevel = Math.min(100, slimeState.foamLevel + 2.2);
      if (slimeState.foamBubbles.length < 36 && Math.random() < 0.65) {
        slimeState.foamBubbles.push({
          angle: Math.random() * Math.PI * 2,
          dist: Math.random() * 0.82,
          r: 3 + Math.random() * 6
        });
      }
      updateSlimeFoamUI();
      audio.playSlimeSquish(slimeState.foamLevel / 100);
    }

    function handleSlimePointerMove(px, py, speed) {
      const cx = width / 2;
      const cy = height / 2 - 20;
      const currentR = slimeState.baseRadius * (1 + (slimeState.foamLevel / 100) * 0.16);
      const distFromCenter = Math.hypot(px - cx, py - cy);

      slimeState.eyeLookX = Math.max(-6, Math.min(6, (px - cx) * 0.03));
      slimeState.eyeLookY = Math.max(-6, Math.min(6, (py - cy) * 0.03));

      // 若正在拖曳一顆配料，拖出史萊姆邊緣時自動「啵！」一聲拔出
      if (slimeState.draggedTopping) {
        const t = slimeState.draggedTopping;
        const relDist = distFromCenter / currentR;
        t.angle = Math.atan2(py - cy, px - cx);
        t.dist = relDist;
        if (relDist > 0.96) {
          const idx = slimeState.toppings.indexOf(t);
          slimeState.draggedTopping = null;
          if (idx !== -1) popOutSingleTopping(idx, cx, cy, currentR);
        }
        return;
      }

      if (distFromCenter > currentR * 1.2) return;

      // 挑出配料模式下滑過配料也會一顆顆拔出
      if (slimeState.activeTool === 'pick') {
        for (let i = slimeState.toppings.length - 1; i >= 0; i--) {
          const t = slimeState.toppings[i];
          const tx = cx + Math.cos(t.angle) * t.dist * currentR;
          const ty = cy + Math.sin(t.angle) * t.dist * currentR;
          if (Math.hypot(px - tx, py - ty) <= t.size + 14) {
            popOutSingleTopping(i, cx, cy, currentR);
            return;
          }
        }
        return;
      }

      // 滑過敲碎脆皮
      if (slimeState.glazeCoverage > 0 && crackGlazeNear(px, py, cx, cy, currentR)) {
        applySlimeImpulse(px, py, cx, cy, currentR, -8);
        return;
      }

      // 刮刀模式
      if (slimeState.activeTool === 'scraper') {
        slimeState.scrapeTrails.push({ x: px, y: py, life: 1.0 });
        for (let i = 0; i < SLIME_POINTS; i++) {
          slimeState.vertices[i].disp *= 0.82;
          slimeState.vertices[i].vel *= 0.65;
        }
        audio.playScrape();
        return;
      }

      // 來回揉捏起泡
      if (speed > 2) {
        applySlimeImpulse(px, py, cx, cy, currentR, -7);
        slimeState.foamLevel = Math.min(100, slimeState.foamLevel + Math.min(2.5, speed * 0.06));
        if (slimeState.foamBubbles.length < 40 && Math.random() < 0.35) {
          slimeState.foamBubbles.push({
            angle: Math.random() * Math.PI * 2,
            dist: Math.random() * 0.85,
            r: 2.5 + Math.random() * 6.5
          });
        }
        // 印章隨揉捏慢慢融入泥體淡化
        for (let i = slimeState.stamps.length - 1; i >= 0; i--) {
          slimeState.stamps[i].alpha -= 0.015;
          if (slimeState.stamps[i].alpha <= 0.05) slimeState.stamps.splice(i, 1);
        }
        updateSlimeFoamUI();
        audio.playSlimeSquish(slimeState.foamLevel / 100);
      }
    }

    function drawToppingShape(shape, x, y, size, rot, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;

      if (shape.startsWith('bead_')) {
        const col = shape === 'bead_blue' ? '#0284c7' : (shape === 'bead_cyan' ? '#38bdf8' : '#e0f2fe');
        const g = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 1, 0, 0, size);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.4, col);
        g.addColorStop(1, '#0c4a6e');
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      } else if (shape === 'jelly_cube') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.72)';
        ctx.strokeStyle = 'rgba(224, 242, 254, 0.9)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(-size, -size, size * 2, size * 2, 4);
        ctx.fill();
        ctx.stroke();
      } else if (shape === 'star_pearl') {
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath();
        for (let p = 0; p < 5; p++) {
          const a1 = (p * Math.PI * 2) / 5 - Math.PI / 2;
          const a2 = a1 + Math.PI / 5;
          ctx.lineTo(Math.cos(a1) * size * 1.15, Math.sin(a1) * size * 1.15);
          ctx.lineTo(Math.cos(a2) * size * 0.5, Math.sin(a2) * size * 0.5);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        // 小貝殼
        ctx.fillStyle = '#7dd3fc';
        ctx.beginPath();
        ctx.arc(0, 2, size, Math.PI, 0);
        ctx.lineTo(0, size * 0.9);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function updateAndDrawSlime(time, dt) {
      // 嚴格鎖定在畫面正中央，絕不隨時間自行漂移或晃動！
      const cx = width / 2;
      const cy = height / 2 - 20;
      const foamRatio = slimeState.foamLevel / 100;
      const currentR = slimeState.baseRadius * (1 + foamRatio * 0.16);

      // 高阻尼軟體彈簧更新（只有受外力時形變，靜止時完全不動）
      const stiffness = slimeState.isCloudTexture ? 0.065 : 0.095;
      const damping = slimeState.isCloudTexture ? 0.68 : 0.74;

      for (let i = 0; i < SLIME_POINTS; i++) {
        const v = slimeState.vertices[i];
        const prev = slimeState.vertices[(i - 1 + SLIME_POINTS) % SLIME_POINTS];
        const next = slimeState.vertices[(i + 1) % SLIME_POINTS];

        const neighborForce = (prev.disp + next.disp - 2 * v.disp) * 0.18;
        const restoreForce = -stiffness * v.disp;
        v.vel = (v.vel + restoreForce + neighborForce) * damping;
        v.disp += v.vel;

        // 微小殘餘震動直接歸零，保證史萊姆 100% 穩固安靜
        if (Math.abs(v.vel) < 0.04 && Math.abs(v.disp) < 0.08) {
          v.vel = 0;
          v.disp = 0;
        }
        v.disp = Math.max(-42, Math.min(42, v.disp));
      }

      // 計算平滑封閉多邊形頂點
      const pts = slimeState.vertices.map(v => {
        const r = currentR + v.disp;
        return {
          x: cx + Math.cos(v.angle) * r,
          y: cy + Math.sin(v.angle) * r,
          hasGlaze: v.hasGlaze
        };
      });

      function traceSlimePath() {
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const curr = pts[i];
          const next = pts[(i + 1) % pts.length];
          const midX = (curr.x + next.x) / 2;
          const midY = (curr.y + next.y) / 2;
          if (i === 0) {
            const prev = pts[pts.length - 1];
            ctx.moveTo((prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
          }
          ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
        }
        ctx.closePath();
      }

      ctx.save();
      traceSlimePath();

      // 依質感與起泡度漸變深海藍 -> 冰藍珍珠慕斯色
      const bodyGrad = ctx.createRadialGradient(
        cx - currentR * 0.3, cy - currentR * 0.3, currentR * 0.1,
        cx, cy, currentR * 1.1
      );
      if (slimeState.isCloudTexture) {
        bodyGrad.addColorStop(0, 'rgba(224, 242, 254, 0.92)');
        bodyGrad.addColorStop(0.55, 'rgba(56, 189, 248, 0.78)');
        bodyGrad.addColorStop(1, 'rgba(3, 105, 161, 0.9)');
      } else {
        const lightL = 52 + foamRatio * 28;
        bodyGrad.addColorStop(0, `hsla(198, 100%, ${lightL + 18}%, 0.88)`);
        bodyGrad.addColorStop(0.55, `hsla(212, 100%, ${lightL}%, 0.72)`);
        bodyGrad.addColorStop(1, 'rgba(0, 42, 128, 0.88)');
      }

      ctx.shadowColor = 'rgba(0, 140, 255, 0.65)';
      ctx.shadowBlur = 32;
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 裁切內部空間繪製氣泡、亮片、配料與印章
      ctx.clip();

      // 1. 內部起泡泡泡
      for (let i = 0; i < slimeState.foamBubbles.length; i++) {
        const fb = slimeState.foamBubbles[i];
        const bx = cx + Math.cos(fb.angle) * fb.dist * currentR;
        const by = cy + Math.sin(fb.angle) * fb.dist * currentR;
        ctx.beginPath();
        ctx.arc(bx, by, fb.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(224, 242, 254, 0.32)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
      }

      // 2. 星光亮片
      for (let i = 0; i < slimeState.glitter.length; i++) {
        const gl = slimeState.glitter[i];
        const gx = cx + Math.cos(gl.angle) * gl.dist * currentR;
        const gy = cy + Math.sin(gl.angle) * gl.dist * currentR;
        const twinkle = 0.45 + 0.55 * Math.sin(time * 3 + gl.phase);
        ctx.beginPath();
        ctx.arc(gx, gy, gl.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
        ctx.fill();
      }

      // 3. 療癒印章
      for (let i = 0; i < slimeState.stamps.length; i++) {
        const st = slimeState.stamps[i];
        const sx = cx + Math.cos(st.angle) * st.dist * currentR;
        const sy = cy + Math.sin(st.angle) * st.dist * currentR;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.strokeStyle = `rgba(224, 242, 254, ${st.alpha})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 1, 7, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
        ctx.restore();
      }

      // 4. 可挑出的糖果珠與果凍配料
      for (let i = 0; i < slimeState.toppings.length; i++) {
        const t = slimeState.toppings[i];
        const tx = cx + Math.cos(t.angle) * t.dist * currentR;
        const ty = cy + Math.sin(t.angle) * t.dist * currentR;

        // 若開啟「挑出配料」模式，顯示深藍發光鎖定圈提示可點擊拔出
        if (slimeState.activeTool === 'pick') {
          ctx.beginPath();
          ctx.arc(tx, ty, t.size + 6 + Math.sin(time * 6) * 2, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        drawToppingShape(t.shape, tx, ty, t.size, t.rot, 0.95);
      }

      // 5. 刮刀柔光軌跡
      for (let i = slimeState.scrapeTrails.length - 1; i >= 0; i--) {
        const tr = slimeState.scrapeTrails[i];
        tr.life -= dt * 1.4;
        if (tr.life <= 0) {
          slimeState.scrapeTrails.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, 26, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(224, 242, 254, ${tr.life * 0.25})`;
        ctx.fill();
      }

      // 6. 可愛大眼睛（僅眼球方向跟隨指尖，史萊姆本體完全不晃動）
      slimeState.blinkTimer += dt;
      if (slimeState.happyTimer > 0) slimeState.happyTimer -= dt;
      const isBlinking = (slimeState.blinkTimer % 4.2) > 4.05;
      const eyeOffsetX = currentR * 0.26;
      const eyeY = cy - currentR * 0.06;

      [-1, 1].forEach(side => {
        const ex = cx + side * eyeOffsetX + slimeState.eyeLookX;
        const ey = eyeY + slimeState.eyeLookY;
        if (slimeState.happyTimer > 0 || isBlinking) {
          ctx.beginPath();
          ctx.arc(ex, ey + 3, 11, Math.PI * 1.15, Math.PI * 1.85);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(ex, ey, 11, 0, Math.PI * 2);
          ctx.fillStyle = '#04122b';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex - 3.5, ey - 3.5, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }
      });

      // 左上角果凍高光反射
      ctx.beginPath();
      ctx.ellipse(
        cx - currentR * 0.38,
        cy - currentR * 0.42,
        currentR * 0.24,
        currentR * 0.11,
        -Math.PI / 5,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      ctx.restore();

      // 7. 繪製外層冰晶脆皮殼（未敲碎的頂點段）
      for (let i = 0; i < pts.length; i++) {
        const curr = pts[i];
        const next = pts[(i + 1) % pts.length];
        if (curr.hasGlaze && next.hasGlaze) {
          ctx.beginPath();
          ctx.moveTo(curr.x, curr.y);
          ctx.lineTo(next.x, next.y);
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.92)';
          ctx.lineWidth = 5.5;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }

      // 8. 繪製飛濺的冰晶脆皮碎片
      for (let i = slimeState.glazeShards.length - 1; i >= 0; i--) {
        const sh = slimeState.glazeShards[i];
        sh.x += sh.vx;
        sh.y += sh.vy;
        sh.vy += 0.28;
        sh.rot += sh.vrot;
        sh.life -= dt * 1.35;
        if (sh.life <= 0) {
          slimeState.glazeShards.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.rot);
        ctx.fillStyle = `rgba(186, 230, 253, ${sh.life})`;
        ctx.beginPath();
        ctx.moveTo(0, -sh.size);
        ctx.lineTo(sh.size * 0.8, sh.size * 0.6);
        ctx.lineTo(-sh.size * 0.7, sh.size * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 9. 繪製被拔出彈飛的配料動畫
      for (let i = slimeState.poppedOutToppings.length - 1; i >= 0; i--) {
        const pt = slimeState.poppedOutToppings[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.22;
        pt.rot += pt.vrot;
        pt.life -= dt * 1.1;
        if (pt.life <= 0) {
          slimeState.poppedOutToppings.splice(i, 1);
          continue;
        }
        drawToppingShape(pt.shape, pt.x, pt.y, pt.size, pt.rot, pt.life);
      }
    }

    /**
     * ============================================================================
     * 4. 模式二：【星塵流體引力 (Nebula Flow)】
     * ============================================================================
     */
    const stardust = [];
    const nebulaRipples = [];
    const pointers = new Map();

    function initStardust() {
      stardust.length = 0;
      const hues = [215, 198, 188, 210];
      for (let i = 0; i < 240; i++) {
        stardust.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.7,
          vy: (Math.random() - 0.5) * 0.7,
          size: 1.2 + Math.random() * 2.2,
          hue: hues[i % hues.length],
          angle: Math.random() * Math.PI * 2,
          radius: 25 + Math.random() * 100,
          history: []
        });
      }
    }

    function scatterStardust(ox, oy) {
      nebulaRipples.push({ x: ox, y: oy, r: 8, alpha: 0.75 });
      for (let i = 0; i < stardust.length; i++) {
        const p = stardust[i];
        const dx = p.x - ox;
        const dy = p.y - oy;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 300) {
          const force = (1 - dist / 300) * (4 + Math.random() * 5);
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        }
      }
      audio.playChime(-1, 1.3);
    }

    function updateAndDrawNebula(time) {
      const activePts = Array.from(pointers.values());
      const interacting = activePts.length > 0;

      for (let i = nebulaRipples.length - 1; i >= 0; i--) {
        const rp = nebulaRipples[i];
        rp.r += 4;
        rp.alpha *= 0.95;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${rp.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (rp.alpha < 0.02) nebulaRipples.splice(i, 1);
      }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < stardust.length; i++) {
        const p = stardust[i];
        if (interacting) {
          const target = activePts[i % activePts.length];
          p.angle += 0.032;
          const sx = target.x + Math.cos(p.angle) * p.radius * 0.55;
          const sy = target.y + Math.sin(p.angle) * p.radius * 0.55;
          const dx = sx - p.x;
          const dy = sy - p.y;
          const dist = Math.hypot(dx, dy) || 1;
          const pull = Math.min(1.4, 170 / (dist + 40)) * 0.28;
          p.vx += (dx / dist) * pull - (dy / dist) * 0.13;
          p.vy += (dy / dist) * pull + (dx / dist) * 0.13;
          p.vx *= 0.91;
          p.vy *= 0.91;
        } else {
          p.vx += Math.cos(time * 0.6 + i) * 0.015;
          p.vy += Math.sin(time * 0.5 + i) * 0.015 - 0.006;
          p.vx *= 0.975;
          p.vy *= 0.975;
        }

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -20) { p.x = width + 20; p.history.length = 0; }
        if (p.x > width + 20) { p.x = -20; p.history.length = 0; }
        if (p.y < -20) { p.y = height + 20; p.history.length = 0; }
        if (p.y > height + 20) { p.y = -20; p.history.length = 0; }

        p.history.push({ x: p.x, y: p.y });
        if (p.history.length > (interacting ? 11 : 6)) p.history.shift();

        if (p.history.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.history[0].x, p.history[0].y);
          for (let j = 1; j < p.history.length; j++) ctx.lineTo(p.history[j].x, p.history[j].y);
          ctx.strokeStyle = `hsla(${p.hue}, 100%, 68%, 0.28)`;
          ctx.lineWidth = p.size * 0.85;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 76%, 0.9)`;
        ctx.fill();
      }
      ctx.restore();
    }

    /**
     * ============================================================================
     * 5. 模式三：【深海發光水母 (Glowing Jellyfish)】
     * ============================================================================
     */
    const jellyfishes = [];
    const jellyBubbles = [];

    function spawnJellyfish(x = Math.random() * width, y = Math.random() * height * 0.75 + 60) {
      if (jellyfishes.length >= 12) jellyfishes.shift();
      jellyfishes.push({
        x,
        y,
        r: 22 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        speed: 0.35 + Math.random() * 0.35,
        glow: 0,
        hue: 195 + Math.random() * 25
      });
    }

    function initJellyfishes() {
      jellyfishes.length = 0;
      for (let i = 0; i < 7; i++) spawnJellyfish();
    }

    function spawnJellyBubbleStream(ox, oy, count = 12) {
      for (let i = 0; i < count; i++) {
        jellyBubbles.push({
          x: ox + (Math.random() - 0.5) * 40,
          y: oy + Math.random() * 20,
          r: 2 + Math.random() * 4.5,
          vy: -(1.2 + Math.random() * 2.2),
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function updateAndDrawJellyfish(time, dt) {
      const activePts = Array.from(pointers.values());

      for (let i = 0; i < jellyfishes.length; i++) {
        const j = jellyfishes[i];
        j.phase += dt * 2.4;
        j.glow = Math.max(0, j.glow - dt * 1.4);

        const pulse = Math.sin(j.phase);
        j.y -= (0.35 + Math.max(0, pulse) * 0.85) * j.speed;
        j.x += Math.sin(time * 0.8 + i) * 0.35;

        if (activePts.length > 0) {
          const target = activePts[0];
          j.x += (target.x - j.x) * dt * 0.65;
          j.y += (target.y - j.y) * dt * 0.65;
        }

        if (j.y < -60) {
          j.y = height + 50;
          j.x = Math.random() * width;
        }

        const rx = j.r * (1 - pulse * 0.14);
        const ry = j.r * (0.72 + pulse * 0.14);

        ctx.save();
        ctx.translate(j.x, j.y);

        // 觸鬚
        for (let t = -2; t <= 2; t++) {
          ctx.beginPath();
          ctx.moveTo(t * (rx * 0.28), 0);
          const wave = Math.sin(j.phase - Math.abs(t) * 0.5) * 10;
          ctx.quadraticCurveTo(t * (rx * 0.32) + wave, j.r * 1.1, t * (rx * 0.25) - wave * 0.6, j.r * 2.1);
          ctx.strokeStyle = `hsla(${j.hue}, 100%, ${72 + j.glow * 20}%, 0.55)`;
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }

        // 發光傘蓋
        const grad = ctx.createRadialGradient(0, -ry * 0.3, 2, 0, 0, rx);
        grad.addColorStop(0, `hsla(${j.hue}, 100%, ${85 + j.glow * 15}%, 0.88)`);
        grad.addColorStop(0.65, `hsla(${j.hue}, 100%, 58%, 0.45)`);
        grad.addColorStop(1, 'rgba(0, 68, 204, 0.15)');

        ctx.beginPath();
        ctx.arc(0, 0, rx, Math.PI, 0);
        ctx.quadraticCurveTo(rx * 0.5, ry * 0.35, 0, ry * 0.2);
        ctx.quadraticCurveTo(-rx * 0.5, ry * 0.35, -rx, 0);
        ctx.fillStyle = grad;
        ctx.shadowColor = '#00aaff';
        ctx.shadowBlur = 18 + j.glow * 20;
        ctx.fill();
        ctx.restore();
      }

      // 上升氣泡流
      for (let i = jellyBubbles.length - 1; i >= 0; i--) {
        const b = jellyBubbles[i];
        b.y += b.vy;
        b.x += Math.sin(time * 4 + b.phase) * 0.5;
        if (b.y < -20) {
          jellyBubbles.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.65)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    /**
     * ============================================================================
     * 6. 模式四：【深海氣泡捏捏樂 (Neon Bubble Pop)】
     * ============================================================================
     */
    const bubbles = [];
    const popParticles = [];
    let poppedCount = 0;
    const popCounterEl = document.getElementById('pop-counter');

    function initBubbles() {
      bubbles.length = 0;
      const isMobile = width < 640;
      const radius = isMobile ? 24 : 30;
      const gap = isMobile ? 12 : 15;
      const step = radius * 2 + gap;
      const topMargin = 85;
      const bottomMargin = 135;
      const usableW = Math.max(120, width - 36);
      const usableH = Math.max(160, height - topMargin - bottomMargin);
      const cols = Math.max(4, Math.floor(usableW / step));
      const rows = Math.max(3, Math.floor(usableH / step));
      const offsetX = (width - (cols * step - gap)) / 2 + radius;
      const offsetY = topMargin + (usableH - (rows * step - gap)) / 2 + radius;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const stagger = (r % 2 === 1) ? step * 0.2 : -step * 0.2;
          const bx = offsetX + c * step + stagger;
          const by = offsetY + r * step;
          if (bx > radius + 6 && bx < width - radius - 6) {
            bubbles.push({
              x: bx, y: by, maxR: radius, currentR: radius,
              popped: false, respawnTimer: 0, phase: Math.random() * Math.PI * 2
            });
          }
        }
      }
    }

    function popSingleBubble(b, playAudio = true) {
      if (b.popped) return;
      b.popped = true;
      b.currentR = 0;
      b.respawnTimer = 2.4 + Math.random() * 1.4;
      poppedCount++;
      popCounterEl.textContent = poppedCount;
      if (playAudio) audio.playBubblePop(1);

      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        popParticles.push({
          x: b.x, y: b.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 2.2, life: 1.0
        });
      }
    }

    function updateAndDrawBubbles(time, dt) {
      for (let i = 0; i < bubbles.length; i++) {
        const b = bubbles[i];
        if (b.popped) {
          b.respawnTimer -= dt;
          if (b.respawnTimer <= 0) {
            b.currentR += (b.maxR - b.currentR) * Math.min(1, dt * 6);
            if (b.maxR - b.currentR < 0.4) { b.currentR = b.maxR; b.popped = false; }
          } else {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.maxR * 0.7, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
            ctx.stroke();
            continue;
          }
        }
        const r = Math.max(0.1, b.currentR + (b.popped ? 0 : Math.sin(time * 2.2 + b.phase) * 1.4));
        const grad = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.3, 2, b.x, b.y, r);
        grad.addColorStop(0, 'rgba(224, 242, 254, 0.55)');
        grad.addColorStop(0.4, 'rgba(0, 140, 255, 0.25)');
        grad.addColorStop(1, 'rgba(56, 189, 248, 0.75)');

        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.55)';
        ctx.stroke();
      }

      for (let i = popParticles.length - 1; i >= 0; i--) {
        const p = popParticles[i];
        p.x += p.vx; p.y += p.vy; p.life -= dt * 2.5;
        if (p.life <= 0) { popParticles.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(125, 211, 252, ${p.life})`;
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 7. 模式五：【靜謐深海雨夜 (Deep Blue Rain & Ripples - 新增紓壓模式)】
     * ============================================================================
     */
    const rainState = {
      heavy: false,
      drops: [],
      waterRipples: []
    };

    function initRain() {
      rainState.drops = [];
      const count = rainState.heavy ? 95 : 42;
      for (let i = 0; i < count; i++) {
        rainState.drops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          len: 14 + Math.random() * 18,
          vy: (rainState.heavy ? 11 : 7.5) + Math.random() * 4,
          targetY: height * (0.45 + Math.random() * 0.45)
        });
      }
    }

    function addWaterRipple(x, y, maxR = 75, playSound = false) {
      rainState.waterRipples.push({
        x, y, r: 4, maxR, alpha: 0.85
      });
      if (playSound) audio.playChime(-1, 1.4);
    }

    function updateAndDrawRain(dt) {
      // 深海靜謐水面反光層
      const waterGrad = ctx.createLinearGradient(0, height * 0.45, 0, height);
      waterGrad.addColorStop(0, 'rgba(0, 20, 60, 0)');
      waterGrad.addColorStop(1, 'rgba(0, 55, 145, 0.25)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, height * 0.45, width, height * 0.55);

      // 雨絲下落
      for (let i = 0; i < rainState.drops.length; i++) {
        const d = rainState.drops[i];
        d.y += d.vy;
        d.x -= 0.6;

        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + 1.2, d.y - d.len);
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.42)';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        if (d.y >= d.targetY) {
          addWaterRipple(d.x, d.targetY, 35 + Math.random() * 25, false);
          d.y = -20;
          d.x = Math.random() * width;
          d.targetY = height * (0.45 + Math.random() * 0.45);
        }
      }

      // 擴散的橢圓深藍霓虹水波紋
      for (let i = rainState.waterRipples.length - 1; i >= 0; i--) {
        const rp = rainState.waterRipples[i];
        rp.r += dt * 55;
        rp.alpha = Math.max(0, 1 - rp.r / rp.maxR);
        if (rp.alpha <= 0.02) {
          rainState.waterRipples.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.36, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${rp.alpha * 0.75})`;
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    }

    /**
     * ============================================================================
     * 8. 模式六：【星空連線冥想 (Constellation Connect - 新增紓壓模式)】
     * ============================================================================
     */
    const constellationState = {
      stars: [],
      links: [],
      lastStar: null,
      meteors: []
    };

    function initConstellation() {
      constellationState.stars = [];
      constellationState.links = [];
      constellationState.lastStar = null;
      for (let i = 0; i < 28; i++) {
        constellationState.stars.push({
          x: 50 + Math.random() * (width - 100),
          y: 80 + Math.random() * (height - 230),
          r: 3.5 + Math.random() * 2.5,
          phase: Math.random() * Math.PI * 2,
          lit: false
        });
      }
    }

    function spawnWishMeteor() {
      constellationState.meteors.push({
        x: Math.random() * width * 0.8 + width * 0.2,
        y: 40 + Math.random() * 120,
        vx: -8 - Math.random() * 5,
        vy: 4.5 + Math.random() * 3,
        life: 1.0
      });
      audio.playChime(7, 1.8);
    }

    function touchConstellationStar(px, py) {
      for (let i = 0; i < constellationState.stars.length; i++) {
        const s = constellationState.stars[i];
        if (Math.hypot(px - s.x, py - s.y) < 34) {
          if (constellationState.lastStar && constellationState.lastStar !== s) {
            const exists = constellationState.links.some(
              l => (l.a === constellationState.lastStar && l.b === s) || (l.a === s && l.b === constellationState.lastStar)
            );
            if (!exists) {
              constellationState.links.push({ a: constellationState.lastStar, b: s });
              audio.playChime(i, 1.5);
            }
          } else if (!s.lit) {
            audio.playChime(i, 1.3);
          }
          s.lit = true;
          constellationState.lastStar = s;
          break;
        }
      }
    }

    function updateAndDrawConstellation(time, dt) {
      // 繪製已連接的深藍雷射星軌
      ctx.save();
      ctx.shadowColor = '#00aaff';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
      ctx.lineWidth = 2.2;
      for (let i = 0; i < constellationState.links.length; i++) {
        const l = constellationState.links[i];
        ctx.beginPath();
        ctx.moveTo(l.a.x, l.a.y);
        ctx.lineTo(l.b.x, l.b.y);
        ctx.stroke();
      }
      ctx.restore();

      // 繪製可連線的發光星點
      for (let i = 0; i < constellationState.stars.length; i++) {
        const s = constellationState.stars[i];
        const pulse = 1 + Math.sin(time * 3 + s.phase) * 0.22;
        const r = s.r * pulse * (s.lit ? 1.35 : 1);

        ctx.beginPath();
        ctx.arc(s.x, s.y, r * 2.4, 0, Math.PI * 2);
        ctx.fillStyle = s.lit ? 'rgba(56, 189, 248, 0.28)' : 'rgba(56, 189, 248, 0.12)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
        ctx.fillStyle = s.lit ? '#ffffff' : '#bae6fd';
        ctx.fill();
      }

      // 許願流星
      for (let i = constellationState.meteors.length - 1; i >= 0; i--) {
        const m = constellationState.meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.life -= dt * 0.95;
        if (m.life <= 0) {
          constellationState.meteors.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 8, m.y - m.vy * 8);
        ctx.strokeStyle = `rgba(224, 242, 254, ${m.life})`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }

    /**
     * ============================================================================
     * 9. 模式七、八、九：【深海風鈴】、【星光流沙】、【4-7-8 深藍呼吸】
     * ============================================================================
     */
    const chimes = [];
    const lanterns = [];
    function initChimes() {
      chimes.length = 0;
      const count = width < 640 ? 5 : 7;
      const spacing = width / (count + 1);
      for (let i = 0; i < count; i++) {
        chimes.push({
          x: spacing * (i + 1),
          len: 120 + (i % 3) * 38,
          angle: 0,
          vel: 0,
          note: i
        });
      }
    }

    function updateAndDrawChimes(dt) {
      for (let i = 0; i < chimes.length; i++) {
        const c = chimes[i];
        c.vel += -0.04 * c.angle;
        c.vel *= 0.96;
        c.angle += c.vel;

        const bx = c.x + Math.sin(c.angle) * c.len;
        const by = 70 + Math.cos(c.angle) * c.len;

        ctx.beginPath();
        ctx.moveTo(c.x, 60);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(bx, by, 14, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.shadowColor = '#00aaff';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (let i = lanterns.length - 1; i >= 0; i--) {
        const l = lanterns[i];
        l.y -= dt * 48;
        if (l.y < -40) { lanterns.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.roundRect(l.x - 10, l.y - 14, 20, 28, 6);
        ctx.fillStyle = 'rgba(125, 211, 252, 0.65)';
        ctx.fill();
      }
    }

    // 星光流沙
    const SAND_COLS = 90;
    let sandHeights = new Float32Array(SAND_COLS);
    const fallingGrains = [];
    let sandHue = 205;

    function updateAndDrawSand(dt) {
      const activePts = Array.from(pointers.values());
      if (activePts.length > 0) {
        const pt = activePts[0];
        for (let k = 0; k < 4; k++) {
          fallingGrains.push({
            x: pt.x + (Math.random() - 0.5) * 14,
            y: pt.y,
            vy: 3 + Math.random() * 3
          });
        }
        audio.playChime(-1, 0.6);
      }

      const colW = width / SAND_COLS;
      for (let i = fallingGrains.length - 1; i >= 0; i--) {
        const g = fallingGrains[i];
        g.y += g.vy;
        g.vy += 0.25;
        const col = Math.max(0, Math.min(SAND_COLS - 1, Math.floor(g.x / colW)));
        const floorY = height - sandHeights[col];
        if (g.y >= floorY) {
          sandHeights[col] = Math.min(height * 0.65, sandHeights[col] + 3.2);
          fallingGrains.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(g.x, g.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${sandHue}, 100%, 76%, 0.9)`;
        ctx.fill();
      }

      // 沙丘自然平滑流動
      for (let i = 1; i < SAND_COLS - 1; i++) {
        if (sandHeights[i] - sandHeights[i - 1] > 5) {
          sandHeights[i] -= 1.2;
          sandHeights[i - 1] += 1.2;
        }
        if (sandHeights[i] - sandHeights[i + 1] > 5) {
          sandHeights[i] -= 1.2;
          sandHeights[i + 1] += 1.2;
        }
      }

      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let i = 0; i < SAND_COLS; i++) {
        ctx.lineTo(i * colW + colW * 0.5, height - sandHeights[i]);
      }
      ctx.lineTo(width, height);
      ctx.closePath();
      const sGrad = ctx.createLinearGradient(0, height * 0.5, 0, height);
      sGrad.addColorStop(0, `hsla(${sandHue}, 100%, 65%, 0.78)`);
      sGrad.addColorStop(1, 'rgba(0, 28, 85, 0.95)');
      ctx.fillStyle = sGrad;
      ctx.fill();
    }

    // 4-7-8 深藍呼吸
    const breathPhaseEl = document.getElementById('breath-phase-text');
    const breathSubEl = document.getElementById('breath-sub-text');
    const breathTimerEl = document.getElementById('breath-timer-text');
    let breathElapsed = 0;
    let lastBreathPhase = '';

    function updateAndDrawBreath(dt) {
      breathElapsed = (breathElapsed + dt) % 19;
      let phase = '', sub = '', rem = 0, scale = 0.45;
      if (breathElapsed < 4) {
        const ease = 0.5 - 0.5 * Math.cos((breathElapsed / 4) * Math.PI);
        scale = 0.45 + ease * 0.55;
        phase = '深深吸氣';
        sub = '用鼻子緩慢吸入寧靜的深海微光';
        rem = Math.ceil(4 - breathElapsed);
      } else if (breathElapsed < 11) {
        scale = 1.0 + Math.sin((breathElapsed - 4) * 2.5) * 0.015;
        phase = '輕柔屏息';
        sub = '讓平靜與氧氣在身體裡停留片刻';
        rem = Math.ceil(11 - breathElapsed);
      } else {
        const ease = 0.5 - 0.5 * Math.cos(((breathElapsed - 11) / 8) * Math.PI);
        scale = 1.0 - ease * 0.55;
        phase = '緩緩吐氣';
        sub = '把所有疲憊與緊繃隨氣息一起釋放';
        rem = Math.ceil(19 - breathElapsed);
      }

      if (phase !== lastBreathPhase) {
        lastBreathPhase = phase;
        breathPhaseEl.textContent = phase;
        breathSubEl.textContent = sub;
        audio.playChime(phase === '深深吸氣' ? 3 : (phase === '輕柔屏息' ? 4 : 0), 2.2);
      }
      breathTimerEl.textContent = `${rem} 秒`;

      const cx = width / 2;
      const cy = height / 2;
      const r = Math.min(width, height) * 0.32 * scale;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#0088ff';
      ctx.shadowBlur = 26;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    /**
     * ============================================================================
     * 10. 模式切換、按鈕事件與 Pointer 互動控制
     * ============================================================================
     */
    let currentMode = 'slime';
    const modeButtons = document.querySelectorAll('.mode-btn');
    const hintText = document.getElementById('hint-text');

    const toolbars = {
      slime: document.getElementById('slime-tools'),

    };

    const modeHints = {
      slime: '史萊姆已穩固居中 · 點擊敲碎深藍冰晶脆皮，來回揉捏起泡，或挑出裡面的配料',
      nebula: '在夜空中滑動或長按，凝聚發光星塵與深海微光 · 放開後如煙火溫柔綻放',
      jellyfish: '輕點發光水母吐出氣泡與豎琴泛音 · 長按可溫柔吸引水母群共舞',
      bubbles: '點擊或滑過發光深藍氣泡，「啵」一聲釋放壓力 · 氣泡稍後會自動恢復',
      rain: '聆聽靜謐深海雨夜 · 點擊或滑過水面激起擴散的深藍霓虹水波紋',
      constellation: '滑過或點擊發光星點，親手編織專屬的深藍霓虹星座與許願流星',
      chimes: '輕撫懸掛的深海水晶風鈴，隨微風擺動並奏出五聲音階治癒鈴聲',
      sand: '長按螢幕灑落發光深藍星砂堆疊沙丘 · 點擊海浪按鈕可溫柔撫平',
      breath: '跟隨中央深藍光環進行 4-7-8 呼吸練習，享受無壓力的寧靜時刻'
    };

    function switchMode(mode) {
      currentMode = mode;
      modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      Object.entries(toolbars).forEach(([key, el]) => {
        if (el) el.classList.toggle('hidden', key !== mode);
      });
      hintText.textContent = modeHints[mode] || '';

      if (mode === 'bubbles' && bubbles.length === 0) initBubbles();
      if (mode === 'jellyfish' && jellyfishes.length === 0) initJellyfishes();
      if (mode === 'rain' && rainState.drops.length === 0) initRain();
      if (mode === 'constellation' && constellationState.stars.length === 0) initConstellation();
      if (mode === 'chimes' && chimes.length === 0) initChimes();
      if (mode === 'breath') { breathElapsed = 0; lastBreathPhase = ''; }
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        audio.unlock();
        switchMode(btn.dataset.mode);
      });
    });

    // 史萊姆工具列綁定
    function setSlimeTool(tool) {
      slimeState.activeTool = tool;
      document.getElementById('btn-slime-scraper').classList.toggle('active', tool === 'scraper');
      document.getElementById('btn-slime-pick').classList.toggle('active', tool === 'pick');
    }

    document.getElementById('btn-slime-glaze').addEventListener('click', () => {
      audio.unlock();

    document.getElementById('btn-slime-popfoam').addEventListener('click', () => {

    const btnTexture = document.getElementById('btn-slime-texture');

      audio.playSlimeSquish(0.5);

    document.getElementById('btn-slime-glitter').addEventListener('click', () => {

    document.getElementById('btn-slime-stamp').addEventListener('click', () => {
      audio.unlock();
      const cx = width / 2;
      const cy = height / 2 - 20;
      const r = slimeState.baseRadius * (1 + (slimeState.foamLevel / 100) * 0.16);
      const a = Math.random() * Math.PI * 2;
      const d = Math.random() * r * 0.55;
      addSlimeStamp(cx + Math.cos(a) * d, cy + Math.sin(a) * d, cx, cy, r);
    });

    document.getElementById('btn-slime-scraper').addEventListener('click', () => {
      audio.unlock();
      setSlimeTool(slimeState.activeTool === 'scraper' ? 'knead' : 'scraper');
    });

    document.getElementById('btn-slime-pick').addEventListener('click', () => {
      audio.unlock();
      setSlimeTool(slimeState.activeTool === 'pick' ? 'knead' : 'pick');
    });

    document.getElementById('btn-slime-clear').addEventListener('click', () => {
      audio.unlock();
      clearAllSlimeToppings();
    });

    // 其他模式按鈕綁定
    document.getElementById('btn-jelly-add').addEventListener('click', () => {
      audio.unlock();
      spawnJellyfish();
      audio.playChime(6, 1.2);
    });
    document.getElementById('btn-jelly-bubbles').addEventListener('click', () => {
      audio.unlock();
      spawnJellyBubbleStream(width / 2, height - 100, 26);
      audio.playBubblePop(1.1);
    });
    document.getElementById('btn-pop-all').addEventListener('click', () => {
      audio.unlock();
      const unpopped = bubbles.filter(b => !b.popped);
      unpopped.forEach((b, idx) => setTimeout(() => popSingleBubble(b, idx % 3 === 0), Math.min(400, idx * 8)));
    });
    document.getElementById('btn-sand-wave').addEventListener('click', () => {
      audio.unlock();
      sandHeights.fill(26);
      audio.playWaveWash();
    });
    document.getElementById('btn-sand-color').addEventListener('click', () => {
      audio.unlock();
      sandHue = sandHue === 205 ? 190 : (sandHue === 190 ? 225 : 205);
      audio.playChime(4, 0.9);
    });
    document.getElementById('btn-chime-breeze').addEventListener('click', () => {
      audio.unlock();
      chimes.forEach((c, idx) => {
        setTimeout(() => {
          c.vel += (Math.random() > 0.5 ? 1 : -1) * 0.14;
          audio.playChime(c.note, 1.5);
        }, idx * 90);
      });
    });
    document.getElementById('btn-chime-lantern').addEventListener('click', () => {
      audio.unlock();
      lanterns.push({ x: 80 + Math.random() * (width - 160), y: height - 90 });
      audio.playChime(5, 1.4);
    });

    // 雨夜 & 星空連線按鈕
    const btnRainIntensity = document.getElementById('btn-rain-intensity');
    btnRainIntensity.addEventListener('click', () => {
      audio.unlock();
      rainState.heavy = !rainState.heavy;
      btnRainIntensity.textContent = rainState.heavy ? '⛈️ 雨勢：深海驟雨' : '🌧️ 雨勢：溫柔細雨';
      initRain();
      audio.playChime(2, 1.1);
    });
    document.getElementById('btn-rain-ripple').addEventListener('click', () => {
      audio.unlock();
      addWaterRipple(width * (0.25 + Math.random() * 0.5), height * (0.55 + Math.random() * 0.3), 115, true);
    });

    document.getElementById('btn-star-meteor').addEventListener('click', () => {
      audio.unlock();
      spawnWishMeteor();
    });
    document.getElementById('btn-star-clear').addEventListener('click', () => {
      audio.unlock();
      constellationState.links = [];
      constellationState.lastStar = null;
      constellationState.stars.forEach(s => s.lit = false);
      audio.playChime(0, 1.0);
    });

    // 畫布 Pointer Events
    canvas.addEventListener('pointerdown', (e) => {
      audio.unlock();
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (currentMode === 'slime') {
        handleSlimePointerDown(e.clientX, e.clientY);
      } else if (currentMode === 'nebula') {
        nebulaRipples.push({ x: e.clientX, y: e.clientY, r: 5, alpha: 0.65 });
        audio.playChime(-1, 1.0);
      } else if (currentMode === 'jellyfish') {
        jellyfishes.forEach(j => {
          if (Math.hypot(e.clientX - j.x, e.clientY - j.y) < j.r * 1.8) {
            j.glow = 1.0;
            spawnJellyBubbleStream(j.x, j.y, 8);
            audio.playChime(-1, 1.4);
          }
        });
      } else if (currentMode === 'bubbles') {
        bubbles.forEach(b => {
          if (!b.popped && Math.hypot(e.clientX - b.x, e.clientY - b.y) <= b.currentR * 1.12) {
            popSingleBubble(b, true);
          }
        });
      } else if (currentMode === 'rain') {
        addWaterRipple(e.clientX, Math.max(height * 0.45, e.clientY), 95, true);
      } else if (currentMode === 'constellation') {
        touchConstellationStar(e.clientX, e.clientY);
      } else if (currentMode === 'chimes') {
        chimes.forEach(c => {
          if (Math.abs(e.clientX - c.x) < 42) {
            c.vel += (e.clientX < c.x ? 1 : -1) * 0.16;
            audio.playChime(c.note, 1.6);
          }
        });
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const speed = Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (currentMode === 'slime') {
        handleSlimePointerMove(e.clientX, e.clientY, speed);
      } else if (currentMode === 'nebula' && speed > 3) {
        audio.playChime(-1, 1.0);
      } else if (currentMode === 'bubbles') {
        bubbles.forEach(b => {
          if (!b.popped && Math.hypot(e.clientX - b.x, e.clientY - b.y) <= b.currentR * 1.12) {
            popSingleBubble(b, true);
          }
        });
      } else if (currentMode === 'rain' && speed > 5) {
        addWaterRipple(e.clientX, Math.max(height * 0.45, e.clientY), 65, true);
      } else if (currentMode === 'constellation') {
        touchConstellationStar(e.clientX, e.clientY);
      } else if (currentMode === 'chimes' && speed > 4) {
        chimes.forEach(c => {
          if (Math.abs(e.clientX - c.x) < 35) {
            c.vel += (e.clientX - prev.x) * 0.008;
            audio.playChime(c.note, 1.5);
          }
        });
      }
    });

    function handlePointerUp(e) {
      if (!pointers.has(e.pointerId)) return;
      const pt = pointers.get(e.pointerId);
      pointers.delete(e.pointerId);
      slimeState.draggedTopping = null;
      if (currentMode === 'nebula') {
        scatterStardust(pt.x, pt.y);
      }
    }

    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    // 音效與沉浸模式 UI
    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      const on = audio.toggleSound();
      document.getElementById('sound-icon').textContent = on ? '🔊' : '🔇';

    const btnHideUi = document.getElementById('btn-hide-ui');

    /**
     * ============================================================================
     * 11. 視窗尺寸自適應與主動畫迴圈
     * ============================================================================
     */
    function resizeCanvas() {
      width = Math.max(300, window.innerWidth);
      height = Math.max(300, window.innerHeight);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      initBgStars();
      if (slimeState.vertices.length === 0) initSlime();
      else slimeState.baseRadius = Math.max(105, Math.min(165, Math.min(width, height) * 0.24));

      if (currentMode === 'bubbles') initBubbles();
      if (currentMode === 'rain') initRain();
      if (currentMode === 'chimes') initChimes();
    }

    window.addEventListener('resize', resizeCanvas);

    let lastTime = 0;
    function animate(ts) {
      const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;
      const time = ts / 1000;

      ctx.clearRect(0, 0, width, height);
      drawBgStars(time);

      if (currentMode === 'slime') updateAndDrawSlime(time, dt);
      else if (currentMode === 'nebula') updateAndDrawNebula(time);
      else if (currentMode === 'jellyfish') updateAndDrawJellyfish(time, dt);
      else if (currentMode === 'bubbles') updateAndDrawBubbles(time, dt);
      else if (currentMode === 'rain') updateAndDrawRain(dt);
      else if (currentMode === 'constellation') updateAndDrawConstellation(time, dt);
      else if (currentMode === 'chimes') updateAndDrawChimes(dt);
      else if (currentMode === 'sand') updateAndDrawSand(dt);
      else if (currentMode === 'breath') updateAndDrawBreath(dt);

      requestAnimationFrame(animate);
    }

    window.onload = function () {
      resizeCanvas();
      initSlime();
      initStardust();
      initJellyfishes();
      initBubbles();
      initRain();
      initConstellation();
      initChimes();
      sandHeights.fill(26);
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
