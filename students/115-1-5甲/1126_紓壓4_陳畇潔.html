  function renderPerler75Grid() {
    const drawer = document.getElementById('perlerPaletteDrawer');
    const gridEl = document.getElementById('perlerColorGrid');
    const labelEl = document.getElementById('perlerColorIndexLabel');
    if (!drawer || !gridEl) return;

    if (currentMode !== 'perler' || !perlerState.paletteOpen) {
      drawer.classList.add('hidden');
      return;
    }

    drawer.classList.remove('hidden');
    const cur = perlerColors[perlerState.colorIdx];
    labelEl.textContent = `#${String(perlerState.colorIdx + 1).padStart(2, '0')} ${cur.name}（共75色）`;

    gridEl.innerHTML = '';
    perlerColors.forEach((col, idx) => {
      const swatch = document.createElement('button');
      swatch.title = `#${idx + 1} ${col.name}`;
      swatch.className = `w-5 h-5 rounded-full border transition cursor-pointer ${
        idx === perlerState.colorIdx && !perlerState.eraser
          ? 'scale-125 border-white ring-2 ring-cyan-300 z-10'
          : 'border-white/25 hover:scale-110'
      }`;
      swatch.style.backgroundColor = col.hex;
      swatch.addEventListener('click', () => {
        perlerState.colorIdx = idx;
        perlerState.eraser = false;
        audio.playPop(1.25);
        renderPerler75Grid();
        updateSubControls();
      });
      gridEl.appendChild(swatch);
    });
  }

  function updateSubControls() {
    const box = document.getElementById('subControls');
    box.innerHTML = '';
    renderPerler75Grid();

    const makeBtn = (text, onClick) => {
      const btn = document.createElement('button');
      btn.className = 'sub-pill rounded-full px-3.5 py-1.5 text-xs sm:text-sm font-medium cursor-pointer';
      btn.textContent = text;
      btn.addEventListener('click', onClick);
      box.appendChild(btn);
    };

    if (currentMode === 'stardust') {
      makeBtn(stardustRepel ? '🧲 切換：引力模式' : '💫 切換：斥力爆散', () => {
        stardustRepel = !stardustRepel;
        updateSubControls();
      });
    } else if (currentMode === 'constellation') {
      makeBtn('🧹 清除星線重連', () => {
        constellationLinks.length = 0;
        constellationStars.forEach(s => { s.lit = false; });
        activeStarIdx = -1;
        audio.playPop(1.1);
      });
      makeBtn('✨ 重新生成星圖', () => {
        initConstellation();
        audio.playChime(5, 1.3, 0.08);
      });
    } else if (currentMode === 'slime') {
      makeBtn('🎨 換史萊姆色', () => {
        slimeState.themeIdx = (slimeState.themeIdx + 1) % slimeThemes.length;
        audio.playPop(1.1);
      });
      makeBtn('✨ 撒亮片', () => { addSlimeToppings('glitter', 14); audio.playPop(1.3); });
      makeBtn('🍬 糖果珠', () => { addSlimeToppings('bead', 9); audio.playPop(1.1); });
      makeBtn('🍓 果凍配料', () => { addSlimeToppings('jelly', 6); audio.playPop(0.95); });
      makeBtn('❄️ 淋上脆皮', () => applySlimeGlaze());
      makeBtn('🫧 戳破泡泡', () => {
        pokeSlime(width * 0.5, height * 0.47, 26);
        audio.playPop(1.35);
      });
    } else if (currentMode === 'crispy') {
      makeBtn('🎨 脆皮色：' + crispyThemes[crispyState.themeIdx].name, () => {
        crispyState.themeIdx = (crispyState.themeIdx + 1) % crispyThemes.length;
        audio.playPop(1.15);
        updateSubControls();
      });
      makeBtn('❄️ 重新淋脆皮', () => {
        crispyState.cracks = [];
        crispyState.velY = -0.18;
        audio.playChime(7, 1.3, 0.08);
      });
    } else if (currentMode === 'shinobu') {
      makeBtn('🦋 召喚蝶群共舞', () => triggerShinobuDance(width * 0.5, height * 0.45));
    } else if (currentMode === 'bubbles') {
      makeBtn('🎨 氣泡色：' + bubblePalettes[bubbleState.paletteIdx].name, () => {
        bubbleState.paletteIdx = (bubbleState.paletteIdx + 1) % bubblePalettes.length;
        bubbleState.items.forEach(b => {
          b.popped = false;
          b.scale = 1.15;
        });
        audio.playChime(6, 1.2, 0.08);
        updateSubControls();
      });
      makeBtn('🫧 全部復原', () => {
        bubbleState.items.forEach(b => {
          b.popped = false;
          b.scale = 1.15;
        });
        audio.playPop(1.2);
      });
    } else if (currentMode === 'perler') {
      const curCol = perlerColors[perlerState.colorIdx];
      makeBtn(`🎨 75色卡：#${String(perlerState.colorIdx + 1).padStart(2, '0')} ${curCol.name}`, () => {
        perlerState.paletteOpen = !perlerState.paletteOpen;
        audio.playPop(1.2);
        renderPerler75Grid();
      });
      if (!perlerState.charmMode) {
        makeBtn(perlerState.eraser ? '🧽 橡皮擦：開' : '🧽 橡皮擦', () => {
          perlerState.eraser = !perlerState.eraser;
          audio.playClick(perlerState.eraser);
          updateSubControls();
        });
        makeBtn('🔥 熨燙成吊飾', () => triggerPerlerIron());
      } else {
        makeBtn(`🔗 扣環：${charmStyles[perlerState.charmStyleIdx]}`, () => {
          perlerState.charmStyleIdx = (perlerState.charmStyleIdx + 1) % charmStyles.length;
          perlerState.charmVel += 0.08;
          audio.playChime(7, 1.2, 0.08);
          updateSubControls();
        });
      }
      makeBtn(perlerState.charmMode ? '✏️ 回釘板編輯' : '🔑 掛成吊飾', () => togglePerlerCharm());
      makeBtn('⭐ 星星', () => { initPerler('star'); audio.playChime(5, 1.2, 0.08); updateSubControls(); });
      makeBtn('💖 愛心', () => { initPerler('heart'); audio.playChime(6, 1.2, 0.08); updateSubControls(); });
    }
  }

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    document.getElementById('modeSubtitle').textContent = modeDescriptions[mode] || '';
    updateSubControls();
    audio.playChime(null, 1.1, 0.05);
  }

  function onResizeRebuild() {
    initBgStars();
    if (stardustParticles.length === 0) initStardust();
    if (constellationStars.length === 0) initConstellation();
    if (slimeState.points.length === 0) initSlime();
    if (shinobuModeState.butterflies.length === 0) initShinobuMode();
    if (fidgetState.keys.length === 0) initFidgetPad();
    if (chimeState.bells.length === 0) initChimes();
    if (jellyfishes.length === 0) initJellyfish();
    initBubbles();
    if (perlerState.grid.length === 0) initPerler('heart');
    if (rainDrops.length === 0) initRain();
    if (lotuses.length === 0) initLotus();
  }

  // =========================================================================
  // 20. 統一滑鼠與觸控互動處理
  // =========================================================================
  function handlePointerStart(x, y) {
    audio.init();
    pointer.down = true;
    pointer.x = pointer.px = x;
    pointer.y = pointer.py = y;

    if (currentMode === 'stardust') {
      spawnClickStarburst(x, y);
    } else if (currentMode === 'constellation') {
      handleConstellationDown(x, y);
    } else if (currentMode === 'slime') {
      pokeSlime(x, y, 22);
    } else if (currentMode === 'crispy') {
      squishCrispyBall(x, y);
    } else if (currentMode === 'shinobu') {
      triggerShinobuDance(x, y);
    } else if (currentMode === 'fidget') {
      handleFidgetDown(x, y);
    } else if (currentMode === 'chimes') {
      handleChimesInteract(x, y);
    } else if (currentMode === 'jellyfish') {
      boostJellyfish(x, y);
    } else if (currentMode === 'bubbles') {
      popBubbleAt(x, y);
    } else if (currentMode === 'perler') {
      interactPerlerAt(x, y);
    } else if (currentMode === 'sand') {
      spawnSand(x, y);
    } else if (currentMode === 'rain') {
      spawnRainRipple(x, y);
    } else if (currentMode === 'lotus') {
      spawnLotus(x, y);
    }
  }

  function handlePointerMove(x, y) {
    pointer.vx = x - pointer.x;
    pointer.vy = y - pointer.y;
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    pointer.x = x;
    pointer.y = y;

    if (!pointer.down) return;

    if (currentMode === 'constellation') {
      handleConstellationMove(x, y);
    } else if (currentMode === 'slime') {
      pokeSlime(x, y, 10);
    } else if (currentMode === 'crispy') {
      squishCrispyBall(x, y);
    } else if (currentMode === 'shinobu') {
      if (Math.random() < 0.45) spawnTouchButterfly(x, y);
    } else if (currentMode === 'chimes') {
      handleChimesInteract(x, y);
    } else if (currentMode === 'bubbles') {
      popBubbleAt(x, y);
    } else if (currentMode === 'perler') {
      interactPerlerAt(x, y);
    }
  }

  function handlePointerEnd() {
    pointer.down = false;
  }

  canvas.addEventListener('mousedown', (e) => handlePointerStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', handlePointerEnd);

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });

  window.addEventListener('touchend', handlePointerEnd);

  // 導航與頂部工具按鈕事件綁定
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (currentMode === 'stardust') initStardust();
    else if (currentMode === 'constellation') initConstellation();
    else if (currentMode === 'slime') initSlime();
    else if (currentMode === 'crispy') { crispyState.cracks = []; }
    else if (currentMode === 'shinobu') initShinobuMode();
    else if (currentMode === 'bubbles') initBubbles();
    else if (currentMode === 'perler') initPerler('empty');
    else if (currentMode === 'sand') initSand();
    else if (currentMode === 'lotus') initLotus();
    audio.playChime(4, 1.4, 0.08);
  });

  document.getElementById('ambientBtn').addEventListener('click', () => {
    const on = audio.toggleAmbient();
    document.getElementById('ambientLabel').textContent = on ? '海浪聲：開' : '海浪聲：關';
    document.getElementById('ambientBtn').classList.toggle('border-cyan-400', on);
  });

  document.getElementById('soundBtn').addEventListener('click', () => {
    const muted = audio.toggleMute();
    document.getElementById('iconSoundOn').classList.toggle('hidden', muted);
    document.getElementById('iconSoundOff').classList.toggle('hidden', !muted);
  });

  // =========================================================================
  // 21. 主動畫循環 (含安全錯誤捕捉保護)
  // =========================================================================
  let lastTime = 0;
  function animate(timestamp) {
    try {
      const dt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;
      globalTime += dt;
      const dtScale = dt * 60;

      drawDeepOceanBackdrop(ctx, globalTime, dtScale);

      if (currentMode === 'stardust') {
        updateAndDrawStardust(ctx, globalTime, dtScale);
      } else if (currentMode === 'constellation') {
        updateAndDrawConstellation(ctx, globalTime);
      } else if (currentMode === 'slime') {
        updateAndDrawSlime(ctx, globalTime, dtScale);
      } else if (currentMode === 'crispy') {
        updateAndDrawCrispyMode(ctx, globalTime, dtScale);
      } else if (currentMode === 'shinobu') {
        updateAndDrawShinobuMode(ctx, globalTime, dtScale);
      } else if (currentMode === 'fidget') {
        updateAndDrawFidgetPad(ctx, globalTime, dtScale);
      } else if (currentMode === 'chimes') {
        updateAndDrawChimes(ctx, globalTime, dtScale);
      } else if (currentMode === 'jellyfish') {
        updateAndDrawJellyfish(ctx, globalTime, dtScale);
      } else if (currentMode === 'bubbles') {
        updateAndDrawBubbles(ctx, dtScale);
      } else if (currentMode === 'perler') {
        updateAndDrawPerler(ctx, globalTime, dtScale);
      } else if (currentMode === 'breathe') {
        updateAndDrawBreathe(ctx, globalTime);
      } else if (currentMode === 'sand') {
        updateAndDrawSand(ctx, dtScale);
      } else if (currentMode === 'rain') {
        updateAndDrawRain(ctx, dtScale);
      } else if (currentMode === 'ferro') {
        updateAndDrawFerro(ctx, globalTime);
      } else if (currentMode === 'lotus') {
        updateAndDrawLotus(ctx, globalTime, dtScale);
      }

      updateAndDrawTouchButterflies(ctx, globalTime, dtScale);
    } catch (err) {
      // 防止任何單幀意外中斷主迴圈
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  updateSubControls();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
