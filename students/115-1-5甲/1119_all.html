                title: "紓壓小天地 2",
                author: "陳畇潔",
                rawUrl: "https://cpaizo.github.io/students/115-1-5甲/紓壓2_陳畇潔.html",
                tag: "療癒續作 ‧ 創意互動",
                description: "紓壓小天地升級第二彈！加入更多有趣的 3D 互動機關與視覺驚喜。",
                emoji: "✨",
                gradient: "from-fuchsia-500 to-purple-600",
                badgeBg: "bg-fuchsia-100 text-fuchsia-800 dark:bg-fuchsia-900/50 dark:text-fuchsia-300"
            }
        ];

        // 應用程式狀態管理
        let currentAuthor = "全部";
        let currentSearchQuery = "";

        // DOM 元素參考
        const projectsGrid = document.getElementById("projectsGrid");
        const authorFiltersContainer = document.getElementById("authorFilters");
        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const visibleCountEl = document.getElementById("visibleCount");
        const emptyState = document.getElementById("emptyState");
        const resetFilterBtn = document.getElementById("resetFilterBtn");

        // Modal 元素參考
        const previewModal = document.getElementById("previewModal");
        const modalContainer = document.getElementById("modalContainer");
        const modalTitle = document.getElementById("modalTitle");
        const modalAuthor = document.getElementById("modalAuthor");
        const modalEmoji = document.getElementById("modalEmoji");
        const modalExternalLink = document.getElementById("modalExternalLink");
        const projectIframe = document.getElementById("projectIframe");
        const iframeLoader = document.getElementById("iframeLoader");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const reloadIframeBtn = document.getElementById("reloadIframeBtn");

        /**
         * 初始化作者篩選按鈕列
         */
        function initAuthorFilters() {
            // 取得不重複的作者名單，並在最前面加上「全部」
            const uniqueAuthors = ["全部", ...new Set(projectsData.map(item => item.author))];

            authorFiltersContainer.innerHTML = uniqueAuthors.map(author => {
                const isActive = author === currentAuthor;
                const count = author === "全部" 
                    ? projectsData.length 
                    : projectsData.filter(p => p.author === author).length;

                return `
                    <button type="button" data-author="${author}"
                        class="author-filter-btn shrink-0 inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold transition-all cursor-pointer active:scale-95 ${
                            isActive 
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30 dark:bg-cyan-500 dark:text-slate-950' 
                            : 'bg-slate-100 hover:bg-slate-200/80 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300'
                        }">
                        <span>${author === "全部" ? "🌟 全部作品" : author}</span>
                        <span class="text-xs px-1.5 py-0.5 rounded-full ${
                            isActive 
                            ? 'bg-white/20 text-white dark:bg-slate-950/20 dark:text-slate-950' 
                            : 'bg-slate-200/80 text-slate-600 dark:bg-slate-700 dark:text-slate-400'
                        }">${count}</span>
                    </button>
                `;
            }).join("");

            // 綁定點擊事件
            document.querySelectorAll(".author-filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentAuthor = btn.getAttribute("data-author");
                    initAuthorFilters();
                    renderProjects();
                });
            });
        }

        /**
         * 渲染篩選後的作品卡片畫廊
         */
        function renderProjects() {
            const keyword = currentSearchQuery.trim().toLowerCase();

            const filteredProjects = projectsData.filter(project => {
                const matchesAuthor = currentAuthor === "全部" || project.author === currentAuthor;
                const matchesKeyword = !keyword || 
                    project.title.toLowerCase().includes(keyword) ||
                    project.author.toLowerCase().includes(keyword) ||
                    project.tag.toLowerCase().includes(keyword) ||
                    project.description.toLowerCase().includes(keyword);
                return matchesAuthor && matchesKeyword;
            });

            // 更新計數器
            visibleCountEl.textContent = filteredProjects.length;

            // 處理無符合結果的畫面
            if (filteredProjects.length === 0) {
                projectsGrid.innerHTML = "";
                projectsGrid.classList.add("hidden");
                emptyState.classList.remove("hidden");
                return;
            }

            projectsGrid.classList.remove("hidden");
            emptyState.classList.add("hidden");

            // 產生每一張作品卡片的 HTML
            projectsGrid.innerHTML = filteredProjects.map(project => {
                // 使用 encodeURI 妥善編碼網址中的中文字與空白符號
                const safeUrl = encodeURI(project.rawUrl);

                return `
                    <article class="project-card group relative flex flex-col justify-between bg-white/90 dark:bg-slate-900/85 backdrop-blur-md rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-cyan-400/70 shadow-md hover:shadow-2xl hover:shadow-indigo-500/15 dark:hover:shadow-cyan-500/15">
                        
                        <div>
                            <!-- 卡片頂部視覺封面 Banner -->
                            <div class="relative h-44 bg-gradient-to-br ${project.gradient} p-6 flex items-center justify-center overflow-hidden">
                                <!-- 幾何網格裝飾線條 -->
                                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px); background-size: 16px 16px;"></div>
                                
                                <!-- 作品編號徽章 -->
                                <span class="absolute top-3.5 left-3.5 px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-md text-white text-xs font-extrabold tracking-wider">
                                    #${String(project.id).padStart(2, '0')}
                                </span>

                                <!-- 3D 互動標籤 -->
                                <span class="absolute top-3.5 right-3.5 px-2.5 py-1 rounded-xl bg-white/25 backdrop-blur-md text-white text-xs font-bold flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                                    3D Interactive
                                </span>

                                <!-- 中心懸浮 Emoji 視覺 -->
                                <div class="relative z-10 w-20 h-20 rounded-3xl bg-white/25 backdrop-blur-md border border-white/40 flex items-center justify-center text-5xl shadow-lg transform group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300 select-none">
                                    ${project.emoji}
                                </div>
                            </div>

                            <!-- 卡片文字內容區 -->
                            <div class="p-6 pb-4">
                                <!-- 主題標籤 -->
                                <div class="mb-2.5">
                                    <span class="inline-block px-3 py-1 rounded-lg text-xs font-bold ${project.badgeBg}">
                                        ${project.tag}
                                    </span>
                                </div>

                                <!-- 作品標題 -->
                                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-cyan-300 transition-colors line-clamp-1" title="${project.title}">
                                    ${project.title}
                                </h2>

                                <!-- 作者資訊 -->
                                <div class="mt-2 flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-300">
                                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-100 dark:bg-indigo-900/70 text-indigo-700 dark:text-indigo-300 text-xs">
                                        👤
                                    </span>
                                    <span>作者：${project.author}</span>
                                </div>

                                <!-- 作品簡介 -->
                                <p class="mt-3 text-sm text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-2">
                                    ${project.description}
                                </p>
                            </div>
                        </div>

                        <!-- 卡片底部雙操作按鈕區 -->
                        <div class="px-6 pb-6 pt-2 flex flex-col sm:flex-row gap-2.5">
                            <!-- 站內預覽 (Modal iframe) 按鈕 -->
                            <button type="button" onclick="openPreviewModal(${project.id})"
                                class="flex-1 inline-flex items-center justify-center gap-1.5 px-4 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 dark:from-cyan-500 dark:to-indigo-500 dark:hover:from-cyan-400 dark:hover:to-indigo-400 text-white dark:text-slate-950 text-sm font-extrabold shadow-md shadow-indigo-500/20 transition-all cursor-pointer active:scale-95">
                                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>站內預覽</span>
                            </button>

                            <!-- 開啟 3D 作品（新分頁）按鈕 -->
                            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer"
                                class="flex-1 inline-flex items-center justify-center gap-1.5 px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-bold border border-slate-200/80 dark:border-slate-700 transition-all active:scale-95">
                                <span>開啟 3D 作品</span>
                                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </div>
                    </article>
                `;
            }).join("");
        }

        /**
         * 開啟站內預覽 Modal 並載入指定作品的 iframe
         */
        window.openPreviewModal = function(projectId) {
            const project = projectsData.find(p => p.id === projectId);
            if (!project) return;

            const safeUrl = encodeURI(project.rawUrl);

            // 更新 Modal 標題與資訊
            modalTitle.textContent = project.title;
            modalAuthor.textContent = `作者：${project.author} ｜ ${project.tag}`;
            modalEmoji.textContent = project.emoji;
            modalExternalLink.href = safeUrl;

            // 顯示載入中遮罩並設定 iframe 網址
            iframeLoader.style.opacity = "1";
            iframeLoader.style.display = "flex";
            projectIframe.src = safeUrl;

            // 顯示 Modal 動畫
            previewModal.classList.remove("hidden");
            previewModal.classList.add("flex");
            document.body.style.overflow = "hidden"; // 鎖定背景捲動

            requestAnimationFrame(() => {
                previewModal.classList.remove("opacity-0");
                modalContainer.classList.remove("scale-95");
                modalContainer.classList.add("scale-100");
            });
        };

        /**
         * 關閉站內預覽 Modal 並釋放 iframe 資源
         */
        function closePreviewModal() {
            previewModal.classList.add("opacity-0");
            modalContainer.classList.remove("scale-100");
            modalContainer.classList.add("scale-95");

            setTimeout(() => {
                previewModal.classList.add("hidden");
                previewModal.classList.remove("flex");
                projectIframe.src = "about:blank"; // 清空 iframe 停止背景 3D 運算耗能
                document.body.style.overflow = "";
            }, 250);
        }

        // 當 iframe 載入完成時隱藏載入動畫
        projectIframe.addEventListener("load", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.opacity = "0";
                setTimeout(() => {
                    iframeLoader.style.display = "none";
                }, 300);
            }
        });

        // 重新整理 iframe 按鈕事件
        reloadIframeBtn.addEventListener("click", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.display = "flex";
                iframeLoader.style.opacity = "1";
                const currentSrc = projectIframe.src;
                projectIframe.src = "";
                setTimeout(() => {
                    projectIframe.src = currentSrc;
                }, 50);
            }
        });

        // 關閉 Modal 按鈕與背景點擊事件
        closeModalBtn.addEventListener("click", closePreviewModal);
        previewModal.addEventListener("click", (e) => {
            if (e.target === previewModal) {
                closePreviewModal();
            }
        });

        // 按下 ESC 鍵關閉預覽視窗
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !previewModal.classList.contains("hidden")) {
                closePreviewModal();
            }
        });

        // 搜尋框即時篩選事件
        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value;
            if (currentSearchQuery.length > 0) {
                clearSearchBtn.classList.remove("hidden");
            } else {
                clearSearchBtn.classList.add("hidden");
            }
            renderProjects();
        });

        // 清除搜尋按鈕事件
        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            currentSearchQuery = "";
            clearSearchBtn.classList.add("hidden");
            renderProjects();
            searchInput.focus();
        });

        // 重設所有篩選條件按鈕
        resetFilterBtn.addEventListener("click", () => {
            currentAuthor = "全部";
            currentSearchQuery = "";
            searchInput.value = "";
            clearSearchBtn.classList.add("hidden");
            initAuthorFilters();
            renderProjects();
        });

        /**
         * 深色星空模式 / 淺色模式切換邏輯
         */
        const themeToggleBtn = document.getElementById("themeToggle");
        const themeText = document.getElementById("themeText");
        const htmlEl = document.documentElement;

        function updateThemeUI(isDark) {
            if (isDark) {
                htmlEl.classList.add("dark");
                themeText.textContent = "淺色活力模式";
            } else {
                htmlEl.classList.remove("dark");
                themeText.textContent = "深色星空模式";
            }
        }

        // 讀取先前儲存的主題偏好或系統設定
        try {
            const savedTheme = localStorage.getItem("115_1_5a_theme");
            if (savedTheme === "dark") {
                updateThemeUI(true);
            } else if (savedTheme === "light") {
                updateThemeUI(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                updateThemeUI(true);
            }
        } catch (err) {
            // 忽略 iFrame 內可能發生的 localStorage 存取限制
        }

        themeToggleBtn.addEventListener("click", () => {
            const isCurrentlyDark = htmlEl.classList.contains("dark");
            const nextDarkState = !isCurrentlyDark;
            updateThemeUI(nextDarkState);
            try {
                localStorage.setItem("115_1_5a_theme", nextDarkState ? "dark" : "light");
            } catch (err) {}
        });

        // 頁面載入後初始化介面
        window.addEventListener("DOMContentLoaded", () => {
            initAuthorFilters();
            renderProjects();
        });
    </script>
</body>
</html>
