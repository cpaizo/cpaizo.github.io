    <script>
        const CSV_URL = "projects.csv";

        const DEFAULT_EMOJIS = ["🦖", "🐱", "🐢", "🔮", "🧊", "🫧", "🐱", "🍳", "✨"];
        const DEFAULT_GRADIENTS = [
            "from-emerald-400 to-teal-600",
            "from-amber-400 to-orange-500",
            "from-cyan-500 to-blue-600",
            "from-orange-500 to-red-600",
            "from-indigo-500 to-violet-600",
            "from-pink-400 to-rose-500",
            "from-yellow-400 to-amber-600",
            "from-lime-500 to-emerald-600",
            "from-fuchsia-500 to-purple-600"
        ];
        const DEFAULT_BADGES = [
            "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300",
            "bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300",
            "bg-cyan-100 text-cyan-800 dark:bg-cyan-900/50 dark:text-cyan-300",
            "bg-orange-100 text-orange-800 dark:bg-orange-900/50 dark:text-orange-300",
            "bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-300",
            "bg-pink-100 text-pink-800 dark:bg-pink-900/50 dark:text-pink-300",
            "bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-300",
            "bg-lime-100 text-lime-800 dark:bg-lime-900/50 dark:text-lime-300",
            "bg-fuchsia-100 text-fuchsia-800 dark:bg-fuchsia-900/50 dark:text-fuchsia-300"
        ];

        let projectsData = [];
        let currentAuthor = "全部";
        let currentSearchQuery = "";

        const projectsGrid = document.getElementById("projectsGrid");
        const authorFiltersContainer = document.getElementById("authorFilters");
        const searchInput = document.getElementById("searchInput");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const visibleCountEl = document.getElementById("visibleCount");
        const totalCountEl = document.getElementById("totalCount");
        const emptyState = document.getElementById("emptyState");
        const emptyTitle = document.getElementById("emptyTitle");
        const emptyDesc = document.getElementById("emptyDesc");
        const resetFilterBtn = document.getElementById("resetFilterBtn");
        const csvFileInput = document.getElementById("csvFileInput");
        const csvStatusText = document.getElementById("csvStatusText");

        const previewModal = document.getElementById("previewModal");
        const modalContainer = document.getElementById("modalContainer");
        const modalTitle = document.getElementById("modalTitle");
        const modalAuthor = document.getElementById("modalAuthor");
        const modalEmoji = document.getElementById("modalEmoji");
        const modalExternalLink = document.getElementById("modalExternalLink");
        const projectIframe = document.getElementById("projectIframe");
        const iframeLoader = document.getElementById("iframeLoader");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const reloadIframeBtn = document.getElementById("reloadIframeBtn");

        function inferTitleFromUrl(url, author, fallbackNum) {
            try {
                const decoded = decodeURIComponent(url.split("?")[0]);
                const fileName = decoded.split("/").pop() || "";
                const baseName = fileName.replace(/\.html?$/i, "").trim();
                if (!baseName) return `3D 作品 #${fallbackNum}`;
                if (author) {
                    const cleaned = baseName
                        .replace(new RegExp(`[\\s_\\-]*${escapeRegExp(author)}$`), "")
                        .trim();
                    if (cleaned) return cleaned;
                }
                return baseName;
            } catch {
                return `3D 作品 #${fallbackNum}`;
            }
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        /**
         * 解析 CSV（支援 id,author,url,tag,date）
         */
        function parseCSV(csvText) {
            const cleanText = csvText.replace(/^\uFEFF/, "");
            const rows = [];
            let currentRow = [];
            let currentField = "";
            let inQuotes = false;

            for (let i = 0; i < cleanText.length; i++) {
                const char = cleanText[i];
                const nextChar = cleanText[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        currentField += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        currentField += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ",") {
                        currentRow.push(currentField.trim());
                        currentField = "";
                    } else if (char === "\r" && nextChar === "\n") {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                        i++;
                    } else if (char === "\n" || char === "\r") {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                    } else {
                        currentField += char;
                    }
                }
            }

            if (currentField.length > 0 || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }

            const nonEmptyRows = rows.filter(row => row.some(cell => cell !== ""));
            if (nonEmptyRows.length < 2) return [];

            const headers = nonEmptyRows[0].map(h => h.trim().toLowerCase());
            const records = [];

            for (let r = 1; r < nonEmptyRows.length; r++) {
                const row = nonEmptyRows[r];
                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header] = row[idx] !== undefined ? row[idx] : "";
                });

                const author = obj.author || "未具名同學";
                const rawUrl = obj.url || obj.rawurl || "";
                const tag = obj.tag || "3D 創意互動";
                const date = obj.date || "";

                if (!rawUrl && !obj.author) continue;

                const parsedId = Number(obj.id);
                const id = Number.isFinite(parsedId) && parsedId > 0 ? parsedId : r;
                const title = obj.title || inferTitleFromUrl(rawUrl, author, id);

                records.push({
                    id,
                    title,
                    author,
                    rawUrl,
                    tag,
                    date,
                    emoji: DEFAULT_EMOJIS[(id - 1) % DEFAULT_EMOJIS.length],
                    gradient: DEFAULT_GRADIENTS[(id - 1) % DEFAULT_GRADIENTS.length],
                    badgeBg: DEFAULT_BADGES[(id - 1) % DEFAULT_BADGES.length]
                });
            }

            return records;
        }

        function loadCSVString(csvText, sourceLabel = "projects.csv") {
            projectsData = parseCSV(csvText);
            currentAuthor = "全部";
            totalCountEl.textContent = projectsData.length;

            if (projectsData.length === 0) {
                csvStatusText.textContent = `⚠️ ${sourceLabel} 中沒有可用的作品資料，請確認欄位（id,author,url,tag,date）。`;
                authorFiltersContainer.innerHTML = "";
                visibleCountEl.textContent = "0";
                projectsGrid.innerHTML = "";
                projectsGrid.classList.add("hidden");
                emptyTitle.textContent = "尚無可顯示的作品資料";
                emptyDesc.textContent = "請確認 CSV 包含標題列（id,author,url,tag,date）與作品資料列。";
                emptyState.classList.remove("hidden");
                return;
            }

            csvStatusText.textContent = `✅ 已從 ${sourceLabel} 載入 ${projectsData.length} 件作品`;
            initAuthorFilters();
            renderProjects();
        }

        async function fetchCSVFromServer() {
            try {
                const response = await fetch(`${CSV_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                loadCSVString(text, CSV_URL);
            } catch {
                csvStatusText.textContent = `ℹ️ 無法自動讀取 ${CSV_URL}，請點選右上角「📂 載入 CSV」選擇檔案。`;
                totalCountEl.textContent = "0";
                visibleCountEl.textContent = "0";
                projectsGrid.classList.add("hidden");
                emptyTitle.textContent = "尚未載入 projects.csv";
                emptyDesc.textContent = "請將 projects.csv 放在同一資料夾（透過網頁伺服器開啟），或點選上方「📂 載入 CSV」。";
                emptyState.classList.remove("hidden");
            }
        }

        function initAuthorFilters() {
            const uniqueAuthors = ["全部", ...new Set(projectsData.map(item => item.author))];

            authorFiltersContainer.innerHTML = uniqueAuthors.map(author => {
                const isActive = author === currentAuthor;
                const count = author === "全部"
                    ? projectsData.length
                    : projectsData.filter(p => p.author === author).length;

                return `
                    <button type="button" data-author="${author}"
                        class="author-filter-btn shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all cursor-pointer active:scale-95 ${
                            isActive
                            ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-500/30 dark:bg-cyan-500 dark:text-slate-950'
                            : 'bg-slate-100 hover:bg-slate-200/80 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300'
                        }">
                        <span>${author === "全部" ? "🌟 全部" : author}</span>
                        <span class="text-[11px] px-1.5 py-0.2 rounded-full ${
                            isActive
                            ? 'bg-white/20 text-white dark:bg-slate-950/20 dark:text-slate-950'
                            : 'bg-slate-200/80 text-slate-600 dark:bg-slate-700 dark:text-slate-400'
                        }">${count}</span>
                    </button>
                `;
            }).join("");

            document.querySelectorAll(".author-filter-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentAuthor = btn.getAttribute("data-author");
                    initAuthorFilters();
                    renderProjects();
                });
            });
        }

        function renderProjects() {
            const keyword = currentSearchQuery.trim().toLowerCase();

            const filteredProjects = projectsData.filter(project => {
                const matchesAuthor = currentAuthor === "全部" || project.author === currentAuthor;
                const matchesKeyword = !keyword ||
                    project.title.toLowerCase().includes(keyword) ||
                    project.author.toLowerCase().includes(keyword) ||
                    project.tag.toLowerCase().includes(keyword) ||
                    project.date.toLowerCase().includes(keyword) ||
                    String(project.id).includes(keyword);
                return matchesAuthor && matchesKeyword;
            });

            visibleCountEl.textContent = filteredProjects.length;
            totalCountEl.textContent = projectsData.length;

            if (filteredProjects.length === 0) {
                projectsGrid.innerHTML = "";
                projectsGrid.classList.add("hidden");
                emptyTitle.textContent = "找不到符合條件的 3D 作品";
                emptyDesc.textContent = "試試看輸入其他關鍵字，或點選下方按鈕顯示全部同學的作品！";
                emptyState.classList.remove("hidden");
                return;
            }

            projectsGrid.classList.remove("hidden");
            emptyState.classList.add("hidden");

            projectsGrid.innerHTML = filteredProjects.map(project => {
                const safeUrl = encodeURI(project.rawUrl);
                const dateBadge = project.date
                    ? `<span class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 shrink-0">📅 ${project.date}</span>`
                    : "";

                return `
                    <article class="project-card group relative flex flex-col justify-between bg-white/90 dark:bg-slate-900/85 backdrop-blur-md rounded-2xl overflow-hidden border border-slate-200/80 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-cyan-400/70 shadow-sm hover:shadow-xl hover:shadow-indigo-500/15 dark:hover:shadow-cyan-500/15">
                        <div>
                            <!-- 精巧型頂部封面 Banner -->
                            <div class="relative h-24 bg-gradient-to-br ${project.gradient} px-4 flex items-center justify-center overflow-hidden">
                                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#ffffff 1.2px, transparent 1.2px); background-size: 14px 14px;"></div>
                                <span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-lg bg-black/25 backdrop-blur-md text-white text-[11px] font-extrabold tracking-wider">
                                    #${String(project.id).padStart(2, '0')}
                                </span>
                                <span class="absolute top-2.5 right-2.5 px-2 py-0.5 rounded-lg bg-white/25 backdrop-blur-md text-white text-[11px] font-bold flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                                    3D
                                </span>
                                <div class="relative z-10 w-11 h-11 rounded-2xl bg-white/25 backdrop-blur-md border border-white/40 flex items-center justify-center text-2xl shadow-md transform group-hover:scale-110 transition-transform duration-300 select-none">
                                    ${project.emoji}
                                </div>
                            </div>

                            <!-- 精簡卡片內容區 -->
                            <div class="p-4 pb-2.5">
                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                    <span class="inline-block px-2.5 py-0.5 rounded-md text-[11px] font-bold truncate ${project.badgeBg}">
                                        ${project.tag}
                                    </span>
                                    ${dateBadge}
                                </div>

                                <h2 class="text-base font-extrabold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-cyan-300 transition-colors line-clamp-1" title="${project.title}">
                                    ${project.title}
                                </h2>

                                <div class="mt-1.5 flex items-center gap-1.5 text-xs font-bold text-slate-600 dark:text-slate-300">
                                    <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-indigo-100 dark:bg-indigo-900/70 text-indigo-700 dark:text-indigo-300 text-[10px]">
                                        👤
                                    </span>
                                    <span>${project.author}</span>
                                </div>
                            </div>
                        </div>

                        <!-- 緊湊雙操作按鈕區 -->
                        <div class="px-4 pb-4 pt-1.5 flex gap-2">
                            <button type="button" onclick="openPreviewModal(${project.id})"
                                class="flex-1 inline-flex items-center justify-center gap-1 px-3 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 dark:from-cyan-500 dark:to-indigo-500 dark:hover:from-cyan-400 dark:hover:to-indigo-400 text-white dark:text-slate-950 text-xs font-extrabold shadow-sm transition-all cursor-pointer active:scale-95">
                                <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>站內預覽</span>
                            </button>

                            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer"
                                class="flex-1 inline-flex items-center justify-center gap-1 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold border border-slate-200/80 dark:border-slate-700 transition-all active:scale-95">
                                <span>開起作品</span>
                                <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </div>
                    </article>
                `;
            }).join("");
        }

        window.openPreviewModal = function(projectId) {
            const project = projectsData.find(p => p.id === projectId);
            if (!project) return;

            const safeUrl = encodeURI(project.rawUrl);
            modalTitle.textContent = project.title;
            const datePart = project.date ? ` ｜ ${project.date}` : "";
            modalAuthor.textContent = `作者：${project.author} ｜ ${project.tag}${datePart}`;
            modalEmoji.textContent = project.emoji;
            modalExternalLink.href = safeUrl;

            iframeLoader.style.opacity = "1";
            iframeLoader.style.display = "flex";
            projectIframe.src = safeUrl;

            previewModal.classList.remove("hidden");
            previewModal.classList.add("flex");
            document.body.style.overflow = "hidden";

            requestAnimationFrame(() => {
                previewModal.classList.remove("opacity-0");
                modalContainer.classList.remove("scale-95");
                modalContainer.classList.add("scale-100");
            });
        };

        function closePreviewModal() {
            previewModal.classList.add("opacity-0");
            modalContainer.classList.remove("scale-100");
            modalContainer.classList.add("scale-95");

            setTimeout(() => {
                previewModal.classList.add("hidden");
                previewModal.classList.remove("flex");
                projectIframe.src = "about:blank";
                document.body.style.overflow = "";
            }, 250);
        }

        projectIframe.addEventListener("load", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.opacity = "0";
                setTimeout(() => {
                    iframeLoader.style.display = "none";
                }, 300);
            }
        });

        reloadIframeBtn.addEventListener("click", () => {
            if (projectIframe.src && projectIframe.src !== "about:blank") {
                iframeLoader.style.display = "flex";
                iframeLoader.style.opacity = "1";
                const currentSrc = projectIframe.src;
                projectIframe.src = "";
                setTimeout(() => {
                    projectIframe.src = currentSrc;
                }, 50);
            }
        });

        closeModalBtn.addEventListener("click", closePreviewModal);
        previewModal.addEventListener("click", (e) => {
            if (e.target === previewModal) closePreviewModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !previewModal.classList.contains("hidden")) {
                closePreviewModal();
            }
        });

        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value;
            clearSearchBtn.classList.toggle("hidden", currentSearchQuery.length === 0);
            renderProjects();
        });

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            currentSearchQuery = "";
            clearSearchBtn.classList.add("hidden");
            renderProjects();
            searchInput.focus();
        });

        resetFilterBtn.addEventListener("click", () => {
            currentAuthor = "全部";
            currentSearchQuery = "";
            searchInput.value = "";
            clearSearchBtn.classList.add("hidden");
            initAuthorFilters();
            renderProjects();
        });

        csvFileInput.addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                loadCSVString(String(event.target?.result || ""), file.name);
            };
            reader.readAsText(file, "UTF-8");
        });

        const themeToggleBtn = document.getElementById("themeToggle");
        const themeText = document.getElementById("themeText");
        const htmlEl = document.documentElement;

        function updateThemeUI(isDark) {
            if (isDark) {
                htmlEl.classList.add("dark");
                themeText.textContent = "淺色活力模式";
            } else {
                htmlEl.classList.remove("dark");
                themeText.textContent = "深色星空模式";
            }
        }

        try {
            const savedTheme = localStorage.getItem("115_1_5a_theme");
            if (savedTheme === "dark") {
                updateThemeUI(true);
            } else if (savedTheme === "light") {
                updateThemeUI(false);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                updateThemeUI(true);
            }
        } catch {}

        themeToggleBtn.addEventListener("click", () => {
            const nextDarkState = !htmlEl.classList.contains("dark");
            updateThemeUI(nextDarkState);
            try {
                localStorage.setItem("115_1_5a_theme", nextDarkState ? "dark" : "light");
            } catch {}
        });

        window.addEventListener("DOMContentLoaded", () => {
            fetchCSVFromServer();
        });
    </script>
</body>
</html>
