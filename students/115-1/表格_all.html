<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生表格作品展示中心</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }
        /* Custom smooth transition for iframe and sidebar */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 shadow-sm z-20 flex-shrink-0 px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-200 flex items-center justify-center">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg lg:text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">學生網頁作品展廊</h1>
                <p class="text-xs text-slate-500 hidden sm:block">主題：HTML 表格設計作品集 (115-1學期)</p>
            </div>
        </div>

        <!-- 頂部右側動作區 -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <button id="mobileSidebarToggle" class="lg:hidden p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <a id="externalLinkBtn" href="#" target="_blank" class="inline-flex items-center space-x-1.5 px-3.5 py-2 text-xs sm:text-sm font-medium text-indigo-600 bg-indigo-50 rounded-xl hover:bg-indigo-100 transition-colors border border-indigo-100">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                <span class="hidden sm:inline">在新視窗開啟</span>
            </a>
            <button id="fullscreenBtn" class="inline-flex items-center space-x-1.5 px-3.5 py-2 text-xs sm:text-sm font-medium text-slate-700 bg-slate-100 rounded-xl hover:bg-slate-200 transition-colors">
                <i class="fa-solid fa-expand"></i>
                <span class="hidden sm:inline">全螢幕檢視</span>
            </button>
        </div>
    </header>

    <!-- 主體內容區 -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- 手機側邊欄遮罩 -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

        <!-- 側邊欄學生選單 -->
        <aside id="sidebar" class="absolute lg:relative inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">學生作品列表 (共 6 位)</span>
                <button id="closeSidebar" class="lg:hidden text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <nav id="studentNavList" class="flex-1 overflow-y-auto p-3 space-y-1.5">
                <!-- 動態載入學生按鈕清單 -->
            </nav>

            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div class="text-xs text-slate-500">
                        <p class="font-medium text-slate-700">互動作品檢視器</p>
                        <p>點擊選單即可即時切換</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- iframe 預覽主畫面 -->
        <main class="flex-1 flex flex-col bg-slate-100 overflow-hidden relative">
            <!-- 作品資訊標題列 -->
            <div class="bg-white/80 backdrop-blur-md px-4 py-2.5 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="currentStudentTitle" class="text-sm font-bold text-slate-700">載入中...</span>
                </div>
                <div class="text-xs text-slate-400 font-mono hidden sm:block" id="currentStudentUrl">URL</div>
            </div>

            <!-- iframe 容器 -->
            <div id="iframeContainer" class="flex-1 p-2 sm:p-4 flex items-center justify-center overflow-hidden">
                <div class="w-full h-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative flex flex-col">
                    <iframe id="workIframe" class="w-full h-full border-0 fade-in" title="學生作品預覽"></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 學生資料陣列
        const students = [
            {
                id: 'yupinjing',
                name: '余品靚',
                url: 'https://cpaizo.github.io/students/115-1/表格_余品靚.html',
                badge: '精緻排版'
            },
            {
                id: 'luchenxi',
                name: '盧晨希',
                url: 'https://cpaizo.github.io/students/115-1/表格_盧晨希.html',
                badge: '創意表格'
            },
            {
                id: 'zhangxinyuan',
                name: '張芯嫙',
                url: 'https://cpaizo.github.io/students/115-1/表格_張芯嫙.html',
                badge: '色彩搭配'
            },
            {
                id: 'zhangjiejun',
                name: '張倢鈞',
                url: 'https://cpaizo.github.io/students/115-1/表格_張倢鈞.html',
                badge: '結構清晰'
            },
            {
                id: 'wukuan',
                name: '吳寬',
                url: 'https://cpaizo.github.io/students/115-1/表格_吳寬.html',
                badge: '樣式豐富'
            },
            {
                id: 'lvdingrui',
                name: '呂定睿',
                url: 'https://cpaizo.github.io/students/115-1/表格_呂定睿.html',
                badge: '完整實作'
            }
        ];

        let currentActiveId = students[0].id;

        // DOM 元素
        const navList = document.getElementById('studentNavList');
        const workIframe = document.getElementById('workIframe');
        const currentStudentTitle = document.getElementById('currentStudentTitle');
        const currentStudentUrl = document.getElementById('currentStudentUrl');
        const externalLinkBtn = document.getElementById('externalLinkBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const mobileSidebarToggle = document.getElementById('mobileSidebarToggle');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // 初始化側邊欄選單
        function renderNav() {
            navList.innerHTML = '';
            students.forEach((student, index) => {
                const isActive = student.id === currentActiveId;
                const button = document.createElement('button');
                button.className = `w-full text-left px-4 py-3 rounded-xl flex items-center justify-between transition-all duration-200 group ${
                    isActive 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100 font-semibold' 
                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                }`;
                
                button.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                            isActive ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-500 group-hover:bg-slate-200'
                        }">0${index + 1}</span>
                        <span class="text-sm">${student.name}</span>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded-full ${
                        isActive ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500'
                    }">${student.badge}</span>
                `;

                button.addEventListener('click', () => {
                    switchStudent(student.id);
                    // 手機版點擊後自動收起側邊欄
                    if (window.innerWidth < 1024) {
                        toggleSidebar(false);
                    }
                });

                navList.appendChild(button);
            });
        }

        // 切換學生作品
        function switchStudent(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            currentActiveId = id;
            workIframe.src = student.url;
            currentStudentTitle.textContent = `${student.name} 的表格作品`;
            currentStudentUrl.textContent = student.url;
            externalLinkBtn.href = student.url;

            renderNav();
        }

        // 手機版側邊欄開關控制
        function toggleSidebar(isOpen) {
            if (isOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        mobileSidebarToggle.addEventListener('click', () => toggleSidebar(true));
        closeSidebar.addEventListener('click', () => toggleSidebar(false));
        sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        // 全螢幕按鈕事件
        fullscreenBtn.addEventListener('click', () => {
            const iframeContainer = document.getElementById('iframeContainer');
            if (!document.fullscreenElement) {
                iframeContainer.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // 初始載入第一位學生
        window.addEventListener('DOMContentLoaded', () => {
            switchStudent(students[0].id);
        });
    </script>
</body>
</html>
