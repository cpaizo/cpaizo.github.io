<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>木槌打地鼠 - 打倒怪獸大 Boss！</title>
    <style>
        /* 1. 全局設定與木槌滑鼠指標 */
        body {
            background-color: #FFF0F5;
            font-family: "MicroSoft JhengHei", "微軟正黑體", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            position: relative;
            overflow-x: hidden;
            /* 經典木槌滑鼠指標 */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 100 100'><text y='0.9em' font-size='85'>🔨</text></svg>") 20 20, auto;
        }

        /* 揮動木槌敲擊動畫 */
        body:active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 100 100'><text y='0.9em' font-size='85' transform='rotate(-45 50 50)'>🔨</text></svg>") 20 20, auto;
        }

        h1 {
            color: #FF1493;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #FFF;
        }

        /* 2. 計分板與倒數計時 */
        .info-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .score-board, .time-board {
            font-size: 24px;
            font-weight: bold;
            color: #555;
            background: white;
            padding: 10px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .time-board span {
            color: #FF1493;
        }

        /* 3. 大 Boss 獨立固定在螢幕最左邊 */
        .boss-container {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            width: 200px;
        }

        .boss-title {
            font-size: 20px;
            font-weight: bold;
            color: #FF1493;
            margin-bottom: 10px;
        }

        /* Boss 血量條 */
        .boss-hp-box {
            width: 100%;
            height: 20px;
            background-color: #EEE;
            border: 3px solid #FF69B4;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .boss-hp-bar {
            width: 100%;
            height: 100%;
            background-color: #FF4500;
            transition: width 0.2s ease;
        }

        .boss-hp-text {
            font-size: 16px;
            font-weight: bold;
            color: #666;
            margin-bottom: 15px;
        }

        /* Boss 圖案與震動動畫 */
        .boss-avatar {
            font-size: 110px;
            transition: transform 0.1s;
        }

        .boss-avatar.hit {
            animation: bossShake 0.15s ease-in-out;
        }

        @keyframes bossShake {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(0.9) rotate(-10deg); filter: brightness(1.2); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* 4. 放大版 9 宮格地盤 (保持在中央) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 140px);
            grid-template-rows: repeat(3, 140px);
            gap: 15px;
            background-color: #DEB887;
            padding: 20px;
            border-radius: 35px;
            box-shadow: 0 12px 0px #8B5A2B, 0 15px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        /* 地鼠洞 */
        .hole {
            background-color: #8B4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 15px 15px rgba(0,0,0,0.6);
        }

        /* 地鼠角色 */
        .mole {
            font-size: 80px;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 100%;
            transition: top 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hole.up .mole {
            top: 0;
        }

        /* 木槌打擊特效 */
        .mole.hit-effect {
            animation: hitAnim 0.15s ease-in-out;
        }

        @keyframes hitAnim {
            0% { transform: scale(1); }
            50% { transform: scale(0.7) rotate(-15deg); }
            100% { transform: scale(0.8); }
        }

        /* 星星爆破動畫 */
        .star-pop {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            animation: popUp 0.4s forwards ease-out;
            z-index: 10;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: scale(0.5) translateY(0); }
            100% { opacity: 0; transform: scale(1.5) translateY(-40px); }
        }

        /* 5. 立體按鈕區 */
        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .btn {
            background-color: #FF69B4;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 35px;
            border: none;
            border-radius: 20px;
            box-shadow: 0px 6px 0px #D14785, 0px 8px 10px rgba(0,0,0,0.15);
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #D14785, 0px 3px 5px rgba(0,0,0,0.15);
        }

        .btn:disabled {
            background-color: #ccc;
            box-shadow: 0px 6px 0px #999;
        }
    </style>
</head>
<body>

    <!-- 獨立在左側的 Boss 區塊 -->
    <div class="boss-container">
        <div class="boss-title">👾 邪惡怪獸 Boss</div>
        <div class="boss-hp-box">
            <div id="boss-hp-bar" class="boss-hp-bar"></div>
        </div>
        <div id="boss-hp-text" class="boss-hp-text">HP: 300 / 300</div>
        <div id="boss-avatar" class="boss-avatar">👾</div>
    </div>

    <!-- 正中間主遊戲畫面 -->
    <h1>🔨 打地鼠 - 打倒怪獸大 Boss！ 🔨</h1>
    
    <div class="info-panel">
        <div class="score-board">得分：<span id="score">0</span> 分</div>
        <div class="time-board">剩餘時間：<span id="time">30</span> 秒</div>
    </div>

    <!-- 正中間的 9 宮格 -->
    <div class="grid" id="grid">
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
        <div class="hole"><div class="mole" onclick="hit(this, event)">🐹</div></div>
    </div>

    <!-- 單一控制按鈕 -->
    <div class="btn-container">
        <button id="start-btn" class="btn" onclick="startGame()">開始遊戲</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const grid = document.getElementById('grid');

        // Boss 相關元件
        const bossHpBar = document.getElementById('boss-hp-bar');
        const bossHpText = document.getElementById('boss-hp-text');
        const bossAvatar = document.getElementById('boss-avatar');

        const characters = ['🐹', '🐰', '🦊', '🐻', '🐸', '🐱', '🐶'];

        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let bossHp = 300;
        let countdownTimer;

        // 音效發聲器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playWoodHitSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1); 
            
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(500, 1000);
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');

            const randomChar = characters[Math.floor(Math.random() * characters.length)];
            mole.innerText = randomChar;
            mole.dataset.hit = "false";

            hole.classList.add('up');

            setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            bossHp = 300;

            scoreBoard.innerText = 0;
            timeBoard.innerText = timeLeft;
            updateBossHpUI();
            bossAvatar.innerText = '👾';

            timeUp = false;
            startBtn.disabled = true;

            peep();

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeBoard.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timeUp = true;
                    startBtn.disabled = false;
                    if (bossHp <= 0) {
                        alert('🎉 恭喜你！成功在時間內打倒怪獸 Boss 了！');
                    } else {
                        alert('⏰ 30秒時間到！Boss 還剩下 ' + bossHp + ' 血量，下次再接再厲！');
                    }
                }
            }, 1000);
        }

        function hit(mole, e) {
            if (mole.dataset.hit === "true" || !mole.parentElement.classList.contains('up') || timeUp) return;

            mole.dataset.hit = "true";
            score += 10;
            scoreBoard.innerText = score;

            damageBoss(10);
            playWoodHitSound();

            mole.innerText = '😵';
            mole.classList.add('hit-effect');

            showStarPop(e);

            setTimeout(() => {
                mole.classList.remove('hit-effect');
                mole.parentElement.classList.remove('up');
            }, 150);
        }

        function damageBoss(amount) {
            if (bossHp <= 0) return;

            bossHp -= amount;
            if (bossHp < 0) bossHp = 0;

            updateBossHpUI();

            bossAvatar.classList.add('hit');
            setTimeout(() => bossAvatar.classList.remove('hit'), 150);

            if (bossHp === 0) {
                bossAvatar.innerText = '😵';
            } else if (bossHp <= 100) {
                bossAvatar.innerText = '😭';
            } else if (bossHp <= 200) {
                bossAvatar.innerText = '😡';
            }
        }

        function updateBossHpUI() {
            const percent = (bossHp / 300) * 100;
            bossHpBar.style.width = percent + '%';
            bossHpText.innerText = 'HP: ' + bossHp + ' / 300';
        }

        function showStarPop(e) {
            const star = document.createElement('div');
            star.className = 'star-pop';
            star.innerText = '✨💥';
            
            const rect = grid.getBoundingClientRect();
            star.style.left = (e.clientX - rect.left - 20) + 'px';
            star.style.top = (e.clientY - rect.top - 20) + 'px';

            grid.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 400);
        }
    </script>

</body>
</html>
