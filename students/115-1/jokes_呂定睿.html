<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南極極冷笑話冰庫 ❄️ Ultimate Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Zen Maru Gothic / Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            polar: {
              night: '#0B132B',
              dark: '#1C2541',
              deep: '#3A506B',
              ice: '#5BC0BE',
              glacier: '#A6E1FA',
              frost: '#E0F7FA',
              auroraGreen: '#00FFC6',
              auroraPink: '#FF007F'
            }
          },
          fontFamily: {
            rounded: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
            sans: ['"Noto Sans TC"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* 靜態與動畫樣式定義 */
    body {
      background: linear-gradient(135deg, #050b18 0%, #0b1a30 40%, #132a4a 80%, #0a2238 100%);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: #e2f1f8;
    }

    /* 動態極光背景 */
    .aurora-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      background: radial-gradient(circle at 20% 20%, rgba(0, 255, 198, 0.4) 0%, transparent 40%),
                  radial-gradient(circle at 80% 30%, rgba(166, 225, 250, 0.4) 0%, transparent 40%),
                  radial-gradient(circle at 50% 80%, rgba(255, 0, 127, 0.25) 0%, transparent 50%);
      filter: blur(60px);
      animation: auroraPulse 12s infinite alternate ease-in-out;
    }

    @keyframes auroraPulse {
      0% { transform: scale(1) translateY(0); opacity: 0.25; }
      50% { transform: scale(1.1) translateY(-20px); opacity: 0.45; }
      100% { transform: scale(1.05) translateY(10px); opacity: 0.3; }
    }

    /* 雪花 Canvas 容器 */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 冰霜玻璃質感卡片 */
    .ice-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 247, 250, 0.2);
      box-shadow: 0 12px 40px 0 rgba(0, 10, 30, 0.5),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.3);
      border-radius: 24px;
    }

    .ice-card-glow {
      box-shadow: 0 0 25px rgba(91, 192, 190, 0.3),
                  0 12px 40px 0 rgba(0, 10, 30, 0.5),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* 3D 冰塊翻轉效果 */
    .perspective-1000 {
      perspective: 1000px;
    }

    .flipper {
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .flipper.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .back {
      transform: rotateY(180deg);
    }

    /* 冰晶按鈕與動態波紋 */
    .btn-ice {
      background: linear-gradient(135deg, #48cae4 0%, #0077b6 100%);
      box-shadow: 0 6px 0 #023e8a, 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-ice:hover {
      background: linear-gradient(135deg, #00b4d8 0%, #0096c7 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #023e8a, 0 14px 25px rgba(0,180,216,0.4);
    }

    .btn-ice:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #023e8a, 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn-reveal {
      background: linear-gradient(135deg, #72efdd 0%, #560bad 100%);
      box-shadow: 0 6px 0 #3a0ca3, 0 10px 20px rgba(114, 239, 221, 0.2);
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-reveal:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #3a0ca3, 0 14px 25px rgba(114, 239, 221, 0.4);
    }

    .btn-reveal:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3a0ca3, 0 4px 10px rgba(0,0,0,0.2);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: ripple-effect 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-effect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* 企鵝搖擺動畫 */
    @keyframes waddle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .waddle {
      animation: waddle 2s ease-in-out infinite;
      display: inline-block;
      transform-origin: bottom center;
    }

    /* 冰晶浮動 */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }
    .floating {
      animation: float 4s ease-in-out infinite;
    }

    /* 自訂滾動條 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 19, 43, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #5BC0BE;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A6E1FA;
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen p-4 md:p-8">

  <!-- 背景層 -->
  <div class="aurora-bg"></div>
  <canvas id="snow-canvas"></canvas>

  <!-- 頂部頁首標題區 -->
  <header class="relative z-10 text-center my-3 md:my-5 max-w-2xl w-full">
    <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md px-6 py-2 rounded-full border border-white/20 mb-3 shadow-lg">
      <span class="text-2xl waddle">🐧</span>
      <span class="text-xs md:text-sm font-semibold tracking-widest text-polar-glacier uppercase">Antarctic Ice Joke Vault</span>
      <span class="text-2xl waddle" style="animation-delay: 1s;">🧊</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-extrabold font-rounded tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-200 via-white to-teal-200 drop-shadow-[0_4px_12px_rgba(91,192,190,0.5)]">
      南極極冷笑話館
    </h1>
    <p class="text-polar-glacier/80 text-xs md:text-sm mt-2 font-light">
      體感溫度直降 -50℃ • 收錄 45+ 篇超凍感笑話 ❄️
    </p>
  </header>

  <!-- 主要互動區域 -->
  <main class="relative z-10 w-full max-w-xl mx-auto flex-1 flex flex-col items-center justify-center my-2">
    
    <!-- 模式切換 Tabs -->
    <div class="flex bg-black/30 p-1.5 rounded-2xl border border-white/10 mb-4 w-full max-w-xs justify-center backdrop-blur-md">
      <button id="tab-random" onclick="switchMode('random')" class="flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 bg-polar-ice text-polar-night shadow-md">
        <i class="fa-solid fa-dice mr-1.5"></i>隨機抽取
      </button>
      <button id="tab-list" onclick="switchMode('list')" class="flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 text-polar-glacier hover:text-white">
        <i class="fa-solid fa-boxes-stacked mr-1.5"></i>冷笑話冰庫
      </button>
    </div>

    <!-- 模式 1：隨機抽取模式 (包含分類選擇) -->
    <div id="random-mode" class="w-full">
      
      <!-- 主題分類標籤選單 -->
      <div class="flex flex-wrap justify-center gap-1.5 md:gap-2 mb-4" id="category-pills">
        <!-- 由 JavaScript 動態生成分類按鈕 -->
      </div>

      <!-- 3D 翻轉冰塊卡片 -->
      <div class="perspective-1000 w-full min-h-[310px] md:min-h-[340px]">
        <div id="card-flipper" class="flipper relative w-full h-full min-h-[310px] md:min-h-[340px]">
          
          <!-- 卡片正面 (題目) -->
          <div class="front absolute w-full h-full inset-0 ice-card ice-card-glow p-6 md:p-8 flex flex-col justify-between items-center text-center">
            <div class="flex justify-between items-center w-full text-xs text-polar-glacier/70 font-mono">
              <span class="flex items-center gap-1">
                <i class="fa-regular fa-snowflake text-cyan-300 animate-spin" style="animation-duration: 8s;"></i> 
                ICE-JOKE <span id="joke-number">#--</span>
              </span>
              <span id="joke-category-tag" class="bg-cyan-900/60 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-400/30 text-[10px]">
                全分類
              </span>
            </div>

            <div class="my-auto py-4 px-2">
              <div class="text-cyan-400 text-xs font-bold tracking-widest uppercase mb-2">【 題目 / Question 】</div>
              <h2 id="question-text" class="text-xl md:text-2xl font-bold font-rounded text-white leading-relaxed">
                點擊下方按鈕，隨機冰鎮一個冷笑話！
              </h2>
            </div>

            <div class="w-full pt-2">
              <button id="btn-show-answer" onclick="revealAnswer(event)" class="btn-reveal text-white font-bold py-3 px-6 rounded-2xl w-full flex items-center justify-center gap-2 text-sm md:text-base cursor-pointer">
                <i class="fa-solid fa-eye"></i> 揭曉答案 (敲碎冰塊)
              </button>
            </div>
          </div>

          <!-- 卡片背面 (答案) -->
          <div class="back absolute w-full h-full inset-0 ice-card p-6 md:p-8 flex flex-col justify-between items-center text-center border-2 border-cyan-400/50 bg-gradient-to-br from-cyan-950/90 to-blue-950/90">
            <div class="flex justify-between items-center w-full text-xs text-polar-auroraGreen font-mono">
              <span><i class="fa-solid fa-temperature-arrow-down"></i> ANSWER UNLOCKED</span>
              <span id="ice-temp" class="text-cyan-300 font-bold">極度冰凍!</span>
            </div>

            <div class="my-auto py-4 px-2">
              <div class="text-teal-300 text-xs font-bold tracking-widest uppercase mb-2">【 解答 / Answer 】</div>
              <p id="answer-text" class="text-lg md:text-2xl font-black font-rounded text-cyan-200 leading-relaxed drop-shadow-[0_2px_8px_rgba(0,255,200,0.4)]">
                ---
              </p>
            </div>

            <div class="w-full pt-2">
              <button onclick="flipBack(event)" class="bg-white/10 hover:bg-white/20 text-polar-glacier font-semibold py-2.5 px-6 rounded-2xl w-full text-sm flex items-center justify-center gap-2 border border-white/20 transition-all">
                <i class="fa-solid fa-rotate-left"></i> 看回題目
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- 抽獎按鈕 -->
      <div class="mt-5 flex flex-col sm:flex-row gap-3 w-full">
        <button id="btn-random-draw" onclick="drawRandomJoke(event)" class="btn-ice text-white font-extrabold text-base md:text-lg py-4 px-8 rounded-2xl flex-1 flex items-center justify-center gap-3 tracking-wide">
          <i class="fa-solid fa-snowflake text-xl floating"></i> 抽取下一個笑話
        </button>
      </div>
    </div>

    <!-- 模式 2：冷笑話冰庫清單模式 (包含即時搜尋) -->
    <div id="list-mode" class="w-full hidden">
      <!-- 搜尋欄位 -->
      <div class="relative mb-3">
        <input type="text" id="search-input" oninput="filterJokeList()" placeholder="搜尋關鍵字（例如：香蕉、小明、動物...）" 
               class="w-full bg-white/10 text-white placeholder-polar-glacier/50 px-10 py-3 rounded-2xl border border-white/20 focus:outline-none focus:border-cyan-300 text-sm backdrop-blur-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-polar-glacier/60 text-sm"></i>
      </div>

      <!-- 清單卡片容器 -->
      <div class="ice-card p-4 md:p-6 max-h-[480px] overflow-y-auto space-y-3" id="joke-list-container">
        <!-- JS 動態生成笑話清單 -->
      </div>
    </div>

  </main>

  <!-- 頁尾與音效切換 -->

    <div class="flex items-center gap-2">
      <span>🐧 極地企鵝提醒：保持微笑，注意保暖</span>
      <span>•</span>
      <button onclick="toggleSound()" id="sound-btn" class="hover:text-cyan-300 flex items-center gap-1 transition-colors">

      </button>
    </div>
    <p class="font-mono text-[10px] opacity-70">Antarctic Cool Jokes Collection © 2026</p>
  </footer>

      { id: 41, category: "history", q: "三國時期誰最會寫詩？", a: "曹操，因為「說曹操，曹操（作詩）到」。" },
      { id: 42, category: "history", q: "秦始皇最喜歡吃什麼水果？", a: "暴政（爆蒸）葡萄。" },
      { id: 43, category: "history", q: "賈伯斯（Steve Jobs）最喜歡喝什麼飲料？", a: "蘋果汁（Apple Juice）。" },
      { id: 44, category: "history", q: "誰是古代最厲害的游泳選手？", a: "屈原，因為他投江之後大家都划船找他。" },
      { id: 45, category: "history", q: "孔子最常穿什麼衣服？", a: "「孔（恐）龍裝」。" }
    ];

    // 分類對應名稱
    const categoriesMap = {
      all: "全部笑話",
      food: "食物篇 🍕",
      animal: "動物篇 🐱",
      homophone: "諧音篇 🤪",
      life: "生活篇 🏠",
      history: "歷史篇 📜"
    };

    let currentCategory = "all";
    let currentJokeIndex = -1;
    let isFlipped = false;
    let soundEnabled = true;

    // Web Audio API 音效合成器
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playIceSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'draw') {
          // 冰塊打擊音效
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'reveal') {
          // 冰塊破碎/解冻亮晶晶音效
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.log("Audio play prevented", e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-status').textContent = soundEnabled ? '開啟' : '靜音';
      document.getElementById('sound-icon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
    }

    // 按鈕波紋特效
    function createRipple(event) {
      const button = event.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      const rect = button.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add("ripple");

      const ripple = button.getElementsByClassName("ripple")[0];
      if (ripple) {
        ripple.remove();
      }

      button.appendChild(circle);
    }

    // 初始化分類 Pills 標籤
    function renderCategoryPills() {
      const container = document.getElementById('category-pills');
      container.innerHTML = '';

      Object.keys(categoriesMap).forEach(cat => {
        const btn = document.createElement('button');
        const isActive = cat === currentCategory;
        btn.className = `px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-200 border ${
          isActive 
            ? 'bg-gradient-to-r from-cyan-400 to-teal-400 text-polar-night border-cyan-300 shadow-[0_0_12px_rgba(91,192,190,0.5)] scale-105' 
            : 'bg-white/5 text-polar-glacier/80 border-white/10 hover:bg-white/15'
        }`;
        btn.textContent = categoriesMap[cat];
        btn.onclick = (e) => {
          createRipple(e);
          selectCategory(cat);
        };
        container.appendChild(btn);
      });
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryPills();
      drawRandomJoke();
    }

    // 隨機抽取笑話（考量當前選擇的分類）
    function drawRandomJoke(e) {
      if (e) createRipple(e);
      playIceSound('draw');

      const flipper = document.getElementById('card-flipper');
      
      // 若處於翻轉解凍狀態，先翻回正面
      if (isFlipped) {
        flipper.classList.remove('flipped');
        isFlipped = false;
        setTimeout(selectNewJoke, 300);
      } else {
        selectNewJoke();
      }
    }

    function selectNewJoke() {
      let filteredJokes = jokesDatabase;
      if (currentCategory !== 'all') {
        filteredJokes = jokesDatabase.filter(j => j.category === currentCategory);
      }

      if (filteredJokes.length === 0) return;

      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * filteredJokes.length);
      } while (filteredJokes[newIndex].id === currentJokeIndex && filteredJokes.length > 1);

      const joke = filteredJokes[newIndex];
      currentJokeIndex = joke.id;

      const randomTemp = -(Math.floor(Math.random() * 40) + 10);

      const qText = document.getElementById('question-text');
      qText.style.opacity = '0';
      
      setTimeout(() => {
        document.getElementById('joke-number').textContent = `#${joke.id.toString().padStart(2, '0')}`;
        document.getElementById('joke-category-tag').textContent = categoriesMap[joke.category] || "通用";
        document.getElementById('ice-temp').textContent = `凍傷溫度: ${randomTemp}℃`;
        qText.textContent = joke.q;
        document.getElementById('answer-text').textContent = joke.a;
        qText.style.opacity = '1';
      }, 150);
    }

    // 揭曉答案
    function revealAnswer(e) {
      if (e) createRipple(e);
      if (currentJokeIndex === -1) {
        drawRandomJoke();
        return;
      }
      playIceSound('reveal');
      const flipper = document.getElementById('card-flipper');
      flipper.classList.add('flipped');
      isFlipped = true;
    }

    // 翻回正面
    function flipBack(e) {
      if (e) createRipple(e);
      playIceSound('draw');
      const flipper = document.getElementById('card-flipper');
      flipper.classList.remove('flipped');
      isFlipped = false;
    }

    // 模式切換
    function switchMode(mode) {
      playIceSound('draw');
      const randomMode = document.getElementById('random-mode');
      const listMode = document.getElementById('list-mode');
      const tabRandom = document.getElementById('tab-random');
      const tabList = document.getElementById('tab-list');

      if (mode === 'random') {
        randomMode.classList.remove('hidden');
        listMode.classList.add('hidden');
        
        tabRandom.className = "flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 bg-polar-ice text-polar-night shadow-md";
        tabList.className = "flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 text-polar-glacier hover:text-white";
      } else {
        randomMode.classList.add('hidden');
        listMode.classList.remove('hidden');

        tabList.className = "flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 bg-polar-ice text-polar-night shadow-md";
        tabRandom.className = "flex-1 py-2 px-4 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 text-polar-glacier hover:text-white";

        renderJokeList();
      }
    }

    // 渲染冷笑話冰庫清單
    function renderJokeList(filterText = '') {
      const container = document.getElementById('joke-list-container');
      container.innerHTML = '';

      const query = filterText.toLowerCase().trim();
      const filtered = jokesDatabase.filter(j => 
        j.q.toLowerCase().includes(query) || 
        j.a.toLowerCase().includes(query) ||
        (categoriesMap[j.category] && categoriesMap[j.category].toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-polar-glacier/60">
            <i class="fa-solid fa-snowflake text-2xl mb-2 block"></i>
            找不到相關冷笑話，請試試別的關鍵字！
          </div>
        `;
        return;
      }

      filtered.forEach((joke) => {
        const item = document.createElement('div');
        item.className = 'p-4 rounded-xl bg-white/5 border border-white/10 transition-all hover:bg-white/10';
        item.innerHTML = `
          <div class="flex justify-between items-start cursor-pointer gap-2" onclick="toggleListItem(${joke.id})">
            <div class="flex items-start gap-2.5">
              <span class="bg-cyan-500/20 text-cyan-300 text-xs font-mono font-bold px-2 py-0.5 rounded border border-cyan-400/30 shrink-0 mt-0.5">
                #${joke.id.toString().padStart(2, '0')}
              </span>
              <div>
                <span class="text-[10px] text-polar-glacier/60 font-medium block mb-0.5">${categoriesMap[joke.category]}</span>
                <h3 class="font-bold text-white text-sm md:text-base leading-snug">${joke.q}</h3>
              </div>
            </div>
            <i id="list-icon-${joke.id}" class="fa-solid fa-chevron-down text-polar-glacier/60 text-xs transition-transform duration-300 mt-1"></i>
          </div>
          <div id="list-answer-${joke.id}" class="hidden mt-3 pt-3 border-t border-white/10 text-cyan-300 text-sm font-medium pl-8">
            <span class="text-teal-400 font-bold">答：</span>${joke.a}
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 搜尋功能
    function filterJokeList() {
      const val = document.getElementById('search-input').value;
      renderJokeList(val);
    }

    // 展開/收合清單項目
    function toggleListItem(id) {
      playIceSound('draw');
      const ansEl = document.getElementById(`list-answer-${id}`);
      const iconEl = document.getElementById(`list-icon-${id}`);
      
      if (ansEl.classList.contains('hidden')) {
        ansEl.classList.remove('hidden');
        iconEl.style.transform = 'rotate(180deg)';
      } else {
        ansEl.classList.add('hidden');
        iconEl.style.transform = 'rotate(0deg)';
      }
    }

    // 雪花 Canvas 動畫
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let snowflakes = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Snowflake {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1 + 0.5;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.opacity = Math.random() * 0.7 + 0.3;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;

        if (this.y > canvas.height) {
          this.reset();
          this.y = 0;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(224, 247, 250, ${this.opacity})`;
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#A6E1FA';
        ctx.fill();
      }
    }

    function initSnow() {
      snowflakes = [];
      const flakeCount = Math.min(Math.floor(window.innerWidth / 8), 100);
      for (let i = 0; i < flakeCount; i++) {
        snowflakes.push(new Snowflake());
      }
    }

    function animateSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      snowflakes.forEach(flake => {
        flake.update();
        flake.draw();
      });
      requestAnimationFrame(animateSnow);
    }

    // 頁面初次載入
    window.onload = function() {
      initSnow();
      animateSnow();
      renderCategoryPills();
      drawRandomJoke();
    };
  </script>
</body>
</html>
