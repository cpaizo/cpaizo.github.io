<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在網頁上載入 3D GLB 模型</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .tip {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="tip">滑鼠左鍵旋轉 / 滾輪縮放</div>
  <div id="canvas-container"></div>

  <!-- 1. 引入 Three.js 核心與相關外掛 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // 2. 初始化基本 3D 場景
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 3. 加入滑鼠控制器（可用滑鼠旋轉、平移、縮放 3D 模型）
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 4. 加入燈光（非常重要！如果沒有燈光，模型會是一片黑色）
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // 環境光
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); // 平行光（製造陰影與立体感）
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // 5. 使用 GLTFLoader 載入你的 .glb 檔案
    const loader = new THREE.GLTFLoader();
    
    // 請將 'model.glb' 換成你自己的檔案路徑或網址
    loader.load('model.glb', function (gltf) {
      const model = gltf.scene;
      
      // 調整模型大小或位置（視你的模型原始尺寸而定）
      model.scale.set(1, 1, 1);
      model.position.set(0, 0, 0);

      scene.add(model);
      console.log('模型載入成功！');
    }, undefined, function (error) {
      console.error('載入模型時發生錯誤：', error);
    });

    // 6. 動畫渲染循環
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 7. 視窗大小自適應
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
