<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 歡樂小天地 - 學生優秀作品集 ✨</title>
    <style>
        /* 1. 溫暖可愛的馬卡龍漸層背景 */
        body {
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
            font-family: "Mitch", "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景漂浮彩色泡泡 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        .b1 { width: 80px; height: 80px; top: 10%; left: 8%; animation-delay: 0s; }
        .b2 { width: 120px; height: 120px; bottom: 15%; right: 10%; animation-delay: 2s; }
        .b3 { width: 60px; height: 60px; top: 70%; left: 12%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* 2. 主標題區 */
        header {
            text-align: center;
            margin-bottom: 35px;
            z-index: 1;
        }

        h1 {
            color: #FF6B8B;
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            text-shadow: 3px 3px 0px #FFF, 5px 5px 10px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #6C5CE7;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 0;
        }

        /* 3. 作品卡片展示牆 */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            z-index: 1;
        }

        /* 舒壓圓角卡片 */
        .card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 4px solid #FFF;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 18px 25px rgba(0,0,0,0.12);
        }

        /* 卡片大頭貼與名字 */
        .avatar {
            font-size: 3.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .student-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 15px;
        }

        /* 可愛 Q 彈按鈕 */
        .btn {
            display: inline-block;
            width: 80%;
            padding: 12px 0;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px rgba(0,0,0,0.15);
        }

        /* 主題顏色搭配 */
        .c1 { border-color: #FFB7B2; }
        .c1 .btn { background-color: #FF8B94; box-shadow: 0 5px 0px #FF6B74; }

        .c2 { border-color: #FFDAC1; }
        .c2 .btn { background-color: #FFB347; box-shadow: 0 5px 0px #E69526; }

        .c3 { border-color: #E2F0CB; }
        .c3 .btn { background-color: #77DD77; box-shadow: 0 5px 0px #58B858; }

        .c4 { border-color: #B5EAD7; }
        .c4 .btn { background-color: #4EAEA2; box-shadow: 0 5px 0px #388E83; }

        .c5 { border-color: #C7CEEA; }
        .c5 .btn { background-color: #779ECB; box-shadow: 0 5px 0px #587CA5; }

        .c6 { border-color: #F3C4FB; }
        .c6 .btn { background-color: #B19FF9; box-shadow: 0 5px 0px #8F7BD8; }

        /* 頁尾 */
        footer {
            margin-top: 40px;
            color: #888;
            font-size: 0.9rem;
            z-index: 1;
        }
    </style>
</head>
