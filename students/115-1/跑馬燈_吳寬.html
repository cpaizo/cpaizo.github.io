    <style>
        /* Custom Keyframe Animations */
        @keyframes fogMove {
            0% { transform: translateX(-10%) translateY(0); opacity: 0.3; }
            50% { transform: translateX(10%) translateY(-15px); opacity: 0.6; }
            100% { transform: translateX(-10%) translateY(0); opacity: 0.3; }
        }

        @keyframes batFly {
            0% { transform: translate(-100px, 20vh) scale(0.6); }
            50% { transform: translate(50vw, -10vh) scale(1); }
            100% { transform: translate(110vw, 30vh) scale(0.5); }
        }

        @keyframes floatGhost {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes flickerLight {
            0%, 100% { opacity: 1; }
            3%, 8% { opacity: 0.1; }
            6% { opacity: 0.8; }
            50% { opacity: 1; }
            52%, 56% { opacity: 0.3; }
            54% { opacity: 0.9; }
        }

        @keyframes textBloodDrip {
            0% { text-shadow: 0 0 10px var(--glow-color), 0 5px 0px var(--main-color); }
            50% { text-shadow: 0 0 25px var(--glow-color), 0 15px 8px var(--main-color), 0 25px 15px #000; }
            100% { text-shadow: 0 0 10px var(--glow-color), 0 5px 0px var(--main-color); }
        }

        .fog-bg {
            background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, rgba(5,5,5,0.95) 100%);
        }

        .fog-layer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(100,0,150,0.15) 0%, rgba(0,0,0,0) 70%);
            animation: fogMove 20s infinite ease-in-out;
            pointer-events: none;
        }

        .flicker-screen {
            animation: flickerLight 8s infinite;
        }

        /* Color Theme Classes */
        .theme-blood {
            --main-color: #ff0033;
            --glow-color: #990000;
            --bg-accent: rgba(153, 0, 0, 0.2);
        }
        .theme-pumpkin {

            --glow-color: #ff0055;

        }

        .marquee-text-effect {

            filter: drop-shadow(0 0 15px var(--glow-color));

        }

            background: #555;
        }

    <!-- Web Audio API Sound Synthesizer Script & Marquee Engine -->
    <script>
        // --- 1. Sound Synthesizer (Web Audio API) ---
        class HalloweenSoundEngine {
            constructor() {
                this.ctx = null;
                this.isWindPlaying = false;
                this.windGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Continuous Ambient Wind Sound
            toggleAmbientWind(enable) {
                this.init();
                if (enable) {
                    if (this.isWindPlaying) return;
                    
                    // Create White Noise for Wind
                    const bufferSize = this.ctx.sampleRate * 2;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }

                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    whiteNoise.loop = true;

                    // Filter for howling sound
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 350;
                    filter.Q.value = 3.0;

                    // LFO to modulate filter frequency (wind howling)
                    const lfo = this.ctx.createOscillator();
                    lfo.frequency.value = 0.2; // slow howl
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.value = 200;

                    lfo.connect(filter.frequency);
                    
                    this.windGain = this.ctx.createGain();
                    this.windGain.gain.value = 0.15;

                    whiteNoise.connect(filter);
                    filter.connect(this.windGain);
                    this.windGain.connect(this.ctx.destination);

                    whiteNoise.start();
                    lfo.start();

                    this.whiteNoiseNode = whiteNoise;
                    this.lfoNode = lfo;
                    this.isWindPlaying = true;
                } else {
                    if (this.whiteNoiseNode) {
                        this.whiteNoiseNode.stop();
                        this.lfoNode.stop();
                        this.isWindPlaying = false;
                    }
                }
            }

            // Ghost Howl / Scream Sound Effect
            playGhostScream() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                const now = this.ctx.currentTime;

                // Pitch envelope
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                osc.frequency.exponentialRampToValueAtTime(200, now + 1.2);

                // Gain envelope
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 1.2);
            }

            // Thunder Burst Sound Effect
            playThunder() {
                this.init();
                const now = this.ctx.currentTime;

                // Noise buffer
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 180;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + 1.5);

                // Visual Lightning Flash
                const flash = document.getElementById('flickerOverlay');
                flash.style.opacity = '0.8';
                setTimeout(() => { flash.style.opacity = '0.2'; }, 80);
                setTimeout(() => { flash.style.opacity = '0.9'; }, 150);
                setTimeout(() => { flash.style.opacity = '0'; }, 400);
            }

            // Evil Laugh Synthesis
            playEvilLaugh() {
                this.init();
                const now = this.ctx.currentTime;
                
                for (let i = 0; i < 5; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    const startTime = now + (i * 0.18);

                    osc.frequency.setValueAtTime(160 - (i * 10), startTime);
                    osc.frequency.exponentialRampToValueAtTime(90 - (i * 8), startTime + 0.15);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.15);
                }
            }
        }

        const soundEngine = new HalloweenSoundEngine();

        // --- 2. Marquee Engine Logic ---
        const marqueeContainer = document.getElementById('marqueeContainer');
        const marqueeWrapper = document.getElementById('marqueeWrapper');
        const marqueeText = document.getElementById('marqueeText');

        let posX = 0;
        let posY = 0;
        let direction = 'left';
        let speed = 5;
        let bounceVel = 1;
        let animationFrameId = null;

        function updateMarqueePosition() {
            const containerWidth = marqueeContainer.clientWidth;
            const containerHeight = marqueeContainer.clientHeight;
            const textWidth = marqueeWrapper.clientWidth;
            const textHeight = marqueeWrapper.clientHeight;

            if (direction === 'left') {
                posX -= speed;
                if (posX < -textWidth) {
                    posX = containerWidth;
                }
                marqueeWrapper.style.transform = `translate3d(${posX}px, 0px, 0px)`;
            } 
            else if (direction === 'right') {
                posX += speed;
                if (posX > containerWidth) {
                    posX = -textWidth;
                }
                marqueeWrapper.style.transform = `translate3d(${posX}px, 0px, 0px)`;
            }
            else if (direction === 'bounce') {
                posX += speed * bounceVel;
                if (posX + textWidth >= containerWidth) {
                    bounceVel = -1;
                    soundEngine.playGhostScream();
                } else if (posX <= 0) {
                    bounceVel = 1;
                }
                marqueeWrapper.style.transform = `translate3d(${posX}px, 0px, 0px)`;
            }
            else if (direction === 'up') {
                posY -= speed;
                if (posY < -textHeight - 50) {
                    posY = containerHeight + 20;
                }
                marqueeWrapper.style.transform = `translate3d(0px, ${posY}px, 0px)`;
            }

            animationFrameId = requestAnimationFrame(updateMarqueePosition);
        }

        function resetPosition() {
            const containerWidth = marqueeContainer.clientWidth;
            const containerHeight = marqueeContainer.clientHeight;

            if (direction === 'left') {
                posX = containerWidth;
                posY = 0;
            } else if (direction === 'right') {
                posX = -marqueeWrapper.clientWidth;
                posY = 0;
            } else if (direction === 'bounce') {
                posX = 10;
                posY = 0;
                bounceVel = 1;
            } else if (direction === 'up') {
                posX = 0;
                posY = containerHeight;
            }
        }

        // --- 3. UI Control Event Listeners ---
        const inputCustomText = document.getElementById('inputCustomText');
        const btnApplyText = document.getElementById('btnApplyText');
        const selectFont = document.getElementById('selectFont');
        const selectDirection = document.getElementById('selectDirection');
        const sliderSpeed = document.getElementById('sliderSpeed');
        const valSpeed = document.getElementById('valSpeed');
        const sliderSize = document.getElementById('sliderSize');
        const valSize = document.getElementById('valSize');

        // Apply Custom Text
        btnApplyText.addEventListener('click', () => {
            const newText = inputCustomText.value.trim();
            if (newText) {
                marqueeText.textContent = newText;
                resetPosition();
            }
        });

        // Preset Text Pills
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.textContent.replace(/^[🎃👻🩸💀]\s*/, '');
                inputCustomText.value = text;
                marqueeText.textContent = text;
                resetPosition();
            });
        });

        // Theme Switcher
        document.querySelectorAll('.theme-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-select-btn').forEach(b => {
                    b.classList.remove('border-red-600', 'border-orange-500', 'border-green-500', 'border-purple-500', 'border-cyan-200', 'border-cyan-400');
                    b.classList.add('border-gray-800');
                });
                
                const themeClass = btn.getAttribute('data-theme');
                document.body.className = document.body.className.replace(/theme-\w+/g, '');
                document.body.classList.add(themeClass);

                btn.classList.remove('border-gray-800');
                btn.classList.add('border-red-600');
            });
        });

        // Font Selection
        selectFont.addEventListener('change', (e) => {
            marqueeText.style.fontFamily = e.target.value;
            resetPosition();
        });

        // Direction Selection
        selectDirection.addEventListener('change', (e) => {
            direction = e.target.value;
            resetPosition();
        });

        // Speed Slider
        sliderSpeed.addEventListener('input', (e) => {
            speed = parseInt(e.target.value, 10);
            valSpeed.textContent = speed;
        });

        // Size Slider
        sliderSize.addEventListener('input', (e) => {
            const fontSize = e.target.value + 'px';
            marqueeText.style.fontSize = fontSize;
            valSize.textContent = fontSize;
            resetPosition();
        });

        // Sound Toggle
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const iconSound = document.getElementById('iconSound');
        let soundEnabled = false;

        btnSoundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundEngine.toggleAmbientWind(soundEnabled);

            if (soundEnabled) {
                iconSound.setAttribute('data-lucide', 'volume-2');
                iconSound.classList.replace('text-gray-400', 'text-green-400');
                btnSoundToggle.classList.add('border-green-600/50');
            } else {
                iconSound.setAttribute('data-lucide', 'volume-x');
                iconSound.classList.replace('text-green-400', 'text-gray-400');
                btnSoundToggle.classList.remove('border-green-600/50');
            }
            lucide.createIcons();
        });

        // Sound Triggers
        document.getElementById('btnTriggerScream').addEventListener('click', () => soundEngine.playGhostScream());
        document.getElementById('btnTriggerThunder').addEventListener('click', () => soundEngine.playThunder());
        document.getElementById('btnTriggerLaugh').addEventListener('click', () => soundEngine.playEvilLaugh());

        // --- 4. Fullscreen & Presentation Mode ---
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnExitFullscreen = document.getElementById('btnExitFullscreen');
        const headerBar = document.getElementById('headerBar');
        const controlPanel = document.getElementById('controlPanel');
        const footerBar = document.getElementById('footerBar');

        function togglePresentationMode(enable) {
            if (enable) {
                headerBar.classList.add('hidden');
                controlPanel.classList.add('hidden');
                footerBar.classList.add('hidden');
                btnExitFullscreen.classList.remove('hidden');

                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } else {
                headerBar.classList.remove('hidden');
                controlPanel.classList.remove('hidden');
                footerBar.classList.remove('hidden');
                btnExitFullscreen.classList.add('hidden');

                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
            setTimeout(resetPosition, 200);
        }

        btnFullscreen.addEventListener('click', () => togglePresentationMode(true));
        btnExitFullscreen.addEventListener('click', () => togglePresentationMode(false));

        // Keyboard Shortcut ESC or F key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                const isHidden = controlPanel.classList.contains('hidden');
                togglePresentationMode(!isHidden);
            }
        });

        // Handle Window Resize
        window.addEventListener('resize', resetPosition);

        // --- 5. PWA Manifest Generator & Service Worker Registration ---
        function initPWA() {
            const manifestData = {
                name: "萬聖節恐怖跑馬燈",
                short_name: "恐怖跑馬燈",
                start_url: ".",
                display: "standalone",
                background_color: "#0d0d0d",
                theme_color: "#0d0d0d",
                description: "Halloween Spooky Marquee Ticker PWA",
                icons: [
                    {
                        src: "https://cdn-icons-png.flaticon.com/512/3815/3815320.png",
                        sizes: "512x512",
                        type: "image/png"
                    }
                ]
            };

            const manifestString = JSON.stringify(manifestData);
            const manifestBlob = new Blob([manifestString], { type: 'application/json' });
            const manifestURL = URL.createObjectURL(manifestBlob);
            document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

            // Register inline dummy ServiceWorker for PWA compliance
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => new Response("Offline")));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swURL = URL.createObjectURL(swBlob);

                navigator.serviceWorker.register(swURL).then(() => {
                    console.log('Spooky PWA ServiceWorker Registered');
                }).catch(err => console.log('SW registration error:', err));
            }
        }

        // Initialize App
        window.onload = function() {
            lucide.createIcons();
            initPWA();
            resetPosition();
            updateMarqueePosition();
        };
    </script>
</body>
</html>
