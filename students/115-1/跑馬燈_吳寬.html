<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬聖節 3 排恐怖跑馬燈 PWA</title>
    
    <!-- PWA Setup via Data URL -->
    <link rel="manifest" id="manifest-placeholder">
    <meta name="theme-color" content="#0d0814">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/jack-o-lantern.png">

    <!-- Google Fonts for Halloween & Gaming Themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Butcherman&family=Creepster&family=Frijole&family=Luckiest+Guy&family=Metal+Mania&family=Nosifer&family=Noto+Sans+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #ff003c;
            --secondary-glow: #790202;
            --bg-color: #05020a;
            --text-color: #ff0000;
            --stroke-color: #790202;
            --font-family: 'Creepster', cursive;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Noto Sans TC', sans-serif;
            color: #fff;
        }

        /* Ambient Fog Canvas & Background */
        #spooky-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 3-Row Container Layout */
        .marquee-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            z-index: 2;
            padding: 20px 0;
        }

        .marquee-row {
            position: relative;
            width: 100%;
            height: 25%;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .marquee-text {
            white-space: nowrap;
            font-family: var(--font-family);
            font-size: 5rem;
            color: var(--text-color);
            position: absolute;
            will-change: transform;
            cursor: pointer;
            transition: font-size 0.2s ease, filter 0.3s ease;
        }

        /* Control Panel Styles */
        .control-panel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(13, 8, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid #3a154c;
            border-radius: 16px;
            padding: 14px 20px;
            width: 92%;
            max-width: 1050px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(138, 43, 226, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .control-panel.collapsed {
            transform: translate(-50%, 120%);
            opacity: 0;
            pointer-events: none;
        }

        .panel-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .inputs-3row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .row-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-label {
            font-size: 0.8rem;
            color: #ff5500;
            font-weight: bold;
            width: 45px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #6a2c91;
            border-radius: 8px;
            padding: 6px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff5500;
            box-shadow: 0 0 8px rgba(255, 85, 0, 0.5);
        }

        select, button {
            background: #1a0f2e;
            border: 1px solid #6a2c91;
            border-radius: 8px;
            color: #e0d0ff;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        select:hover, button:hover {
            background: #2a1848;
            border-color: #ff5500;
            color: #fff;
        }

        button.active {
            background: #ff5500;
            color: #000;
            font-weight: bold;
            border-color: #ffaa00;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #bfa8e0;
        }

        input[type="range"] {
            accent-color: #ff5500;
            cursor: pointer;
            width: 80px;
        }

        /* Color Picker Styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: 1px solid #6a2c91;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 4px;
            border: none;
        }

        /* Toggle Panel Button */
        .toggle-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 11;
            background: rgba(20, 10, 35, 0.8);
            border: 1px solid #ff5500;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.4rem;
            color: #ff5500;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.4);
        }

        .sound-board {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sound-btn {
            background: #250938;
            border: 1px solid #800080;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .fullscreen-hint {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 3;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .marquee-text {
                font-size: 3rem;
            }
            .control-panel {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <canvas id="spooky-canvas"></canvas>

    <div class="marquee-stage">
        <div class="marquee-row" id="row-1">
            <div class="marquee-text" id="text-1">萬聖節狂歡派對 TRICK OR TREAT! 🎃</div>
        </div>
        <div class="marquee-row" id="row-2">
            <div class="marquee-text" id="text-2">👻 ROBLOX 萬聖節限定關卡開啟 👻</div>
        </div>
        <div class="marquee-row" id="row-3">
            <div class="marquee-text" id="text-3">🩸 不給糖就就搗蛋！SPARKLE NIGHT 🩸</div>
        </div>
    </div>

    <div class="fullscreen-hint">按 [F] 鍵進入全螢幕展示模式 | [H] 隱藏選單</div>

    <button class="toggle-btn" id="toggle-panel-btn" title="切換選單 (快捷鍵: H)">⚙️</button>

    <div class="control-panel" id="control-panel">
        <!-- 3 Rows Text Inputs -->
        <div class="inputs-3row">
            <div class="row-input-group">
                <span class="row-label">第1排:</span>
                <input type="text" id="input-1" value="萬聖節狂歡派對 TRICK OR TREAT! 🎃">
            </div>
            <div class="row-input-group">
                <span class="row-label">第2排:</span>
                <input type="text" id="input-2" value="👻 ROBLOX 萬聖節限定關卡開啟 👻">
            </div>
            <div class="row-input-group">
                <span class="row-label">第3排:</span>
                <input type="text" id="input-3" value="🩸 不給糖就就搗蛋！SPARKLE NIGHT 🩸">
            </div>
        </div>

        <!-- Row 2: Theme, Font, Independent Colors -->
        <div class="panel-row">
            <div class="control-item">
                <label>預設主題:</label>
                <select id="theme-select">
                    <option value="roblox">🎮 Roblox 3D 積木</option>
                    <option value="blood">🩸 鮮血地獄 (Blood)</option>
                    <option value="pumpkin">🎃 惡魔南瓜 (Pumpkin)</option>
                    <option value="slime">🧪 毒液綠 (Slime)</option>
                    <option value="witch">🔮 女巫魔法 (Witch)</option>
                    <option value="ghost">👻 幽靈冰白 (Ghost)</option>
                </select>
            </div>
            
            <div class="control-item">
                <label>文字顏色:</label>
                <input type="color" id="text-color-picker" value="#ffcc00">
            </div>

            <div class="control-item">
                <label>外框/陰影:</label>
                <input type="color" id="stroke-color-picker" value="#ff3300">
            </div>

            <div class="control-item">
                <label>字體:</label>
                <select id="font-select">
                    <option value="'Luckiest Guy', cursive">Luckiest Guy (Roblox 3D)</option>
                    <option value="'Creepster', cursive">Creepster</option>
                    <option value="'Nosifer', cursive">Nosifer (滴血)</option>
                    <option value="'Butcherman', cursive">Butcherman</option>
                    <option value="'Frijole', cursive">Frijole</option>
                    <option value="'Metal Mania', cursive">Metal Mania</option>
                    <option value="'Press Start 2P', cursive">Press Start 2P</option>
                    <option value="'Noto Sans TC', sans-serif">預設黑體</option>
                </select>
            </div>
        </div>

        <!-- Row 3: Speed, Size, Directions -->
        <div class="panel-row">
            <div class="control-item">
                <label>速度 Speed:</label>
                <input type="range" id="speed-slider" min="1" max="20" value="6">
            </div>
            <div class="control-item">
                <label>字體 Size:</label>
                <input type="range" id="size-slider" min="30" max="150" value="70">
            </div>
            <div class="control-item">
                <label>閃爍:</label>
                <button id="flicker-btn" class="active">⚡ 開啟</button>
            </div>
            <div class="control-item">
                <button id="fullscreen-btn">📺 全螢幕</button>
            </div>
        </div>

        <!-- Row 4: Audio Board -->
        <div class="panel-row">
            <div class="control-item">
                <label>🔊 音效:</label>
                <div class="sound-board">
                    <button class="sound-btn" onclick="playSpookySound('scream')">😱 慘叫</button>
                    <button class="sound-btn" onclick="playSpookySound('laugh')">😈 笑聲</button>
                    <button class="sound-btn" onclick="playSpookySound('thunder')">⚡ 驚雷</button>
                    <button class="sound-btn" onclick="playSpookySound('wind')">🌬️ 風聲</button>
                </div>
            </div>
            <div class="control-item">
                <button id="pwa-install-btn" style="display:none; background: #0088cc; color: white;">📱 安裝 PWA</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Theme Presets ---
        const themes = {
            roblox: {
                font: "'Luckiest Guy', cursive",
                textColor: "#ffcc00",
                strokeColor: "#ff3300",
                bg: "#080a14"
            },
            blood: {
                font: "'Nosifer', cursive",
                textColor: "#ff003c",
                strokeColor: "#800000",
                bg: "#05020a"
            },
            pumpkin: {
                font: "'Creepster', cursive",
                textColor: "#ff6600",
                strokeColor: "#cc2200",
                bg: "#0d0500"
            },
            slime: {
                font: "'Frijole', cursive",
                textColor: "#39ff14",
                strokeColor: "#008000",
                bg: "#020a02"
            },
            witch: {
                font: "'Butcherman', cursive",
                textColor: "#df00ff",
                strokeColor: "#4b0082",
                bg: "#08010f"
            },
            ghost: {
                font: "'Metal Mania', cursive",
                textColor: "#e0ffff",
                strokeColor: "#00ffff",
                bg: "#01080a"
            }
        };

        // --- 2. Marquee Engine for 3 Rows ---
        const rows = [
            { textEl: document.getElementById('text-1'), inputEl: document.getElementById('input-1'), pos: 0, dir: -1 },
            { textEl: document.getElementById('text-2'), inputEl: document.getElementById('input-2'), pos: 0, dir: 1 },
            { textEl: document.getElementById('text-3'), inputEl: document.getElementById('input-3'), pos: 0, dir: -1 }
        ];

        const themeSelect = document.getElementById('theme-select');
        const fontSelect = document.getElementById('font-select');
        const textColorPicker = document.getElementById('text-color-picker');
        const strokeColorPicker = document.getElementById('stroke-color-picker');
        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');
        const flickerBtn = document.getElementById('flicker-btn');

        let currentFont = "'Luckiest Guy', cursive";
        let isFlickering = true;

        function updateTextStyle() {
            const textColor = textColorPicker.value;
            const strokeColor = strokeColorPicker.value;

            rows.forEach(row => {
                row.textEl.style.fontFamily = currentFont;
                row.textEl.style.color = textColor;
                
                // Build dynamic outline & shadow effect based on strokeColor
                row.textEl.style.textShadow = `
                    2px 2px 0px #000,
                    -2px -2px 0px #000,
                    2px -2px 0px #000,
                    -2px 2px 0px #000,
                    4px 4px 0px ${strokeColor},
                    0 0 20px ${strokeColor}
                `;
            });
        }

        function updateTexts() {
            rows.forEach(row => {
                row.textEl.textContent = row.inputEl.value || ' ';
            });
        }

        function applyTheme(themeKey) {
            const theme = themes[themeKey];
            if (!theme) return;
            
            document.body.style.backgroundColor = theme.bg;
            currentFont = theme.font;
            fontSelect.value = theme.font;
            textColorPicker.value = theme.textColor;
            strokeColorPicker.value = theme.strokeColor;
            
            updateTextStyle();
        }

        function animate() {
            const speed = parseInt(speedSlider.value);

            rows.forEach((row, index) => {
                const containerW = row.textEl.parentElement.clientWidth;
                const textW = row.textEl.offsetWidth;

                row.pos += speed * row.dir;

                if (row.dir === -1 && row.pos < -textW) {
                    row.pos = containerW;
                } else if (row.dir === 1 && row.pos > containerW) {
                    row.pos = -textW;
                }

                // Flicker effect
                if (isFlickering && Math.random() < 0.02) {
                    row.textEl.style.opacity = (Math.random() * 0.4 + 0.3).toString();
                } else {
                    row.textEl.style.opacity = '1';
                }

                row.textEl.style.transform = `translate3d(${row.pos}px, 0, 0)`;
            });

            requestAnimationFrame(animate);
        }

        // --- 3. Event Listeners ---
        rows.forEach(row => {
            row.inputEl.addEventListener('input', updateTexts);
        });

        themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
        
        fontSelect.addEventListener('change', (e) => {
            currentFont = e.target.value;
            updateTextStyle();
        });

        textColorPicker.addEventListener('input', updateTextStyle);
        strokeColorPicker.addEventListener('input', updateTextStyle);

        sizeSlider.addEventListener('input', (e) => {
            rows.forEach(row => {
                row.textEl.style.fontSize = `${e.target.value}px`;
            });
        });

        flickerBtn.addEventListener('click', () => {
            isFlickering = !isFlickering;
            flickerBtn.classList.toggle('active', isFlickering);
        });

        // Hide/Show Controls Panel
        const controlPanel = document.getElementById('control-panel');
        const togglePanelBtn = document.getElementById('toggle-panel-btn');

        function togglePanel() {
            controlPanel.classList.toggle('collapsed');
        }

        togglePanelBtn.addEventListener('click', togglePanel);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') togglePanel();
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // Fullscreen Mode
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // --- 4. Web Audio API Spooky Sound Synthesizer ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSpookySound(type) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'scream') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                osc.frequency.exponentialRampToValueAtTime(300, now + 1.2);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 1.2);
            } else if (type === 'laugh') {
                for (let i = 0; i < 5; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    const startTime = now + (i * 0.18);
                    osc.frequency.setValueAtTime(150 - (i * 10), startTime);
                    osc.frequency.exponentialRampToValueAtTime(80, startTime + 0.12);

                    gain.gain.setValueAtTime(0.4, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.14);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.14);
                }
            } else if (type === 'thunder') {
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, now);
                filter.frequency.linearRampToValueAtTime(50, now + 1.5);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } else if (type === 'wind') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 1.0);
                osc.frequency.linearRampToValueAtTime(150, now + 2.5);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 1.0);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 2.5);
            }
        }

        // --- 5. Spooky Ambient Canvas Animation ---
        const canvas = document.getElementById('spooky-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const bats = [];

        class FogParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 120 + 80;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.15 + 0.05;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100) this.reset();
            }
            draw() {
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, `rgba(138, 43, 226, ${this.alpha})`);
                gradient.addColorStop(0.5, `rgba(45, 0, 75, ${this.alpha * 0.5})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Bat {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() < 0.5 ? -40 : canvas.width + 40;
                this.y = Math.random() * (canvas.height * 0.6);
                this.speed = Math.random() * 3 + 2;
                this.vx = this.x < 0 ? this.speed : -this.speed;
                this.wingAngle = 0;
                this.size = Math.random() * 12 + 10;
            }
            update() {
                this.x += this.vx;
                this.y += Math.sin(this.x * 0.05) * 1.5;
                this.wingAngle += 0.2;
                if ((this.vx > 0 && this.x > canvas.width + 50) || (this.vx < 0 && this.x < -50)) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#11001a';
                ctx.beginPath();
                const wingY = Math.sin(this.wingAngle) * (this.size * 0.6);
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-this.size / 2, -this.size + wingY, -this.size, wingY);
                ctx.quadraticCurveTo(-this.size / 2, 0, 0, 5);
                ctx.quadraticCurveTo(this.size / 2, 0, this.size, wingY);
                ctx.quadraticCurveTo(this.size / 2, -this.size + wingY, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 20; i++) particles.push(new FogParticle());
        for (let i = 0; i < 6; i++) bats.push(new Bat());

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            bats.forEach(b => { b.update(); b.draw(); });
            requestAnimationFrame(renderCanvas);
        }

        // --- 6. PWA Dynamic Manifest & Service Worker ---
        function initPWA() {
            const manifestData = {
                name: "萬聖節3排跑馬燈 PWA",
                short_name: "萬聖跑馬燈",
                start_url: ".",
                display: "standalone",
                background_color: "#05020a",
                theme_color: "#0d0814",
                icons: [{ src: "https://img.icons8.com/emoji/192/jack-o-lantern.png", sizes: "192x192", type: "image/png" }]
            };

            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            updateTexts();
            applyTheme('roblox');
            animate();
            renderCanvas();
            initPWA();
        });
    </script>
</body>
</html>
