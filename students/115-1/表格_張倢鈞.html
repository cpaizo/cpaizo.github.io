<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日系超萌企鵝互動鍵盤 - Kawaii Penguin Keyboard Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-grad-1: #e0f2fe;
            --bg-grad-2: #38bdf8;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.7);
            --key-bg: #ffffff;
            --key-text: #0f172a;
            --key-sub: #0284c7;
            --key-border: #bae6fd;
            --key-shadow: #7dd3fc;
            --key-active: #38bdf8;
            --accent: #fb923c;
            --penguin-body: #1e293b;
            --penguin-belly: #ffffff;
            --penguin-beak: #fb923c;
            --penguin-blush: #f472b6;
        }

        /* 經典帝王企鵝 */
        body.theme-emperor {
            --bg-grad-1: #38bdf8;
            --bg-grad-2: #1e3a8a;
            --card-bg: rgba(255, 255, 255, 0.35);
            --card-border: rgba(255, 255, 255, 0.6);
            --key-bg: rgba(255, 255, 255, 0.95);
            --key-text: #0f172a;
            --key-sub: #0284c7;
            --key-border: #93c5fd;
            --key-shadow: #60a5fa;
            --key-active: #38bdf8;
            --accent: #fb923c;
            --penguin-body: #1e293b;
        }

        /* 草莓牛奶企鵝 */
        body.theme-strawberry {
            --bg-grad-1: #fbcfe8;
            --bg-grad-2: #f43f5e;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.75);
            --key-bg: #ffffff;
            --key-text: #881337;
            --key-sub: #e11d48;
            --key-border: #fecdd3;
            --key-shadow: #fda4af;
            --key-active: #fb7185;
            --accent: #fbbf24;
            --penguin-body: #9f1239;
            --penguin-blush: #fb7185;
        }

        /* 薄荷冰塊企鵝 */
        body.theme-mint {
            --bg-grad-1: #ccfbf1;
            --bg-grad-2: #0d9488;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.75);
            --key-bg: #ffffff;
            --key-text: #134e4a;
            --key-sub: #0d9488;
            --key-border: #99f6e4;
            --key-shadow: #5eead4;
            --key-active: #2dd4bf;
            --accent: #fb923c;
            --penguin-body: #115e59;
        }

        /* 極光星空企鵝 */
        body.theme-aurora {
            --bg-grad-1: #1e1b4b;
            --bg-grad-2: #0284c7;
            --card-bg: rgba(15, 23, 42, 0.55);
            --card-border: rgba(167, 139, 250, 0.35);
            --key-bg: rgba(30, 41, 59, 0.9);
            --key-text: #f8fafc;
            --key-sub: #38bdf8;
            --key-border: #475569;
            --key-shadow: #334155;
            --key-active: #818cf8;
            --accent: #fb7185;
            --penguin-body: #0f172a;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* 雪花 Canvas */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 柔光毛玻璃面板 */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--card-border);
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.12);
        }

        /* 軟糖冰塊按鍵 Keycap */
        .keycap {
            background-color: var(--key-bg);
            color: var(--key-text);
            border: 2px solid var(--key-border);
            border-radius: 16px;
            box-shadow: 0 6px 0 0 var(--key-shadow), 0 8px 18px rgba(0,0,0,0.12);
            transition: all 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            touch-action: manipulation;
            position: relative;
        }

        .keycap .sub-text {
            color: var(--key-sub);
        }

        .keycap:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            cursor: pointer;
        }

        .keycap:active, .keycap.active {
            transform: translateY(5px) !important;
            box-shadow: 0 1px 0 0 var(--key-shadow), 0 2px 10px rgba(56, 189, 248, 0.5) !important;
            background-color: var(--key-active) !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }

        .keycap:active .sub-text, .keycap.active .sub-text {
            color: #f0f9ff !important;
        }

        /* 日系企鵝拍翅與晃頭動畫 */
        .wing-left {
            transform-origin: 52px 108px;
            transition: transform 0.08s ease-in-out;
        }
        .wing-right {
            transform-origin: 148px 108px;
            transition: transform 0.08s ease-in-out;
        }

        /* 打字時拍拍手 */
        .typing-clap .wing-left {
            transform: rotate(-42deg) translateY(-6px);
        }
        .typing-clap .wing-right {
            transform: rotate(42deg) translateY(-6px);
        }

        .penguin-head-group {
            transform-origin: 100px 85px;
            transition: transform 0.12s ease;
        }
        .typing-clap .penguin-head-group {
            transform: translateY(-3px) rotate(2deg);
        }

        /* 企鵝身體搖擺 */
        @keyframes waddle {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }
        .waddle-anim {
            animation: waddle 1.6s infinite ease-in-out;
        }

        /* 噴發粒子特效 */
        .particle {
            position: fixed;
            pointer-events: none;
            animation: floatPop 0.85s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 9999;
            font-size: 1.4rem;
        }

        @keyframes floatPop {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: translate(-50%, -45px) scale(1.3) rotate(15deg); }
            100% { opacity: 0; transform: translate(-50%, -85px) scale(1.1) rotate(-15deg); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 4px; }
    </style>
</head>
<body class="theme-emperor relative min-h-screen flex flex-col justify-between p-3 sm:p-6">

    <!-- 雪花飄落 Canvas -->
    <canvas id="snowCanvas"></canvas>

    <!-- 主容器 -->
    <div class="relative z-10 w-full max-w-6xl mx-auto flex flex-col gap-4">

            <!-- 左側 Logo 與標題 -->

                <div class="w-14 h-14 rounded-2xl bg-white/40 border-2 border-white/60 flex items-center justify-center text-sky-600 text-3xl shadow-inner">
                    <i class="fa-solid fa-ice-cream animate-bounce"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-slate-800 dark:text-white flex items-center gap-2" style="font-family: 'Mochiy Pop One', 'Fredoka', sans-serif;">
                        企鵝醬鍵盤 <span class="text-xs px-3 py-1 rounded-full bg-sky-400/30 text-sky-800 dark:text-sky-200 border border-sky-400/40 font-bold">萌化版</span>
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-700 dark:text-sky-100/90 font-medium mt-0.5">日系 Q 版企鵝 ‧ 注音/英文鍵盤 ‧ 清脆萌音 ‧ 冰山打字課</p>
                </div>
            </div>

            <!-- 中間超萌企鵝吉祥物 (Kawaii Penguin Mascot) -->
            <div id="penguinMascot" class="flex flex-col items-center justify-center relative cursor-pointer select-none group" title="點擊企鵝醬餵食/互動！">
                <!-- 對話氣泡 -->
                <div id="penguinSpeech" class="absolute -top-11 bg-white text-slate-800 text-xs font-black px-4 py-1.5 rounded-full shadow-lg border-2 border-amber-300 whitespace-nowrap opacity-95 transition-all duration-300 scale-100 flex items-center gap-1">
                    <span>咕唧！快來跟我一起打字吧~</span> 🐧
                </div>

                <!-- 超萌日系 SVG 企鵝畫布 -->
                <svg id="penguinSvg" class="w-28 h-28 sm:w-32 sm:h-32 waddle-anim drop-shadow-xl" viewBox="0 0 200 200">
                    <defs>
                        <!-- 柔和漸層 -->
                        <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#fb923c" />
                            <stop offset="100%" stop-color="#f97316" />
                        </linearGradient>
                        <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#f1f5f9" />
                        </linearGradient>
                    </defs>

                    <!-- 企鵝小腳掌 (圓滾滾) -->
                    <ellipse cx="72" cy="172" rx="16" ry="10" fill="url(#beakGrad)" />
                    <ellipse cx="128" cy="172" rx="16" ry="10" fill="url(#beakGrad)" />

                    <!-- 企鵝小翅膀 (左 / 右) -->
                    <path class="wing-left" d="M 52 100 C 22 110, 18 140, 48 145 C 58 135, 58 112, 52 100 Z" fill="var(--penguin-body)" />
                    <path class="wing-right" d="M 148 100 C 178 110, 182 140, 152 145 C 142 135, 142 112, 148 100 Z" fill="var(--penguin-body)" />

                    <!-- 圓滾滾蛋型企鵝身體 -->
                    <path d="M 100 25 C 150 25, 170 70, 170 120 C 170 165, 145 175, 100 175 C 55 175, 30 165, 30 120 C 30 70, 50 25, 100 25 Z" fill="var(--penguin-body)" />

                    <!-- 白肚肚 (超萌心形圓肚) -->
                    <path d="M 100 50 C 135 50, 150 85, 150 122 C 150 158, 130 168, 100 168 C 70 168, 50 158, 50 122 C 50 85, 65 50, 100 50 Z" fill="url(#bellyGrad)" />

                    <!-- 企鵝頭部群組 (呆毛/眼睛/嘴巴/腮紅) -->
                    <g class="penguin-head-group">
                        <!-- 頭頂可愛企鵝呆毛 -->
                        <path d="M 100 26 C 96 12, 88 10, 92 4 C 98 12, 102 18, 100 26 Z" fill="var(--penguin-body)" />
                        <path d="M 102 26 C 108 14, 116 12, 112 6 C 106 14, 102 20, 102 26 Z" fill="var(--penguin-body)" />

                        <!-- 1. 平時水汪汪大眼睛 -->
                        <g id="eyeNormal">
                            <!-- 左眼 -->
                            <circle cx="78" cy="78" r="10" fill="#0f172a" />
                            <circle cx="75" cy="74" r="4" fill="#ffffff" />
                            <circle cx="81" cy="81" r="1.8" fill="#ffffff" />
                            <!-- 右眼 -->
                            <circle cx="122" cy="78" r="10" fill="#0f172a" />
                            <circle cx="119" cy="74" r="4" fill="#ffffff" />
                            <circle cx="125" cy="81" r="1.8" fill="#ffffff" />
                        </g>

                        <!-- 2. 開心瞇眼 (≧◡≦) -->
                        <g id="eyeHappy" class="hidden">
                            <path d="M 68 80 Q 78 68 88 80" stroke="#0f172a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                            <path d="M 112 80 Q 122 68 132 80" stroke="#0f172a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                        </g>

                        <!-- 3. 星星眼 (★ω★) -->
                        <g id="eyeStar" class="hidden">
                            <path d="M 78 70 L 81 76 L 87 77 L 82 81 L 84 87 L 78 83 L 72 87 L 74 81 L 69 77 L 75 76 Z" fill="#fbbf24" />
                            <path d="M 122 70 L 125 76 L 131 77 L 126 81 L 128 87 L 122 83 L 116 87 L 118 81 L 113 77 L 119 76 Z" fill="#fbbf24" />
                        </g>

                        <!-- 4. 愛心眼 (♥ω♥) -->
                        <g id="eyeHeart" class="hidden">
                            <path d="M 78 82 C 78 82, 68 76, 68 72 C 68 68, 72 66, 75 69 C 78 72, 78 72, 78 72 C 78 72, 78 72, 81 69 C 84 66, 88 68, 88 72 C 88 76, 78 82, 78 82 Z" fill="#f43f5e" />
                            <path d="M 122 82 C 122 82, 112 76, 112 72 C 112 68, 116 66, 119 69 C 122 72, 122 72, 122 72 C 122 72, 122 72, 125 69 C 128 66, 132 68, 132 72 C 132 76, 122 82, 122 82 Z" fill="#f43f5e" />
                        </g>

                        <!-- 粉嫩可愛腮紅 -->
                        <ellipse cx="66" cy="88" rx="8" ry="5" fill="var(--penguin-blush)" opacity="0.75" />
                        <ellipse cx="134" cy="88" rx="8" ry="5" fill="var(--penguin-blush)" opacity="0.75" />

                        <!-- Q 萌小嘴巴 -->
                        <path d="M 90 85 Q 100 80 110 85 Q 100 102 90 85 Z" fill="url(#beakGrad)" />
                    </g>
                </svg>
            </div>

            <!-- 控制面板 (主題、音效、雪花) -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <!-- 主題選擇 -->
                <div class="flex items-center gap-1.5 bg-black/15 px-3 py-1.5 rounded-2xl border border-white/30 text-xs text-slate-800 dark:text-white font-bold">
                    <i class="fa-solid fa-palette text-amber-300"></i>
                    <select id="themeSelect" class="bg-transparent focus:outline-none cursor-pointer">
                        <option value="emperor" class="text-slate-900">經典帝王 (冰晶藍)</option>
                        <option value="strawberry" class="text-slate-900">草莓牛奶 (粉嫩紅)</option>
                        <option value="mint" class="text-slate-900">薄荷冰塊 (清新綠)</option>
                        <option value="aurora" class="text-slate-900">極光星空 (深海夜)</option>
                    </select>
                </div>

                <!-- 音效選擇 -->
                <div class="flex items-center gap-1.5 bg-black/15 px-3 py-1.5 rounded-2xl border border-white/30 text-xs text-slate-800 dark:text-white font-bold">
                    <i class="fa-solid fa-volume-high text-sky-300" id="soundIcon"></i>
                    <select id="soundTypeSelect" class="bg-transparent focus:outline-none cursor-pointer">
                        <option value="pop" class="text-slate-900">企鵝啵啵聲 🐧</option>
                        <option value="ice" class="text-slate-900">清脆冰塊聲 🧊</option>
                        <option value="squeak" class="text-slate-900">軟萌咕唧聲 🐥</option>
                        <option value="mute" class="text-slate-900">靜音模式 🔇</option>
                    </select>
                </div>

                <!-- 雪花開關 -->
                <button id="snowToggleBtn" class="px-3.5 py-1.5 rounded-2xl bg-black/15 border border-white/30 text-xs font-bold hover:bg-white/20 transition flex items-center gap-1.5 text-slate-800 dark:text-white">
                    <i class="fa-solid fa-snowflake text-sky-200"></i> 雪花: ON
                </button>
            </div>
        </header>

        <!-- 打字挑戰與記事本 -->
        <main class="flex flex-col gap-4">
            
            <!-- 冰山打字挑戰賽 -->
            <div class="glass-panel p-4 rounded-3xl flex flex-col gap-3 relative overflow-hidden border border-sky-300/40">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-white/20 pb-2.5">
                    <div class="flex items-center gap-2">
                        <span class="px-3.5 py-1 rounded-full bg-amber-400 text-slate-900 font-extrabold text-xs flex items-center gap-1.5 shadow">
                            <i class="fa-solid fa-trophy"></i> 冰山 WPM 打字課
                        </span>
                        <div id="testTimer" class="font-mono font-bold text-amber-300 text-base ml-2">60 秒</div>
                    </div>

                    <!-- 打字數據 -->
                    <div class="flex items-center gap-4 text-xs sm:text-sm font-bold text-slate-800 dark:text-white">
                        <div><span class="text-sky-800 dark:text-sky-200 text-xs block">CPM (字/分)</span><span id="cpmVal" class="text-amber-400 text-base font-black">0</span></div>
                        <div><span class="text-sky-800 dark:text-sky-200 text-xs block">WPM (詞/分)</span><span id="wpmVal" class="text-emerald-400 text-base font-black">0</span></div>
                        <div><span class="text-sky-800 dark:text-sky-200 text-xs block">正確率</span><span id="accuracyVal" class="text-purple-300 text-base font-black">100%</span></div>
                        <div><span class="text-sky-800 dark:text-sky-200 text-xs block">獲得小魚</span><span id="fishVal" class="text-amber-400 text-base font-black">0 🐟</span></div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="startTestBtn" class="px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-orange-400 text-slate-900 font-black text-xs hover:brightness-110 shadow-lg transition active:scale-95">
                            開始打字挑戰
                        </button>
                        <button id="resetTestBtn" class="px-3.5 py-1.5 rounded-full bg-white/20 hover:bg-white/30 text-xs font-bold border border-white/30 text-slate-800 dark:text-white transition">
                            重置
                        </button>
                    </div>
                </div>

                <!-- 測試文本範例 -->
                <div id="sampleText" class="font-mono text-base sm:text-lg leading-relaxed p-3.5 rounded-2xl bg-black/15 border border-white/20 max-h-24 overflow-y-auto select-none tracking-wide text-slate-900 dark:text-sky-50 font-semibold">
                    點擊「開始打字挑戰」按鈕，企鵝醬會陪你練習打字並發放美味的小魚獎勵喔！
                </div>
            </div>

            <!-- 文字輸入區 -->
            <div class="glass-panel p-4 rounded-3xl flex flex-col gap-2 relative">
                <div class="flex items-center justify-between text-xs text-slate-700 dark:text-sky-100/90 font-bold">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-feather text-amber-300"></i> 企鵝記事本 (Penguin Note Pad)
                    </span>
                    <div class="flex items-center gap-3">
                        <span id="charCount" class="font-mono">0 個字元</span>
                        <button id="copyBtn" class="hover:text-amber-300 transition flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> 複製內容
                        </button>
                        <button id="clearBtn" class="hover:text-rose-300 transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 清空
                        </button>
                    </div>
                </div>

                <textarea id="typingArea" rows="3" 
                    class="w-full bg-black/15 text-slate-900 dark:text-white font-mono text-base sm:text-lg p-3.5 rounded-2xl resize-none focus:outline-none focus:ring-2 focus:ring-sky-300/80 border border-white/20 transition placeholder:text-slate-500 dark:placeholder:text-sky-200/50"
                    placeholder="點擊此處打字，或使用下方可愛企鵝鍵盤輸入..."></textarea>
            </div>

            <!-- 企鵝虛擬鍵盤本體 -->
            <div class="glass-panel p-3 sm:p-5 rounded-3xl overflow-x-auto border border-white/30 shadow-2xl">
                <div id="keyboardContainer" class="min-w-[720px] lg:min-w-0 flex flex-col gap-2">
                    <!-- JavaScript 將繪製精細鍵帽 -->
                </div>
            </div>

        </main>
    </div>

    <script>
        /* --- 1. 全局狀態與變數 --- */
        let currentTheme = 'emperor';
        let soundType = 'pop';
        let snowEnabled = true;
        let isTesting = false;
        let testTimerInterval = null;
        let timeLeft = 60;
        let totalTypedKeys = 0;
        let correctTypedKeys = 0;
        let fishCount = 0;
        let currentSampleIndex = 0;

        const SAMPLE_TEXTS = [
            "可愛的小企鵝拍拍翅膀，在圓滾滾的冰山上快樂地溜冰！",
            "打字速度越快，企鵝醬獲得的小魚就越多，眼睛也會閃閃發光喔！",
            "Penguins are aquatic flightless birds living in the icy southern hemisphere.",
            "冰涼的軟糖鍵盤發出清脆啵啵聲，心情瞬間變得超級療癒！",
            "Keep calm and love kawaii penguins! Enjoy typing with happy music."
        ];

        /* --- 2. 鍵盤配置 (注音 + 英文) --- */
        const KEYBOARD_LAYOUT = [
            // Row 1
            [
                { code: 'Escape', label: 'Esc', width: 'w-12', isFunc: true },
                { code: 'F1', label: 'F1', isFunc: true }, { code: 'F2', label: 'F2', isFunc: true },
                { code: 'F3', label: 'F3', isFunc: true }, { code: 'F4', label: 'F4', isFunc: true },
                { code: 'F5', label: 'F5', isFunc: true }, { code: 'F6', label: 'F6', isFunc: true },
                { code: 'F7', label: 'F7', isFunc: true }, { code: 'F8', label: 'F8', isFunc: true },
                { code: 'F9', label: 'F9', isFunc: true }, { code: 'F10', label: 'F10', isFunc: true },
                { code: 'F11', label: 'F11', isFunc: true }, { code: 'F12', label: 'F12', isFunc: true },
                { code: 'Delete', label: 'Del', width: 'w-12', isFunc: true }
            ],
            // Row 2: 注音第一排
            [
                { code: 'Backquote', label: '`', shiftLabel: '~', sub: '巷' },
                { code: 'Digit1', label: '1', shiftLabel: '!', sub: 'ㄅ' },
                { code: 'Digit2', label: '2', shiftLabel: '@', sub: 'ㄉ' },
                { code: 'Digit3', label: '3', shiftLabel: '#', sub: 'ˇ' },
                { code: 'Digit4', label: '4', shiftLabel: '$', sub: 'ˋ' },
                { code: 'Digit5', label: '5', shiftLabel: '%', sub: 'ㄓ' },
                { code: 'Digit6', label: '6', shiftLabel: '^', sub: 'ˊ' },
                { code: 'Digit7', label: '7', shiftLabel: '&', sub: '˙' },
                { code: 'Digit8', label: '8', shiftLabel: '*', sub: 'ㄚ' },
                { code: 'Digit9', label: '9', shiftLabel: '(', sub: 'ㄞ' },
                { code: 'Digit0', label: '0', shiftLabel: ')', sub: 'ㄢ' },
                { code: 'Minus', label: '-', shiftLabel: '_', sub: 'ㄦ' },
                { code: 'Equal', label: '=', shiftLabel: '+' },
                { code: 'Backspace', label: 'Backspace ⌫', width: 'flex-1', isFunc: true }
            ],
            // Row 3: 注音第二排
            [
                { code: 'Tab', label: 'Tab ↹', width: 'w-16', isFunc: true },
                { code: 'KeyQ', label: 'Q', sub: 'ㄆ' }, { code: 'KeyW', label: 'W', sub: 'ㄊ' },
                { code: 'KeyE', label: 'E', sub: 'ㄍ' }, { code: 'KeyR', label: 'R', sub: 'ㄐ' },
                { code: 'KeyT', label: 'T', sub: '彡' }, { code: 'KeyY', label: 'Y', sub: 'ㄗ' },
                { code: 'KeyU', label: 'U', sub: 'ㄧ' }, { code: 'KeyI', label: 'I', sub: 'ㄛ' },
                { code: 'KeyO', label: 'O', sub: 'ㄟ' }, { code: 'KeyP', label: 'P', sub: 'ㄣ' },
                { code: 'BracketLeft', label: '[', shiftLabel: '{' },
                { code: 'BracketRight', label: ']', shiftLabel: '}' },
                { code: 'Backslash', label: '\\', shiftLabel: '|', width: 'w-12' }
            ],
            // Row 4: 注音第三排
            [
                { code: 'CapsLock', label: 'Caps ⇪', width: 'w-20', isFunc: true },
                { code: 'KeyA', label: 'A', sub: 'ㄇ' }, { code: 'KeyS', label: 'S', sub: 'ㄋ' },
                { code: 'KeyD', label: 'D', sub: 'ㄎ' }, { code: 'KeyF', label: 'F', sub: 'ㄑ' },
                { code: 'KeyG', label: 'G', sub: 'ㄕ' }, { code: 'KeyH', label: 'H', sub: 'ㄘ' },
                { code: 'KeyJ', label: 'J', sub: 'ㄨ' }, { code: 'KeyK', label: 'K', sub: 'ㄜ' },
                { code: 'KeyL', label: 'L', sub: 'ㄠ' },
                { code: 'Semicolon', label: ';', shiftLabel: ':', sub: 'ㄤ' },
                { code: 'Quote', label: "'", shiftLabel: '"' },
                { code: 'Enter', label: 'Enter ↵', width: 'flex-1', isFunc: true, isEnter: true }
            ],
            // Row 5: 注音第四排
            [
                { code: 'ShiftLeft', label: 'Shift ⇧', width: 'w-24', isFunc: true },
                { code: 'KeyZ', label: 'Z', sub: 'ㄈ' }, { code: 'KeyX', label: 'X', sub: 'ㄌ' },
                { code: 'KeyC', label: 'C', sub: 'ㄏ' }, { code: 'KeyV', label: 'V', sub: 'ㄒ' },
                { code: 'KeyB', label: 'B', sub: 'ㄖ' }, { code: 'KeyN', label: 'N', sub: 'ㄙ' },
                { code: 'KeyM', label: 'M', sub: 'ㄩ' },
                { code: 'Comma', label: ',', shiftLabel: '<', sub: 'ㄝ' },
                { code: 'Period', label: '.', shiftLabel: '>', sub: 'ㄡ' },
                { code: 'Slash', label: '/', shiftLabel: '?', sub: 'ㄥ' },
                { code: 'ShiftRight', label: 'Shift ⇧', width: 'flex-1', isFunc: true }
            ],
            // Row 6: Space 鍵
            [
                { code: 'ControlLeft', label: 'Ctrl', width: 'w-16', isFunc: true },
                { code: 'MetaLeft', label: 'Win 🐧', width: 'w-16', isFunc: true },
                { code: 'AltLeft', label: 'Alt', width: 'w-16', isFunc: true },
                { code: 'Space', label: 'P E N G U I N  I C E  S P A C E', width: 'flex-1', isSpace: true },
                { code: 'AltRight', label: 'Alt', width: 'w-16', isFunc: true },
                { code: 'MetaRight', label: 'Win', width: 'w-16', isFunc: true },
                { code: 'ControlRight', label: 'Ctrl', width: 'w-16', isFunc: true }
            ]
        ];

        /* --- 3. Web Audio API 音效合成器 --- */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playKeySound(code) {
            if (soundType === 'mute') return;
            initAudio();
            const now = audioCtx.currentTime;

            if (code === 'Enter' || code === 'Space') {
                // 跳水 Splash / 歡呼音效
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.22);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
                return;
            }

            if (soundType === 'pop') {
                // 企鵝啵啵聲 (Penguin Pop)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450 + Math.random() * 150, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);

            } else if (soundType === 'ice') {
                // 清脆冰塊聲
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1900 + Math.random() * 300, now);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);

            } else if (soundType === 'squeak') {
                // 軟萌咕唧聲 (Cute Quack)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const base = 650 + Math.random() * 150;
                osc.frequency.setValueAtTime(base, now);
                osc.frequency.linearRampToValueAtTime(base + 250, now + 0.04);
                osc.frequency.linearRampToValueAtTime(base - 50, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        /* --- 4. 渲染鍵盤 UI --- */
        function renderKeyboard() {
            const container = document.getElementById('keyboardContainer');
            container.innerHTML = '';

            KEYBOARD_LAYOUT.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex gap-1.5 sm:gap-2 justify-center w-full';

                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.dataset.code = key.code;
                    
                    let widthClass = key.width || 'flex-1';
                    btn.className = `keycap ${widthClass} h-11 sm:h-14 flex flex-col items-center justify-center p-1 font-extrabold text-xs sm:text-sm select-none relative`;

                    if (key.sub) {
                        btn.innerHTML = `
                            <span class="text-xs sm:text-base leading-tight">${key.label}</span>
                            <span class="sub-text text-[10px] sm:text-xs font-semibold opacity-85 leading-none">${key.sub}</span>
                        `;
                    } else {
                        btn.innerHTML = `<span class="leading-none">${key.label}</span>`;
                    }

                    // 點擊觸發
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        handleVirtualKeyPress(key);
                    });

                    rowDiv.appendChild(btn);
                });

                container.appendChild(rowDiv);
            });
        }

        /* --- 5. 鍵盤事件與打字處理 --- */
        const typingArea = document.getElementById('typingArea');

        function handleVirtualKeyPress(key) {
            playKeySound(key.code);
            triggerPenguinAnimation(key.code);
            spawnParticles(key.code);

            if (key.code === 'Backspace') {
                typingArea.value = typingArea.value.slice(0, -1);
            } else if (key.code === 'Enter') {
                typingArea.value += '\n';
            } else if (key.code === 'Space') {
                typingArea.value += ' ';
            } else if (key.code === 'Tab') {
                typingArea.value += '    ';
            } else if (!key.isFunc) {
                typingArea.value += key.label.toLowerCase();
            }

            updateCharCount();
            checkTestProgress();
            highlightKey(key.code);
        }

        function highlightKey(code) {
            const keyEl = document.querySelector(`[data-code="${code}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 120);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.target !== typingArea && e.code === 'Space') {
                e.preventDefault();
            }
            playKeySound(e.code);
            triggerPenguinAnimation(e.code);
            spawnParticles(e.code);
            highlightKey(e.code);
            
            if (document.activeElement !== typingArea) {
                typingArea.focus();
            }
            setTimeout(updateCharCount, 10);
            setTimeout(checkTestProgress, 10);
        });

        /* --- 6. 企鵝吉祥物萌化表情切換與動畫 --- */
        const penguinSvg = document.getElementById('penguinSvg');
        const penguinSpeech = document.getElementById('penguinSpeech');
        
        const eyeNormal = document.getElementById('eyeNormal');
        const eyeHappy = document.getElementById('eyeHappy');
        const eyeStar = document.getElementById('eyeStar');
        const eyeHeart = document.getElementById('eyeHeart');

        let typingAnimTimeout = null;

        function setPenguinEye(type) {
            eyeNormal.classList.add('hidden');
            eyeHappy.classList.add('hidden');
            eyeStar.classList.add('hidden');
            eyeHeart.classList.add('hidden');

            if (type === 'happy') eyeHappy.classList.remove('hidden');
            else if (type === 'star') eyeStar.classList.remove('hidden');
            else if (type === 'heart') eyeHeart.classList.remove('hidden');
            else eyeNormal.classList.remove('hidden');
        }

        function triggerPenguinAnimation(code) {
            penguinSvg.classList.add('typing-clap');

            if (code === 'Enter' || code === 'Space') {
                setPenguinEye('heart');
            } else {
                // 打字快時隨機切換星星眼或瞇眼
                setPenguinEye(Math.random() > 0.5 ? 'happy' : 'star');
            }

            clearTimeout(typingAnimTimeout);
            typingAnimTimeout = setTimeout(() => {
                penguinSvg.classList.remove('typing-clap');
                setPenguinEye('normal');
            }, 320);
        }

        // 對話與點擊互動
        const KAWAII_QUOTES = [
            "咕唧！拍拍手為你加油~ 👏",
            "冰山上的小魚太美味啦！🐟",
            "打字好快！企鵝醬崇拜你~ (★ω★)",
            "累了嗎？喝一口冰涼甜甜奶茶吧 🧋",
            "按下 Enter 鍵，跟我一起跳水！💦"
        ];

        document.getElementById('penguinMascot').addEventListener('click', () => {
            initAudio();
            playKeySound('Enter');
            triggerPenguinAnimation('Enter');
            const quote = KAWAII_QUOTES[Math.floor(Math.random() * KAWAII_QUOTES.length)];
            penguinSpeech.innerHTML = `<span>${quote}</span> 🐧`;
        });

        /* --- 7. 冰晶與愛心粒子特效 --- */
        function spawnParticles(code) {
            const icons = ['🧊', '❄️', '✨', '💖', '🐟', '⭐️'];
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = icons[Math.floor(Math.random() * icons.length)];

            const keyEl = document.querySelector(`[data-code="${code}"]`);
            let x, y;
            if (keyEl) {
                const rect = keyEl.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top;
            } else {
                x = window.innerWidth / 2;
                y = window.innerHeight / 2;
            }

            p.style.left = `${x + (Math.random() * 30 - 15)}px`;
            p.style.top = `${y}px`;

            document.body.appendChild(p);
            setTimeout(() => p.remove(), 850);
        }

        /* --- 8. 飄雪 Canvas 特效 --- */
        const snowCanvas = document.getElementById('snowCanvas');
        const ctx = snowCanvas.getContext('2d');
        let snowflakes = [];

        function resizeSnowCanvas() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSnowCanvas);
        resizeSnowCanvas();

        function createSnow() {
            snowflakes = [];
            for (let i = 0; i < 55; i++) {
                snowflakes.push({
                    x: Math.random() * snowCanvas.width,
                    y: Math.random() * snowCanvas.height,
                    r: Math.random() * 3 + 1,
                    speed: Math.random() * 0.8 + 0.4,
                    wind: Math.random() * 0.4 - 0.2
                });
            }
        }
        createSnow();

        function drawSnow() {
            if (!snowEnabled) {
                ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
                requestAnimationFrame(drawSnow);
                return;
            }

            ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();

            snowflakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);

                f.y += f.speed;
                f.x += f.wind;

                if (f.y > snowCanvas.height) {
                    f.y = -5;
                    f.x = Math.random() * snowCanvas.width;
                }
            });

            ctx.fill();
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        /* --- 9. 打字測驗邏輯 --- */
        const startTestBtn = document.getElementById('startTestBtn');
        const resetTestBtn = document.getElementById('resetTestBtn');
        const sampleText = document.getElementById('sampleText');
        const testTimer = document.getElementById('testTimer');
        const cpmVal = document.getElementById('cpmVal');
        const wpmVal = document.getElementById('wpmVal');
        const accuracyVal = document.getElementById('accuracyVal');
        const fishVal = document.getElementById('fishVal');

        function startTest() {
            isTesting = true;
            timeLeft = 60;
            totalTypedKeys = 0;
            correctTypedKeys = 0;
            typingArea.value = '';
            typingArea.focus();

            currentSampleIndex = (currentSampleIndex + 1) % SAMPLE_TEXTS.length;
            sampleText.innerText = SAMPLE_TEXTS[currentSampleIndex];

            startTestBtn.classList.add('hidden');
            penguinSpeech.innerText = "打字挑戰開始！咕唧加油！🐟";

            clearInterval(testTimerInterval);
            testTimerInterval = setInterval(() => {
                timeLeft--;
                testTimer.innerText = `${timeLeft} 秒`;

                calculateStats();

                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function endTest() {
            isTesting = false;
            clearInterval(testTimerInterval);
            startTestBtn.classList.remove('hidden');

            const finalWpm = parseInt(wpmVal.innerText);
            let title = "萌萌小企鵝 🐧";
            if (finalWpm > 55) {
                title = "極地飛天王者企鵝 👑";
                setPenguinEye('star');
            } else if (finalWpm > 30) {
                title = "溜冰高手企鵝 ⛸️";
                setPenguinEye('happy');
            }

            const earnedFish = Math.floor(finalWpm / 5) + 1;
            fishCount += earnedFish;
            fishVal.innerText = `${fishCount} 🐟`;

            penguinSpeech.innerText = `挑戰成功！榮獲【${title}】！獲得 ${earnedFish} 條小魚！`;
        }

        function checkTestProgress() {
            if (!isTesting) return;

            const target = sampleText.innerText;
            const input = typingArea.value;

            totalTypedKeys = input.length;
            let correct = 0;

            for (let i = 0; i < input.length; i++) {
                if (i < target.length && input[i] === target[i]) {
                    correct++;
                }
            }
            correctTypedKeys = correct;

            calculateStats();

            if (input.length >= target.length) {
                endTest();
            }
        }

        function calculateStats() {
            const timeElapsed = (60 - timeLeft) || 1;
            const cpm = Math.round((correctTypedKeys / timeElapsed) * 60);
            const wpm = Math.round(cpm / 5);
            const accuracy = totalTypedKeys > 0 ? Math.round((correctTypedKeys / totalTypedKeys) * 100) : 100;

            cpmVal.innerText = cpm;
            wpmVal.innerText = wpm;
            accuracyVal.innerText = `${accuracy}%`;
        }

        /* --- 10. 控制項事件綁定 --- */
        document.getElementById('themeSelect').addEventListener('change', (e) => {
            document.body.className = `theme-${e.target.value} relative min-h-screen flex flex-col justify-between p-3 sm:p-6`;
        });

        document.getElementById('soundTypeSelect').addEventListener('change', (e) => {
            soundType = e.target.value;
        });

        document.getElementById('snowToggleBtn').addEventListener('click', () => {
            snowEnabled = !snowEnabled;
            document.getElementById('snowToggleBtn').innerHTML = `<i class="fa-solid fa-snowflake text-sky-200"></i> 雪花: ${snowEnabled ? 'ON' : 'OFF'}`;
        });

        startTestBtn.addEventListener('click', startTest);
        resetTestBtn.addEventListener('click', () => {
            clearInterval(testTimerInterval);
            isTesting = false;
            timeLeft = 60;
            testTimer.innerText = "60 秒";
            cpmVal.innerText = "0";
            wpmVal.innerText = "0";
            accuracyVal.innerText = "100%";
            typingArea.value = '';
            startTestBtn.classList.remove('hidden');
            penguinSpeech.innerText = "準備好了嗎？點擊開始挑戰！";
            setPenguinEye('normal');
        });

        function updateCharCount() {
            document.getElementById('charCount').innerText = `${typingArea.value.length} 個字元`;
        }
        typingArea.addEventListener('input', updateCharCount);

        document.getElementById('clearBtn').addEventListener('click', () => {
            typingArea.value = '';
            updateCharCount();
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            typingArea.select();
            document.execCommand('copy');
            penguinSpeech.innerText = "文字已成功複製到剪貼簿囉！📋";
        });

        // 初始化
        renderKeyboard();
    </script>
</body>
