<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全螢幕玻璃裂痕震碎 - 巨貓襲擊版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f3f8;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 螢幕震動動畫 */
    .screen-shake {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, -3px, 0); }
      20%, 80% { transform: translate3d(5px, 5px, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 3px, 0); }
      40%, 60% { transform: translate3d(7px, -3px, 0); }
    }

    /* 1. 立體質感按鈕 */
    .btn-3d {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 22px 52px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      outline: none;
      user-select: none;
      z-index: 10;

      box-shadow: 
        0px 8px 0px #d64545,
        0px 15px 20px rgba(238, 90, 36, 0.35),
        inset 0px 2px 2px rgba(255, 255, 255, 0.4),
        inset 0px -2px 2px rgba(0, 0, 0, 0.15);

      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-3d span {
      position: relative;
      z-index: 2;
      text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.2);
    }

    .btn-3d::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
      border-radius: 16px 16px 0 0;
      pointer-events: none;
      z-index: 1;
    }

    .btn-3d:hover {
      transform: translateY(-2px);
      box-shadow: 
        0px 10px 0px #d64545,
        0px 20px 25px rgba(238, 90, 36, 0.45),
        inset 0px 2px 2px rgba(255, 255, 255, 0.5),
        inset 0px -2px 2px rgba(0, 0, 0, 0.15);
    }

    .btn-3d:active {
      transform: translateY(6px);
      box-shadow: 
        0px 2px 0px #d64545,
        0px 5px 10px rgba(238, 90, 36, 0.3),
        inset 0px 1px 1px rgba(255, 255, 255, 0.2),
        inset 0px -1px 1px rgba(0, 0, 0, 0.2);
    }

    /* 2. 全螢幕特效容器 */
    .full-glass-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      animation: fadeOut 0.8s forwards 2.6s;
    }

    /* 蛛網裂痕動畫 */
    .crack-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: crackSpread 0.12s ease-out forwards;
    }

    /* 全螢幕碎片崩落 */
    .glass-shard {
      transform-origin: center;
      animation: shardFall 1s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards;
    }

    /* 巨型貓咪登場 */
    .giant-cat {
      transform-origin: 50% 90%;
      transform: translateY(300px) scale(0.3);
      opacity: 0;
      animation: giantCatAttack 1s cubic-bezier(0.175, 0.885, 0.32, 1.2) 0.15s forwards;
    }

    .cat-paw-left {
      transform-origin: 150px 300px;
      animation: scratchLeft 0.2s ease-in-out 0.25s infinite alternate;
    }

    .cat-paw-right {
      transform-origin: 450px 300px;
      animation: scratchRight 0.2s ease-in-out 0.25s infinite alternate;
    }

    @keyframes crackSpread {
      to { stroke-dashoffset: 0; }
    }

    @keyframes shardFall {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.7);
      }
    }

    @keyframes giantCatAttack {
      0% {
        transform: translateY(300px) scale(0.3);
        opacity: 0;
      }
      35% {
        transform: translateY(-30px) scale(1.1);
        opacity: 1;
      }
      70% {
        transform: translateY(0px) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translateY(350px) scale(0.4);
        opacity: 0;
      }
    }

    @keyframes scratchLeft {
      0% { transform: rotate(0deg) translateY(0); }
      100% { transform: rotate(-30deg) translateY(-25px); }
    }

    @keyframes scratchRight {
      0% { transform: rotate(0deg) translateY(0); }
      100% { transform: rotate(30deg) translateY(-25px); }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>
<body>

  <button class="btn-3d" id="attackBtn">
    <span>炸裂螢幕！貓咪襲擊</span>
  </button>

  <script>
    const btn = document.getElementById('attackBtn');

    btn.addEventListener('click', (e) => {
      triggerFullShatter(e);
    });

    function triggerFullShatter(e) {
      document.body.classList.remove('screen-shake');
      void document.body.offsetWidth;
      document.body.classList.add('screen-shake');

      const container = document.createElement('div');
      container.className = 'full-glass-container';

      // 以點擊按鈕的位置為裂痕中心
      const cx = e.clientX || window.innerWidth / 2;
      const cy = e.clientY || window.innerHeight / 2;

      // 1. 生成放射狀蛛網裂痕 SVG 線條
      let crackPaths = '';
      const numRays = 12;
      for (let i = 0; i < numRays; i++) {
        const angle = (i * (360 / numRays) + (Math.random() * 20 - 10)) * (Math.PI / 180);
        const len = Math.max(window.innerWidth, window.innerHeight);
        const ex = cx + Math.cos(angle) * len;
        const ey = cy + Math.sin(angle) * len;

        // 閃電折線效果
        const mx1 = cx + Math.cos(angle) * (len * 0.3) + (Math.random() - 0.5) * 40;
        const my1 = cy + Math.sin(angle) * (len * 0.3) + (Math.random() - 0.5) * 40;
        const mx2 = cx + Math.cos(angle) * (len * 0.6) + (Math.random() - 0.5) * 60;
        const my2 = cy + Math.sin(angle) * (len * 0.6) + (Math.random() - 0.5) * 60;

        crackPaths += `<path class="crack-line" d="M ${cx} ${cy} L ${mx1} ${my1} L ${mx2} ${my2} L ${ex} ${ey}" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.5" fill="none" />`;
      }

      // 環狀蛛網連線
      for (let r = 100; r < 600; r += 120) {
        crackPaths += `<circle class="crack-line" cx="${cx}" cy="${cy}" r="${r}" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-dasharray="15 10" fill="none" />`;
      }

      // 2. 生成全螢幕網格崩落碎片
      let shardsSVG = '';
      const rows = 5;
      const cols = 6;
      const w = 100 / cols;
      const h = 100 / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x1 = c * w;
          const y1 = r * h;
          const x2 = (c + 1) * w;
          const y2 = (r + 1) * h;

          const ox = (Math.random() - 0.5) * 4;
          const oy = (Math.random() - 0.5) * 4;

          const tx = (Math.random() - 0.5) * 400;
          const ty = Math.random() * 350 + 150;
          const rot = (Math.random() - 0.5) * 180;

          shardsSVG += `
            <polygon class="glass-shard" 
                     points="${x1}%,${y1}% ${x2+ox}%,${y1+oy}% ${x2}%,${y2}% ${x1-ox}%,${y2-oy}%" 
                     fill="rgba(255, 255, 255, 0.35)" 
                     stroke="rgba(255, 255, 255, 0.8)" 
                     stroke-width="1.5"
                     style="--tx: ${tx}px; --ty: ${ty}px; --rot: ${rot}deg;" />
          `;
        }
      }

      container.innerHTML = `
        <svg width="100%" height="100%">
          <!-- 黑色深淵破口底色 -->
          <rect width="100%" height="100%" fill="rgba(13, 17, 23, 0.7)" />

          <!-- 巨型貓咪 -->
          <g class="giant-cat">
            <g transform="translate(${window.innerWidth / 2 - 300}, ${window.innerHeight / 2 - 250})">
              <polygon points="150,150 70,20 230,90" fill="#ffa726" />
              <polygon points="140,140 85,45 200,90" fill="#ff7043" />
              <polygon points="450,150 530,20 370,90" fill="#ffa726" />
              <polygon points="460,140 515,45 400,90" fill="#ff7043" />

              <ellipse cx="300" cy="220" rx="180" ry="140" fill="#ffa726" />
              <path d="M 160 300 C 160 440, 440 440, 440 300 Z" fill="#ffa726" />

              <ellipse cx="230" cy="200" rx="24" ry="32" fill="#2d3436" />
              <ellipse cx="370" cy="200" rx="24" ry="32" fill="#2d3436" />
              <circle cx="238" cy="190" r="10" fill="#ffffff" />
              <circle cx="378" cy="190" r="10" fill="#ffffff" />
              <polygon points="300,230 280,255 320,255" fill="#ff7043" />
              
              <path d="M 180 230 L 60 210 M 180 245 L 70 260 M 420 230 L 540 210 M 420 245 L 530 260" stroke="#2d3436" stroke-width="6" stroke-linecap="round" />

              <g class="cat-paw-left">
                <rect x="110" y="280" width="80" height="120" rx="40" fill="#ffa726" />
                <circle cx="150" cy="380" r="40" fill="#ffffff" />
                <circle cx="150" cy="385" r="20" fill="#ff7043" />
              </g>
              <g class="cat-paw-right">
                <rect x="410" y="280" width="80" height="120" rx="40" fill="#ffa726" />
                <circle cx="450" cy="380" r="40" fill="#ffffff" />
                <circle cx="450" cy="385" r="20" fill="#ff7043" />
              </g>
            </g>
          </g>

          <!-- 全螢幕閃電蛛網裂痕 -->
          <g>
            ${crackPaths}
          </g>

          <!-- 崩落飛散玻璃碎片 -->
          <g>
            ${shardsSVG}
          </g>
        </svg>
      `;

      document.body.appendChild(container);

      setTimeout(() => {
        container.remove();
      }, 3400);
    }
  </script>

</body>
</html>
