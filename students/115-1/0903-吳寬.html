<!DOCTYPE html>
<html>
<head>
    <title>按一下新增標題</title>
    <style>
        @keyframes colorChange {
            0% {
                background-color: #4A0000; /* 超深紅 */
            }
            50% {
                background-color: #FF0000; /* 鮮紅 */
            }
            100% {
                background-color: #4A0000; /* 變回超深紅 */
            }
        }

        body {
            /* 調整為 8 秒完成一次循環，並設定 infinite 無限重複 */
            animation: colorChange 8s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <h1>按一下新增內容</h1>
    <p>??</p>
</body>
</html>
