<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>超可愛哭哭柴犬</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fff9f0;
      overflow: hidden;
      cursor: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .ui-container {
      margin-bottom: 25px;
      text-align: center;
    }

    .game-title {
      color: #795548;
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 12px 0;
    }

    .hp-bar-bg {
      width: 260px;
      height: 18px;
      background-color: #e0d0c0;
      border-radius: 9px;
      overflow: hidden;
      margin: 0 auto;
    }
    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #ff9800;
      transition: width 0.1s ease-out;
    }
    .hp-text {
      color: #8d6e63;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }

    .btn-wrapper {
      position: relative;
    }

    /* 可愛圓滾滾柴犬頭部 */
    .shiba-btn {
      width: 220px;
      height: 200px;
      background-color: #ffa726;
      border-radius: 50% 50% 45% 45%;
      border: 5px solid #fb8c00;
      outline: none;
      cursor: none;
      position: relative;
      transition: transform 0.08s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }

    /* 圓潤的短耳朵 */
    .ear {
      position: absolute;
      top: -12px;
      width: 50px;
      height: 50px;
      background-color: #ffa726;
      border: 5px solid #fb8c00;
      border-radius: 10px 40px 0 0;
    }
    .ear.left {
      left: 15px;
      transform: rotate(-15deg);
    }
    .ear.right {
      right: 15px;
      transform: rotate(15deg) scaleX(-1);
    }

    .ear-inner {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      background-color: #ffcc80;
      border-radius: 5px 20px 0 0;
    }

    /* 腮幫子白包子臉 */
    .face-white {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 110px;
      background-color: #ffffff;
      border-radius: 60px 60px 45% 45%;
    }

    /* 豆豆眉毛 */
    .eyebrow {
      position: absolute;
      top: 45px;
      width: 26px;
      height: 20px;
      background-color: #ffffff;
      border-radius: 50%;
    }
    .eyebrow.left { left: 45px; }
    .eyebrow.right { right: 45px; }

    /* 粉嫩腮紅 */
    .blush {
      position: absolute;
      top: 95px;
      width: 24px;
      height: 14px;
      background-color: #ffab91;
      border-radius: 50%;
      opacity: 0.6;
    }
    .blush.left { left: 25px; }
    .blush.right { right: 25px; }

    /* 水汪汪大眼睛 */
    .eye {
      position: absolute;
      top: 72px;
      width: 22px;
      height: 26px;
      background-color: #3e2723;
      border-radius: 50%;
      z-index: 2;
    }
    .eye.left { left: 52px; }
    .eye.right { right: 52px; }

    /* 眼中光澤 */
    .eye::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    /* 鼻子與嘴巴 */
    .nose {
      position: absolute;
      top: 100px;
      width: 20px;
      height: 14px;
      background-color: #3e2723;
      border-radius: 40% 40% 50% 50%;
      z-index: 2;
    }

    .mouth {
      position: absolute;
      top: 112px;
      width: 26px;
      height: 10px;
      border-bottom: 3px solid #3e2723;
      border-radius: 0 0 13px 13px;
      z-index: 2;
    }

    /* 眼淚（預設隱藏） */
    .tear {
      position: absolute;
      top: 92px;
      width: 10px;
      height: 14px;
      background-color: #4fc3f7;
      border-radius: 50% 50% 50% 50% / 80% 80% 30% 30%;
      opacity: 0;
      z-index: 3;
      transition: opacity 0.1s;
    }
    .tear.left { left: 45px; }
    .tear.right { right: 45px; }

    /* --- 被打時的哭哭樣貌 --- */
    .shiba-btn.crying .eye {
      height: 6px;
      top: 80px;
      background-color: #3e2723;
      border-radius: 3px;
    }
    .shiba-btn.crying .eye::after {
      display: none;
    }
    .shiba-btn.crying .mouth {
      width: 18px;
      height: 12px;
      border: none;
      background-color: #3e2723;
      border-radius: 50%;
      top: 114px;
    }
    .shiba-btn.crying .tear {
      opacity: 1;
      animation: dropTear 0.3s infinite ease-in;
    }

    @keyframes dropTear {
      0% { transform: translateY(0); }
      100% { transform: translateY(12px); opacity: 0; }
    }

    .shiba-btn.hit {
      transform: scale(0.9) translateY(10px);
    }

    .dmg-num {
      position: absolute;
      font-weight: 800;
      font-size: 26px;
      color: #ff7043;
      pointer-events: none;
      animation: floatUp 0.4s ease-out forwards;
      z-index: 999;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-35px); }
    }

    /* 可愛小木槌 */
    #hammer {
      position: fixed;
      top: 0;
      left: 0;
      width: 90px;
      height: 90px;
      pointer-events: none;
      z-index: 9999;
      transform-origin: 80% 80%;
      transition: transform 0.04s ease-out;
    }

    #hammer.swung {
      transform: rotate(-55deg) translateY(8px) !important;
    }
  </style>
</head>
<body>

  <div class="ui-container">
    <h1 class="game-title">不要打柴柴 Q_Q</h1>
    <div class="hp-bar-bg">
      <div class="hp-bar-fill" id="hp-fill"></div>
    </div>
    <div class="hp-text" id="hp-text">HP: 100 / 100</div>
  </div>

  <div class="btn-wrapper" id="wrapper">
    <button class="shiba-btn" id="btn">
      <div class="ear left"><div class="ear-inner"></div></div>
      <div class="ear right"><div class="ear-inner"></div></div>
      <div class="face-white"></div>
      <div class="eyebrow left"></div>
      <div class="eyebrow right"></div>
      <div class="blush left"></div>
      <div class="blush right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="tear left"></div>
      <div class="tear right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </button>
  </div>

  <svg id="hammer" viewBox="0 0 100 100">
    <rect x="42" y="35" width="14" height="50" rx="4" fill="#a1887f"/>
    <rect x="12" y="16" width="76" height="24" rx="6" fill="#8d6e63"/>
  </svg>

  <script>
    const hammer = document.getElementById('hammer');
    const btn = document.getElementById('btn');
    const wrapper = document.getElementById('wrapper');
    const hpFill = document.getElementById('hp-fill');
    const hpText = document.getElementById('hp-text');

    let maxHp = 100;
    let currentHp = 100;
    let resetTimer = null;

    window.addEventListener('mousemove', (e) => {
      hammer.style.left = `${e.clientX - 65}px`;
      hammer.style.top = `${e.clientY - 55}px`;
    });

    window.addEventListener('mousedown', () => hammer.classList.add('swung'));
    window.addEventListener('mouseup', () => hammer.classList.remove('swung'));

    btn.addEventListener('mousedown', () => {
      btn.classList.add('hit', 'crying');
    });

    btn.addEventListener('mouseup', () => {
      btn.classList.remove('hit');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        btn.classList.remove('crying');
      }, 400);
    });

    btn.addEventListener('click', (e) => {
      const damage = 10;
      currentHp = Math.max(0, currentHp - damage);

      createDmgText(e, damage);

      const percentage = (currentHp / maxHp) * 100;
      hpFill.style.width = `${percentage}%`;
      hpText.innerText = `HP: ${currentHp} / ${maxHp}`;

      if (currentHp === 0) {
        hpText.innerText = "柴柴哭哭秀秀中...";
        setTimeout(() => {
          currentHp = maxHp;
          hpFill.style.width = '100%';
          hpText.innerText = `HP: ${currentHp} / ${maxHp}`;
        }, 600);
      }
    });

    function createDmgText(e, dmg) {
      const rect = wrapper.getBoundingClientRect();
      const num = document.createElement('div');
      num.className = 'dmg-num';
      num.innerText = `-${dmg}`;
      num.style.left = `${e.clientX - rect.left - 10}px`;
      num.style.top = `${e.clientY - rect.top - 30}px`;
      
      wrapper.appendChild(num);
      setTimeout(() => num.remove(), 400);
    }
  </script>
</body>
</html>
