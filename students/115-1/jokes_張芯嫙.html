<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵星人冷笑話與遊戲樂園 🐾</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for winning celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Zen Maru Gothic -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cat-pink': '#FFB7C5',
                        'cat-soft-pink': '#FFF0F5',
                        'cat-dark-pink': '#FF69B4',
                        'cat-orange': '#FFB347',
                        'cat-cream': '#FFFDD0',
                        'cat-brown': '#5C4033',
                    },
                    fontFamily: {
                        sans: ['Zen Maru Gothic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF0F5;
            background-image: radial-gradient(#FFB7C5 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            touch-action: manipulation;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23FF69B4'><path d='M12 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-9 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-4 3c-3.5 0-6 2.5-6 5.5 0 2.5 2.5 4.5 6 4.5s6-2 6-4.5c0-3-2.5-5.5-6-5.5z'/></svg>"), auto;
        }

        /* 貓耳朵裝飾 */
        .cat-ears {
            position: relative;
        }
        .cat-ears::before, .cat-ears::after {
            content: '';
            position: absolute;
            top: -24px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #FFB7C5;
            z-index: 0;
        }
        .cat-ears::before { left: 30px; transform: rotate(-15deg); }
        .cat-ears::after { right: 30px; transform: rotate(15deg); }

        /* 按鈕爪子動畫 */
        .btn-paw {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .btn-paw:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
        }
        .btn-paw:active {
            transform: translateY(2px) scale(0.98);
        }

        /* 喵喵晃動動畫 */
        @keyframes catWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }
        .wiggle {
            animation: catWiggle 1.5s infinite ease-in-out;
        }

        /* Pop In 動畫 */
        .pop-in {
            animation: popIn 0.3s ease-out forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 記憶卡片翻轉效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF0F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB7C5;
            border-radius: 4px;
        }

        /* Particle Trail */
        .paw-particle {
            position: fixed;
            pointer-events: none;
            font-size: 14px;
            animation: fadeOutPaw 0.8s ease-out forwards;
            z-index: 9999;
        }
        @keyframes fadeOutPaw {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.3) translateY(-20px); }
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>

    <!-- Pure Web Audio API Synthesizer (BGM + Sound Effects) -->
    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;
        let musicEnabled = false;
        let bgmTimer = null;
        let bgmNoteIndex = 0;

        // BGM Melodic loop notes (Hz frequencies)
        const bgmNotes = [
            523.25, 659.25, 783.99, 659.25, 523.25, 659.25, 783.99, 880.00,
            698.46, 880.00, 1046.50, 880.00, 587.33, 698.46, 880.00, 698.46
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            const icon = document.getElementById('icon-sound');
            if (soundEnabled) {
                btn.classList.replace('text-gray-400', 'text-cat-dark-pink');
                icon.className = 'fa-solid fa-volume-high';
                playSound('meow');
            } else {
                btn.classList.replace('text-cat-dark-pink', 'text-gray-400');
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        function toggleMusic() {
            initAudio();
            musicEnabled = !musicEnabled;
            const btn = document.getElementById('btn-music');
            const icon = document.getElementById('icon-music');

            if (musicEnabled) {
                btn.classList.add('bg-cat-pink', 'text-white');
                btn.classList.remove('bg-white', 'text-cat-dark-pink');
                startBGM();
            } else {
                btn.classList.remove('bg-cat-pink', 'text-white');
                btn.classList.add('bg-white', 'text-cat-dark-pink');
                stopBGM();
            }
        }

        function startBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
            bgmNoteIndex = 0;
            bgmTimer = setInterval(() => {
                if (!musicEnabled || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(bgmNotes[bgmNoteIndex], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.22);

                    bgmNoteIndex = (bgmNoteIndex + 1) % bgmNotes.length;
                } catch(e) {}
            }, 250);
        }

        function stopBGM() {
            if (bgmTimer) clearInterval(bgmTimer);
            bgmTimer = null;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();

            try {
                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);

                } else if (type === 'meow') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.linearRampToValueAtTime(750, now + 0.12);
                    osc.frequency.linearRampToValueAtTime(450, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);

                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);

                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.2);
                    });

                } else if (type === 'eat') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(800, now + 0.05);
                    osc.frequency.setValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        function triggerPawParticle(e) {
            const paw = document.createElement('div');
            paw.className = 'paw-particle';
            paw.innerText = '🐾';
            paw.style.left = `${e.clientX - 8}px`;
            paw.style.top = `${e.clientY - 8}px`;
            document.body.appendChild(paw);
            setTimeout(() => paw.remove(), 800);
        }
    </script>

    <!-- Complete 100 Cold Jokes Data & Interface Logic -->
    <script>
        const jokes = [
            { id: 1, q: "有一壇酒埋在地下過了一千年，結果他變成了什麼？", a: "酒精。" },
            { id: 2, q: "有一只豬，它走啊走啊，走到了英國，結果他變成了什麼？", a: "Pig。" },

            { id: 4, q: "蝴蝶，螞蟻，蜘蛛，蜈蚣，他們一起工作，最後哪一個沒有領到酬勞？", a: "蜈蚣，因為無功不受祿。" },
            { id: 5, q: "動物園裏大象的鼻子最長，那第二長的是誰呢？", a: "小象。" },
            { id: 6, q: "哪種水果視力最差？", a: "芒果。" },
            { id: 7, q: "哪兩種蔬菜有手機？", a: "蘿蔔青菜，各有索愛。" },

                    titleEl.innerText = "🍤 餵貓咪吃點心";
                    statsEl.innerHTML = `<span>親密度: <b id="game-score">0</b>%</span>`;
                    arena.innerHTML = `<div class="text-center text-cat-brown"><p class="font-bold text-base md:text-lg mb-2">看清喵喵想吃的點心！</p><p class="text-xs text-cat-brown/70">選擇正確的食物餵牠，提升 100% 親密度！</p></div>`;
                    break;
                case 5:
                    titleEl.innerText = "🥫 貓咪接罐頭";
                    statsEl.innerHTML = `<span>時間: <b id="game-time">30</b>s</span> <span>得分: <b id="game-score">0</b></span>`;
                    arena.innerHTML = `<div class="text-center text-cat-brown"><p class="font-bold text-base md:text-lg mb-2">左右移動托盤接住罐頭！</p><p class="text-xs text-cat-brown/70">罐頭/魚 +10，炸彈辣椒 🌶️ 扣分！</p></div>`;
                    break;
            }
        }

        function clearCurrentGame() {
            if (gameTimer) clearInterval(gameTimer);
            if (gameInterval) clearInterval(gameInterval);
            gameTimer = null;
            gameInterval = null;
            isGameRunning = false;
        }

        function startGame() {
            if (currentGameId === 0) {
                alert("請先選擇一款小遊戲喵！");
                return;
            }
            playSound('meow');
            clearCurrentGame();
            isGameRunning = true;
            gameScore = 0;

            switch(currentGameId) {
                case 1: initFishGame(); break;
                case 2: initMoleGame(); break;
                case 3: initMemoryGame(); break;
                case 4: initFeedGame(); break;
                case 5: initCatchGame(); break;
            }
        }

        function resetGame() {
            if (currentGameId === 0) return;
            startGame();
        }

        function finishGame(customMsg = null) {
            isGameRunning = false;
            clearCurrentGame();
            playSound('win');
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            }

            const arena = document.getElementById('game-arena');
            const msg = customMsg || `遊戲結束喵！🎉\n你的最終得分：${gameScore} 分！`;
            arena.innerHTML = `
                <div class="text-center p-6 bg-white/90 rounded-2xl shadow-lg border-2 border-cat-pink pop-in">
                    <i class="fa-solid fa-trophy text-4xl text-cat-orange mb-2 block wiggle"></i>
                    <h3 class="text-xl font-black text-cat-dark-pink mb-2">恭喜完成！</h3>
                    <p class="text-cat-brown font-bold whitespace-pre-line mb-4">${msg}</p>
                    <button onclick="startGame()" class="btn-paw bg-cat-orange text-white font-bold py-2 px-6 rounded-xl shadow">再玩一次 🐾</button>
                </div>
            `;
        }

        /* GAME 1: 貓咪抓魚 */
        function initFishGame() {
            gameTimeLeft = 30;
            gameScore = 0;
            const arena = document.getElementById('game-arena');
            arena.innerHTML = `<div id="fish-pool" class="relative w-full h-full cursor-crosshair"></div>`;
            const pool = document.getElementById('fish-pool');

            document.getElementById('game-score').innerText = "0";
            document.getElementById('game-time').innerText = "30";

            gameInterval = setInterval(() => {
                if (!isGameRunning) return;
                spawnFish(pool);
            }, 600);

            gameTimer = setInterval(() => {
                gameTimeLeft--;
                document.getElementById('game-time').innerText = gameTimeLeft;
                if (gameTimeLeft <= 0) finishGame();
            }, 1000);
        }

        function spawnFish(pool) {
            if (pool.children.length > 8) return;
            const fish = document.createElement('div');
            const isGolden = Math.random() < 0.2;
            const fishType = isGolden ? '🌟 🐠' : '🐟';
            const pts = isGolden ? 30 : 10;

            fish.className = 'absolute text-2xl md:text-3xl select-none transition-all duration-300 pop-in';
            fish.innerHTML = fishType;
            
            const startY = Math.random() * (pool.clientHeight - 40);
            const isLeft = Math.random() < 0.5;
            let posX = isLeft ? -40 : pool.clientWidth + 10;
            const speed = (Math.random() * 2 + 1.5) * (isLeft ? 1 : -1);

            fish.style.top = `${startY}px`;
            fish.style.left = `${posX}px`;
            if (!isLeft) fish.style.transform = 'scaleX(-1)';

            let moveInt = setInterval(() => {
                if (!isGameRunning) { clearInterval(moveInt); return; }
                posX += speed;
                fish.style.left = `${posX}px`;

                if (posX < -60 || posX > pool.clientWidth + 60) {
                    clearInterval(moveInt);
                    fish.remove();
                }
            }, 30);

            fish.onclick = (e) => {
                e.stopPropagation();
                playSound(isGolden ? 'win' : 'pop');
                gameScore += pts;
                document.getElementById('game-score').innerText = gameScore;

                const hit = document.createElement('span');
                hit.className = 'absolute text-xs font-black text-cat-dark-pink animate-bounce';
                hit.innerText = `+${pts}`;
                hit.style.left = `${fish.offsetLeft}px`;
                hit.style.top = `${fish.offsetTop}px`;
                pool.appendChild(hit);
                setTimeout(() => hit.remove(), 600);

                clearInterval(moveInt);
                fish.remove();
            };

            pool.appendChild(fish);
        }

        /* GAME 2: 打地鼠貓咪版 */
        function initMoleGame() {
            gameTimeLeft = 30;
            gameScore = 0;
            const arena = document.getElementById('game-arena');
            arena.innerHTML = `
                <div class="grid grid-cols-3 gap-3 md:gap-4 p-4 w-full max-w-sm mx-auto h-full items-center">
                    ${[0,1,2,3,4,5,6,7,8].map(i => `
                        <div class="relative bg-cat-pink/40 border-2 border-cat-pink rounded-2xl h-20 md:h-22 flex items-center justify-center overflow-hidden">
                            <div id="hole-${i}" class="text-3xl md:text-4xl cursor-pointer select-none transition-transform duration-200 transform translate-y-16">
                                🐭
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('game-score').innerText = "0";
            document.getElementById('game-time').innerText = "30";

            let activeHole = -1;
            let currentType = 'mouse';

            gameInterval = setInterval(() => {
                if (!isGameRunning) return;
                if (activeHole >= 0) {
                    const prev = document.getElementById(`hole-${activeHole}`);
                    if (prev) prev.classList.add('translate-y-16');
                }

                activeHole = Math.floor(Math.random() * 9);
                currentType = Math.random() < 0.25 ? 'cat' : 'mouse';
                
                const el = document.getElementById(`hole-${activeHole}`);
                if (el) {
                    el.innerText = currentType === 'cat' ? '🐱' : '🐭';
                    el.classList.remove('translate-y-16');
                    
                    el.onclick = () => {
                        if (!el.classList.contains('translate-y-16')) {
                            if (currentType === 'mouse') {
                                playSound('pop');
                                gameScore += 10;
                            } else {
                                playSound('wrong');
                                gameScore = Math.max(0, gameScore - 15);
                            }
                            document.getElementById('game-score').innerText = gameScore;
                            el.classList.add('translate-y-16');
                        }
                    };
                }
            }, 750);

            gameTimer = setInterval(() => {
                gameTimeLeft--;
                document.getElementById('game-time').innerText = gameTimeLeft;
                if (gameTimeLeft <= 0) finishGame();
            }, 1000);
        }

        /* GAME 3: 貓咪記憶對對碰 */
        function initMemoryGame() {
            const icons = ['🥫', '🐟', '🌿', '🦴', '🐾', '🧶'];
            const cardsData = [...icons, ...icons].sort(() => Math.random() - 0.5);
            
            let moves = 0;
            let matchedPairs = 0;
            let flippedCards = [];

            const arena = document.getElementById('game-arena');
            arena.innerHTML = `
                <div class="grid grid-cols-4 gap-2 md:gap-3 p-3 w-full max-w-sm mx-auto h-full items-center perspective-1000">
                    ${cardsData.map((icon, idx) => `
                        <div class="memory-card relative h-16 md:h-20 rounded-xl cursor-pointer transform-style-3d transition-transform duration-300" data-index="${idx}" data-icon="${icon}">
                            <div class="absolute inset-0 bg-cat-pink border-2 border-white rounded-xl flex items-center justify-center text-xl text-white font-black shadow backface-hidden">
                                🐾
                            </div>
                            <div class="absolute inset-0 bg-white border-2 border-cat-pink rounded-xl flex items-center justify-center text-2xl md:text-3xl backface-hidden rotate-y-180 shadow">
                                ${icon}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('game-moves').innerText = "0";
            document.getElementById('game-pairs').innerText = "0/6";

            const cardElements = arena.querySelectorAll('.memory-card');
            cardElements.forEach(card => {
                card.onclick = () => {
                    if (!isGameRunning || flippedCards.length >= 2 || card.classList.contains('rotate-y-180') || card.classList.contains('matched')) return;

                    playSound('pop');
                    card.classList.add('rotate-y-180');
                    flippedCards.push(card);

                    if (flippedCards.length === 2) {
                        moves++;
                        document.getElementById('game-moves').innerText = moves;
                        const [c1, c2] = flippedCards;

                        if (c1.dataset.icon === c2.dataset.icon) {
                            playSound('meow');
                            c1.classList.add('matched');
                            c2.classList.add('matched');
                            flippedCards = [];
                            matchedPairs++;
                            document.getElementById('game-pairs').innerText = `${matchedPairs}/6`;

                            if (matchedPairs === 6) {
                                gameScore = Math.max(10, 100 - moves * 5);
                                setTimeout(() => finishGame(`翻牌完成喵！🌟\n總步數：${moves} 步`), 500);
                            }
                        } else {
                            setTimeout(() => {
                                playSound('wrong');
                                c1.classList.remove('rotate-y-180');
                                c2.classList.remove('rotate-y-180');
                                flippedCards = [];
                            }, 800);
                        }
                    }
                };
            });
        }

        /* GAME 4: 餵貓咪吃點心 */
        function initFeedGame() {
            gameScore = 0;
            const foods = [
                { name: '鮮魚', icon: '🐟' },
                { name: '貓罐頭', icon: '🥫' },
                { name: '牛奶', icon: '🥛' },
                { name: '大蝦', icon: '🍤' },
                { name: '肉乾', icon: '🥩' }
            ];

            const arena = document.getElementById('game-arena');
            document.getElementById('game-score').innerText = "0";

            function nextRound() {
                if (!isGameRunning) return;
                const target = foods[Math.floor(Math.random() * foods.length)];
                
                arena.innerHTML = `
                    <div class="flex flex-col items-center justify-between h-full p-4 w-full">
                        <div class="relative flex flex-col items-center">
                            <div class="bg-white px-4 py-2 rounded-2xl border-2 border-cat-pink font-black text-cat-dark-pink shadow-md mb-2 animate-bounce">
                                我想吃：${target.icon} ${target.name} 喵！
                            </div>
                            <div class="text-6xl wiggle">🐱</div>
                        </div>

                        <div class="grid grid-cols-5 gap-2 w-full max-w-md mt-2">
                            ${foods.map(f => `
                                <button onclick="feedCat('${f.name}', '${target.name}')" class="btn-paw bg-white border-2 border-cat-pink p-2 rounded-2xl flex flex-col items-center text-center shadow">
                                    <span class="text-2xl md:text-3xl">${f.icon}</span>
                                    <span class="text-[10px] font-bold text-cat-brown mt-1">${f.name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            window.feedCat = (chosen, target) => {
                if (!isGameRunning) return;
                if (chosen === target) {
                    playSound('eat');
                    gameScore += 20;
                    document.getElementById('game-score').innerText = gameScore;
                    if (gameScore >= 100) {
                        finishGame("太棒了！親密度已滿 100%！\n貓咪主子非常滿意喵～ ✨");
                    } else {
                        nextRound();
                    }
                } else {
                    playSound('wrong');
                    gameScore = Math.max(0, gameScore - 10);
                    document.getElementById('game-score').innerText = gameScore;
                    nextRound();
                }
            };

            nextRound();
        }

        /* GAME 5: 貓咪接罐頭 */
        function initCatchGame() {
            gameTimeLeft = 30;
            gameScore = 0;

            const arena = document.getElementById('game-arena');
            arena.innerHTML = `<canvas id="catch-canvas" class="w-full h-full bg-cat-soft-pink rounded-2xl"></canvas>`;
            const canvas = document.getElementById('catch-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = arena.clientWidth;
            canvas.height = arena.clientHeight;

            document.getElementById('game-score').innerText = "0";
            document.getElementById('game-time').innerText = "30";

            let basketX = canvas.width / 2 - 30;
            const basketWidth = 60;
            const basketHeight = 25;

            let items = [];

            function moveBasket(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                basketX = clientX - rect.left - basketWidth / 2;
                if (basketX < 0) basketX = 0;
                if (basketX > canvas.width - basketWidth) basketX = canvas.width - basketWidth;
            }

            canvas.addEventListener('mousemove', moveBasket);
            canvas.addEventListener('touchmove', moveBasket);

            gameInterval = setInterval(() => {
                if (!isGameRunning) return;
                const types = [
                    { icon: '🥫', pts: 10 },
                    { icon: '🐟', pts: 10 },
                    { icon: '🍤', pts: 15 },
                    { icon: '🌶️', pts: -15 },
                    { icon: '🦴', pts: -10 }
                ];
                const item = types[Math.floor(Math.random() * types.length)];
                items.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: -20,
                    speed: Math.random() * 2 + 2,
                    ...item
                });
            }, 500);

            gameTimer = setInterval(() => {
                gameTimeLeft--;
                document.getElementById('game-time').innerText = gameTimeLeft;
                if (gameTimeLeft <= 0) finishGame();
            }, 1000);

            function loop() {
                if (!isGameRunning) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFB7C5';
                ctx.beginPath();
                ctx.roundRect(basketX, canvas.height - basketHeight - 10, basketWidth, basketHeight, 12);
                ctx.fill();
                ctx.fillStyle = '#5C4033';
                ctx.font = '14px Zen Maru Gothic';
                ctx.textAlign = 'center';
                ctx.fillText('🐱 Basket', basketX + basketWidth/2, canvas.height - 18);

                for (let i = items.length - 1; i >= 0; i--) {
                    const it = items[i];
                    it.y += it.speed;

                    ctx.font = '22px serif';
                    ctx.fillText(it.icon, it.x, it.y);

                    if (it.y >= canvas.height - basketHeight - 20 && it.y <= canvas.height - 10) {
                        if (it.x >= basketX - 10 && it.x <= basketX + basketWidth + 10) {
                            if (it.pts > 0) playSound('pop');
                            else playSound('wrong');

                            gameScore = Math.max(0, gameScore + it.pts);
                            document.getElementById('game-score').innerText = gameScore;
                            items.splice(i, 1);
                            continue;
                        }
                    }

                    if (it.y > canvas.height + 20) {
                        items.splice(i, 1);
                    }
                }

                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
