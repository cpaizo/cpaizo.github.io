<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115-1 學生氣泡排序法作品藝廊</title>
  <style>
    :root {
      --primary: #00A8FF;
      --primary-dark: #0097E6;
      --accent: #FF9F43;
      --bg: #E8F7FF;
      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #636E72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "微軟正黑體";
      background-color: var(--bg);
      color: var(--text-main);
      padding: 30px 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 168, 255, 0.12);
      border-bottom: 5px solid var(--primary);
    }

    h1 {
      color: var(--primary-dark);
      font-size: 28px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      background: #E1F5FE;
      color: var(--primary-dark);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .student-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .student-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #00C6FF, #0072FF);
    }

    .student-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0, 168, 255, 0.2);
      border-color: #80DEEA;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      background: #E0F7FA;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .student-info {
      display: flex;
      flex-direction: column;
    }

    .student-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-main);
    }

    .project-tag {
      font-size: 12px;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 0;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: background 0.2s ease;
      font-size: 14px;
    }

    .btn-link:hover {
      background: var(--primary-dark);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
