<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 槍戰新春賀卡 2026 - 勝者為王</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Noto Sans TC', sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: crosshair;
        }

        /* 瞄準線十字架 (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 204, 0.8);
            box-shadow: 0 0 8px #00ffcc;
        }
        #crosshair::before { width: 2px; height: 24px; }
        #crosshair::after { width: 24px; height: 2px; }
        .crosshair-dot {
            width: 4px;
            height: 4px;
            background: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff0055;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 標題與風格抬頭顯示 (HUD) */
        .header-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .title-box {
            background: rgba(10, 15, 30, 0.75);
            border: 2px solid #ffcc00;
            border-left: 6px solid #ff0055;
            padding: 16px 28px;
            border-radius: 8px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3), inset 0 0 15px rgba(255, 0, 85, 0.2);
            transform: skew(-5deg);
        }
        .title-box h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffe600, #ff0055, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,230,0,0.5);
        }
        .title-box p {
            font-size: 0.95rem;
            color: #00ffcc;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 700;
        }

        /* 連擊擊殺計數器 (Combo HUD) */
        .combo-box {
            background: rgba(15, 5, 25, 0.8);
            border: 2px solid #00f0ff;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: skew(5deg);
        }
        .combo-count {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
        }
        .combo-label {
            font-size: 0.85rem;
            color: #ff0055;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 浮動祝賀特效彈字幕 */
        .floating-blessing {
            position: absolute;
            font-weight: 900;
            font-size: 2rem;
            color: #fff700;
            text-shadow: 0 0 12px #ff0055, 2px 2px 0px #000;
            pointer-events: none;
            z-index: 20;
            animation: floatUp 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) FORWARD;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(-5deg); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.3) rotate(3deg); }
            100% { opacity: 0; transform: translate(-50%, -90px) scale(1) rotate(0deg); }
        }

        /* 祝賀賀詞卡與控制面板 */
        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
        }

        .card-preview {
            background: rgba(12, 12, 24, 0.85);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 12px;
            padding: 20px;
            max-width: 420px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,215,0,0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #ffcc00;
            font-size: 1.1rem;
        }
        .card-body {
            font-size: 1rem;
            line-height: 1.6;
            color: #e0e0ff;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #00f0ff;
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cyber-btn {
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
            border: none;
            color: #fff;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: skew(-8deg);
        }
        .cyber-btn:hover {
            transform: skew(-8deg) scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
            background: linear-gradient(135deg, #ff2a75 0%, #ff7700 100%);
        }
        .cyber-btn:active {
            transform: skew(-8deg) scale(0.98);
        }
        .cyber-btn.gold {
            background: linear-gradient(135deg, #ffaa00 0%, #e67e22 100%);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
        }
        .cyber-btn.gold:hover {
            background: linear-gradient(135deg, #ffc400 0%, #f39c12 100%);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.8);
        }
        .cyber-btn.cyan {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }
        .cyber-btn.cyan:hover {
            background: linear-gradient(135deg, #00d2ff 0%, #00a8e8 100%);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
        }

        /* Modal 彈窗 */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #0f1220;
            border: 2px solid #ff0055;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.5);
        }
        .modal-content h2 {
            color: #ffcc00;
            margin-bottom: 16px;
            font-size: 1.5rem;
        }
        .modal-content textarea {
            width: 100%;
            height: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #00f0ff;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 1rem;
            margin-bottom: 16px;
            resize: none;
        }
        .preset-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tag {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tag:hover {
            background: #ff0055;
            border-color: #ff0055;
        }

        /* 響應式微調 */
        @media (max-width: 768px) {
            .ui-layer { padding: 12px; }
            .title-box h1 { font-size: 1.5rem; }
            .controls-bottom { flex-direction: column; align-items: stretch; gap: 12px; }
            .card-preview { max-width: 100%; }
            .btn-group { flex-direction: row; flex-wrap: wrap; }
            .cyber-btn { flex: 1; min-width: 130px; padding: 10px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"><div class="crosshair-dot"></div></div>

    <div class="ui-layer">
        <!-- 頂部抬頭顯示器 HUD -->
        <div class="header-hud">
            <div class="title-box">
                <h1>新春大吉 · 勝者為王</h1>
                <p><i class="fa-solid fa-crosshairs"></i> ROBLOX 競技王者 · 2026 太空賀歲卡</p>
            </div>
            <div class="combo-box">
                <div class="combo-count" id="comboCount">00</div>
                <div class="combo-label">連連大吉 COMBO</div>
            </div>
        </div>

        <!-- 底部控制面板與賀詞卡 -->
        <div class="controls-bottom">
            <div class="card-preview interactive">
                <div class="card-header">
                    <i class="fa-solid fa-award"></i>
                    <strong>2026 新春特別祝福</strong>
                    <i class="fa-solid fa-pen interactive" id="openModalBtn" style="margin-left: auto; cursor: pointer; color: #00f0ff;" title="修改賀詞"></i>
                </div>
                <div class="card-body" id="cardTextDisplay">
                    祝你在新的一年裡：槍法神準連戰連勝，開箱大吉金幣滿滿！新春快樂，吉祥如意！
                </div>
            </div>

            <div class="btn-group interactive">
                <button class="cyber-btn" id="fireworksBtn">
                    <i class="fa-solid fa-fire"></i> 萬事如意 (自動煙火)
                </button>
                <button class="cyber-btn gold" id="burstBtn">
                    <i class="fa-solid fa-burst"></i> 恭喜發財 (五連連發)
                </button>
                <button class="cyber-btn cyan" id="clearBtn">
                    <i class="fa-solid fa-trash-can"></i> 一鍵清場 (清除模型)
                </button>
            </div>
        </div>
    </div>

    <!-- 自訂祝賀語 Modal -->
    <div class="modal" id="wishModal">
        <div class="modal-content">
            <h2><i class="fa-solid fa-scroll"></i> 設定新春祝賀語</h2>
            <textarea id="wishInput" placeholder="請輸入您的新春祝福文字..."></textarea>
            <div class="preset-tags">
                <span class="tag" onclick="setPreset('蛇年大吉，戰力爆表！大吉大利，今晚勝者！')">蛇年大吉</span>
                <span class="tag" onclick="setPreset('槍槍頭標，萬事如意！金幣福氣全收攬！')">萬事如意</span>
                <span class="tag" onclick="setPreset('新春開局，勝率百分百！財源滾滾一路開掛！')">財源滾滾</span>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="cyber-btn cyan" id="closeModalBtn" style="transform: none;">取消</button>
                <button class="cyber-btn" id="saveWishBtn" style="transform: none;">儲存賀詞</button>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio API 音效合成器 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(50, now + 0.4);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.4, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start(now);
                noise.stop(now + 0.4);
            }
        }

        // --- Three.js 初始化 3D 場景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 光源設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xff0055, 1.5);
        dirLight1.position.set(20, 40, 20);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x00f0ff, 1.2);
        dirLight2.position.set(-20, -20, 20);
        scene.add(dirLight2);

        const pointLight = new THREE.PointLight(0xffcc00, 2, 50);
        pointLight.position.set(0, 0, 10);
        scene.add(pointLight);

        // --- 太空星雲背景系統 ---
        const starCount = 1500;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 250;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 250;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 250;

            const r = Math.random();
            if (r > 0.6) {
                starColors[i * 3] = 1.0; starColors[i * 3 + 1] = 0.8; starColors[i * 3 + 2] = 0.2;
            } else if (r > 0.3) {
                starColors[i * 3] = 1.0; starColors[i * 3 + 1] = 0.0; starColors[i * 3 + 2] = 0.35;
            } else {
                starColors[i * 3] = 0.0; starColors[i * 3 + 1] = 0.95; starColors[i * 3 + 2] = 1.0;
            }
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 輔助函式：將模型材質設置為支援透明度（為自動淡出準備）
        function makeTransparent(group) {
            group.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material = child.material.clone();
                    child.material.transparent = true;
                    child.material.opacity = 1.0;
                }
            });
        }

        // --- Roblox 3D 模型生成器 ---
        const spawnedObjects = [];

        function createRobloxIngot() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2, metalness: 0.9 });
            group.add(new THREE.Mesh(new THREE.BoxGeometry(7.5, 2.5, 4.5), mat));
            const top = new THREE.Mesh(new THREE.BoxGeometry(9, 3, 5.5), mat); top.position.y = 2.2; group.add(top);
            const centerBall = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.2, 3.5), mat); centerBall.position.y = 4.2; group.add(centerBall);
            group.scale.set(1.4, 1.4, 1.4);
            makeTransparent(group);
            return group;
        }

        function createRobloxCoin() {
            const group = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3, metalness: 0.8 });
            const darkGold = new THREE.MeshStandardMaterial({ color: 0xcc8800, roughness: 0.4, metalness: 0.7 });
            group.add(new THREE.Mesh(new THREE.BoxGeometry(9, 9, 1.5), goldMat));
            group.add(new THREE.Mesh(new THREE.BoxGeometry(4.5, 4.5, 1.8), darkGold));
            group.scale.set(1.3, 1.3, 1.3);
            makeTransparent(group);
            return group;
        }

        function createRobloxLantern() {
            const group = new THREE.Group();
            const redMat = new THREE.MeshStandardMaterial({ color: 0xee0033, roughness: 0.4 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.8, roughness: 0.2 });
            group.add(new THREE.Mesh(new THREE.BoxGeometry(7.5, 9, 7.5), redMat));
            const topCap = new THREE.Mesh(new THREE.BoxGeometry(8.5, 1.5, 8.5), goldMat); topCap.position.y = 5.2; group.add(topCap);
            const botCap = new THREE.Mesh(new THREE.BoxGeometry(8.5, 1.5, 8.5), goldMat); botCap.position.y = -5.2; group.add(botCap);
            const tassel = new THREE.Mesh(new THREE.BoxGeometry(1.5, 4.5, 1.5), goldMat); tassel.position.y = -8; group.add(tassel);
            group.scale.set(1.2, 1.2, 1.2);
            makeTransparent(group);
            return group;
        }

        function createRobloxNoob() {
            const group = new THREE.Group();
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.5 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.5 });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x00cc44, roughness: 0.5 });
            const redMat = new THREE.MeshStandardMaterial({ color: 0xff0044, roughness: 0.3 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.6, 3.6), yellowMat); head.position.y = 6.6; group.add(head);
            const torso = new THREE.Mesh(new THREE.BoxGeometry(4.8, 6, 2.4), blueMat); torso.position.y = 1.8; group.add(torso);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(2.2, 5.8, 2.2), yellowMat); leftArm.position.set(-3.7, 1.8, 0); leftArm.rotation.z = 0.2; group.add(leftArm);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(2.2, 5.8, 2.2), yellowMat); rightArm.position.set(3.7, 1.8, 0); rightArm.rotation.z = -0.2; group.add(rightArm);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(2.3, 5.8, 2.3), greenMat); leftLeg.position.set(-1.3, -4.1, 0); group.add(leftLeg);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(2.3, 5.8, 2.3), greenMat); rightLeg.position.set(1.3, -4.1, 0); group.add(rightLeg);
            const scarf = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.5, 3), redMat); scarf.position.y = 4.8; group.add(scarf);
            group.scale.set(1.3, 1.3, 1.3);
            makeTransparent(group);
            return group;
        }

        function createRobloxTrophy() {
            const group = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.1, metalness: 0.95 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            group.add(new THREE.Mesh(new THREE.BoxGeometry(6, 3, 6), darkMat));
            const stem = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), goldMat); stem.position.y = 3.5; group.add(stem);
            const cup = new THREE.Mesh(new THREE.BoxGeometry(7, 6, 7), goldMat); cup.position.y = 8.5; group.add(cup);
            group.scale.set(1.2, 1.2, 1.2);
            makeTransparent(group);
            return group;
        }

        const objectGenerators = [createRobloxIngot, createRobloxCoin, createRobloxLantern, createRobloxNoob, createRobloxTrophy];

        // --- 3D 粒子與雷射爆破系統 ---
        const fireworks = [];
        const confettiParticles = [];

        function createLaserBeam(targetPos) {
            const geometry = new THREE.BufferGeometry();
            const startPos = new THREE.Vector3(0, -20, 20);
            geometry.setFromPoints([startPos, targetPos]);
            const material = new THREE.LineBasicMaterial({ color: 0x00f0ff, linewidth: 4, transparent: true, opacity: 1 });
            const laser = new THREE.Line(geometry, material);
            scene.add(laser);

            let opacity = 1;
            const fade = setInterval(() => {
                opacity -= 0.15;
                material.opacity = opacity;
                if (opacity <= 0) {
                    scene.remove(laser);
                    geometry.dispose();
                    material.dispose();
                    clearInterval(fade);
                }
            }, 30);
        }

        function createFireworkExplosion(pos) {
            const pCount = 80;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(pCount * 3);
            const velocities = [];
            const colors = new Float32Array(pCount * 3);

            const colorOptions = [new THREE.Color(0xff0055), new THREE.Color(0xffcc00), new THREE.Color(0x00f0ff), new THREE.Color(0x00ff66)];

            for (let i = 0; i < pCount; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;
                const dir = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2).normalize().multiplyScalar(Math.random() * 0.8 + 0.3);
                velocities.push(dir);
                const col = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 1 });
            const pSystem = new THREE.Points(geo, mat);
            scene.add(pSystem);

            fireworks.push({ system: pSystem, velocities: velocities, life: 1.0 });
        }

        function createConfettiBurst(pos) {
            const count = 40;
            const confettiMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), confettiMat);
                p.position.copy(pos);
                p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                const velocity = new THREE.Vector3((Math.random() - 0.5) * 0.6, Math.random() * 0.8 + 0.2, (Math.random() - 0.5) * 0.6);
                scene.add(p);
                confettiParticles.push({ mesh: p, vel: velocity, rotVel: Math.random() * 0.2, life: 1.0 });
            }
        }

        // --- 中文祝賀語字幕 ---
        const blessingTexts = [
            "大吉大利！", "槍槍頭標！", "財源廣進！", "勝者為王！", 
            "蛇年大吉！", "金幣滿滿！", "萬事如意！", "戰力爆表！",
            "歐氣爆棚！", "鴻運當頭！", "福氣滿滿！", "一路開掛！"
        ];
        let comboCounter = 0;

        function showFloatingBlessing(screenX, screenY) {
            const textEl = document.createElement('div');
            textEl.className = 'floating-blessing';
            textEl.innerText = blessingTexts[Math.floor(Math.random() * blessingTexts.length)];
            textEl.style.left = `${screenX}px`;
            textEl.style.top = `${screenY}px`;
            document.body.appendChild(textEl);
            setTimeout(() => textEl.remove(), 1200);

            comboCounter++;
            document.getElementById('comboCount').innerText = comboCounter < 10 ? `0${comboCounter}` : comboCounter;
        }

        // --- 滑鼠點擊觸發物件生成 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function spawnSurprise(e) {
            if (e.target.closest('.interactive')) return;

            initAudio();
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const targetPos = new THREE.Vector3();
            raycaster.ray.at(30, targetPos);

            createLaserBeam(targetPos);
            playSound('laser');

            const randomGen = objectGenerators[Math.floor(Math.random() * objectGenerators.length)];
            const obj = randomGen();
            obj.position.copy(targetPos);
            obj.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

            const rotSpeed = {
                x: (Math.random() - 0.5) * 0.04,
                y: (Math.random() - 0.5) * 0.04,
                z: (Math.random() - 0.5) * 0.04
            };

            scene.add(obj);

            // 將物件加入管理陣列，設置壽命 Life = 1.0 (慢慢減少)
            spawnedObjects.push({
                mesh: obj,
                rotSpeed: rotSpeed,
                life: 1.0
            });

            setTimeout(() => {
                createFireworkExplosion(targetPos);
                createConfettiBurst(targetPos);
                playSound(Math.random() > 0.5 ? 'coin' : 'explosion');
                showFloatingBlessing(e.clientX, e.clientY);
            }, 100);
        }

        window.addEventListener('pointerdown', spawnSurprise);

        // --- 自動煙火與按鈕 ---
        let autoFireworkInterval = null;

        document.getElementById('fireworksBtn').addEventListener('click', () => {
            if (autoFireworkInterval) {
                clearInterval(autoFireworkInterval);
                autoFireworkInterval = null;
                document.getElementById('fireworksBtn').style.background = '';
            } else {
                autoFireworkInterval = setInterval(() => {
                    const pos = new THREE.Vector3((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20);
                    createFireworkExplosion(pos);
                    playSound('explosion');
                }, 400);
                document.getElementById('fireworksBtn').style.background = 'linear-gradient(135deg, #00ff66 0%, #009933 100%)';
            }
        });

        document.getElementById('burstBtn').addEventListener('click', () => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const pos = new THREE.Vector3((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 20);
                    const randomGen = objectGenerators[Math.floor(Math.random() * objectGenerators.length)];
                    const obj = randomGen();
                    obj.position.copy(pos);
                    scene.add(obj);
                    spawnedObjects.push({
                        mesh: obj,
                        rotSpeed: { x: 0.02, y: 0.02, z: 0.02 },
                        life: 1.0
                    });

                    createFireworkExplosion(pos);
                    createConfettiBurst(pos);
                    playSound('coin');
                }, i * 150);
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            spawnedObjects.forEach(item => scene.remove(item.mesh));
            spawnedObjects.length = 0;
            playSound('laser');
        });

        // --- Modal 控制 ---
        const modal = document.getElementById('wishModal');
        const cardDisplay = document.getElementById('cardTextDisplay');
        const wishInput = document.getElementById('wishInput');

        document.getElementById('openModalBtn').addEventListener('click', () => {
            wishInput.value = cardDisplay.innerText.trim();
            modal.classList.add('active');
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));
        document.getElementById('saveWishBtn').addEventListener('click', () => {
            if (wishInput.value.trim() !== "") cardDisplay.innerText = wishInput.value;
            modal.classList.remove('active');
        });
        function setPreset(text) { wishInput.value = text; }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 主動畫迴圈 ---
        function animate() {
            requestAnimationFrame(animate);

            starField.rotation.y += 0.0006;
            starField.rotation.x += 0.0003;

            // 旋轉與「慢慢淡出清除」3D 生成物件
            for (let i = spawnedObjects.length - 1; i >= 0; i--) {
                const item = spawnedObjects[i];
                
                // 每幀慢慢減少壽命（約 6~8 秒後完全消失）
                item.life -= 0.003;

                // 物件動態旋轉與浮動
                item.mesh.rotation.x += item.rotSpeed.x;
                item.mesh.rotation.y += item.rotSpeed.y;
                item.mesh.rotation.z += item.rotSpeed.z;
                item.mesh.position.y += Math.sin(Date.now() * 0.003 + i) * 0.02;

                // 逐漸降低透明度
                item.mesh.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.opacity = Math.max(0, item.life);
                    }
                });

                // 完全透明時從場景中移除
                if (item.life <= 0) {
                    scene.remove(item.mesh);
                    item.mesh.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            if (child.material) child.material.dispose();
                        }
                    });
                    spawnedObjects.splice(i, 1);
                }
            }

            // 更新 3D 煙火粒子
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.life -= 0.025;
                const positions = fw.system.geometry.attributes.position.array;

                for (let j = 0; j < fw.velocities.length; j++) {
                    positions[j * 3] += fw.velocities[j].x;
                    positions[j * 3 + 1] += fw.velocities[j].y - 0.05;
                    positions[j * 3 + 2] += fw.velocities[j].z;
                }
                fw.system.geometry.attributes.position.needsUpdate = true;
                fw.system.material.opacity = fw.life;

                if (fw.life <= 0) {
                    scene.remove(fw.system);
                    fw.system.geometry.dispose();
                    fw.system.material.dispose();
                    fireworks.splice(i, 1);
                }
            }

            // 更新彩帶碎片
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const c = confettiParticles[i];
                c.life -= 0.015;
                c.mesh.position.add(c.vel);
                c.vel.y -= 0.015;
                c.mesh.rotation.x += c.rotVel;
                c.mesh.rotation.y += c.rotVel;

                if (c.life <= 0) {
                    scene.remove(c.mesh);
                    c.mesh.geometry.dispose();
                    confettiParticles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
