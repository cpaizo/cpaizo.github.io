<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忠山實小 2026 中秋節快樂！</title>
    <!-- Canvas-Confetti 煙火套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-gold: #ffd700;
            --accent-orange: #ff7e5f;
            --bg-night: #0b132b;
            --card-bg: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #3a506b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* 呼吸光暈月亮 */
        .moon {
            position: absolute;
            top: 40px;
            right: 10%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #ffe066 60%, #ffd700 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 224, 102, 0.8), 0 0 100px rgba(255, 215, 0, 0.4);
            z-index: 1;
            cursor: pointer;
            animation: moonGlow 4s infinite alternate ease-in-out;
            transition: transform 0.2s ease;
        }

        .moon:hover {
            transform: scale(1.1);
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 40px rgba(255, 224, 102, 0.7), 0 0 80px rgba(255, 215, 0, 0.3); }
            100% { box-shadow: 0 0 60px rgba(255, 224, 102, 0.9), 0 0 120px rgba(255, 215, 0, 0.5); }
        }

        /* 追趕滑鼠的小玉兔 */
        .pet-rabbit {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 999;
            transition: transform 0.15s ease-out, left 0.3s ease-out, top 0.3s ease-out;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        /* 毛玻璃質感卡片 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 680px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #feb47b, #ff7e5f);
            color: #fff;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        /* 圖片外框與搖擺效果 */
        .image-box {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .image-box:hover {
            transform: scale(1.03);
        }

        .image-box img {
            width: 600px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .wiggle {
            animation: wiggleAnim 0.5s ease-in-out;
        }

        @keyframes wiggleAnim {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-4deg) scale(1.02); }
            50% { transform: rotate(4deg) scale(1.02); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        /* 文章區域 */
        .article-content {
            font-size: 1.1rem;
            line-height: 1.85;
            color: #e2e8f0;
            text-align: justify;
            text-justify: inter-ideograph;
            background: rgba(0, 0, 0, 0.25);
            padding: 22px 25px;
            border-radius: 16px;
            border-left: 4px solid var(--primary-gold);
            margin-bottom: 25px;
        }

        /* 互動按鈕組 */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .btn-lantern { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #2d3748; }
        .btn-firework { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); color: #1a365d; }
        .btn-fortune { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #742a2a; }
        .btn-game { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #1a4936; }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* 互動面板 (顯示籤詩或小遊戲) */
        .interactive-panel {
            display: none;
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed var(--primary-gold);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            color: #fffdf0;
            animation: fadeIn 0.4s ease-out;
        }

        /* 餵月餅小遊戲樣式 */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-gold);
        }

        .cake-btn {
            font-size: 3rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
        }

        .cake-btn:active {
            transform: scale(1.3);
        }

        /* 天燈粒子 */
        .lantern {
            position: absolute;
            bottom: -50px;
            font-size: 26px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 2;
            opacity: 0.85;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-105vh) rotate(20deg); opacity: 0; }
        }

        footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <!-- 追趕游標的小玉兔 -->
    <div class="pet-rabbit" id="rabbit">🐇</div>

    <!-- 可點擊互動的發光月亮 -->
    <div class="moon" onclick="triggerMoonMagic()" title="點擊月亮驚喜！"></div>

    <!-- 賀卡主體 -->
    <main class="container">
        <div class="badge">忠山實小 2026 特殊賀卡</div>
        <h1>🌕 中秋佳節 溫馨祝福 🥮</h1>

        <div class="image-box" id="cardImage" onclick="wiggleImage()">
            <img src="photos/中秋節-張倢鈞.jpg" width="600px" alt="忠山實小2026中秋節賀卡">
        </div>

        <!-- 文章 -->
        <article class="article-content">
            皎潔月光下，《妖怪學校的菜鳥老師！》中軟萌可愛的曼陀羅草「棉花糖」，和其他隻曼陀羅草，與大家分享香甜月餅。忠山實小在2026年中秋佳節，祝福所有師生與家長團圓平安、歡笑不斷，如同明月般溫馨美好！
        </article>

        <!-- 互動按鈕組 -->
        <div class="button-group">
            <button class="btn btn-lantern" onclick="releaseLantern()">🏮 放天燈</button>
            <button class="btn btn-firework" onclick="shootFireworks()">🎆 放煙火</button>
            <button class="btn btn-fortune" onclick="drawFortune()">🥮 抽中秋籤詩</button>
            <button class="btn btn-game" onclick="toggleGame()">🎮 餵玉兔吃月餅</button>
        </div>

        <!-- 互動資訊區 -->
        <div class="interactive-panel" id="interactivePanel"></div>

        <footer>
            © 2026 忠山實驗小學 All Rights Reserved.
        </footer>
    </main>

    <script>
        // 1. 跟隨滑鼠移動的可愛小玉兔
        const rabbit = document.getElementById('rabbit');
        document.addEventListener('mousemove', (e) => {
            rabbit.style.left = (e.clientX + 15) + 'px';
            rabbit.style.top = (e.clientY + 15) + 'px';
        });

        // 2. 天燈粒子特效
        function createLantern() {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            const icons = ['🏮', '🌕', '🥮', '🐇', '✨', '🍡'];
            lantern.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            lantern.style.left = Math.random() * 90 + 5 + 'vw';
            lantern.style.animationDuration = (Math.random() * 5 + 6) + 's';
            lantern.style.fontSize = (Math.random() * 15 + 20) + 'px';
            
            document.body.appendChild(lantern);
            setTimeout(() => lantern.remove(), 11000);
        }
        setInterval(createLantern, 1500);

        function releaseLantern() {
            for(let i = 0; i < 8; i++) setTimeout(createLantern, i * 180);
        }

        // 3. 煙火特效
        function shootFireworks() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // 4. 點擊圖片晃動
        function wiggleImage() {
            const imgBox = document.getElementById('cardImage');
            imgBox.classList.add('wiggle');
            shootFireworks();
            setTimeout(() => imgBox.classList.remove('wiggle'), 500);
        }

        // 5. 點擊月亮驚喜
        function triggerMoonMagic() {
            confetti({ particleCount: 150, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 150, angle: 120, spread: 55, origin: { x: 1 } });
        }

        // 6. 抽籤詩功能
        const fortunes = [
            "🥮 籤王：吃到全宇宙最甜的蛋黃酥，好運加倍！",
            "🌕 大吉：月亮加持，這學期所有考試與作業通通高分通過！",
            "🐇 幸運籤：巧遇玉兔，獲得滿滿的快樂與活力能量！",
            "✨ 佳籤：心想事成，忠山實小陪伴你度過最溫馨的中秋節！",
            "🍡 甜甜籤：這週將會發生一件讓你開懷大笑的幸運好事！"
        ];

        function drawFortune() {
            const panel = document.getElementById('interactivePanel');
            const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            panel.style.display = 'block';
            panel.innerHTML = `<div style="font-size:1.1rem; color:#ffe066;">${randomFortune}</div>`;
            shootFireworks();
        }

        // 7. 餵月餅小遊戲
        let score = 0;
        function toggleGame() {
            const panel = document.getElementById('interactivePanel');
            panel.style.display = 'block';
            panel.innerHTML = `
                <div class="game-area">
                    <div class="game-score">🐇 玉兔飽食度：<span id="scoreText">${score}</span> 顆月餅</div>
                    <p style="font-size:0.9rem; color:#cbd5e0;">連續快速點擊月餅，餵飽可愛小玉兔！</p>
                    <button class="cake-btn" onclick="feedRabbit()">🥮</button>
                </div>
            `;
        }

        function feedRabbit() {
            score++;
            document.getElementById('scoreText').innerText = score;
            if (score % 10 === 0) {
                shootFireworks();
            }
        }
    </script>
</body>
</html>
