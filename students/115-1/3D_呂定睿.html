        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Glassmorphism background styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 225, 120, 0.8);
            box-shadow: 0 15px 35px rgba(255, 180, 0, 0.2), 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .btn-bounce {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-bounce:hover {
            transform: scale(1.08) translateY(-3px);
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }

        /* Sparkle text effect */
        .sparkle-text {
            background: linear-gradient(45deg, #ff5e62, #ff9966, #ffd700, #4facfe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Click floating text animation */
        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUpFade 1.2s ease-out forwards;
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotate(-10deg);
            }
            50% {
                transform: translate(-50%, -100%) scale(1.2) rotate(5deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(1) rotate(0deg);
            }
        }
    </style>
</head>

    <script>
        // --- sound synthesizers (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.bgmPlaying = false;
                this.bgmTimer = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playSparkle() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                // Cute high arpeggio pitch
                const freq = 1200 + Math.random() * 800;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.15);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playPop() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            }

            toggleBGM() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                this.bgmPlaying = !this.bgmPlaying;
                if (this.bgmPlaying) {
                    this.playMelodyLoop();
                } else {
                    if (this.bgmTimer) clearTimeout(this.bgmTimer);
                }
                return this.bgmPlaying;
            }

            playMelodyLoop() {
                if (!this.bgmPlaying) return;

                // Happy cute 8-bit style tune (C Major Pentatonic)
                const notes = [523.25, 659.25, 783.99, 1046.50, 880.00, 783.99, 659.25, 587.33];
                let step = 0;

                const playNextNote = () => {
                    if (!this.bgmPlaying) return;
                    
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], now);

                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.25);

                    step++;
                    this.bgmTimer = setTimeout(playNextNote, 300);
                };

                playNextNote();
            }
        }

            }

        let currentWishIdx = 0;

        // Floating popup words
        const POPUP_WORDS = ["★ 謝謝老師！", "⚡ 讚！", "🎓 教師節快樂", "✨ 辛苦了！", "❤️ 感謝教導", "🌟 100分！", "🎈 幸福滿滿"];

        // --- Three.js Scene Setup ---
        let scene, camera, renderer, controls;
        let pikachuGroup, blackboardGroup, pokeballMesh, bookStackGroup;
        let starParticles = [];
        const container = document.getElementById('canvas-container');

        function init3D() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfff9e6); // Soft creamy yellow
            scene.fog = new THREE.FogExp2(0xfff9e6, 0.015);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 14);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go under floor
            controls.minDistance = 6;
            controls.maxDistance = 22;
            controls.target.set(0, 1.5, 0);

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xffd7a0, 0.4);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // 6. Build Environment & Objects
            createRoomFloor();
            createPikachu();
            createBlackboard();
            createPokeball();
            createSchoolSupplies();
            createFloatingDecorations();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onCanvasClick);

            // 8. Animation Loop
            animate();
        }

        // --- Procedural 3D Models (Low-Poly Cute Style) ---

        // Floor / Podium Platform
        function createRoomFloor() {

            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Wooden classroom rug/podium
            const rugGeo = new THREE.CylinderGeometry(5.5, 5.5, 0.1, 32);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0xe0a96d, roughness: 0.8 }); // Warm wood tone
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.position.y = 0.05;
            rug.receiveShadow = true;
            scene.add(rug);
        }

        // Cute Pikachu Model
        function createPikachu() {
            pikachuGroup = new THREE.Group();

            const pikaYellow = new THREE.MeshStandardMaterial({ color: 0xffd000, roughness: 0.4 });
            const pikaBlack = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const pikaRed = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3 });
            const pikaWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });

            // Body
            const bodyGeo = new THREE.SphereGeometry(1, 32, 32);
            bodyGeo.scale(1, 1.15, 0.95);
            const body = new THREE.Mesh(bodyGeo, pikaYellow);
            body.position.y = 1.1;
            body.castShadow = true;
            pikachuGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.85, 32, 32);
            headGeo.scale(1.1, 1, 1);
            const head = new THREE.Mesh(headGeo, pikaYellow);
            head.position.set(0, 2.1, 0.1);
            head.castShadow = true;
            pikachuGroup.add(head);

            // Ears
            const earGeo = new THREE.ConeGeometry(0.22, 1.1, 16);
            earGeo.translate(0, 0.55, 0);

            // Left Ear
            const leftEar = new THREE.Mesh(earGeo, pikaYellow);
            leftEar.position.set(-0.55, 2.6, 0);
            leftEar.rotation.z = 0.4;
            leftEar.rotation.x = -0.2;
            leftEar.castShadow = true;
            pikachuGroup.add(leftEar);

            // Left Ear Tip
            const earTipGeo = new THREE.ConeGeometry(0.225, 0.4, 16);
            earTipGeo.translate(0, 0.9, 0);
            const leftEarTip = new THREE.Mesh(earTipGeo, pikaBlack);
            leftEar.add(leftEarTip);

            // Right Ear
            const rightEar = new THREE.Mesh(earGeo, pikaYellow);
            rightEar.position.set(0.55, 2.6, 0);
            rightEar.rotation.z = -0.6;
            rightEar.rotation.x = 0.1;
            rightEar.castShadow = true;
            pikachuGroup.add(rightEar);

            // Right Ear Tip
            const rightEarTip = new THREE.Mesh(earTipGeo, pikaBlack);
            rightEar.add(rightEarTip);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const eyePupilGeo = new THREE.SphereGeometry(0.04, 12, 12);

            // Left Eye
            const leftEye = new THREE.Mesh(eyeGeo, pikaBlack);
            leftEye.position.set(-0.32, 2.25, 0.78);
            const leftPupil = new THREE.Mesh(eyePupilGeo, pikaWhite);
            leftPupil.position.set(-0.03, 0.03, 0.1);
            leftEye.add(leftPupil);
            pikachuGroup.add(leftEye);

            // Right Eye
            const rightEye = new THREE.Mesh(eyeGeo, pikaBlack);
            rightEye.position.set(0.32, 2.25, 0.78);
            const rightPupil = new THREE.Mesh(eyePupilGeo, pikaWhite);
            rightPupil.position.set(0.03, 0.03, 0.1);
            rightEye.add(rightPupil);
            pikachuGroup.add(rightEye);

            // Cheeks (Rosy Red Circles)
            const cheekGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16);
            cheekGeo.rotateX(Math.PI / 2);

            const leftCheek = new THREE.Mesh(cheekGeo, pikaRed);
            leftCheek.position.set(-0.58, 2.05, 0.7);
            leftCheek.rotation.y = -0.4;
            pikachuGroup.add(leftCheek);

            const rightCheek = new THREE.Mesh(cheekGeo, pikaRed);
            rightCheek.position.set(0.58, 2.05, 0.7);
            rightCheek.rotation.y = 0.4;
            pikachuGroup.add(rightCheek);

            // Cute Nose
            const noseGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const nose = new THREE.Mesh(noseGeo, pikaBlack);
            nose.position.set(0, 2.15, 0.88);
            pikachuGroup.add(nose);

            // Mouth (Cute curve using torus)
            const mouthGeo = new THREE.TorusGeometry(0.08, 0.02, 8, 16, Math.PI);
            const mouth = new THREE.Mesh(mouthGeo, pikaBlack);
            mouth.position.set(0, 2.02, 0.85);
            mouth.rotation.x = Math.PI;
            pikachuGroup.add(mouth);

            // Graduation/Teacher Cap on Pikachu!
            const capGroup = new THREE.Group();
            const capBaseGeo = new THREE.CylinderGeometry(0.45, 0.5, 0.3, 16);
            const capTopGeo = new THREE.BoxGeometry(1.1, 0.05, 1.1);
            const capMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const capTasselMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });

            const capBase = new THREE.Mesh(capBaseGeo, capMat);
            const capTop = new THREE.Mesh(capTopGeo, capMat);
            capTop.position.y = 0.15;
            capGroup.add(capBase, capTop);

            // Tassel
            const tasselGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const tassel = new THREE.Mesh(tasselGeo, capTasselMat);
            tassel.position.set(0.4, 0.1, 0.4);
            capGroup.add(tassel);

            capGroup.position.set(0, 2.9, 0.05);
            capGroup.rotation.z = -0.15;
            pikachuGroup.add(capGroup);

            // Arms (Waving left hand)
            const armGeo = new THREE.SphereGeometry(0.25, 16, 16);
            armGeo.scale(0.8, 1.6, 0.8);

            const leftArm = new THREE.Mesh(armGeo, pikaYellow);
            leftArm.position.set(-0.85, 1.4, 0.3);
            leftArm.rotation.z = 0.8;
            leftArm.rotation.x = 0.5;
            pikachuGroup.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, pikaYellow);
            rightArm.position.set(0.85, 1.2, 0.3);
            rightArm.rotation.z = -0.4;
            pikachuGroup.add(rightArm);

            // Tail (Zigzag Lightning shape using merged boxes)
            const tailGroup = new THREE.Group();
            const tailMat = new THREE.MeshStandardMaterial({ color: 0xffd000, roughness: 0.4 });
            const tailBrownMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.6 });

            const seg1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.08), tailBrownMat);
            seg1.position.set(0, 0.25, 0);

            const seg2 = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 0.08), tailMat);
            seg2.position.set(0.15, 0.55, 0);
            seg2.rotation.z = -0.6;

            const seg3 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.7, 0.08), tailMat);
            seg3.position.set(0.1, 0.95, 0);
            seg3.rotation.z = 0.5;

            const seg4 = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.9, 0.08), tailMat);
            seg4.position.set(0.35, 1.5, 0);
            seg4.rotation.z = -0.3;

            tailGroup.add(seg1, seg2, seg3, seg4);
            tailGroup.position.set(-0.1, 0.7, -0.7);
            tailGroup.rotation.y = -Math.PI / 4;
            tailGroup.rotation.x = -0.2;
            pikachuGroup.add(tailGroup);

            // Position entire Pikachu
            pikachuGroup.position.set(-0.5, 0.1, 0.5);
            scene.add(pikachuGroup);
        }

        // Blackboard with Greeting Text
        function createBlackboard() {
            blackboardGroup = new THREE.Group();

            // Frame
            const frameGeo = new THREE.BoxGeometry(5.2, 3.4, 0.2);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.7 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.castShadow = true;

            // Board Surface
            const boardGeo = new THREE.BoxGeometry(4.8, 3.0, 0.05);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x1c3d2b, roughness: 0.4 }); // Classic dark green
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.z = 0.1;

            // Chalkboard Stand Legs
            const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 4.5);
            const legMat = frameMat;

            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-2.2, -1.2, -0.2);
            leftLeg.rotation.z = 0.15;

            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(2.2, -1.2, -0.2);
            rightLeg.rotation.z = -0.15;

            blackboardGroup.add(frame, board, leftLeg, rightLeg);

            // Canvas texture for blackboard chalk writing & drawings
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // Chalk background & doodles
            ctx.fillStyle = '#1c3d2b';
            ctx.fillRect(0, 0, 512, 300);

            // Chalk Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 38px "Zen Maru Gothic", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('9.28 教師節快樂！', 256, 75);

            ctx.fillStyle = '#ffde59';
            ctx.font = 'bold 26px "Zen Maru Gothic", sans-serif';
            ctx.fillText('感謝老師 辛勤教導！', 256, 135);

            // Cute chalk doodles (Pokéball & Star)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            // Pokéball doodle left
            ctx.beginPath();
            ctx.arc(100, 210, 30, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(100, 210, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(70, 210); ctx.lineTo(130, 210);
            ctx.stroke();

            // Star doodle right
            ctx.fillStyle = '#ff914d';
            ctx.font = '40px sans-serif';
            ctx.fillText('⚡★ 100分 ★⚡', 350, 220);

            const chalkTexture = new THREE.CanvasTexture(canvas);
            const chalkMat = new THREE.MeshBasicMaterial({ map: chalkTexture, transparent: true });
            const chalkPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.7, 2.9), chalkMat);
            chalkPlane.position.z = 0.14;
            blackboardGroup.add(chalkPlane);

            blackboardGroup.position.set(0.8, 3.2, -2.5);
            blackboardGroup.rotation.y = -0.2;
            scene.add(blackboardGroup);
        }

        // Pokéball Model
        function createPokeball() {
            const group = new THREE.Group();

            const topGeo = new THREE.SphereGeometry(0.6, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const topMat = new THREE.MeshStandardMaterial({ color: 0xee1515, roughness: 0.3 });
            const top = new THREE.Mesh(topGeo, topMat);

            const botGeo = new THREE.SphereGeometry(0.6, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const botMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.3 });
            const bot = new THREE.Mesh(botGeo, botMat);

            const bandGeo = new THREE.CylinderGeometry(0.61, 0.61, 0.1, 32);
            const bandMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const band = new THREE.Mesh(bandGeo, bandMat);

            const btnRingGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 24);
            btnRingGeo.rotateX(Math.PI / 2);
            const btnRing = new THREE.Mesh(btnRingGeo, bandMat);
            btnRing.position.z = 0.52;

            const btnCoreGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.14, 24);
            btnCoreGeo.rotateX(Math.PI / 2);
            const btnCoreMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const btnCore = new THREE.Mesh(btnCoreGeo, btnCoreMat);
            btnCore.position.z = 0.53;

            group.add(top, bot, band, btnRing, btnCore);
            group.position.set(2.2, 0.65, 1.2);
            group.rotation.y = -0.6;
            group.rotation.z = 0.1;
            group.castShadow = true;

            pokeballMesh = group;
            scene.add(pokeballMesh);
        }

        // Classroom Desk Elements: Stack of Books & Red Apple
        function createSchoolSupplies() {
            bookStackGroup = new THREE.Group();

            const bookColors = [0x3b82f6, 0xef4444, 0x10b981];
            bookColors.forEach((col, idx) => {
                const bookGeo = new THREE.BoxGeometry(1.4, 0.25, 1.1);
                const bookMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.5 });
                const book = new THREE.Mesh(bookGeo, bookMat);
                book.position.y = idx * 0.26 + 0.13;
                book.rotation.y = (idx - 1) * 0.2;
                book.castShadow = true;

                // Pages side
                const pageGeo = new THREE.BoxGeometry(1.32, 0.21, 1.02);
                const pageMat = new THREE.MeshStandardMaterial({ color: 0xfffbeb });
                const page = new THREE.Mesh(pageGeo, pageMat);
                page.position.set(0.02, 0, 0);
                book.add(page);

                bookStackGroup.add(book);
            });

            // Cute Red Apple on top of books for Teacher!
            const appleGroup = new THREE.Group();
            const appleGeo = new THREE.SphereGeometry(0.28, 16, 16);
            const appleMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
            const apple = new THREE.Mesh(appleGeo, appleMat);

            const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.15);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x451a03 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 0.28;
            stem.rotation.z = -0.2;

            const leafGeo = new THREE.SphereGeometry(0.08, 8, 8);
            leafGeo.scale(1, 0.2, 2);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(0.08, 0.28, 0);

            appleGroup.add(apple, stem, leaf);
            appleGroup.position.set(0, 0.95, 0);
            appleGroup.castShadow = true;
            bookStackGroup.add(appleGroup);

            bookStackGroup.position.set(-2.8, 0.1, -0.5);
            bookStackGroup.rotation.y = 0.4;
            scene.add(bookStackGroup);
        }

        // Floating Background Cute Star Shapes
        function createFloatingDecorations() {
            const starShape = create3DStarGeometry();
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.2,
                roughness: 0.3,
                emissive: 0xffb700,
                emissiveIntensity: 0.3
            });

            for (let i = 0; i < 10; i++) {
                const mesh = new THREE.Mesh(starShape, starMat);
                mesh.position.set(
                    (Math.random() - 0.5) * 14,
                    2 + Math.random() * 6,
                    (Math.random() - 0.5) * 10 - 2
                );
                const s = 0.2 + Math.random() * 0.25;
                mesh.scale.set(s, s, s);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                mesh.userData = {
                    rotSpeed: (Math.random() - 0.5) * 0.03,
                    floatSpeed: 0.008 + Math.random() * 0.01,
                    baseY: mesh.position.y
                };
                scene.add(mesh);
            }
        }

        // Utility: Generate 5-Pointed 3D Star Extruded Geometry
        function create3DStarGeometry() {
            const shape = new THREE.Shape();
            const points = 5;
            const outerRadius = 0.6;
            const innerRadius = 0.28;

            for (let i = 0; i < points * 2; i++) {
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            shape.closePath();

            const extrudeSettings = {
                depth: 0.2,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.05,
                bevelThickness: 0.05
            };

            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

        // --- Sparkle/Star Explosions on Mouse Click ---
        const starGeom = create3DStarGeometry();
        const particleColors = [0xffd700, 0xff69b4, 0x38bdf8, 0x4ade80, 0xfacc15];

        function spawnStarBurst(worldPos) {
            const count = 14;
            for (let i = 0; i < count; i++) {
                const color = particleColors[Math.floor(Math.random() * particleColors.length)];
                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.2,
                    emissive: color,
                    emissiveIntensity: 0.4
                });

                const p = new THREE.Mesh(starGeom, mat);
                p.position.copy(worldPos);

                const scale = 0.15 + Math.random() * 0.2;
                p.scale.set(scale, scale, scale);

                // Random blast velocity vector
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.08 + Math.random() * 0.12;
                const velY = 0.08 + Math.random() * 0.15;

                p.userData = {
                    vx: Math.cos(angle) * speed,
                    vy: velY,
                    vz: Math.sin(angle) * speed,
                    rotX: (Math.random() - 0.5) * 0.2,
                    rotY: (Math.random() - 0.5) * 0.2,
                    life: 1.0, // Lifetime 1.0 down to 0
                    decay: 0.02 + Math.random() * 0.02
                };

                scene.add(p);
                starParticles.push(p);
            }
        }

        // Interactive Click Handler
        function onCanvasClick(e) {
            soundFX.playSparkle();

            // 1. Raycast to find 3D point in world space
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // Plane at center scene z=0
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, targetPos);

            if (!targetPos) {
                targetPos.set(0, 2, 0);
            }

            // 2. Spawn 3D star burst
            spawnStarBurst(targetPos);

            // 3. Spawn cute floating HTML text at click position
            spawnFloatingText(e.clientX, e.clientY);

            // 4. Little Pikachu bounce reaction
            if (pikachuGroup) {
                pikachuGroup.position.y = 0.5;
                setTimeout(() => pikachuGroup.position.y = 0.1, 200);
            }
        }

        // Spawn cute text pops on click
        function spawnFloatingText(x, y) {
            const textContainer = document.getElementById('text-container');
            const el = document.createElement('div');
            el.className = 'float-text text-xl sm:text-2xl text-amber-900 bg-yellow-300 border-2 border-yellow-500 rounded-full px-4 py-1 shadow-lg';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.innerText = POPUP_WORDS[Math.floor(Math.random() * POPUP_WORDS.length)];
            
            textContainer.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        // --- Main Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. Controls update
            controls.update();

            // 2. Pikachu cute breathing/idle floating
            if (pikachuGroup) {
                pikachuGroup.position.y = 0.1 + Math.sin(elapsedTime * 3) * 0.05;
                pikachuGroup.rotation.y = Math.sin(elapsedTime * 1.5) * 0.1;
            }

            // 3. Pokéball slow hover & spin
            if (pokeballMesh) {
                pokeballMesh.rotation.y += 0.015;
                pokeballMesh.position.y = 0.65 + Math.sin(elapsedTime * 2.5) * 0.08;
            }

            // 4. Update Star Burst Particles
            for (let i = starParticles.length - 1; i >= 0; i--) {
                const p = starParticles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;

                p.userData.vy -= 0.004; // Gravity effect
                p.rotation.x += p.userData.rotX;
                p.rotation.y += p.userData.rotY;

                p.userData.life -= p.userData.decay;
                const scale = Math.max(0, p.userData.life * 0.3);
                p.scale.set(scale, scale, scale);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    starParticles.splice(i, 1);
                }
            }

            // 5. Render Scene
            renderer.render(scene, camera);
        }

        // Responsive window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UI Interactions Setup ---
        window.onload = function() {
            init3D();

            // Switch Blessing Wish Button
            const wishBtn = document.getElementById('change-wish-btn');
            const titleEl = document.getElementById('card-title');
            const descEl = document.getElementById('card-desc');

            wishBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                soundFX.playPop();

                currentWishIdx = (currentWishIdx + 1) % WISHES.length;
                titleEl.innerText = WISHES[currentWishIdx].title;
                descEl.innerText = WISHES[currentWishIdx].desc;

                // Spurt stars at center
                spawnStarBurst(new THREE.Vector3(0, 2, 0));
            });

            // Trigger Star Rain Event
            const starRainBtn = document.getElementById('star-rain-btn');
            starRainBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                soundFX.playSparkle();

                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const randomPos = new THREE.Vector3(
                            (Math.random() - 0.5) * 8,
                            1 + Math.random() * 3,
                            (Math.random() - 0.5) * 6
                        );
                        spawnStarBurst(randomPos);
                    }, i * 120);
                }
            });

            // Camera Reset Button
            const resetCamBtn = document.getElementById('reset-cam-btn');
            resetCamBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                soundFX.playPop();
                camera.position.set(0, 4, 14);
                controls.target.set(0, 1.5, 0);
            });

            // BGM Toggle Button
            const bgmBtn = document.getElementById('bgm-btn');
            bgmBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isPlaying = soundFX.toggleBGM();
                bgmBtn.classList.toggle('text-amber-500', isPlaying);
                bgmBtn.classList.toggle('text-red-500', !isPlaying);
                bgmBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
            });
        };
    </script>
</body>
