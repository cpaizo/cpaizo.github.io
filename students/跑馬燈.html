<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全螢幕跑馬燈</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 設定控制面板區域 */
    .controls-container {
      background-color: #2a2a2a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #4da6ff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cccccc;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #444;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
      font-size: 16px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* 全螢幕跑馬燈容器 */
    #marquee-fullscreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      overflow: hidden;
      cursor: pointer;
    }

    /* 跑馬燈移動軌道與文字 */
    .marquee-content {
      position: absolute;
      white-space: nowrap;
      will-change: transform;
      font-weight: bold;
      line-height: 1;
      /* 動畫預設為左往右滾動 */
      animation: scroll-left 10s linear infinite;
    }

    /* 滾動動畫定義 */
    @keyframes scroll-left {
      0% {
        transform: translateX(100vw);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    /* 旋轉 90 度時的動畫調整 (適合手機直拿時橫向顯示) */
    .marquee-content.rotate-90 {
      animation: scroll-rotated 10s linear infinite;
    }

    @keyframes scroll-rotated {
      0% {
        transform: translate(-50%, -50%) rotate(90deg) translateY(-100vh);
      }
      100% {
        transform: translate(-50%, -50%) rotate(90deg) translateY(100vw);
      }
    }

    .tip {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div class="controls-container" id="controls">
    <h2>跑馬燈設定</h2>
    
    <div class="form-group">
      <label for="text-input">跑馬燈文字：</label>
      <input type="text" id="text-input" value="歡迎光臨！Hello World!" placeholder="請輸入文字...">
    </div>

    <div class="form-group">
      <label for="color-input">文字顏色：</label>
      <div class="color-picker-wrapper">
        <input type="color" id="color-input" value="#ff0055">
        <span id="color-code">#ff0055</span>
      </div>
    </div>

    <div class="form-group">
      <label for="size-input">文字大小 (vh)：</label>
      <select id="size-input">
        <option value="20">中等 (20vh)</option>
        <option value="35" selected>大 (35vh)</option>
        <option value="50">超大 (50vh)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="speed-input">滾動速度：</label>
      <select id="speed-input">
        <option value="15">慢</option>
        <option value="10" selected>中</option>
        <option value="5">快</option>
      </select>
    </div>

    <button id="start-btn">開啟全螢幕跑馬燈</button>
    <p class="tip">提示：全螢幕後點擊畫面任何地方即可關閉</p>
  </div>

  <!-- 全螢幕跑馬燈顯示區 -->
  <div id="marquee-fullscreen">
    <div class="marquee-content" id="marquee-text"></div>
  </div>

  <script>
    const textInput = document.getElementById('text-input');
    const colorInput = document.getElementById('color-input');
    const colorCode = document.getElementById('color-code');
    const sizeInput = document.getElementById('size-input');
    const speedInput = document.getElementById('speed-input');
    const startBtn = document.getElementById('start-btn');
    const fullscreenDiv = document.getElementById('marquee-fullscreen');
    const marqueeText = document.getElementById('marquee-text');

    // 即時更新選取的顏色色號文字
    colorInput.addEventListener('input', (e) => {
      colorCode.textContent = e.target.value;
    });

    // 開啟全螢幕並啟動跑馬燈
    startBtn.addEventListener('click', () => {
      const text = textInput.value.trim() || "請輸入文字";
      const color = colorInput.value;
      const fontSize = sizeInput.value + 'vh';
      const speed = speedInput.value + 's';

      // 設定文字樣式與內容
      marqueeText.textContent = text;
      marqueeText.style.color = color;
      marqueeText.style.fontSize = fontSize;
      marqueeText.style.animationDuration = speed;

      // 垂直居中對齊
      marqueeText.style.top = `calc(50% - ${sizeInput.value / 2}vh)`;

      // 顯示跑馬燈容器
      fullscreenDiv.style.display = 'block';

      // 請求瀏覽器全螢幕
      if (fullscreenDiv.requestFullscreen) {
        fullscreenDiv.requestFullscreen();
      } else if (fullscreenDiv.webkitRequestFullscreen) { /* Safari */
        fullscreenDiv.webkitRequestFullscreen();
      } else if (fullscreenDiv.msRequestFullscreen) { /* IE11 */
        fullscreenDiv.msRequestFullscreen();
      }
    });

    // 點擊全螢幕畫面時退出全螢幕
    fullscreenDiv.addEventListener('click', exitMarquee);

    // 離開全螢幕處理函數
    function exitMarquee() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
      fullscreenDiv.style.display = 'none';
    }

    // 監聽全螢幕狀態變化 (例如使用者按 Esc 鍵退出時)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenDiv.style.display = 'none';
      }
    });
  </script>
</body>
</html>
