<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 花仙子：香氛魔法城堡 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #E07A5F;         /* 手繪暖珊瑚橘（按鈕與重點） */
            --primary-dark: #B8563C;    /* 暖陶土深色 */
            --secondary: #7EB59B;       /* 療癒草綠 */
            --accent-yellow: #F7D988;   /* 溫柔奶油蛋黃 */
            --cream-soft: #FFF4CC;      /* 淺奶油蛋黃 */
            --light: #FFF9EB;           /* 奶油淺底 */
            --border: #E8C7A8;          /* 手繪暖框 */
            --bg: #FFFBEB;              /* 溫柔奶油蛋黃底色 */
            --ink: #4A3F35;             /* 手繪鉛筆深褐 */
            --header-bg: linear-gradient(135deg, #FFF3C4 0%, #FDE49E 55%, #F7D483 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 配合溫柔奶油蛋黃的柔和光暈與手繪點點背景 */
        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 12%, rgba(253, 231, 162, 0.7) 0%, transparent 32%),
                radial-gradient(circle at 86% 18%, rgba(255, 240, 184, 0.75) 0%, transparent 34%),
                radial-gradient(circle at 50% 90%, rgba(247, 217, 136, 0.35) 0%, transparent 38%),
                radial-gradient(rgba(224, 122, 95, 0.14) 2px, transparent 2px),
                radial-gradient(rgba(247, 217, 136, 0.5) 2px, transparent 2px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            background-position: 0 0, 0 0, 0 0, 0 0, 14px 14px;
            color: var(--ink);
            padding-bottom: 24px;
        }

        header {
            background: var(--header-bg);
            padding: 34px 20px 34px 20px;
            text-align: center;
            color: var(--ink);
            border-bottom: 3px dashed var(--border);
            box-shadow: 0 6px 18px rgba(247, 217, 136, 0.35);
        }

        .doodle-banner {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: var(--ink);
        }

        header p {
            display: inline-block;
            background: rgba(255, 255, 255, 0.68);
            color: var(--ink);
            padding: 6px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1.5px dashed var(--primary);
            margin-top: 6px;
        }

        .app-container {
            max-width: 1160px;
            margin: 28px auto 0 auto;
            padding: 0 16px;
        }

        .layout-classic {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .layout-classic .area-products {
            grid-column: span 2;
        }

        @media (max-width: 850px) {
            .layout-classic {
                display: flex;
                flex-direction: column;
            }
        }

        .card {
            background: #FFFFFF;
            padding: 22px;
            border-radius: 24px 20px 26px 18px;
            border: 2.5px solid var(--ink);
            box-shadow: 5px 5px 0 var(--accent-yellow);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 7px 0 var(--cream-soft);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--border);
        }

        .doodle-badge {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: var(--light);
            border: 2px solid var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn {
            background: var(--primary);
            color: #FFFFFF;
            border: 2px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            padding: 11px 18px;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        /* 方形 Webcam 鏡頭容器（約 180 x 180 px，維持純方形） */
        #webcam-container {
            width: 180px;
            height: 180px;
            min-width: 20px;
            aspect-ratio: 1 / 1;
            margin: 14px auto 8px auto;
            overflow: hidden;
            position: relative;
            border-radius: 10px;
            border: 2.5px solid var(--ink);
            box-shadow: 3px 3px 0 var(--secondary);
            background-color: var(--light);
        }

        #webcam-container canvas {
            width: 180px !important;
            height: 180px !important;
            object-fit: cover;
            display: block;
        }

        .prediction-row {
            background: var(--light);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 7px 12px;
            margin-top: 8px;
        }

        .prediction-label {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.86rem;
            color: var(--ink);
        }

        .progress-bar-bg {
            background: #EAE4D9;
            height: 7px;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            background: var(--secondary);
            height: 100%;
            width: 0%;
            transition: width 0.2s ease;
            border-radius: 999px;
        }

        .cart-list {
            height: 260px;
            overflow-y: auto;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 12px;
            background: #FFFDF9;
            margin-bottom: 12px;
        }

        .cart-item {
            padding: 9px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: var(--light);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 0.92rem;
        }

        .qty-btn {
            background: #FFFFFF;
            color: var(--ink);
            border: 1.5px solid var(--ink);
            width: 24px;
            height: 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            line-height: 1;
        }

        .qty-btn:hover {
            background: var(--accent-yellow);
        }

        .product-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 960px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: #FFFDF9;
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 14px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--ink);
            box-shadow: 3px 4px 0 var(--accent-yellow);
            background: #FFFFFF;
        }

        .product-icon {
            width: 100%;
            height: 96px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 12px;
            background: #FFFFFF;
            padding: 4px;
        }

        .blessing-box {
            text-align: center;
            padding: 12px 14px;
            border-radius: 16px;
            background: #F4F9F6;
            border: 2px dashed var(--secondary);
            opacity: 0.65;
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        .blessing-box.unlocked {
            opacity: 1;
            background: #FFF9E6;
            border-style: solid;
            border-color: var(--primary);
            box-shadow: 2px 3px 0 var(--accent-yellow);
        }

        .petal {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            animation: fall linear forwards;
            font-size: 24px;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 63, 53, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: #FFFFFF;
            padding: 26px 22px;
            border-radius: 24px;
            border: 2.5px solid var(--ink);
            box-shadow: 6px 6px 0 var(--accent-yellow);
            max-width: 380px;
            width: 90%;
            text-align: center;
        }

        footer {
            max-width: 1160px;
            margin: 34px auto 0 auto;
            text-align: center;
            padding: 18px 20px;
            color: #7D7165;
            font-size: 0.86rem;
            border-top: 2px dashed var(--border);
            white-space: pre-line;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
        const CONFIG_MODEL_URL = "https://teachablemachine.withgoogle.com/models/DcJr26jzY/";
        const configProducts = [
            {"name":"花仙子花語香膏-檸檬","price":1,"imgUrl":"https://cpaizo.github.io/farcent/photos/01%E9%A6%99%E6%B0%9B%E5%8E%BB%E5%91%B3/01%E8%8A%B1%E4%BB%99%E5%AD%90%E8%8A%B1%E8%AA%9E%E9%A6%99%E8%86%8F-%E6%AA%B8%E6%AA%AC.png"},
            {"name":"去味大師科技礦晶香包-日月潭紅玉","price":1,"imgUrl":"https://cpaizo.github.io/farcent/photos/01%E9%A6%99%E6%B0%9B%E5%8E%BB%E5%91%B3/02%E5%8E%BB%E5%91%B3%E5%A4%A7%E5%B8%AB%E7%A7%91%E6%8A%80%E7%A4%A6%E6%99%B6%E9%A6%99%E5%8C%85-%E6%97%A5%E6%9C%88%E6%BD%AD%E7%B4%85%E7%8E%89.png"},
            {"name":"Farcent香水室內擴香-小蒼蘭&英國梨","price":3,"imgUrl":"https://cpaizo.github.io/farcent/photos/01%E9%A6%99%E6%B0%9B%E5%8E%BB%E5%91%B3/03Farcent%E9%A6%99%E6%B0%B4%E5%AE%A4%E5%85%A7%E6%93%B4%E9%A6%99-%E5%B0%8F%E8%92%BC%E8%98%AD&%E8%8B%B1%E5%9C%8B%E6%A2%A8.png"},
            {"name":"Farcent香水法頌精油擴香-蒼木杜松","price":2,"imgUrl":"https://cpaizo.github.io/farcent/photos/01%E9%A6%99%E6%B0%9B%E5%8E%BB%E5%91%B3/04Farcent%E9%A6%99%E6%B0%B4%E6%B3%95%E9%A0%8C%E7%B2%BE%E6%B2%B9%E6%93%B4%E9%A6%99-%E8%92%BC%E6%9C%A8%E6%9D%9C%E6%9D%BE.png"}
        ];
        const blessingWords = [
            "🌸 哇！空氣中散發著迷人花香，房間變得好療癒！",
            "✨ 異味怪獸被香氛魔法嚇得落荒而逃！",
            "🌷 滿屋芬芳，連花草精靈都忍不住駐足跳舞了！"
        ];
        const CONFIG_CART_EMPTY_MSG = "百寶袋空空如也，快來挑選香氛寶物吧...";
        const CONFIG_EFFECT_ICON = "🌸";
        const CONFIG_CHECKOUT_TITLE = "香氛任務達成！";

        const itemDatabase = {};
        const myCart = {};
        const gridWrapper = document.getElementById('dynamic-product-grid');

        configProducts.forEach((prod) => {
            itemDatabase[prod.name] = { price: prod.price, imgUrl: prod.imgUrl };
            myCart[prod.name] = 0;
            const div = document.createElement('div');
            div.className = 'product-card';
            div.onclick = () => addProductLogic(prod.name);
            div.innerHTML = `
                <img src="${prod.imgUrl}" alt="${prod.name}" class="product-icon">
                <div style="font-weight: 800; font-size: 0.92rem; color: var(--ink);">${prod.name}</div>
                <div style="color: var(--primary-dark); font-weight: 900; margin-top: 6px; background: var(--light); padding: 2px 10px; border-radius: 999px; font-size: 0.88rem;">${prod.price} 金幣</div>
            `;
            gridWrapper.appendChild(div);
        });

        let model, webcam, labelContainer, maxPredictions;
        let isCamStarted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function makeBeepSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.frequency.value = 1000;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        function speakMagicWord(msg) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(msg);
                speech.lang = 'zh-TW';
                window.speechSynthesis.speak(speech);
            }
        }

        let lastItem = "", lastTime = 0;
        function addProductLogic(name) {
            if (myCart[name] === undefined) return;
            if (myCart[name] === 0) speakMagicWord("放入" + name);
            else makeBeepSound();
            myCart[name]++;
            renderCart();
        }

        async function startWebcam() {
            if (isCamStarted) return;
            document.getElementById('webcam-container').style.display = 'block';
            model = await tmImage.load(CONFIG_MODEL_URL + "model.json", CONFIG_MODEL_URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            webcam = new tmImage.Webcam(180, 180, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(webcamLoop);
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("result-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `<div class="prediction-label"><span class="item-name">..</span><span class="item-score">0%</span></div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>`;
                labelContainer.appendChild(row);
            }
            isCamStarted = true;
        }

        async function webcamLoop() {
            webcam.update();
            const predictions = await model.predict(webcam.canvas);
            const now = Date.now();
            for (let i = 0; i < maxPredictions; i++) {
                const name = predictions[i].className.trim();
                const score = predictions[i].probability;
                if (labelContainer.childNodes[i]) {
                    labelContainer.childNodes[i].querySelector('.item-name').innerText = name;
                    labelContainer.childNodes[i].querySelector('.item-score').innerText = (score * 100).toFixed(0) + "%";
                    labelContainer.childNodes[i].querySelector('.progress-bar-fill').style.width = (score * 100) + "%";
                }
                if (score > 0.90 && itemDatabase[name] && (name !== lastItem || now - lastTime > 4000)) {
                    lastItem = name;
                    lastTime = now;
                    addProductLogic(name);
                }
            }
            window.requestAnimationFrame(webcamLoop);
        }

        function renderCart() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = "";
            let sum = 0, count = 0;

            for (let name in myCart) {
                let qty = myCart[name];
                if (qty > 0) {
                    count++;
                    let price = itemDatabase[name].price;
                    sum += price * qty;
                    const item = document.createElement('div');
                    item.className = 'cart-item';
                    item.innerHTML = `
                        <div><strong>${name}</strong> <span style="font-size:0.82rem; opacity:0.8;">(${price}金幣)</span></div>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <button class="qty-btn" onclick="modQty('${name}', -1)">-</button>
                            <span style="margin: 0 4px; font-weight:bold;">${qty}</span>
                            <button class="qty-btn" onclick="modQty('${name}', 1)">+</button>
                        </div>
                    `;
                    wrapper.appendChild(item);
                }
            }
            if (count === 0) {
                wrapper.innerHTML = `<p style="text-align:center; color:#9A8C7E; padding:18px; font-size:0.88rem;">${CONFIG_CART_EMPTY_MSG}</p>`;
            }
            document.getElementById('magic-total').innerText = sum + " 金幣";

            const bBox = document.getElementById('blessing-section');
            if (bBox) {
                if (sum >= 20) {
                    bBox.classList.add('unlocked');
                    document.getElementById('blessing-title').innerText = "✨ 已獲得精靈評語";
                    document.getElementById('blessing-display').innerText = blessingWords[Math.floor(Math.random() * blessingWords.length)];
                } else {
                    bBox.classList.remove('unlocked');
                    document.getElementById('blessing-title').innerText = "🔒 滿 20 金幣解鎖精靈評語";
                    document.getElementById('blessing-display').innerText = "";
                }
            }
        }

        function modQty(name, amt) {
            myCart[name] += amt;
            if (myCart[name] < 0) myCart[name] = 0;
            renderCart();
        }

        function createEffectRain() {
            for (let i = 0; i < 35; i++) {
                const item = document.createElement('div');
                item.className = 'petal';
                item.innerText = CONFIG_EFFECT_ICON;
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(item);
                setTimeout(() => item.remove(), 4000);
            }
        }

        function triggerCheckout() {
            let total = parseInt(document.getElementById('magic-total').innerText);
            if (total === 0) return alert("百寶袋還是空的喔！");
            speakMagicWord(CONFIG_CHECKOUT_TITLE);
            document.getElementById('success-modal').classList.add('show');
            createEffectRain();
        }

        function closeModalWindow() {
            document.getElementById('success-modal').classList.remove('show');
            for (let k in myCart) myCart[k] = 0;
            renderCart();
        }
        renderCart();
    </script>
</body>
</html>
