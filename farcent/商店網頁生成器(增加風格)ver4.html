    <style>

            --primary-accent: #8E24AA;
            --bg-gradient: linear-gradient(135deg, #1A0B2E 0%, #2D114D 50%, #15002A 100%);
            --panel-bg: rgba(255, 255, 255, 0.97);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        body { background: var(--bg-gradient); color: #2C3E50; padding: 25px 15px; min-height: 100vh; }
        .main-wrapper { max-width: 1250px; margin: 0 auto; background: var(--panel-bg); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); }
        .header-title { text-align: center; margin-bottom: 25px; }
        .header-title h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(45deg, #4A0E4E, #8E24AA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 950px) { .grid-layout { grid-template-columns: 1fr; } }
        
        .section-card { background: #FFFFFF; border: 2px solid #EAECEE; border-radius: 16px; padding: 20px; margin-bottom: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .section-title { font-size: 1.15rem; font-weight: 900; color: var(--primary-accent); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 2px dashed #F2F4F4; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 700; margin-bottom: 5px; color: #34495E; font-size: 0.9rem; }
        input[type="text"], input[type="number"], input[type="url"], select { width: 100%; padding: 9px 12px; border: 2px solid #D5D8DC; border-radius: 8px; font-size: 0.9rem; background: #FAFAFA; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary-accent); outline: none; background: #FFF; box-shadow: 0 0 0 3px rgba(142, 36, 170, 0.15); }
        
        .select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .select-grid { grid-template-columns: 1fr; } }

        .product-item { background: #F8F9F9; border: 2px dashed #BDC3C7; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .btn-remove { background: #EC7063; color: white; border: none; padding: 3px 8px; border-radius: 5px; cursor: pointer; float: right; font-weight: bold; font-size: 0.8rem; }
        .btn-add { background: #2ECC71; color: white; border: none; width: 100%; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .btn-generate { background: linear-gradient(135deg, #8E24AA, #4A0E4E); color: white; border: none; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: 900; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(142, 36, 170, 0.3); }
        .btn-generate:hover { transform: translateY(-2px); }

</head>

<script>

                    <div id="blessing-display" style="font-weight: bold; margin-top: 5px; color: var(--primary); font-size:0.9rem;"></div>
                </div>` : ''}

                <button class="btn" onclick="triggerCheckout()"><i class="fa-solid fa-sparkles"></i> 詠唱結帳咒語</button>

                ${optBlessingLoc === 'loc-cart' ? `
                <div class="blessing-box" id="blessing-section">
                    <h5 id="blessing-title">🔒 滿 20 金幣解鎖精靈評語</h5>
                    <div id="blessing-display" style="font-weight: bold; margin-top: 5px; color: var(--primary); font-size:0.9rem;"></div>
                </div>` : ''}
            </div>

        ${optLayoutArch === 'layout-sidebar' ? '</div><div class="right-main">' : ''}

            <!-- 商品展示櫃 -->
            <div class="card area-products">
                ${optBlessingLoc === 'loc-product' ? `
                <div class="blessing-box" id="blessing-section" style="margin-bottom:12px;">
                    <h5 id="blessing-title">🔒 滿 20 金幣解鎖精靈評語</h5>
                    <div id="blessing-display" style="font-weight: bold; margin-top: 5px; color: var(--primary); font-size:0.9rem;"></div>
                </div>` : ''}
                <div class="card-title"><i class="fa-solid fa-broom"></i> 精靈展示櫃 (點選召喚)</div>
                <div class="product-grid" id="dynamic-product-grid"></div>
            </div>

            ${optBlessingLoc === 'loc-bottom' ? `
            <div class="card area-blessing" style="grid-column: span 2;">
                <div class="blessing-box" id="blessing-section">
                    <h4 id="blessing-title">🔒 滿 20 金幣解鎖精靈評語</h4>
                    <div id="blessing-display" style="font-weight: bold; margin-top: 6px; color: var(--primary);"></div>
                </div>
            </div>` : ''}

        ${optLayoutArch === 'layout-sidebar' ? '</div></div>' : '</div>'}

        ${optBlessingLoc === 'loc-floating' ? `
        <div style="position:fixed; bottom:20px; right:20px; z-index:99;">
            <div class="blessing-box" id="blessing-section" style="background:white; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
                <h5 id="blessing-title">🔒 滿 20 金幣解鎖</h5>
                <div id="blessing-display" style="font-weight: bold; margin-top: 3px; color: var(--primary); font-size:0.85rem;"></div>
            </div>
        </div>` : ''}

        ${optBlessingLoc === 'loc-footer' ? `
        <div class="blessing-box" id="blessing-section" style="margin-top:20px;">
            <h5 id="blessing-title">🔒 滿 20 金幣解鎖精靈評語</h5>
            <div id="blessing-display" style="font-weight: bold; margin-top: 5px; color: var(--primary);"></div>
        </div>` : ''}
    </div>

    <!-- 結帳彈窗 -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-window">
            <i class="fa-solid fa-crown" style="font-size: 3.5rem; color: #F1C40F; margin-bottom: 10px;"></i>
            <h2>清掃任務達成！</h2>
            <p style="margin: 12px 0; color:#555;">🎉 恭喜你成功召喚驅塵神器，家裡變得閃亮晶晶！</p>
            <button class="btn" onclick="closeModalWindow()">太棒了！</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"><\/script>
    <script>
        const CONFIG_MODEL_URL = ${JSON.stringify(modelUrl)};
        const configProducts = ${JSON.stringify(products)};
        const blessingWords = ["🧹 哇！地板乾淨到可以當鏡子照了！", "✨ 灰塵怪獸被你嚇得拔腿就跑！", "🌿 乾淨的家會引來幸運精靈喔！"];

        const itemDatabase = {};
        const myCart = {};
        const gridWrapper = document.getElementById('dynamic-product-grid');

        configProducts.forEach((prod) => {
            itemDatabase[prod.name] = { price: prod.price, imgUrl: prod.imgUrl };
            myCart[prod.name] = 0;
            const div = document.createElement('div');
            div.className = 'product-card';
            div.onclick = () => addProductLogic(prod.name);
            div.innerHTML = \`
                <img src="\${prod.imgUrl}" class="product-icon">
                <div style="font-weight:bold; font-size:0.9rem;">\${prod.name}</div>
                <div style="color:#E67E22; font-weight:900; margin-top:3px;">\${prod.price} 金幣</div>
            \`;
            gridWrapper.appendChild(div);
        });

        let model, webcam, labelContainer, maxPredictions;
        let isCamStarted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function makeBeepSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.frequency.value = 1000; gain.gain.value = 0.1;
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(); osc.stop(audioContext.currentTime + 0.1);
        }

        function speakMagicWord(msg) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(msg);
                speech.lang = 'zh-TW';
                window.speechSynthesis.speak(speech);
            }
        }

        let lastItem = "", lastTime = 0;
        function addProductLogic(name) {
            if (myCart[name] === undefined) return;
            if (myCart[name] === 0) speakMagicWord("放入" + name);
            else makeBeepSound();
            myCart[name]++;
            renderCart();
        }

        async function startWebcam() {
            if (isCamStarted) return;
            document.getElementById('webcam-container').style.display = 'block';
            model = await tmImage.load(CONFIG_MODEL_URL + "model.json", CONFIG_MODEL_URL + "metadata.json");
            maxPredictions = model.getTotalClasses();
            webcam = new tmImage.Webcam(320, 240, true);
            await webcam.setup(); await webcam.play();
            window.requestAnimationFrame(webcamLoop);
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("result-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = \`<div class="prediction-label"><span class="item-name">..</span><span class="item-score">0%</span></div><div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>\`;
                labelContainer.appendChild(row);
            }
            isCamStarted = true;
        }

        async function webcamLoop() {
            webcam.update();
            const predictions = await model.predict(webcam.canvas);
            const now = Date.now();
            for (let i = 0; i < maxPredictions; i++) {
                const name = predictions[i].className.trim();
                const score = predictions[i].probability;
                if (labelContainer.childNodes[i]) {
                    labelContainer.childNodes[i].querySelector('.item-name').innerText = name;
                    labelContainer.childNodes[i].querySelector('.item-score').innerText = (score * 100).toFixed(0) + "%";
                    labelContainer.childNodes[i].querySelector('.progress-bar-fill').style.width = (score * 100) + "%";
                }
                if (score > 0.90 && itemDatabase[name] && (name !== lastItem || now - lastTime > 4000)) {
                    lastItem = name; lastTime = now;
                    addProductLogic(name);
                }
            }
            window.requestAnimationFrame(webcamLoop);
        }

        function renderCart() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = "";
            let sum = 0, count = 0;

            for (let name in myCart) {
                let qty = myCart[name];
                if (qty > 0) {
                    count++;
                    let price = itemDatabase[name].price;
                    sum += price * qty;
                    const item = document.createElement('div');
                    item.className = 'cart-item';
                    item.innerHTML = \`
                        <div><strong>\${name}</strong> <span style="font-size:0.8rem; opacity:0.8;">(\${price}金幣)</span></div>
                        <div>
                            <button class="qty-btn" onclick="modQty('\${name}', -1)">-</button>
                            <span style="margin: 0 4px; font-weight:bold;">\${qty}</span>
                            <button class="qty-btn" onclick="modQty('\${name}', 1)">+</button>
                        </div>
                    \`;
                    wrapper.appendChild(item);
                }
            }
            if (count === 0) wrapper.innerHTML = '<p style="text-align:center; color:#999; padding:15px; font-size:0.85rem;">百寶袋空空如也...</p>';
            document.getElementById('magic-total').innerText = sum + " 金幣";

            const bBox = document.getElementById('blessing-section');
            if (bBox) {
                if (sum >= 20) {
                    bBox.classList.add('unlocked');
                    document.getElementById('blessing-title').innerText = "✨ 已獲得精靈評語";
                    document.getElementById('blessing-display').innerText = blessingWords[Math.floor(Math.random()*blessingWords.length)];
                } else {
                    bBox.classList.remove('unlocked');
                    document.getElementById('blessing-title').innerText = "🔒 滿 20 金幣解鎖精靈評語";
                    document.getElementById('blessing-display').innerText = "";
                }
            }
        }

        function modQty(name, amt) {
            myCart[name] += amt;
            if (myCart[name] < 0) myCart[name] = 0;
            renderCart();
        }

        function createFlowerRain() {
            for (let i = 0; i < 35; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.innerText = '🌸';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 4000);
            }
        }

        function triggerCheckout() {
            let total = parseInt(document.getElementById('magic-total').innerText);
            if (total === 0) return alert("百寶袋還是空的喔！");
            speakMagicWord("清掃挑戰成功！");
            document.getElementById('success-modal').classList.add('show');
            createFlowerRain();
        }

        function closeModalWindow() {
            document.getElementById('success-modal').classList.remove('show');
            for (let k in myCart) myCart[k] = 0;
            renderCart();
        }
        renderCart();
    <\/script>
</body>
</html>`;

        const blob = new Blob([template], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
