<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質感居家 · 產品專區</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #777777;
            --accent-color: #8c857b;
            --border-color: #e8e5e0;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
            line-height: 1.8;
            letter-spacing: 0.05em;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 12px;
            color: #2c2a29;
            letter-spacing: 0.15em;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 300;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px 80px;
            flex: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 40px 24px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
            border-color: var(--accent-color);
        }

        .product-card .card-content h2 {
            font-size: 1.15rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #2c2a29;
        }

        .product-card .card-content p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .card-action {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent-color);
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            padding-bottom: 2px;
            align-self: center;
        }

        .card-action::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--accent-color);
            opacity: 0.3;
            transition: var(--transition);
        }

        .product-card:hover .card-action::after {
            opacity: 1;
        }

        footer {
            background-color: #f7f5f0;
            border-top: 1px solid var(--border-color);
            padding: 30px 20px;
            text-align: center;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 0.08em;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            header {
                padding: 50px 20px 30px;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
