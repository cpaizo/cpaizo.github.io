<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪄 AI 智能魔法商店網頁生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7D3C98;
            --bg: #F5EEF8;
            --card-border: #BB8FCE;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: #2E4053;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border: 4px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 0px var(--card-border);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
        }
        h3 {
            color: #5B2C6F;
            border-bottom: 2px dashed var(--card-border);
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #5B2C6F;
            font-size: 0.95rem;
        }
        input[type="text"], input[type="number"], input[type="url"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--card-border);
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .product-item {
            background: #FBFAFC;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        .btn-add {
            background: #27AE60;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-remove {
            background: #E74C3C;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
        }
        .btn-generate {
            background: linear-gradient(to bottom, #BB8FCE, var(--primary));
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0px #5B2C6F;
            margin-top: 20px;
        }
        .btn-generate:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🪄 AI 智能魔法商店網頁生成器</h1>
    
    <h3>🏪 1. 基本設定與模型</h3>
    <div class="form-group">
        <label for="storeName">商店名稱：</label>
        <input type="text" id="storeName" value="🌸 花仙子 × 驅塵氏：閃亮城堡的魔法清潔工坊 🌸">
    </div>

    <div class="form-group">
        <label for="promoText">促銷標語：</label>
        <input type="text" id="promoText" value="✨ 揮動驅塵魔法棒！召喚森林精靈，把家裡的灰塵怪獸通通變不見！ ✨">
    </div>

    <div class="form-group">
        <label for="modelUrl">Teachable Machine 模型網址（結尾須為 /）：</label>
        <input type="url" id="modelUrl" value="https://teachablemachine.withgoogle.com/models/XMd01LdS0/">
    </div>

    <h3>💬 2. 介面與對話框文字設定</h3>
    <div class="form-row">
        <div class="form-group">
            <label for="titleCamera">AI 鏡頭區標題：</label>
            <input type="text" id="titleCamera" value="召喚魔法陣 (AI 鏡頭)">
        </div>
        <div class="form-group">
            <label for="btnCamera">開啟相機按鈕：</label>
            <input type="text" id="btnCamera" value="啟動魔法水晶球 (開啟相機)">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="titleCart">購物車區標題：</label>
            <input type="text" id="titleCart" value="我的清潔百寶袋 (購物車)">
        </div>
        <div class="form-group">
            <label for="titleProducts">商品櫥窗標題：</label>
            <input type="text" id="titleProducts" value="手動點選召喚 (精靈展示櫃)">
        </div>
    </div>

    <div class="form-group">
        <label for="emptyCartText">購物車空空如也提示語：</label>
        <input type="text" id="emptyCartText" value="✨ 百寶袋空空如也，快用鏡頭召喚驅塵神器，把灰塵變不見！">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="titleCheckout">結帳櫃檯標題：</label>
            <input type="text" id="titleCheckout" value="魔法結帳櫃檯">
        </div>
        <div class="form-group">
            <label for="btnCheckout">結帳按鈕文字：</label>
            <input type="text" id="btnCheckout" value="詠唱結帳咒語">
        </div>
    </div>

    <div class="form-group">
        <label for="titleBlessing">滿額彩蛋區標題：</label>
        <input type="text" id="titleBlessing" value="🔒 滿額隱藏魔法：清掃小精靈的評語">
    </div>

    <h3>📦 3. 商品清單設定</h3>
    <div id="product-list">
        <!-- 動態增加商品表單區 -->
    </div>
    <button class="btn-add" onclick="addProductForm()">+ 新增商品</button>

    <button class="btn-generate" onclick="generateAndDownload()">🚀 點我下載生成專屬 HTML 網頁</button>
</div>

<script>
    // 預設商品資料
    const defaultProducts = [
        { name: "驅塵氏黏塵滾輪", price: 6, imgUrl: "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW8602XXF.png" },
        { name: "驅塵氏抗菌濕拖巾-木質麝香", price: 4, imgUrl: "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW7068WXF.png" },
        { name: "驅塵氏雙軌密封夾鏈袋(中)", price: 5, imgUrl: "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW7782XXF.png" },
        { name: "驅塵氏香氛環保清潔袋-薰衣草(中)(3入)", price: 4, imgUrl: "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW7917VBF.png" }
    ];

    const productContainer = document.getElementById('product-list');

    function addProductForm(data = { name: '', price: 5, imgUrl: '' }) {
        const div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML = `
            <button class="btn-remove" onclick="this.parentElement.remove()">刪除</button>
            <div style="margin-bottom:8px;">
                <label>商品名稱：</label>
                <input type="text" class="prod-name" value="${data.name}" required>
            </div>
            <div style="margin-bottom:8px;">
                <label>商品金額 (金幣)：</label>
                <input type="number" class="prod-price" value="${data.price}" min="1" required>
            </div>
            <div>
                <label>商品圖片網址：</label>
                <input type="url" class="prod-img" value="${data.imgUrl}" placeholder="https://..." required>
            </div>
        `;
        productContainer.appendChild(div);
    }

    // 載入預設商品
    defaultProducts.forEach(p => addProductForm(p));

    function generateAndDownload() {
        // 抓取基礎設定
        const storeName = document.getElementById('storeName').value;
        const promoText = document.getElementById('promoText').value;
        let modelUrl = document.getElementById('modelUrl').value.trim();
        if (!modelUrl.endsWith('/')) modelUrl += '/';

        // 抓取自訂對話框/標題文字
        const txtTitleCamera = document.getElementById('titleCamera').value;
        const txtBtnCamera = document.getElementById('btnCamera').value;
        const txtTitleCart = document.getElementById('titleCart').value;
        const txtTitleProducts = document.getElementById('titleProducts').value;
        const txtEmptyCartText = document.getElementById('emptyCartText').value;
        const txtTitleCheckout = document.getElementById('titleCheckout').value;
        const txtBtnCheckout = document.getElementById('btnCheckout').value;
        const txtTitleBlessing = document.getElementById('titleBlessing').value;

        // 收集商品資料
        const productItems = document.querySelectorAll('.product-item');
        const products = [];
        productItems.forEach(item => {
            const name = item.querySelector('.prod-name').value;
            const price = parseInt(item.querySelector('.prod-price').value) || 0;
            const imgUrl = item.querySelector('.prod-img').value;
            if (name) {
                products.push({ name, price, imgUrl });
            }
        });

        // HTML 核心模板
        const template = `<!DOCTYPE html>

    <style>

            box-shadow: 0 8px 20px rgba(195, 155, 211, 0.4); border-bottom: 5px dashed white; position: relative;
        }
        header h1 {
            font-family: 'Noto Sans TC', 'Mochiy Pop One', sans-serif; font-weight: 900; font-size: 2.6rem;
            color: #4A235A; letter-spacing: 4px;

        .product-card:hover { transform: scale(1.02) rotate(0.5deg); background: #FFFFF4; }

        .qty-btn { background: #F5EEF8; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; color: var(--primary-purple); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: var(--border-purple); color: white; }

        .blessing-icon { font-size: 3rem; color: #9B59B6; margin: 8px 0; display: inline-block; transition: transform 0.3s; }

    <script>
        const CONFIG_STORE_NAME = ${JSON.stringify(storeName)};

        const itemDatabase = {};
        const myCart = {};
        const gridWrapper = document.getElementById('dynamic-product-grid');
        gridWrapper.innerHTML = "";

        configProducts.forEach((prod, index) => {
            itemDatabase[prod.name] = { price: prod.price };
            myCart[prod.name] = 0;
            const cardDiv = document.createElement('div');
            cardDiv.className = 'product-card';
            cardDiv.style = 'display: flex; align-items: center; gap: 20px; padding: 16px; border: 1px solid #ebdef0; border-radius: 8px; background: #fff; cursor: pointer;';
            cardDiv.onclick = function() { addProductManually(prod.name); };
            cardDiv.innerHTML = \`
                <div class="product-icon" style="flex: 0 0 120px; width: 120px; display: flex; justify-content: center; align-items: center;">
                    <img src="\${prod.imgUrl}" alt="\${prod.name}" style="width: 100%; height: 120px; object-fit: contain;">
                </div>
                <div style="flex: 1; text-align: left; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; flex-wrap: wrap;">
                    <span class="product-name">\${index + 1}.\${prod.name}</span>
                    <span class="product-price">(\${prod.price} 金幣)</span>
                </div>
            \`;
            gridWrapper.appendChild(cardDiv);
        });

        let model, webcam, labelContainer, maxPredictions;
        let isCamStarted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function makeBeepSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioContext.currentTime); 
            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1); 
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(); osc.stop(audioContext.currentTime + 0.1);
        }

        function makeMagicSound(frequency, duration) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine'; osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.08, audioContext.currentTime);
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(); osc.stop(audioContext.currentTime + duration);
        }

        function speakMagicWord(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const speech = new SpeechSynthesisUtterance(message);
                speech.lang = 'zh-TW'; speech.rate = 1.1;
                window.speechSynthesis.speak(speech);
            }
        }

        let lastScannedItem = ""; lastScannedTime = 0;
        function addProductLogic(name) {
            if (myCart[name] === undefined) return;
            if (myCart[name] === 0) {
                myCart[name] = 1; speakMagicWord("發現" + name + "，已放入購物車");
            } else {
                myCart[name]++; makeBeepSound();
            }
            renderCart();
        }

        function addProductManually(name) { addProductLogic(name); }

        async function startWebcam() {
            if (isCamStarted) return;
            const jsonURL = CONFIG_MODEL_URL + "model.json";
            const metaURL = CONFIG_MODEL_URL + "metadata.json";
            try {
                document.getElementById('webcam-container').style.display = 'block';
                model = await tmImage.load(jsonURL, metaURL);
                maxPredictions = model.getTotalClasses();
                webcam = new tmImage.Webcam(320, 240, true); 
                await webcam.setup(); await webcam.play();
                window.requestAnimationFrame(webcamTrackingLoop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("result-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const row = document.createElement("div");
                    row.className = "prediction-row";
                    row.innerHTML = \`
                        <div class="prediction-label">
                            <span class="item-name">載入中...</span>
                            <span class="item-score">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"></div>
                        </div>
                    \`;
                    labelContainer.appendChild(row);
                }
                isCamStarted = true;
                speakMagicWord("AI 辨識鏡頭已開啟！");
            } catch (err) {
                console.error(err);
                alert("開啟鏡頭失敗！請檢查權限與模型網址是否填寫正確。");
            }
        }

        async function webcamTrackingLoop() {
            webcam.update(); await runAiPrediction();
            window.requestAnimationFrame(webcamTrackingLoop);
        }

        async function runAiPrediction() {
            const predictionResult = await model.predict(webcam.canvas);
            const currentTime = Date.now();
            for (let i = 0; i < maxPredictions; i++) {
                const className = predictionResult[i].className.trim();
                const scoreValue = predictionResult[i].probability;
                const UI_rows = labelContainer.childNodes;
                if (UI_rows[i]) {
                    UI_rows[i].querySelector('.item-name').innerText = className;
                    UI_rows[i].querySelector('.item-score').innerText = (scoreValue * 100).toFixed(0) + "%";
                    UI_rows[i].querySelector('.progress-bar-fill').style.width = (scoreValue * 100) + "%";
                }
                if (scoreValue > 0.90 && itemDatabase[className] !== undefined) {
                    if (className !== lastScannedItem || (currentTime - lastScannedTime) > 5000) {
                        lastScannedItem = className; lastScannedTime = currentTime;
                        addProductLogic(className);
                    }
                }
            }
        }

        function createFlowerRain() {
            const flowers = ['✨', '🧹', '💎', '🌟', '🧼', '🔮', '💜'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.fontSize = Math.random() * 15 + 15 + 'px'; 
                    petal.style.animationDuration = Math.random() * 3 + 2 + 's'; 
                    document.body.appendChild(petal);
                    setTimeout(() => { petal.remove(); }, 5000);
                }, i * 100);
            }
        }

        function renderCart() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = "";
            let sumRaw = 0, sumDiscount = 0, totalItemsCount = 0;
            for (let name in myCart) {
                let quantity = myCart[name];
                if (quantity > 0) {
                    totalItemsCount++;
                    let pricePerUnit = itemDatabase[name].price;
                    let lineTotalRaw = pricePerUnit * quantity;
                    sumRaw += lineTotalRaw;
                    let lineDiscount = 0;
                    if (quantity >= 3) {
                        lineDiscount = Math.round(lineTotalRaw * 0.2);
                        sumDiscount += lineDiscount;
                    }
                    const rowHtml = document.createElement('div');
                    rowHtml.className = 'cart-item';
                    rowHtml.innerHTML = \`
                        <div>
                            <div class="cart-item-name">\${name}</div>
                            <div class="cart-item-details">
                                \${pricePerUnit} 金幣/件 \${quantity >= 3 ? '<span style="color:#8E44AD; background:#F5EEF8; padding:1px 5px; border-radius:5px; margin-left:5px;">滿3件享8折</span>' : ''}
                            </div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="modifyQty('\${name}', -1)">-</button>
                            <span style="font-weight:bold; min-width:15px; text-align:center;">\${quantity}</span>
                            <button class="qty-btn" onclick="modifyQty('\${name}', 1)">+</button>
                            <span style="font-weight:bold; min-width:50px; text-align:right;">\${lineTotalRaw - lineDiscount}金幣</span>
                        </div>
                    \`;
                    wrapper.appendChild(rowHtml);
                }
            }
            if (totalItemsCount === 0) {
                wrapper.innerHTML = \`<p style="color: #A18E96; text-align: center; padding: 20px;">\${TEXT_EMPTY_CART}</p>\`;
            }
            let sumFinal = sumRaw - sumDiscount;
            document.getElementById('raw-total').innerText = sumRaw + " 金幣";
            document.getElementById('discount-save').innerText = "-" + sumDiscount + " 金幣";
            document.getElementById('magic-total').innerText = sumFinal + " 金幣";

            const blessingBox = document.getElementById('blessing-section');
            const blessingDisplay = document.getElementById('blessing-display');
            if (sumFinal >= 20) {
                if (!blessingBox.classList.contains('unlocked')) {
                    blessingBox.classList.add('unlocked');
                    blessingDisplay.innerText = blessingWords[Math.floor(Math.random() * blessingWords.length)];
                    speakMagicWord("成功觸發彩蛋評語！");
                }
            } else {
                blessingBox.classList.remove('unlocked');
                blessingDisplay.innerText = "";
            }
        }

        function modifyQty(name, amount) {
            if (myCart[name] === undefined) return;
            myCart[name] += amount;
            if (myCart[name] < 0) myCart[name] = 0;
            if (amount > 0) makeBeepSound();
            renderCart();
        }

        function triggerCheckout() {
            let totalCost = parseInt(document.getElementById('magic-total').innerText);
            if (totalCost === 0) {
                speakMagicWord(TEXT_CHECKOUT_EMPTY_SPEECH);
                alert(TEXT_CHECKOUT_EMPTY_ALERT);
                return;
            }
            makeMagicSound(523.25, 0.15);
            setTimeout(() => makeMagicSound(659.25, 0.15), 150);
            setTimeout(() => makeMagicSound(783.99, 0.3), 300);
            speakMagicWord(TEXT_CHECKOUT_SUCCESS_SPEECH);
            document.getElementById('success-modal').classList.add('show');
            createFlowerRain();
        }

        function closeModalWindow() {
            document.getElementById('success-modal').classList.remove('show');
            for (let name in myCart) myCart[name] = 0;
            renderCart();
        }
    <\/script>
    <footer class="footer-disclaimer">
        <p>【教學示範聲明】</p>
        <p>本網站僅供資訊教學與功能模擬測試使用，非真實營運之網路商店。</p>
    </footer>
</body>
</html>`;

</script>
