<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 AI 智能魔法清潔工坊｜無印和風便當盒</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --muji-bg: #FAF8F5;         /* 和紙米白底色 */
            --muji-surface: #FFFFFF;    /* 純白卡片 */
            --muji-tint: #F3EFE8;       /* 溫潤暖米底 */
            --muji-wood: #9C7A54;       /* 原木褐主色 */
            --muji-wood-dark: #7A5E3E;  /* 深木褐懸停 */
            --muji-ink: #3A3A3A;        /* 炭墨灰文字 */
            --muji-muted: #7A756E;      /* 暖灰副標 */
            --muji-border: #E5DFD5;     /* 細緻髮絲邊框 */
            --muji-sage: #6B8E78;       /* 和風抹茶點綴 */
            --header-muji: linear-gradient(135deg, #F6F2EA 0%, #ECE5D8 60%, #E2D8C6 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 日系無印／和風簡約風背景 */
        body {
            background-color: var(--muji-bg);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(226, 216, 198, 0.35) 0%, transparent 32%),
                radial-gradient(circle at 88% 20%, rgba(107, 142, 120, 0.08) 0%, transparent 34%);
            color: var(--muji-ink);
            padding-bottom: 36px;
            overflow-x: hidden;
            letter-spacing: 0.02em;
        }

        /* 日系無印標題橫幅 */
        header {
            background: var(--header-muji);
            padding: 36px 20px 32px 20px;
            text-align: center;
            color: var(--muji-ink);
            border-bottom: 1.5px solid var(--muji-border);
            box-shadow: 0 4px 16px rgba(58, 58, 58, 0.04);
        }

        .muji-kicker {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--muji-wood);
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--muji-border);
            padding: 3px 14px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        header h1 {
            font-weight: 900;
            font-size: 2.05rem;
            color: var(--muji-ink);
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.96rem;
            font-weight: 500;
            color: var(--muji-muted);
            background: rgba(255, 255, 255, 0.78);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 999px;
            border: 1px solid var(--muji-border);
        }

        /* 便當盒／模組卡片式主版面（Bento Grid） */
        .bento-container {
            max-width: 1140px;
            margin: 28px auto 0 auto;
            padding: 0 18px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            align-items: start;
        }

        .bento-ai { grid-column: span 5; }
        .bento-products { grid-column: span 7; }
        .bento-cart { grid-column: span 7; }
        .bento-checkout { grid-column: span 5; }

        @media (max-width: 920px) {
            .bento-ai, .bento-products, .bento-cart, .bento-checkout {
                grid-column: span 12;
            }
        }

        .card {
            background: var(--muji-surface);
            border: 1.5px solid var(--muji-border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 6px 18px rgba(58, 58, 58, 0.04);
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            border-color: #CFC6B8;
            box-shadow: 0 8px 22px rgba(58, 58, 58, 0.06);
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--muji-border);
        }

        .card-title {
            font-weight: 800;
            font-size: 1.18rem;
            color: var(--muji-ink);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.03em;
        }

        .bento-tag {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--muji-wood);
            background: var(--muji-tint);
            border: 1px solid var(--muji-border);
            padding: 2px 9px;
            border-radius: 6px;
        }

        .btn {
            background: var(--muji-wood);
            color: #FFFFFF;
            border: none;
            padding: 12px 20px;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
            letter-spacing: 0.04em;
        }

        .btn:hover {
            background: var(--muji-wood-dark);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* 方形 Webcam 鏡頭容器（約 180 x 180 px，維持純方形） */
        #webcam-container {
            width: 180px;
            height: 180px;
            min-width: 20px;
            aspect-ratio: 1 / 1;
            margin: 14px auto 8px auto;
            background: var(--muji-tint);
            border: 2px solid var(--muji-wood);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #webcam-container canvas {
            width: 180px !important;
            height: 180px !important;
            object-fit: cover;
            display: block;
        }

        #result-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prediction-row {
            background: var(--muji-tint);
            border: 1px solid var(--muji-border);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .prediction-label {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.88rem;
            color: var(--muji-ink);
        }

        .progress-bar-bg {
            background: #E2DDD4;
            height: 7px;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--muji-sage);
            height: 100%;
            width: 0%;
            transition: width 0.15s ease;
            border-radius: 999px;
        }

        /* 便當盒商品格（2x2 模組卡） */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        @media (max-width: 560px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: var(--muji-bg);
            border: 1.5px solid var(--muji-border);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--muji-wood);
            background: #FFFFFF;
        }

        .product-icon {
            flex: 0 0 76px;
            width: 76px;
            height: 76px;
            background: #FFFFFF;
            border: 1px solid var(--muji-border);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
            text-align: left;
        }

        .product-name {
            font-weight: 700;
            font-size: 0.94rem;
            color: var(--muji-ink);
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .product-price {
            color: var(--muji-wood);
            font-weight: 800;
            font-size: 0.88rem;
            display: inline-block;
            background: #FFFFFF;
            border: 1px solid var(--muji-border);
            padding: 1px 9px;
            border-radius: 999px;
        }

        /* 購物車百寶袋 */
        .cart-list {
            height: 260px;
            overflow-y: auto;
            border: 1.5px dashed var(--muji-border);
            border-radius: 12px;
            padding: 12px;
            background: var(--muji-bg);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--muji-border);
            background: #FFFFFF;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 0.94rem;
            color: var(--muji-ink);
        }

        .cart-item-details {
            font-size: 0.82rem;
            color: var(--muji-muted);
            margin-top: 2px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: var(--muji-tint);
            border: 1px solid var(--muji-border);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: 700;
            color: var(--muji-ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--muji-wood);
            color: #FFFFFF;
            border-color: var(--muji-wood);
        }

        /* 結算與精靈評語 */
        .price-summary {
            background: var(--muji-bg);
            border: 1px solid var(--muji-border);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .total-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.18rem;
            font-weight: 900;
            color: var(--muji-ink);
        }

        .blessing-box {
            text-align: center;
            padding: 16px 14px;
            background: var(--muji-bg);
            border: 1.5px dashed var(--muji-border);
            border-radius: 14px;
            margin-top: 14px;
            opacity: 0.65;
            transition: all 0.3s ease;
        }

        .blessing-box.unlocked {
            opacity: 1;
            background: #F4F9F5;
            border-style: solid;
            border-color: var(--muji-sage);
        }

        .blessing-icon {
            font-size: 2.2rem;
            color: var(--muji-wood);
            margin: 8px 0;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .blessing-box.unlocked .blessing-icon {
            color: var(--muji-sage);
            animation: pulseBeat 2s infinite alternate;
        }

        @keyframes pulseBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        #blessing-title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--muji-ink);
        }

        #blessing-display {
            font-weight: 700;
            font-size: 0.96rem;
            color: var(--muji-wood-dark);
            margin-top: 6px;
            min-height: 22px;
            line-height: 1.5;
        }

        .petal {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) translateX(100px); opacity: 0; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(58, 58, 58, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: #FFFFFF;
            border: 2px solid var(--muji-border);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 14px 30px rgba(58, 58, 58, 0.14);
        }

        .modal-window i {
            font-size: 3.4rem;
            color: var(--muji-wood);
            margin-bottom: 12px;
        }

        .modal-window h2 {
            font-weight: 900;
            color: var(--muji-ink);
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .modal-window p {
            font-size: 0.98rem;
            color: var(--muji-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .footer-disclaimer {
            max-width: 1140px;
            margin: 34px auto 0 auto;
            text-align: center;
            padding: 20px 16px 8px 16px;
            color: var(--muji-muted);
            font-size: 0.86rem;
            line-height: 1.65;
            border-top: 1px solid var(--muji-border);
        }

        .footer-disclaimer p {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="muji-kicker">MUJI STYLE · BENTO WORKBENCH</div>
        <h1 id="dynamic-store-name">片刻載入中...</h1>
        <p id="dynamic-promo-text">片刻載入中...</p>
    </header>

    <main class="bento-container">
        <!-- 模組 1：AI 鏡頭辨識 -->
        <section class="card bento-ai">
            <div class="card-header-row">
                <div class="card-title">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--muji-wood);"></i>
                    <span>召喚魔法陣 (AI 鏡頭)</span>
                </div>
                <span class="bento-tag">AI CAM</span>
            </div>
            <button class="btn" onclick="startWebcam()">
                <i class="fa-solid fa-camera-retro"></i> 啟動魔法水晶球 (開啟相機)
            </button>
            <div id="webcam-container" style="display: none;"></div>
            <div id="result-container"></div>
        </section>

        <!-- 模組 2：精靈展示櫃 -->
        <section class="card bento-products">
            <div class="card-header-row">
                <div class="card-title">
                    <i class="fa-solid fa-broom" style="color: var(--muji-wood);"></i>
                    <span>手動點選召喚 (精靈展示櫃)</span>
                </div>
                <span class="bento-tag">4 ITEMS</span>
            </div>
            <div class="product-grid" id="dynamic-product-grid"></div>
        </section>

        <!-- 模組 3：清潔百寶袋 -->
        <section class="card bento-cart">
            <div class="card-header-row">
                <div class="card-title">
                    <i class="fa-solid fa-cart-shopping" style="color: var(--muji-wood);"></i>
                    <span>我的清潔百寶袋 (購物車)</span>
                </div>
                <span class="bento-tag">BAG</span>
            </div>
            <div class="cart-list" id="cart-items-wrapper"></div>
        </section>

        <!-- 模組 4：魔法結帳櫃檯與精靈評語 -->
        <section class="card bento-checkout">
            <div class="card-header-row">
                <div class="card-title">
                    <i class="fa-solid fa-coins" style="color: var(--muji-wood);"></i>
                    <span>魔法結帳櫃檯</span>
                </div>
                <span class="bento-tag">CHECKOUT</span>
            </div>
            <div class="price-summary">
                <div class="total-line">
                    <span>得力助手結算價：</span>
                    <span id="magic-total" style="color: var(--muji-wood-dark);">0 金幣</span>
                </div>
            </div>
            <button class="btn" style="margin-top: 14px;" onclick="triggerCheckout()">
                <i class="fa-solid fa-sparkles"></i> 詠唱結帳咒語
            </button>
            <div class="blessing-box" id="blessing-section">
                <h3 id="blessing-title">🔒 滿額隱藏魔法：清掃小精靈的評語</h3>
                <p id="blessing-subtitle" style="font-size: 0.84rem; color: var(--muji-muted); margin-top: 4px;">
                    當結算價達到 <span style="color: var(--muji-wood-dark); font-weight: 800;">20 金幣</span> 時即會召喚精靈！
                </p>
                <div class="blessing-icon" id="blessing-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div id="blessing-display"></div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="success-modal">
        <div class="modal-window">
            <i class="fa-solid fa-sparkles"></i>
            <h2 id="modal-title">清掃任務達成！</h2>
            <p id="modal-body-text">恭喜你成功召喚驅塵神器，家裡變得閃亮晶晶！</p>
            <button class="btn" onclick="closeModalWindow()">太棒了！</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
        const CONFIG_STORE_NAME = "花仙子 × 驅塵氏：閃亮城堡的魔法清潔工坊";
        const CONFIG_PROMO_TEXT = "揮動驅塵魔法棒！召喚森林精靈，把家裡的灰塵怪獸通通變不見！";
        const CONFIG_MODEL_URL = "https://teachablemachine.withgoogle.com/models/CfAjkqqbw/";
        const configProducts = [
            {
                "name": "驅塵氏黏塵滾輪",
                "price": 3,
                "imgUrl": "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW8602XXF.png"
            },
            {
                "name": "驅塵氏抗菌濕拖巾-木質麝香",
                "price": 1,
                "imgUrl": "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW7068WXF.png"
            },
            {
                "name": "驅塵氏雙軌密封夾鏈袋(中)",
                "price": 1,
                "imgUrl": "https://www.farcent.com.tw/files/products/Product%20Pictures/W0/P-WW7782XXF.png"
            },
            {
                "name": "驅塵氏靜電除塵紙(無香)",
                "price": 1,
                "imgUrl": "https://cpaizo.github.io/farcent/photos/04%E5%B1%85%E5%AE%B6%E6%89%93%E6%8E%83%E5%B7%A5%E5%85%B7/04%E9%A9%85%E5%A1%B5%E6%B0%8F%E9%9D%9C%E9%9B%BB%E9%99%A4%E5%A1%B5%E7%B4%99(%E7%84%A1%E9%A6%99).png"
            }
        ];

        const TEXT_EMPTY_CART = "百寶袋空空如也，快用鏡頭召喚驅塵神器，把灰塵變不見！";
        const TEXT_CHECKOUT_EMPTY_ALERT = "百寶袋裡面還沒有東西可以結帳喔！";
        const TEXT_CHECKOUT_EMPTY_SPEECH = "清潔百寶袋還是空的唷，快去挑選清掃助手吧！";
        const TEXT_CHECKOUT_SUCCESS_SPEECH = "鋪好亮晶晶魔法！清掃挑戰成功！";
        const blessingWords = [
            "🧹 哇！地板乾淨到可以當鏡子照了呢！",
            "✨ 灰塵怪獸看到你的驅塵神器，都嚇得拔腿就跑囉！",
            "🌿 家裡亮晶晶，心情也會跟著變得超級好！",
            "💎 一塵不染的空間，就是最棒的魔法治癒！",
            "🌟 乾淨的家會引來幸運精靈，祝你今天好運連連！"
        ];

        document.getElementById('dynamic-store-name').innerText = CONFIG_STORE_NAME;
        document.getElementById('dynamic-promo-text').innerText = CONFIG_PROMO_TEXT;
        document.getElementById('cart-items-wrapper').innerHTML = `<p style="color: #7A756E; text-align: center; padding: 24px 12px; font-size: 0.9rem;">${TEXT_EMPTY_CART}</p>`;

        const itemDatabase = {};
        const myCart = {};
        const gridWrapper = document.getElementById('dynamic-product-grid');
        gridWrapper.innerHTML = "";

        configProducts.forEach((prod, index) => {
            itemDatabase[prod.name] = { price: prod.price };
            myCart[prod.name] = 0;
            const cardDiv = document.createElement('div');
            cardDiv.className = 'product-card';
            cardDiv.onclick = function() { addProductManually(prod.name); };
            cardDiv.innerHTML = `
                <div class="product-icon">
                    <img src="${prod.imgUrl}" alt="${prod.name}">
                </div>
                <div class="product-info">
                    <div class="product-name">${index + 1}. ${prod.name}</div>
                    <span class="product-price">${prod.price} 金幣</span>
                </div>
            `;
            gridWrapper.appendChild(cardDiv);
        });

        let model, webcam, labelContainer, maxPredictions;
        let isCamStarted = false;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function makeBeepSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioContext.currentTime);
            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        function makeMagicSound(frequency, duration) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.08, audioContext.currentTime);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }

        function speakMagicWord(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(message);
                speech.lang = 'zh-TW';
                speech.rate = 1.1;
                window.speechSynthesis.speak(speech);
            }
        }

        let lastScannedItem = "", lastScannedTime = 0;
        function addProductLogic(name) {
            if (myCart[name] === undefined) return;
            if (myCart[name] === 0) {
                myCart[name] = 1;
                speakMagicWord("發現" + name + "，已放入清潔百寶袋");
            } else {
                myCart[name]++;
                makeBeepSound();
            }
            renderCart();
        }

        function addProductManually(name) { addProductLogic(name); }

        async function startWebcam() {
            if (isCamStarted) return;
            const jsonURL = CONFIG_MODEL_URL + "model.json";
            const metaURL = CONFIG_MODEL_URL + "metadata.json";
            try {
                document.getElementById('webcam-container').style.display = 'block';
                model = await tmImage.load(jsonURL, metaURL);
                maxPredictions = model.getTotalClasses();
                webcam = new tmImage.Webcam(180, 180, true);
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(webcamTrackingLoop);
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("result-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const row = document.createElement("div");
                    row.className = "prediction-row";
                    row.innerHTML = `
                        <div class="prediction-label">
                            <span class="item-name">載入中...</span>
                            <span class="item-score">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"></div>
                        </div>
                    `;
                    labelContainer.appendChild(row);
                }
                isCamStarted = true;
                speakMagicWord("AI 辨識精靈鏡頭已順利開啟！");
            } catch (err) {
                console.error(err);
                alert("開啟鏡頭失敗！請檢查權限與模型網址是否填寫正確。");
            }
        }

        async function webcamTrackingLoop() {
            webcam.update();
            await runAiPrediction();
            window.requestAnimationFrame(webcamTrackingLoop);
        }

        async function runAiPrediction() {
            const predictionResult = await model.predict(webcam.canvas);
            const currentTime = Date.now();
            for (let i = 0; i < maxPredictions; i++) {
                const className = predictionResult[i].className.trim();
                const scoreValue = predictionResult[i].probability;
                const UI_rows = labelContainer.childNodes;
                if (UI_rows[i]) {
                    UI_rows[i].querySelector('.item-name').innerText = className;
                    UI_rows[i].querySelector('.item-score').innerText = (scoreValue * 100).toFixed(0) + "%";
                    UI_rows[i].querySelector('.progress-bar-fill').style.width = (scoreValue * 100) + "%";
                }
                if (scoreValue > 0.90 && itemDatabase[className] !== undefined) {
                    if (className !== lastScannedItem || (currentTime - lastScannedTime) > 5000) {
                        lastScannedItem = className;
                        lastScannedTime = currentTime;
                        addProductLogic(className);
                    }
                }
            }
        }

        function createFlowerRain() {
            const flowers = ['✨', '🧹', '💎', '🌟', '🧼', '🔮', '🍃'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.fontSize = Math.random() * 15 + 15 + 'px';
                    petal.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(petal);
                    setTimeout(() => { petal.remove(); }, 5000);
                }, i * 100);
            }
        }

        function renderCart() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = "";
            let sumRaw = 0, totalItemsCount = 0;

            for (let name in myCart) {
                let quantity = myCart[name];
                if (quantity > 0) {
                    totalItemsCount++;
                    let pricePerUnit = itemDatabase[name].price;
                    let lineTotalRaw = pricePerUnit * quantity;
                    sumRaw += lineTotalRaw;

                    const rowHtml = document.createElement('div');
                    rowHtml.className = 'cart-item';
                    rowHtml.innerHTML = `
                        <div>
                            <div class="cart-item-name">${name}</div>
                            <div class="cart-item-details">${pricePerUnit} 金幣/件</div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="modifyQty('${name}', -1)">-</button>
                            <span style="font-weight:bold; min-width:15px; text-align:center;">${quantity}</span>
                            <button class="qty-btn" onclick="modifyQty('${name}', 1)">+</button>
                            <span style="font-weight:bold; min-width:50px; text-align:right;">${lineTotalRaw}金幣</span>
                        </div>
                    `;
                    wrapper.appendChild(rowHtml);
                }
            }
            if (totalItemsCount === 0) {
                wrapper.innerHTML = `<p style="color: #7A756E; text-align: center; padding: 24px 12px; font-size: 0.9rem;">${TEXT_EMPTY_CART}</p>`;
            }

            let sumFinal = sumRaw;
            document.getElementById('magic-total').innerText = sumFinal + " 金幣";

            const blessingBox = document.getElementById('blessing-section');
            const blessingDisplay = document.getElementById('blessing-display');
            if (sumFinal >= 20) {
                if (!blessingBox.classList.contains('unlocked')) {
                    blessingBox.classList.add('unlocked');
                    document.getElementById('blessing-title').innerText = "✨ 已召喚家事精靈！獲得清掃評語";
                    blessingDisplay.innerText = blessingWords[Math.floor(Math.random() * blessingWords.length)];
                    speakMagicWord("成功召喚家事精靈，送你一段清掃評語！");
                }
            } else {
                blessingBox.classList.remove('unlocked');
                document.getElementById('blessing-title').innerText = "🔒 滿額隱藏魔法：清掃小精靈的評語";
                blessingDisplay.innerText = "";
            }
        }

        function modifyQty(name, amount) {
            if (myCart[name] === undefined) return;
            myCart[name] += amount;
            if (myCart[name] < 0) myCart[name] = 0;
            if (amount > 0) makeBeepSound();
            renderCart();
        }

        function triggerCheckout() {
            let totalCost = parseInt(document.getElementById('magic-total').innerText);
            if (totalCost === 0) {
                speakMagicWord(TEXT_CHECKOUT_EMPTY_SPEECH);
                alert(TEXT_CHECKOUT_EMPTY_ALERT);
                return;
            }
            makeMagicSound(523.25, 0.15);
            setTimeout(() => makeMagicSound(659.25, 0.15), 150);
            setTimeout(() => makeMagicSound(783.99, 0.3), 300);
            speakMagicWord(TEXT_CHECKOUT_SUCCESS_SPEECH);
            document.getElementById('success-modal').classList.add('show');
            createFlowerRain();
        }

        function closeModalWindow() {
            document.getElementById('success-modal').classList.remove('show');
            for (let name in myCart) myCart[name] = 0;
            renderCart();
        }
    </script>
