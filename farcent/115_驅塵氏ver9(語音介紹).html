<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 AI 智能魔法清潔工坊 🧹</title>
    <!-- 引入 Google Fonts 活潑可愛的中文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS 變數：驅塵氏魔幻深紫與魔力紫風格 */
        :root {
            --primary-purple: #7D3C98;   
            --light-purple: #EBDEF0;     
            --magic-yellow: #FEF9E7;     
            --text-dark: #2E4053;        
            --bg-soft: #F5EEF8;          
            --border-purple: #BB8FCE;    
            --btn-purple: #8E44AD;       
            --btn-hover-purple: #9B59B6; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-soft);
            background-image: radial-gradient(#E8DAEF 10%, transparent 10%),
                              radial-gradient(#FDEDEC 10%, transparent 10%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-dark);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* 標題區 */
        header {
            background: linear-gradient(135deg, #C39BD3, #F9E79F);
            padding: 35px 20px; 
            text-align: center;
            box-shadow: 0 8px 20px rgba(195, 155, 211, 0.4);
            border-bottom: 5px dashed white;
            position: relative;
        }

        header h1 {
            font-family: 'Noto Sans TC', 'Mochiy Pop One', sans-serif;
            font-weight: 900;       
            font-size: 2.6rem;      
            color: #4A235A;         
            letter-spacing: 4px;    
            text-shadow: 2px 2px 0px #FFFFFF, -2px -2px 0px #FFFFFF, 2px -2px 0px #FFFFFF, -2px 2px 0px #FFFFFF;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2E4053;
            background: rgba(255, 255, 255, 0.8);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .upper-layout {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 20px;
        }

        .lower-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .upper-layout, .lower-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border: 4px solid var(--border-purple);
            border-radius: 25px;
            padding: 22px;
            box-shadow: 0 8px 0px var(--border-purple);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;      
            color: #5B2C6F;         
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }

        .btn {
            background: linear-gradient(to bottom, #BB8FCE, var(--btn-purple));
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0px #6C3483;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #6C3483;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* 視訊攝影機區 */
        #webcam-container {
            width: 320px;       
            height: 240px;      
            margin: 15px auto 0 auto;
            background: #F5EEF8;
            border: 3px dashed var(--border-purple);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        /* AI 辨識區 */
        #result-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .prediction-row {
            background: #FBFAFC;
            border: 1px solid #F5EEF8;
            border-radius: 12px;
            padding: 8px 12px;
        }

        .prediction-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .progress-bar-bg {
            background: #EAECEE;
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(to right, #C39BD3, #F9E79F);
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 10px;
        }

        /* 商品展示區 */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: #FFFDF9;
            border: 2px solid #F9E79F;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(142, 68, 173, 0.2);
            background: #FFFFF4;
            border-color: #BB8FCE;
        }

        .product-card.hover-active {
            animation: magicGlow 1.2s infinite alternate;
        }

        @keyframes magicGlow {
            0% {
                box-shadow: 0 0 10px #BB8FCE, inset 0 0 5px #F9E79F;
                border-color: #8E44AD;
            }
            100% {
                box-shadow: 0 0 25px #8E44AD, inset 0 0 15px #F9E79F;
                border-color: #F39C12;
            }
        }

        .product-icon {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .product-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .product-price {
            color: #E74C3C;
            font-weight: 900;
        }

        /* 購物車清單 */
        .cart-list {
            height: 350px;
            overflow-y: auto;
            border: 2px solid #E5EBE8;
            border-radius: 15px;
            padding: 10px;
            background: #FAFAFA;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 2px dashed #F5EEF8;
            background: #FFF;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .cart-item-details {
            font-size: 0.85rem;
            color: #7F8C8D;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #F5EEF8;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: var(--primary-purple);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--border-purple);
            color: white;
        }

        /* 計價統計區 */
        .price-summary {
            background: #FBFAFC;
            border: 2px solid #F5EEF8;
            border-radius: 15px;
            padding: 15px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .discount-text {
            color: #8E44AD;
            font-weight: bold;
        }

        .total-line {
            border-top: 3px dashed var(--border-purple);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2C3E50;
        }

        /* 隱藏評語區樣式 */
        .blessing-box {
            text-align: center;
            padding: 18px;
            background: #FBF4FC;
            border: 3px dashed #D7BDE2;
            border-radius: 20px;
            margin-top: 15px;
            opacity: 0.4;
            transition: all 0.4s ease;
        }

        .blessing-box.unlocked {
            opacity: 1;
            background: #F5EEF8;
            border-style: solid;
            box-shadow: 0 0 15px rgba(215, 189, 226, 0.6);
        }

        .blessing-icon {
            font-size: 3rem;
            color: #9B59B6;
            margin: 8px 0;
            display: inline-block;
            transition: transform 0.3s;
        }
        
        .blessing-box.unlocked .blessing-icon {
            animation: pulseBeat 2s infinite alternate;
        }

        @keyframes pulseBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        #blessing-title {
            font-weight: 900;
            font-size: 1.2rem;
        }

        #blessing-display {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #8E44AD;
            margin-top: 8px;
            min-height: 24px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        /* 懸停魔法彈出圖片視窗 (Lightbox) */
        .preview-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 35, 58, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none; /* 防止遮擋滑鼠造成 onmouseleave 誤觸發 */
        }

        .preview-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .preview-modal {
            background: #FFFDF9;
            border: 5px solid var(--border-purple);
            border-radius: 20px;
            padding: 25px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(187, 143, 206, 0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; 
        }

        .preview-overlay.show .preview-modal {
            transform: scale(1);
        }

        .preview-modal img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .preview-title {
            font-weight: 900;
            color: var(--primary-purple);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        /* 結帳成功彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: white;
            border: 5px solid var(--border-purple);
            border-radius: 25px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transform: scale(0.7);
            transition: all 0.3s ease;
        }

        .modal-overlay.show .modal-window {
            transform: scale(1);
        }

        .modal-window i {
            font-size: 4.5rem;
            color: var(--primary-purple);
            margin-bottom: 15px;
        }

        .modal-window h2 {
            font-weight: 900;
            color: var(--primary-purple);
            margin-bottom: 10px;
        }

        .modal-window p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .petal {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) translateX(100px);
                opacity: 0;
            }
        }

        .footer-disclaimer {
            width: 100%;
            text-align: center;
            padding: 20px 10px;
            background-color: #f8f9fa;
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
            border-top: 1px solid #e9ecef;
        }

        .footer-disclaimer p {
            margin: 0;
        }    
    </style>
</head>
<body>

    <header>
        <h1 id="dynamic-store-name">片刻載入中...</h1>

        <div class="lower-layout">

                    <div class="summary-line total-line">

                    <i class="fa-solid fa-sparkles"></i> 詠唱結帳咒語

            </div>
        </div>
    </div>

    <!-- 懸停 1 秒跳出的魔法彈出視窗 (Lightbox) -->

            <img id="preview-img" src="" alt="預覽圖片">

    </div>

    <!-- 結帳成功彈窗 -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-window">
            <i class="fa-solid fa-sparkles"></i>
            <h2 id="modal-title">清掃任務達成！</h2>
            <p id="modal-body-text">🎉 恭喜你成功召喚驅塵神器，家裡變得閃亮晶晶！</p>
            <button class="btn" onclick="closeModalWindow()">太棒了！</button>

        document.getElementById('dynamic-store-name').innerText = CONFIG_STORE_NAME;
        document.getElementById('dynamic-promo-text').innerText = CONFIG_PROMO_TEXT;
        document.getElementById('cart-items-wrapper').innerHTML = `<p style="color: #A18E96; text-align: center; padding: 20px;">${TEXT_EMPTY_CART}</p>`;

        const itemDatabase = {};
        const myCart = {};
        const scannedHistory = {}; // 紀錄 AI 鏡頭是否已掃描過該商品
        let hoverTimer = null;
        let isHovered = false; // 追蹤目前滑鼠是否在卡片內

        const gridWrapper = document.getElementById('dynamic-product-grid');
        gridWrapper.innerHTML = "";

        configProducts.forEach((prod, index) => {
            itemDatabase[prod.name] = { price: prod.price };
            myCart[prod.name] = 0;

            const cardDiv = document.createElement('div');
            cardDiv.className = 'product-card';
            cardDiv.style = 'display: flex; align-items: center; gap: 20px; padding: 16px; border: 1px solid #ebdef0; border-radius: 8px; background: #fff; cursor: pointer;';
            
            // 點擊：直接加入購物車，播放「已加入購物車」簡短音效與提示
            cardDiv.onclick = function(e) { 
                clearTimeout(hoverTimer);
                cardDiv.classList.remove('hover-active');
                closePreviewModal();
                
                myCart[prod.name]++;
                makeBeepSound();
                speakMagicWord("已將" + prod.name + "加入購物車");
                renderCart();
            };

            // 滑鼠進入卡片 (僅在進入時觸發一次)
            cardDiv.onmouseenter = function() {
                isHovered = true;
                clearTimeout(hoverTimer);

                // 啟動 1 秒計時，卡片內移動不影響
                hoverTimer = setTimeout(() => {
                    if (isHovered) {
                        cardDiv.classList.add('hover-active');
                        makeMagicSound(600, 0.2);
                        showPreviewModal(prod.name, prod.hoverImgUrl || prod.imgUrl);
                        
                        // 懸停滿 1 秒後觸發專屬導購介紹語音
                        const speechText = PRODUCT_SPEECH_SCRIPTS[prod.name] || (prod.name + "，售價" + prod.price + "金幣");
                        speakMagicWord(speechText);
                    }
                }, 1000); 
            };

            // 滑鼠離開卡片區域時才清空並關閉
            cardDiv.onmouseleave = function() {
                isHovered = false;
                clearTimeout(hoverTimer);
                cardDiv.classList.remove('hover-active');
                closePreviewModal();
            };

            cardDiv.innerHTML = `
                <div class="product-icon" style="flex: 0 0 120px; width: 120px; display: flex; justify-content: center; align-items: center;">
                    <img src="${prod.imgUrl}" alt="${prod.name}" style="width: 100%; height: 120px; object-fit: contain;">
                </div>
                <div style="flex: 1; text-align: left; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; flex-wrap: wrap;">
                    <span class="product-name">${index + 1}.${prod.name}</span>
                    <span class="product-price">(${prod.price} 金幣)</span>
                </div>
            `;
            gridWrapper.appendChild(cardDiv);
        });

        // 控制懸停彈窗顯示與關閉
        function showPreviewModal(title, imgSrc) {
            document.getElementById('preview-title-text').innerText = "✨ " + title + " ✨";
            document.getElementById('preview-img').src = imgSrc;
            document.getElementById('hover-preview-overlay').classList.add('show');
        }

        function closePreviewModal() {
            document.getElementById('hover-preview-overlay').classList.remove('show');
        }

        let model, webcam, labelContainer, maxPredictions;
        let isCamStarted = false;

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function makeBeepSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioContext.currentTime); 
            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1); 
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.1);
        }

        function makeMagicSound(frequency, duration) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.08, audioContext.currentTime);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }

        function speakMagicWord(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const speech = new SpeechSynthesisUtterance(message);
                speech.lang = 'zh-TW';
                speech.rate = 1.1;
                window.speechSynthesis.speak(speech);
            }
        }

        let lastScannedItem = "";
        let lastScannedTime = 0;

        // 加入商品邏輯：控制第 1 次語音與第 2 次嗶聲
        function addProductLogic(name, isAiCamera = false) {
            if (myCart[name] === undefined) return;
            
            myCart[name]++;

            if (isAiCamera) {
                if (!scannedHistory[name]) {
                    // 第 1 次：記錄狀態、播音效，並講話「發現...」
                    scannedHistory[name] = true;
                    makeBeepSound();
                    speakMagicWord("發現" + name + "，已放入購物車");
                } else {
                    // 第 2 次（含）以上：只發出 嗶 一聲
                    makeBeepSound();
                }
            } else {
                // 手動點擊卡片
                makeBeepSound();
                speakMagicWord("已將" + name + "加入購物車");
            }

            renderCart();
        }

        async function startWebcam() {
            if (isCamStarted) return;
            const jsonURL = CONFIG_MODEL_URL + "model.json";
            const metaURL = CONFIG_MODEL_URL + "metadata.json";

            try {
                document.getElementById('webcam-container').style.display = 'block';
                model = await tmImage.load(jsonURL, metaURL);
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(320, 240, true); 
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(webcamTrackingLoop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);

                labelContainer = document.getElementById("result-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const row = document.createElement("div");
                    row.className = "prediction-row";
                    row.innerHTML = `
                        <div class="prediction-label">
                            <span class="item-name">載入中...</span>
                            <span class="item-score">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill"></div>
                        </div>
                    `;
                    labelContainer.appendChild(row);
                }
                isCamStarted = true;
                speakMagicWord("AI 辨識精靈鏡頭已順利開啟！");
            } catch (err) {
                console.error(err);
                alert("開啟鏡頭失敗！請檢查權限與模型網址是否填寫正確。");
            }
        }

        async function webcamTrackingLoop() {
            webcam.update();
            await runAiPrediction();
            window.requestAnimationFrame(webcamTrackingLoop);
        }

        async function runAiPrediction() {
            const predictionResult = await model.predict(webcam.canvas);
            const currentTime = Date.now();

            for (let i = 0; i < maxPredictions; i++) {
                const className = predictionResult[i].className.trim();
                const scoreValue = predictionResult[i].probability;

                const UI_rows = labelContainer.childNodes;
                if (UI_rows[i]) {
                    UI_rows[i].querySelector('.item-name').innerText = className;
                    UI_rows[i].querySelector('.item-score').innerText = (scoreValue * 100).toFixed(0) + "%";
                    UI_rows[i].querySelector('.progress-bar-fill').style.width = (scoreValue * 100) + "%";
                }

                if (scoreValue > 0.90 && itemDatabase[className] !== undefined) {
                    if (className !== lastScannedItem || (currentTime - lastScannedTime) > 5000) {
                        lastScannedItem = className;
                        lastScannedTime = currentTime;
                        addProductLogic(className, true);
                    }
                }
            }
        }

        function createFlowerRain() {
            const flowers = ['✨', '🧹', '💎', '🌟', '🧼', '🔮', '💜'];
            const totalPetals = 40;

            for (let i = 0; i < totalPetals; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.fontSize = Math.random() * 15 + 15 + 'px'; 
                    petal.style.animationDuration = Math.random() * 3 + 2 + 's'; 
                    document.body.appendChild(petal);
                    setTimeout(() => { petal.remove(); }, 5000);
                }, i * 100);
            }
        }

        function renderCart() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = "";

            let sumRaw = 0;
            let sumDiscount = 0;
            let totalItemsCount = 0;

            for (let name in myCart) {
                let quantity = myCart[name];
                if (quantity > 0) {
                    totalItemsCount++;
                    let pricePerUnit = itemDatabase[name].price;
                    let lineTotalRaw = pricePerUnit * quantity;
                    sumRaw += lineTotalRaw;

                    let lineDiscount = 0;
                    if (quantity >= 3) {
                        lineDiscount = Math.round(lineTotalRaw * 0.2);
                        sumDiscount += lineDiscount;
                    }

                    const rowHtml = document.createElement('div');
                    rowHtml.className = 'cart-item';
                    rowHtml.innerHTML = `
                        <div>
                            <div class="cart-item-name">${name}</div>
                            <div class="cart-item-details">
                                ${pricePerUnit} 金幣/件 ${quantity >= 3 ? '<span style="color:#8E44AD; background:#F5EEF8; padding:1px 5px; border-radius:5px; margin-left:5px;">滿3件享8折</span>' : ''}
                            </div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="modifyQty('${name}', -1)">-</button>
                            <span style="font-weight:bold; min-width:15px; text-align:center;">${quantity}</span>
                            <button class="qty-btn" onclick="modifyQty('${name}', 1)">+</button>
                            <span style="font-weight:bold; min-width:50px; text-align:right;">${lineTotalRaw - lineDiscount}金幣</span>
                        </div>
                    `;
                    wrapper.appendChild(rowHtml);
                }
            }

            if (totalItemsCount === 0) {
                wrapper.innerHTML = `<p style="color: #A18E96; text-align: center; padding: 20px;">${TEXT_EMPTY_CART}</p>`;
            }

            let sumFinal = sumRaw - sumDiscount;

            document.getElementById('raw-total').innerText = sumRaw + " 金幣";
            document.getElementById('discount-save').innerText = "-" + sumDiscount + " 金幣";
            document.getElementById('magic-total').innerText = sumFinal + " 金幣";

            const blessingBox = document.getElementById('blessing-section');
            const blessingDisplay = document.getElementById('blessing-display');

            if (sumFinal >= 20) {
                if (!blessingBox.classList.contains('unlocked')) {
                    blessingBox.classList.add('unlocked');
                    document.getElementById('blessing-title').innerText = "✨ 已召喚家事精靈！獲得清掃評語";
                    const randomBlessing = blessingWords[Math.floor(Math.random() * blessingWords.length)];
                    blessingDisplay.innerText = randomBlessing;
                    speakMagicWord("成功召喚家事精靈，送你一段清掃評語！");
                }
            } else {
                blessingBox.classList.remove('unlocked');
                document.getElementById('blessing-title').innerText = "🔒 滿額隱藏魔法：清掃小精靈的評語";
                blessingDisplay.innerText = "";
            }
        }

        function modifyQty(name, amount) {
            if (myCart[name] === undefined) return;
            myCart[name] += amount;
            if (myCart[name] < 0) myCart[name] = 0;
            
            if (amount > 0) {
                makeBeepSound();
            }
            renderCart();
        }

        function triggerCheckout() {
            let totalCost = parseInt(document.getElementById('magic-total').innerText);
            if (totalCost === 0) {
                speakMagicWord(TEXT_CHECKOUT_EMPTY_SPEECH);
                alert(TEXT_CHECKOUT_EMPTY_ALERT);
                return;
            }

            makeMagicSound(523.25, 0.15); 
            setTimeout(() => makeMagicSound(659.25, 0.15), 150); 
            setTimeout(() => makeMagicSound(783.99, 0.3), 300); 
            
            speakMagicWord(TEXT_CHECKOUT_SUCCESS_SPEECH);

            document.getElementById('success-modal').classList.add('show');
            createFlowerRain();
        }

        function closeModalWindow() {
            document.getElementById('success-modal').classList.remove('show');
            
            // 清空購物車與掃描紀錄，讓下次重新購買時能再次聽到第 1 次語音
            for (let name in myCart) {
                myCart[name] = 0;
            }
            for (let name in scannedHistory) {
                delete scannedHistory[name];
            }

            renderCart();
        }
    </script>
