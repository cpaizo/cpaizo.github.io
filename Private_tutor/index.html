<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家教課時與費用管理</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    :root { --primary: #4A90E2; --bg: #F5F7FA; --card: #FFFFFF; --text: #333; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { text-align: center; padding: 12px; background: #EBF3FF; border-radius: 8px; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 14px; margin-bottom: 4px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #CCC; }
    .tab-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; background: #E0E0E0; color: #333; border-radius: 6px; text-align: center; font-size: 13px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .list-item { border-bottom: 1px solid #EEE; padding: 10px 0; font-size: 14px; }
    .list-item:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-done { background: #E6F4EA; color: #137333; }
    .badge-pending { background: #FEF7E0; color: #B06000; }
    .badge-cancel { background: #FCE8E6; color: #C5221F; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📚 家教課時與費用管理</h2>

    <!-- 頂部總覽儀表板 -->
    <div class="card">
      <div class="grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-remaining">--</div>
          <div class="stat-label">剩餘額度 (小時)</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-pending-exp" style="color: #E67E22;">$--</div>
          <div class="stat-label">未結清費用 (停車/材料)</div>
        </div>
      </div>
    </div>

    <!-- 功能頁籤切換 -->
    <div class="tab-group">
      <div class="tab-btn active" onclick="switchTab('schedule')">📅 預約排課</div>
      <div class="tab-btn" onclick="switchTab('deposit')">💰 家長儲值</div>
      <div class="tab-btn" onclick="switchTab('expense')">🚗 登記費用</div>
      <div class="tab-btn" onclick="switchTab('history')">📋 歷史明細</div>
    </div>

    <!-- 1. 預約排課表單 -->
    <div id="tab-schedule" class="tab-content active card">
      <h3>登記 / 預約上課</h3>
      <form id="form-schedule">
        <div class="form-group">
          <label>上課日期</label>
          <input type="date" id="sch-date" required>
        </div>
        <div class="grid">
          <div class="form-group">
            <label>開始時間</label>
            <input type="time" id="sch-start" value="13:00" required>
          </div>
          <div class="form-group">
            <label>結束時間</label>
            <input type="time" id="sch-end" value="16:00" required>
          </div>
        </div>
        <div class="form-group">
          <label>上課時數 (小時)</label>
          <input type="number" id="sch-hours" value="3" step="0.5" required>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="sch-parking" checked style="width:auto;"> 自動計入停車費 ($30/hr)</label>
        </div>
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="sch-note" placeholder="例如：Python 課程">
        </div>
        <button type="submit" id="btn-sch">送出登記</button>
      </form>
    </div>

    <!-- 2. 儲值表單 -->
    <div id="tab-deposit" class="tab-content card">
      <h3>收鐘點費 / 儲值</h3>
      <form id="form-deposit">
        <div class="form-group">
          <label>繳費日期</label>
          <input type="date" id="dep-date" required>
        </div>
        <div class="form-group">
          <label>實收鐘點費 ($)</label>
          <input type="number" id="dep-amount" value="15000" required>
        </div>
        <div class="form-group">
          <label>鐘點單價 ($/小時)</label>
          <input type="number" id="dep-rate" value="1000" required>
        </div>
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="dep-note" placeholder="例如：預收 15 小時">
        </div>
        <button type="submit" id="btn-dep">確認儲值</button>
      </form>
    </div>

    <!-- 3. 代墊費用表單 -->
    <div id="tab-expense" class="tab-content card">
      <h3>登記代墊費用 (停車費 / 材料費)</h3>
      <form id="form-expense">
        <div class="form-group">
          <label>發生日期</label>
          <input type="date" id="exp-date" required>
        </div>
        <div class="form-group">
          <label>費用類別</label>
          <select id="exp-category">
            <option value="停車費">停車費</option>
            <option value="材料費">材料費</option>
          </select>
        </div>
        <div class="form-group">
          <label>金額 ($)</label>
          <input type="number" id="exp-amount" placeholder="例如：350" required>
        </div>
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="exp-note" placeholder="例如：Micro:bit 開發板">
        </div>
        <button type="submit" id="btn-exp">新增費用</button>
      </form>
    </div>

    <!-- 4. 歷史明細列表 -->
    <div id="tab-history" class="tab-content card">
      <h3>近期紀錄</h3>
      <div id="history-list">載入中...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
