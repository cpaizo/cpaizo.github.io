<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級夢幻跑馬燈 (Class Marquee PWA)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons for friendly visual UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cute Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiypop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- PWA Web App Manifest embedded via Blob Data URI JS below -->
    <meta name="theme-color" content="#ec4899">
    <meta name="description" content="專為國小生設計的彩色互動跑馬燈，支援離線與全螢幕播放！">
    
    <style>
        /* 1. 自訂字型設定 (Custom Font Families) */
        .font-cute { font-family: 'Mochiypop One', 'Fredoka', cursive, sans-serif; }
        .font-sans-tc { font-family: 'Noto Sans TC', sans-serif; }
        .font-impact { font-family: 'Impact', 'Arial Black', sans-serif; }

        /* 2. 跑馬燈滾動動畫定義 (Scroll Animations) */
        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        @keyframes scroll-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        @keyframes bounce-blink {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        .animate-scroll-left {
            display: inline-block;
            white-space: nowrap;
            animation: scroll-left var(--speed, 10s) linear infinite;
        }
        .animate-scroll-right {
            display: inline-block;
            white-space: nowrap;
            animation: scroll-right var(--speed, 10s) linear infinite;
        }
        .animate-bounce-blink {
            display: inline-block;
            white-space: nowrap;
            animation: bounce-blink var(--speed, 2s) ease-in-out infinite;
        }

        /* 動畫暫停類別 (Pause state) */
        .paused {
            animation-play-state: paused !important;
        }

        /* 3. 飄浮背景特效的核心動畫 (Floating Particle Keyframes) */
        @keyframes floatUpAndRotate {
            0% {
                transform: translateY(110vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-15vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* 粒子元素基本樣式 (Ensuring correct Z-Index & bright visibility) */
        .floating-particle {
            position: absolute;
            pointer-events: none; /* 讓粒子不會阻擋滑鼠點擊 */
            user-select: none;
            will-change: transform, opacity;
            animation: floatUpAndRotate var(--duration, 6s) linear infinite;
            animation-delay: var(--delay, 0s);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
        }

        /* 4. 跑馬燈 LED 點陣外框發光效果 (LED Glow) */
        .led-glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
        }

        /* 隱藏滾動條 (Hide Scrollbars) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans-tc min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-pink-500 selection:text-white">

    <!-- JavaScript 邏輯控制區 (JS Logic & Particle Engine & PWA) -->
    <script>
        /* =============================================================
         * 1. 元素抓取 (DOM Elements Selection)
         * ============================================================= */
        const marqueeText = document.getElementById('marquee-text');
        const marqueeContainer = document.getElementById('marquee-container');
        const displayArea = document.getElementById('display-area');
        const textInput = document.getElementById('text-input');
        
        const speedSlider = document.getElementById('speed-slider');
        const speedValueText = document.getElementById('speed-value-text');
        
        const sizeSlider = document.getElementById('size-slider');
        const sizeValueText = document.getElementById('size-value-text');
        
        const fontSelect = document.getElementById('font-family-select');
        const textColorPicker = document.getElementById('text-color-picker');
        const bgColorPicker = document.getElementById('bg-color-picker');
        const glowToggleBtn = document.getElementById('glow-toggle-btn');
        
        const dirLeftBtn = document.getElementById('dir-left');
        const dirRightBtn = document.getElementById('dir-right');
        const dirBounceBtn = document.getElementById('dir-bounce');
        
        const pauseToggleBtn = document.getElementById('pause-toggle-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        const presetBtns = document.querySelectorAll('.preset-btn');
        const particlesContainer = document.getElementById('particles-container');
        const shapeBtns = document.querySelectorAll('.shape-btn');
        const particleDensitySlider = document.getElementById('particle-density-slider');
        const particleCountBadge = document.getElementById('particle-count-badge');

        // 狀態變數 (State Management)
        let isPaused = false;
        let isGlowing = false;
        let activeShape = 'stars';
        let particleCount = 18;

        /* =============================================================
         * 2. 跑馬燈文字與樣式控制 (Marquee Text & Style Handlers)
         * ============================================================= */
        
        // 即時文字更新
        textInput.addEventListener('input', (e) => {
            marqueeText.textContent = e.target.value || '請輸入文字...';
        });

        // 快速標語點擊帶入
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.textContent.trim();
                textInput.value = text;
                marqueeText.textContent = text;
            });
        });

        // 調整滾動速度
        speedSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            marqueeText.style.setProperty('--speed', `${val}s`);
            
            if (val <= 4) speedValueText.textContent = `快速 (${val}秒)`;
            else if (val <= 12) speedValueText.textContent = `中速 (${val}秒)`;
            else speedValueText.textContent = `慢速 (${val}秒)`;
        });

        // 調整文字大小
        sizeSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            marqueeText.style.fontSize = `${size}px`;
            sizeValueText.textContent = `${size} px`;
        });

        // 切換字型
        fontSelect.addEventListener('change', (e) => {
            marqueeText.className = marqueeText.className.replace(/font-\S+/g, '');
            marqueeText.classList.add(e.target.value);
        });

        // 文字與背景顏色
        textColorPicker.addEventListener('input', (e) => {
            marqueeText.style.color = e.target.value;
        });

        bgColorPicker.addEventListener('input', (e) => {
            displayArea.style.backgroundColor = e.target.value;
        });

        // 發光效果開關
        glowToggleBtn.addEventListener('click', () => {
            isGlowing = !isGlowing;
            if (isGlowing) {
                marqueeText.classList.add('led-glow');
                glowToggleBtn.classList.replace('bg-slate-800', 'bg-purple-600');
            } else {
                marqueeText.classList.remove('led-glow');
                glowToggleBtn.classList.replace('bg-purple-600', 'bg-slate-800');
            }
        });

        /* =============================================================
         * 3. 跑馬燈方向與暫停 (Direction & Playback Control)
         * ============================================================= */
        function setDirection(direction) {
            marqueeText.classList.remove('animate-scroll-left', 'animate-scroll-right', 'animate-bounce-blink');
            
            [dirLeftBtn, dirRightBtn, dirBounceBtn].forEach(btn => {
                btn.classList.replace('bg-pink-600', 'bg-slate-800');
                btn.classList.replace('text-white', 'text-slate-300');
            });

            if (direction === 'left') {
                marqueeText.classList.add('animate-scroll-left');
                dirLeftBtn.classList.replace('bg-slate-800', 'bg-pink-600');
                dirLeftBtn.classList.replace('text-slate-300', 'text-white');
            } else if (direction === 'right') {
                marqueeText.classList.add('animate-scroll-right');
                dirRightBtn.classList.replace('bg-slate-800', 'bg-pink-600');
                dirRightBtn.classList.replace('text-slate-300', 'text-white');
            } else if (direction === 'bounce') {
                marqueeText.classList.add('animate-bounce-blink');
                dirBounceBtn.classList.replace('bg-slate-800', 'bg-pink-600');
                dirBounceBtn.classList.replace('text-slate-300', 'text-white');
            }
        }

        dirLeftBtn.addEventListener('click', () => setDirection('left'));
        dirRightBtn.addEventListener('click', () => setDirection('right'));
        dirBounceBtn.addEventListener('click', () => setDirection('bounce'));

        // 暫停與繼續切換
        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                marqueeText.classList.add('paused');
                pauseIcon.classList.replace('fa-pause', 'fa-play');
                pauseToggleBtn.classList.add('bg-pink-600');
            } else {
                marqueeText.classList.remove('paused');
                pauseIcon.classList.replace('fa-play', 'fa-pause');
                pauseToggleBtn.classList.remove('bg-pink-600');
            }
        }

        pauseToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 避免觸發背景點擊產生粒子
            togglePause();
        });

        /* =============================================================
         * 4. 飄浮背景粒子引擎 (Robust Floating Particle Engine)
         * ============================================================= */
        
        // 圖案清單 (Shape dictionary)
        const particleIcons = {
            stars: ['⭐', '🌟', '💫', '✨', '🟡'],
            hearts: ['💖', '❤️', '💕', '🌸', '💘'],
            bubbles: ['🫧', '💧', '🔵', '⚪', '🫧'],
            sparkles: ['✨', '💎', '⚡', '🌙', '⭐']
        };

        // 清除並重構所有粒子
        function renderParticles() {
            particlesContainer.innerHTML = ''; // 清空舊元素
            
            if (activeShape === 'off') {
                particleCountBadge.textContent = '已關閉';
                return;
            }

            particleCountBadge.textContent = `${particleCount} 個粒子`;
            const shapes = particleIcons[activeShape] || particleIcons.stars;

            // 根據設定的數量建立粒子
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'floating-particle';
                
                // 隨機選擇圖案、大小、位置與動畫延遲
                const symbol = shapes[Math.floor(Math.random() * shapes.length)];
                const leftPos = Math.random() * 100; // 水平百分比 (0-100%)
                const size = Math.random() * 24 + 18; // 字型大小 (18px - 42px)
                const duration = Math.random() * 5 + 4; // 動畫週期 (4s - 9s)
                const delay = Math.random() * -10; // 負延遲能讓畫面開啟時就有粒子

                particle.textContent = symbol;
                particle.style.left = `${leftPos}%`;
                particle.style.fontSize = `${size}px`;
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.setProperty('--delay', `${delay}s`);

                particlesContainer.appendChild(particle);
            }
        }

        // 點擊跑馬燈看板時，動態生成互動爆發粒子 (Click Interaction)
        displayArea.addEventListener('click', (e) => {
            if (activeShape === 'off') return;

            const rect = displayArea.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            
            // 每次點擊產生 3 個快速飄升的驚喜粒子
            const shapes = particleIcons[activeShape] || particleIcons.stars;
            for (let i = 0; i < 3; i++) {
                const burstParticle = document.createElement('div');
                burstParticle.className = 'floating-particle';
                
                const symbol = shapes[Math.floor(Math.random() * shapes.length)];
                const size = Math.random() * 28 + 24;
                const offset = (Math.random() - 0.5) * 60; // 隨機偏移
                
                burstParticle.textContent = symbol;
                burstParticle.style.left = `${Math.max(2, Math.min(95, ((clickX + offset) / rect.width) * 100))}%`;
                burstParticle.style.fontSize = `${size}px`;
                burstParticle.style.setProperty('--duration', '3s');
                burstParticle.style.setProperty('--delay', '0s');

                particlesContainer.appendChild(burstParticle);

                // 動畫結束後自動清理，避免過多 DOM 元素累積
                setTimeout(() => burstParticle.remove(), 3000);
            }
        });

        // 粒子圖案按鈕切換事件
        shapeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                shapeBtns.forEach(b => {
                    b.classList.replace('bg-amber-500/30', 'bg-slate-800');
                    b.classList.replace('text-amber-200', 'text-slate-400');
                    b.classList.replace('border-amber-500/60', 'border-slate-700');
                });
                
                btn.classList.replace('bg-slate-800', 'bg-amber-500/30');
                btn.classList.replace('text-slate-400', 'text-amber-200');
                btn.classList.replace('border-slate-700', 'border-amber-500/60');
                
                activeShape = btn.getAttribute('data-shape');
                renderParticles();
            });
        });

        // 粒子密度數量調整
        particleDensitySlider.addEventListener('input', (e) => {
            particleCount = parseInt(e.target.value);
            if (activeShape !== 'off') {
                renderParticles();
            }
        });

        // 初始載入粒子
        renderParticles();

        /* =============================================================
         * 5. 全螢幕功能 (Fullscreen Handler)
         * ============================================================= */
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                displayArea.requestFullscreen().catch(err => {
                    alert(`無法切換至全螢幕: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        /* =============================================================
         * 6. PWA (Progressive Web App) 離線快取與安裝支援
         * ============================================================= */
        
        // 1. 動態建立 PWA Web Manifest (Blob URL)
        const manifestData = {
            name: "五年級夢幻跑馬燈",
            short_name: "夢幻跑馬燈",
            description: "國小五年級資訊課 - 彩色互動跑馬燈 PWA 網頁應用程式",
            start_url: "./",
            display: "standalone",
            background_color: "#020617",
            theme_color: "#ec4899",
            icons: [
                {
                    src: "https://placehold.co/192x192/ec4899/ffffff?text=跑馬燈",
                    sizes: "192x192",
                    type: "image/png"
                },
                {
                    src: "https://placehold.co/512x512/ec4899/ffffff?text=跑馬燈",
                    sizes: "512x512",
                    type: "image/png"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestUrl;
        document.head.appendChild(manifestLink);

        // 2. 註冊內嵌 Service Worker 實現離線使用
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'marquee-pwa-v2';
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open(CACHE_NAME).then((cache) => {
                            return cache.addAll(['./']);
                        })
                    );
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((res) => res || fetch(e.request))
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA Service Worker 註冊成功！'))
                    .catch((err) => console.log('Service Worker 註冊失敗:', err));
            });
        }

        // 3. PWA 安裝按鈕接管 (Install Prompt)
        let deferredPrompt;
        const pwaInstallBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaInstallBtn.classList.remove('hidden');
        });

        pwaInstallBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('使用者已安裝夢幻跑馬燈 PWA');
                }
                deferredPrompt = null;
                pwaInstallBtn.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
