<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>酷炫跑馬燈 PWA</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS 專屬圖示 -->
  <link id="appleIcon" rel="apple-touch-icon" href="">

  <!-- PWA Manifest -->
  <link id="pwaManifest" rel="manifest" href="">

  <!-- Tailwind CSS 樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google 字體與 VT323 LED 字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=VT323&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      touch-action: manipulation;
    }

    /* ========================================== */
    /* 使用 em 單位，讓描邊與發光隨著字體等比例放大縮小 */
    /* ========================================== */
    .glow-neon {
      text-shadow: 0 0 0.15em currentColor, 0 0 0.35em currentColor, 0 0 0.7em currentColor;
      -webkit-text-stroke: 0px transparent;
    }

    .glow-soft {
      text-shadow: 0 0 0.2em rgba(255, 255, 255, 0.9), 0 0 0.5em currentColor;
      -webkit-text-stroke: 0px transparent;
    }

    .glow-led {
      font-family: 'VT323', monospace;
      letter-spacing: 0.05em;
      text-shadow: 0 0 0.1em currentColor, 0 0 0.25em currentColor;
      -webkit-text-stroke: 0px transparent;
    }

    /* 火熱描邊：使用 em 單位，字體越大描邊越粗！ */
    .glow-stroke {
      -webkit-text-stroke: 0.045em #ffffff;
      text-shadow: 0 0 0.25em currentColor;
    }

    .glow-none {
      text-shadow: none;
      -webkit-text-stroke: 0px transparent;
    }

    /* 手機全螢幕相容模式 (CSS Fallback) */
    .css-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      border: none !important;
      border-radius: 0 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-x-hidden select-none">

  <!-- ========================================== -->
  <!-- 1. 跑馬燈舞台區 -->
  <!-- ========================================== -->
  <main id="marqueeStage" class="relative w-full h-[50vh] md:h-[55vh] overflow-hidden flex items-center justify-center border-b-4 border-indigo-500 shadow-2xl transition-all duration-300 bg-slate-950">
    
    <!-- 背景飄浮畫布 -->
    <canvas id="particleCanvas" class="absolute inset-0 z-0 pointer-events-auto block"></canvas>

    <!-- 跑馬燈文字區塊 -->
    <div id="marqueeContainer" class="absolute z-10 whitespace-nowrap flex items-center left-0 pointer-events-none">
      <span id="marqueeText" class="inline-block font-extrabold glow-neon">
        🌟 國小五年一班 加油！ 🚀
      </span>
    </div>

    <!-- 全螢幕切換按鈕 -->
    <button id="fullScreenBtn" onclick="toggleFullScreen()" class="absolute top-4 right-4 z-20 bg-indigo-600/90 hover:bg-indigo-500 text-white px-4 py-2 rounded-full backdrop-blur-md shadow-lg flex items-center gap-2 text-sm md:text-base border border-indigo-400 active:scale-95 transition-all duration-300">
      <span>📺</span> <span id="fullScreenText">全螢幕展示</span>
    </button>
  </main>

  <!-- ========================================== -->
  <!-- 2. 下方控制面板 (學生操作區) -->
  <!-- ========================================== -->
  <section class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
    
    <!-- 快速口號選單 -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-md">
      <label class="block text-sm font-bold text-indigo-300 mb-2">⚡ 快速選擇口號：</label>
      <div class="flex flex-wrap gap-2">
        <button onclick="setPreset('🏫 五年級加油！比賽拿第一！')" class="px-3 py-1.5 bg-indigo-900/60 hover:bg-indigo-700 text-indigo-200 text-sm rounded-xl border border-indigo-500/30">🏫 班級加油</button>
        <button onclick="setPreset('🎂 祝大家生日快樂！天天開心！')" class="px-3 py-1.5 bg-pink-900/60 hover:bg-pink-700 text-pink-200 text-sm rounded-xl border border-pink-500/30">🎂 生日祝福</button>
        <button onclick="setPreset('☀️ 今日天氣晴朗！放學去運動！')" class="px-3 py-1.5 bg-amber-900/60 hover:bg-amber-700 text-amber-200 text-sm rounded-xl border border-amber-500/30">☀️ 好心情</button>
        <button onclick="setPreset('🏆 資訊課 PWA 實作成功！')" class="px-3 py-1.5 bg-emerald-900/60 hover:bg-emerald-700 text-emerald-200 text-sm rounded-xl border border-emerald-500/30">🏆 課堂展示</button>
      </div>
    </div>

    <!-- 文字內容與方向 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2 bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <label for="textInput" class="block text-sm font-bold text-indigo-300 mb-2">✏️ 自訂跑馬燈內容：</label>
        <input type="text" id="textInput" value="🌟 國小五年一班 加油！ 🚀" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white font-bold outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <label class="block text-sm font-bold text-indigo-300 mb-2">↔️ 滾動方向：</label>
        <select id="directionSelect" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-white font-bold outline-none cursor-pointer">
          <option value="right-to-left">← 由右向左 (經典重複)</option>
          <option value="left-to-right">→ 由左向右</option>
          <option value="bounce">↔ 左右來回彈跳</option>
          <option value="static">⏸️ 靜止置中</option>
        </select>
      </div>
    </div>

    <!-- 主題與顏色設定 -->
    <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-4">
      <h3 class="text-base font-bold text-indigo-200 flex items-center gap-2">
        <span>🎨</span> 視覺色彩與發光主題設定
      </h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 文字顏色 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">🔤 文字顏色</label>
          <div class="flex items-center gap-2">
            <input type="color" id="textColorInput" value="#ffea00" class="w-10 h-10 rounded-lg border-0 bg-transparent cursor-pointer">
            <span id="colorHexText" class="text-xs font-mono text-slate-400">#ffea00</span>
          </div>
        </div>

        <!-- 發光主題 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">✨ 文字發光主題</label>
          <select id="glowThemeSelect" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-white text-xs font-bold cursor-pointer">
            <option value="glow-neon">霓虹強光 (Neon)</option>
            <option value="glow-soft">柔和夢幻 (Soft Glow)</option>
            <option value="glow-led">LED 點陣 (LED Display)</option>
            <option value="glow-stroke">火熱描邊 (Outline)</option>
            <option value="glow-none">純色不發光 (Flat)</option>
          </select>
        </div>

        <!-- 背景風格 -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">🖼️ 背景主題風格</label>
          <select id="bgPresetSelect" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-white text-xs font-bold cursor-pointer">
            <option value="bg-slate-950">🌌 深邃夜空 (經典黑)</option>
            <option value="gradient-party">🎉 霓虹派對 (藍紫漸層)</option>
            <option value="gradient-cyber">⚡ 賽博朋克 (藍綠漸層)</option>
            <option value="gradient-sunset">🌅 浪漫夕陽 (橘紅漸層)</option>
            <option value="gradient-aurora">🌲 極光森林 (青綠漸層)</option>
            <option value="custom">🎨 自訂純色背景</option>
          </select>
        </div>

        <!-- 自訂背景顏色 -->
        <div id="customBgContainer" class="hidden">
          <label class="block text-xs font-bold text-slate-300 mb-1.5">🖌️ 自訂背景顏色</label>
          <input type="color" id="bgColorInput" value="#0f172a" class="w-10 h-10 rounded-lg border-0 bg-transparent cursor-pointer">
        </div>
      </div>
    </div>

    <!-- 速度、大小與背景特效 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <div class="flex justify-between mb-1"><label class="text-sm font-bold text-indigo-300">🏃 滾動速度</label><span id="speedVal" class="text-xs text-indigo-200 font-mono">5</span></div>
        <input type="range" id="speedInput" min="1" max="15" value="5" class="w-full accent-indigo-500 cursor-pointer">
      </div>

      <!-- 文字大小最大至 240px -->
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <div class="flex justify-between mb-1"><label class="text-sm font-bold text-indigo-300">🔍 文字大小</label><span id="fontSizeVal" class="text-xs text-indigo-200 font-mono">60px</span></div>
        <input type="range" id="fontSizeInput" min="24" max="240" value="60" class="w-full accent-indigo-500 cursor-pointer">
      </div>

      <!-- 特效選單 (含關閉特效) -->
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
        <label class="block text-sm font-bold text-indigo-300 mb-1">✨ 背景飄浮特效圖案</label>
        <select id="particleTypeSelect" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-white text-sm font-bold cursor-pointer">
          <option value="star">⭐ 燦爛星星</option>
          <option value="heart">💖 溫馨愛心</option>
          <option value="bubble">🫧 夢幻氣泡</option>
          <option value="sparkle">✨ 閃耀星光</option>
          <option value="party">🎉 派對表情</option>
          <option value="none">🚫 無 (關閉背景特效)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 3. JavaScript 邏輯控制 -->
  <!-- ========================================== -->
  <script>
    // --- 1. 自動生成相容 PNG Icon ---
    function generateDynamicPngIcon() {
      const c = document.createElement('canvas');
      c.width = 192;
      c.height = 192;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#4f46e5';
      ctx.beginPath();
      ctx.roundRect(0, 0, 192, 192, 40);
      ctx.fill();

      ctx.font = '100px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📢', 96, 102);

      const pngDataUrl = c.toDataURL('image/png');
      document.getElementById('appleIcon').href = pngDataUrl;

      const manifestObj = {
        name: "學生酷炫跑馬燈",
        short_name: "跑馬燈",
        start_url: "./index.html",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#4f46e5",
        icons: [{ src: pngDataUrl, sizes: "192x192", type: "image/png" }]
      };

      document.getElementById('pwaManifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
    }

    generateDynamicPngIcon();

    // --- 2. DOM 元素獲取 ---
    const marqueeContainer = document.getElementById('marqueeContainer');
    const marqueeText = document.getElementById('marqueeText');
    const marqueeStage = document.getElementById('marqueeStage');
    const fullScreenBtn = document.getElementById('fullScreenBtn');
    const fullScreenText = document.getElementById('fullScreenText');
    const textInput = document.getElementById('textInput');
    const speedInput = document.getElementById('speedInput');
    const speedVal = document.getElementById('speedVal');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const textColorInput = document.getElementById('textColorInput');
    const colorHexText = document.getElementById('colorHexText');
    const directionSelect = document.getElementById('directionSelect');
    const particleTypeSelect = document.getElementById('particleTypeSelect');
    const glowThemeSelect = document.getElementById('glowThemeSelect');
    const bgPresetSelect = document.getElementById('bgPresetSelect');
    const customBgContainer = document.getElementById('customBgContainer');
    const bgColorInput = document.getElementById('bgColorInput');

    let posX = 0;
    let directionMultiplier = -1;
    let isFullScreenMode = false;

    // 重置跑馬燈起始位置
    function resetPosition() {
      const stageWidth = marqueeStage.clientWidth || window.innerWidth;
      const direction = directionSelect.value;
      if (direction === 'right-to-left') {
        posX = stageWidth;
      } else if (direction === 'left-to-right') {
        posX = -marqueeContainer.clientWidth;
      } else {
        posX = stageWidth / 2 - marqueeContainer.clientWidth / 2;
      }
    }

    function updateMarquee() {
      marqueeText.textContent = textInput.value || '請輸入文字...';
      const sizePx = fontSizeInput.value;
      marqueeText.style.fontSize = `${sizePx}px`;
      fontSizeVal.textContent = `${sizePx}px`;
      marqueeText.style.color = textColorInput.value;
      colorHexText.textContent = textColorInput.value;
      speedVal.textContent = speedInput.value;

      // 載入發光主題樣式（使用 CSS em 自動縮放）
      marqueeText.className = `inline-block font-extrabold ${glowThemeSelect.value}`;
    }

    function updateBackground() {
      const preset = bgPresetSelect.value;
      marqueeStage.style.background = '';
      marqueeStage.className = "relative w-full h-[50vh] md:h-[55vh] overflow-hidden flex items-center justify-center border-b-4 border-indigo-500 shadow-2xl transition-all duration-300";

      if (preset === 'bg-slate-950') {
        marqueeStage.classList.add('bg-slate-950');
        customBgContainer.classList.add('hidden');
      } else if (preset === 'gradient-party') {
        marqueeStage.style.background = 'linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #831843 100%)';
        customBgContainer.classList.add('hidden');
      } else if (preset === 'gradient-cyber') {
        marqueeStage.style.background = 'linear-gradient(135deg, #022c22 0%, #064e3b 50%, #0f172a 100%)';
        customBgContainer.classList.add('hidden');
      } else if (preset === 'gradient-sunset') {
        marqueeStage.style.background = 'linear-gradient(135deg, #451a03 0%, #78350f 50%, #831843 100%)';
        customBgContainer.classList.add('hidden');
      } else if (preset === 'gradient-aurora') {
        marqueeStage.style.background = 'linear-gradient(135deg, #064e3b 0%, #1e1b4b 100%)';
        customBgContainer.classList.add('hidden');
      } else if (preset === 'custom') {
        customBgContainer.classList.remove('hidden');
        marqueeStage.style.backgroundColor = bgColorInput.value;
      }
    }

    // --- 3. 跑馬燈平滑動畫 ---
    function animateMarquee() {
      const stageWidth = marqueeStage.clientWidth || window.innerWidth;
      const textWidth = marqueeContainer.clientWidth;
      const speed = parseFloat(speedInput.value);
      const direction = directionSelect.value;

      if (direction === 'static') {
        marqueeContainer.style.left = '50%';
        marqueeContainer.style.transform = 'translateX(-50%)';
      } else {
        marqueeContainer.style.left = '0px';

        if (direction === 'right-to-left') {
          posX -= speed;
          if (posX < -textWidth) {
            posX = stageWidth;
          }
        } else if (direction === 'left-to-right') {
          posX += speed;
          if (posX > stageWidth) {
            posX = -textWidth;
          }
        } else if (direction === 'bounce') {
          posX += speed * directionMultiplier;
          if (posX <= 0) directionMultiplier = 1;
          else if (posX >= stageWidth - textWidth) directionMultiplier = -1;
        }

        marqueeContainer.style.transform = `translateX(${posX}px)`;
      }

      requestAnimationFrame(animateMarquee);
    }

    function setPreset(text) {
      textInput.value = text;
      updateMarquee();
      resetPosition();
    }

    // --- 4. 全螢幕模式控制 ---
    function toggleFullScreen() {
      if (!isFullScreenMode) {
        if (marqueeStage.requestFullscreen) {
          marqueeStage.requestFullscreen().catch(() => enableCssFullscreen());
        } else {
          enableCssFullscreen();
        }
        isFullScreenMode = true;
        fullScreenBtn.classList.add('opacity-0', 'pointer-events-none');
        fullScreenText.textContent = '❌ 退出';
      } else {
        exitFullScreenMode();
      }
      triggerReflowAndSyncCanvas();
    }

    function enableCssFullscreen() {
      marqueeStage.classList.add('css-fullscreen');
    }

    function exitFullScreenMode() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      marqueeStage.classList.remove('css-fullscreen');
      isFullScreenMode = false;
      fullScreenBtn.classList.remove('opacity-0', 'pointer-events-none');
      fullScreenText.textContent = '全螢幕展示';
      triggerReflowAndSyncCanvas();
    }

    function triggerReflowAndSyncCanvas() {
      setTimeout(() => { syncCanvasDimensions(); }, 50);
      setTimeout(() => { syncCanvasDimensions(); }, 250);
    }

    marqueeStage.addEventListener('mousemove', showBtnTemporarily);
    marqueeStage.addEventListener('click', showBtnTemporarily);

    let hideTimeout;
    function showBtnTemporarily() {
      if (isFullScreenMode) {
        fullScreenBtn.classList.remove('opacity-0', 'pointer-events-none');
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          if (isFullScreenMode) {
            fullScreenBtn.classList.add('opacity-0', 'pointer-events-none');
          }
        }, 3000);
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isFullScreenMode) {
        exitFullScreenMode();
      }
    });

    // --- 5. 事件監聽 ---
    textInput.addEventListener('input', () => { updateMarquee(); resetPosition(); });
    fontSizeInput.addEventListener('input', () => { updateMarquee(); resetPosition(); });
    textColorInput.addEventListener('input', updateMarquee);
    glowThemeSelect.addEventListener('change', updateMarquee);
    speedInput.addEventListener('input', () => speedVal.textContent = speedInput.value);
    directionSelect.addEventListener('change', resetPosition);
    bgPresetSelect.addEventListener('change', updateBackground);
    bgColorInput.addEventListener('input', updateBackground);

    // --- 6. 核心 Canvas 粒子動畫系統 ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function syncCanvasDimensions() {
      const w = marqueeStage.clientWidth || window.innerWidth;
      const h = marqueeStage.clientHeight || (window.innerHeight * 0.5);

      if (w > 0 && h > 0) {
        canvas.width = w;
        canvas.height = h;
      }
      initParticles();
    }

    window.addEventListener('resize', syncCanvasDimensions);

    class Particle {
      constructor(x, y, isBurst = false) {
        const cw = canvas.width || window.innerWidth;
        const ch = canvas.height || 300;
        this.x = x || Math.random() * cw;
        this.y = y || ch + Math.random() * 20;
        this.size = Math.random() * 18 + 12;
        this.speedY = isBurst ? (Math.random() - 0.5) * 6 : -(Math.random() * 1.5 + 0.8);
        this.speedX = isBurst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 1;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.type = particleTypeSelect.value;
      }

      update() {
        const cw = canvas.width || window.innerWidth;
        const ch = canvas.height || 300;

        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < -30) {
          this.y = ch + 10;
          this.x = Math.random() * cw;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let symbol = '⭐';
        if (this.type === 'heart') symbol = '💖';
        if (this.type === 'bubble') symbol = '🫧';
        if (this.type === 'sparkle') symbol = '✨';
        if (this.type === 'party') symbol = '🎉';

        ctx.fillText(symbol, this.x, this.y);
        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      if (particleTypeSelect.value !== 'none') {
        const cw = canvas.width || window.innerWidth;
        const pCount = cw < 600 ? 20 : 35;
        for (let i = 0; i < pCount; i++) {
          particles.push(new Particle(Math.random() * cw, Math.random() * (canvas.height || 300)));
        }
      }
    }

    function animateParticles() {
      const cw = canvas.width || window.innerWidth;
      const ch = canvas.height || 300;

      ctx.clearRect(0, 0, cw, ch);

      if (particleTypeSelect.value !== 'none') {
        if (particles.length === 0) {
          initParticles();
        }
        particles.forEach(p => {
          p.update();
          p.draw();
        });
      }

      requestAnimationFrame(animateParticles);
    }

    marqueeStage.addEventListener('click', (e) => {
      if (particleTypeSelect.value === 'none') return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      for (let i = 0; i < 6; i++) {
        particles.push(new Particle(clickX, clickY, true));
      }
    });

    particleTypeSelect.addEventListener('change', () => {
      initParticles();
    });

    // 啟動初始化與迴圈
    syncCanvasDimensions();
    updateMarquee();
    updateBackground();
    resetPosition();
    animateMarquee();
    animateParticles();

    // --- 7. PWA Service Worker 註冊 ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
