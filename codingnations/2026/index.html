<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上頒獎典禮系統</title>
  <!-- 引入免費 MQTT 即時通訊套件 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background: #0f172a; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }

    /* 控台 UI (Send) */
    #send-ui { text-align: center; display: none; max-width: 800px; padding: 20px; }
    .award-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 25px; }
    .btn-award {
      padding: 20px 10px; font-size: 20px; font-weight: bold;
      background: #1e293b; color: #38bdf8; border: 2px solid #38bdf8;
      border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-award:hover { background: #38bdf8; color: #0f172a; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
    .btn-award:active { transform: scale(0.95); }

    /* 主畫面 UI (Got) */
    #got-ui { text-align: center; display: none; width: 100%; height: 100%; position: relative; }

    /* 貓頭鷹動態圖檔樣式 */
    .owl-container {
      position: absolute;
      top: 35%;
      right: -180px;
      width: 120px;
      height: 120px;
      pointer-events: none;
      z-index: 20;
    }

    .owl-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 獎狀彈窗 */
    #award-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 10; text-align: center;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #certificate-img {
      max-width: 80vw; max-height: 70vh; border-radius: 12px;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.4); border: 4px solid #fbbf24;
    }
    .btn-reset { margin-top: 20px; padding: 10px 25px; font-size: 16px; background: #ef4444; color: white; border: none; border-radius: 20px; cursor: pointer; }

    @keyframes popIn {
      from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 發送端 UI (控台) -->
  <div id="send-ui">
    <h1>🎛️ 主辦單位頒獎控制台</h1>
    <p style="color: #94a3b8;">點擊名次，貓頭鷹將帶出該名次獎狀 (1.png ~ 10.png)</p>
    <div class="award-grid">
      <button class="btn-award" onclick="triggerAward(1)">第 1 名</button>
      <button class="btn-award" onclick="triggerAward(2)">第 2 名</button>
      <button class="btn-award" onclick="triggerAward(3)">第 3 名</button>
      <button class="btn-award" onclick="triggerAward(4)">第 4 名</button>
      <button class="btn-award" onclick="triggerAward(5)">第 5 名</button>
      <button class="btn-award" onclick="triggerAward(6)">第 6 名</button>
      <button class="btn-award" onclick="triggerAward(7)">第 7 名</button>
      <button class="btn-award" onclick="triggerAward(8)">第 8 名</button>
      <button class="btn-award" onclick="triggerAward(9)">第 9 名</button>
      <button class="btn-award" onclick="triggerAward(10)">第 10 名</button>
    </div>
    <p id="status-msg" style="margin-top: 20px; color: #38bdf8;"></p>
  </div>

  <!-- 接收端 UI (大螢幕) -->
  <div id="got-ui">
    <h1 style="color: #64748b; margin-top: 40px;">🏆 線上頒獎典禮現場</h1>
    <div id="award-modal">
      <img id="certificate-img" src="" alt="獎狀">
      <br>
      <button class="btn-reset" onclick="hideCertificate()">準備下一位頒獎</button>
    </div>
  </div>

  <!-- 貓頭鷹動態元件 -->
  <div id="owl" class="owl-container">
    <img id="owl-sprite" class="owl-img" src="Code_1.png" alt="Owl">
  </div>

  <script>
    const TOPIC = 'coding_assoc_2026_ceremony_secret_owl_98721';
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');

    if (role === 'send') {
      document.title = "頒獎控台 (Send)";
      document.getElementById('send-ui').style.display = 'block';
    } else {
      document.title = "頒獎典禮大螢幕 (Got)";
      document.getElementById('got-ui').style.display = 'block';
    }

    client.on('connect', () => {
      console.log('MQTT 即時連線成功！');
      if (role !== 'send') {
        client.subscribe(TOPIC);
      }
    });

    // ----------------- 貓頭鷹連續揮翅動畫 (Code_1.png ~ Code_4.png) -----------------
    let flapInterval = null;
    function startFlapping() {
      let frameIndex = 1;
      const owlSprite = document.getElementById('owl-sprite');
      if (flapInterval) clearInterval(flapInterval);
      
      flapInterval = setInterval(() => {
        frameIndex = (frameIndex % 4) + 1;
        owlSprite.src = `Code_${frameIndex}.png`;
      }, 100);
    }

    function stopFlapping() {
      if (flapInterval) {
        clearInterval(flapInterval);
        flapInterval = null;
      }
      document.getElementById('owl-sprite').src = 'Code_1.png';
    }

    // 全域動畫 Cancel Token，用來強制中斷上一輪動畫
    let currentAnimationId = null;

    // ----------------- 發送端 (Send) 邏輯 -----------------
    let isFlying = false;

    function triggerAward(rank) {
      if (isFlying) return;
      isFlying = true;

      // 💡 關鍵：一按下按鈕，立刻通知接收端「清除畫面與舊獎狀」
      client.publish(TOPIC, JSON.stringify({ action: 'clear_screen' }));

      document.getElementById('status-msg').innerText = `正在頒發 第 ${rank} 名...`;
      const owl = document.getElementById('owl');
      
      let startX = window.innerWidth + 180;
      let currentX = startX;
      const speed = 12;
      let angle = 0;

      startFlapping();

      function animate() {
        currentX -= speed;
        angle += 0.08; 
        let waveY = Math.sin(angle) * 45;

        owl.style.transform = `translate(${currentX - startX}px, ${waveY}px)`;

        if (currentX < -180) {
          // 控台貓頭鷹飛完後，發送「顯示新獎狀」訊號給接收端
          client.publish(TOPIC, JSON.stringify({ action: 'show_award', rank: rank }));
          stopFlapping();

          setTimeout(() => {
            owl.style.transform = 'translate(0px, 0px)';
            document.getElementById('status-msg').innerText = `第 ${rank} 名 獎狀已送出！`;
            isFlying = false;
          }, 300);
        } else {
          requestAnimationFrame(animate);
        }
      }
      requestAnimationFrame(animate);
    }

    // ----------------- 接收端 (Got) 邏輯 -----------------
    client.on('message', (topic, message) => {
      const data = JSON.parse(message.toString());
      
      if (data.action === 'clear_screen') {
        // 收到清除訊號：立刻隱藏獎狀、停止貓頭鷹並歸位
        resetGotScreen();
      } else if (data.action === 'show_award') {
        startGotAnimation(data.rank);
      }
    });

    let currentGotX = 0;
    let startX = 0;

    function resetGotScreen() {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }
      stopFlapping();
      document.getElementById('award-modal').style.display = 'none';
      const owl = document.getElementById('owl');
      owl.style.transform = 'translate(0px, 0px)';
    }

    function startGotAnimation(rank) {
      resetGotScreen(); // 確保開始前狀態是完全乾淨的

      const owl = document.getElementById('owl');
      
      startX = window.innerWidth + 180;
      let targetX = window.innerWidth / 2 - 60;
      currentGotX = startX;
      const speed = 12;
      let angle = 0;

      startFlapping();

      function animate() {
        currentGotX -= speed;
        angle += 0.08;
        let waveY = Math.sin(angle) * 45;

        owl.style.transform = `translate(${currentGotX - startX}px, ${waveY}px)`;

        if (currentGotX <= targetX) {
          stopFlapping();

          const certImg = document.getElementById('certificate-img');
          certImg.src = `${rank}.png`;
          certImg.onload = () => {
            document.getElementById('award-modal').style.display = 'block';
          };
          certImg.onerror = () => {
            alert(`找不到 ${rank}.png 圖片，請確認圖檔已放入專案目錄！`);
          };
        } else {
          currentAnimationId = requestAnimationFrame(animate);
        }
      }
      currentAnimationId = requestAnimationFrame(animate);
    }

    // 接收端手動點擊「準備下一位頒獎」按鈕退場
    function hideCertificate() {
      document.getElementById('award-modal').style.display = 'none';
      const owl = document.getElementById('owl');
      const speed = 12;
      let angle = 0;

      startFlapping();

      function flyOut() {
        currentGotX -= speed;
        angle += 0.08;
        let waveY = Math.sin(angle) * 45;

        owl.style.transform = `translate(${currentGotX - startX}px, ${waveY}px)`;

        if (currentGotX < -180) {
          stopFlapping();
          owl.style.transform = 'translate(0px, 0px)';
        } else {
          currentAnimationId = requestAnimationFrame(flyOut);
        }
      }
      currentAnimationId = requestAnimationFrame(flyOut);
    }
  </script>
</body>
</html>
