<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全螢幕跑馬燈 Pro</title>
  
  <!-- ==================== PWA & App 相關設定 ==================== -->
  <!-- 設置 App 主題顏色 (手機狀態列) -->
  <meta name="theme-color" content="#1e1e1e">
  <!-- 允許 iOS 將網頁加入主畫面後以全螢幕模式運行 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="跑馬燈">
  
  <!-- App Icon (使用你生成的簡單設計 Icon，需命名為 icon.png) -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- PWA Manifest 連結 (使 App 可安裝) -->
  <!-- 
    注意：在本地直接打開 HTML 檔案時，Manifest 可能不會生效。
    需將此檔案與 icon.png 上傳至伺服器 (如 GitHub Pages) 後，
    手機瀏覽器才會提示「安裝至主畫面」。
  -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none; /* 禁止 iOS 長按彈出選單 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* 防止 PWA 模式下出現滾動條 */
    }

    /* ==================== 控制面板樣式 ==================== */
    .controls-container {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      border: 1px solid #333;
      z-index: 10;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      max-height: 90vh; /* 防止內容過多 */
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #4da6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Icon 樣式 */
    h2 img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bbb;
    }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 16px; /* 防止 iOS 輸入時自動放大 */
      outline: none;
      -webkit-appearance: none; /* 清除原生樣式 */
    }

    textarea {
      resize: vertical;
      height: 70px;
      line-height: 1.4;
    }

    .row-group {
      display: flex;
      gap: 12px;
    }

    .row-group .form-group {
      flex: 1;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2a2a2a;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    ::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    ::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent; /* 禁止點擊高亮 */
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .btn-secondary {
      background-color: #333;
      color: #ccc;
      border: 1px solid #555;
    }

    .btn-secondary:hover {
      background-color: #444;
      color: #fff;
    }

    .tip {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* ==================== 全螢幕跑馬燈區域 (關鍵) ==================== */
    #marquee-fullscreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      /* 支援 iPhone X 瀏海屏 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .marquee-content {
      position: absolute;
      white-space: nowrap;
      will-change: transform; /* 優化性能 */
      font-weight: bold;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 鏡像翻轉效果 */
    .mirror {
      transform: scaleX(-1) !important;
    }

    /* ---- 1. 視覺特效 ---- */
    /* 閃爍 */
    .effect-blink {
      animation-name: blink-anim;
      animation-iteration-count: infinite;
    }

    /* 霓虹發光 */
    .effect-glow {
      text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor;
    }

    .effect-rainbow {
      background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00,
