<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全螢幕跑馬燈 Pro - 循環版</title>
  
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="跑馬燈">
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .controls-container {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      border: 1px solid #333;
      z-index: 10;
      overflow-y: auto;
      max-height: 90vh;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #4da6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h2 img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #bbb;
    }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
    }

    textarea {
      resize: vertical;
      height: 60px;
      line-height: 1.4;
    }

    .row-group {
      display: flex;
      gap: 12px;
    }

    .row-group .form-group {
      flex: 1;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2a2a2a;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-secondary {
      background-color: #333;
      color: #ccc;
      border: 1px solid #555;
    }

    .tip {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* ==================== 全螢幕跑馬燈區域 ==================== */
    #marquee-fullscreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    /* 開場主題標題樣式 */
    #intro-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 900;
      font-size: 35vh;
      white-space: nowrap;
      z-index: 2;
      display: none;
      animation: pulse-zoom 0.8s ease-in-out infinite alternate;
    }

    /* 跑馬燈內容 */
    .marquee-content {
      position: absolute;
      white-space: nowrap;
      will-change: transform;
      font-weight: bold;
      line-height: 1;
      top: 50%;
      transform: translateY(-50%);
      display: none;
    }

    .mirror {
      transform: translateY(-50%) scaleX(-1) !important;
    }

    /* 視覺特效 */
    .effect-blink { animation: blink-anim 1s infinite; }
    .effect-glow { text-shadow: 0 0 15px currentColor, 0 0 30px currentColor, 0 0 50px currentColor; }
    .effect-rainbow {
      background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: rainbow-anim 3s linear infinite;
    }

    /* ---- 動畫定義 ---- */
    @keyframes pulse-zoom {
      0% {
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 1;
      }
    }

    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    @keyframes rainbow-anim {
      to { background-position: 200% center; }
    }

    @keyframes move-up {
      0% { top: 100vh; left: 50%; transform: translateX(-50%); }
      100% { top: -100%; left: 50%; transform: translateX(-50%); }
    }
    @keyframes move-down {
      0% { top: -100%; left: 50%; transform: translateX(-50%); }
      100% { top: 100vh; left: 50%; transform: translateX(-50%); }
    }

    .dir-static {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      animation: none !important;
      white-space: normal;
      text-align: center;
      width: 90vw;
    }
    
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <!-- 控制面板 -->
  <div class="controls-container" id="controls">
    <h2>
      <img src="icon.png" alt="App Icon">
      跑馬燈 Pro
    </h2>
    
    <!-- 開場主題文字、時間與獨立顏色 -->
    <div class="form-group">
      <label for="intro-text">開場主題 (留空則純內容循環)：</label>
      <input type="text" id="intro-text" value="號外" placeholder="例如：號外、最新消息">
    </div>

    <div class="row-group">
      <div class="form-group">
        <label>主題顏色：</label>
        <div class="color-picker-wrapper">
          <input type="color" id="intro-color" value="#ff0055">
          <span id="intro-color-val" style="font-size:12px;">#ff0055</span>
        </div>
      </div>
      <div class="form-group">
        <label for="intro-duration">主題停留(秒)：</label>
        <input type="number" id="intro-duration" value="2" min="1" max="10">
      </div>
    </div>

    <!-- 內容跑馬燈 -->
    <div class="form-group">
      <label for="text-input">內容跑馬燈文字：</label>
      <textarea id="text-input" placeholder="請輸入文字...">北市若再停班停課G7還能在大巨蛋熱戰？</textarea>
    </div>

    <!-- 顏色 -->
    <div class="row-group">
      <div class="form-group">
        <label>內容顏色：</label>
        <div class="color-picker-wrapper">
          <input type="color" id="text-color" value="#ffff00">
          <span id="text-color-val" style="font-size:12px;">#ffff00</span>
        </div>
      </div>
      <div class="form-group">
        <label>背景顏色：</label>
        <div class="color-picker-wrapper">
          <input type="color" id="bg-color" value="#000000">
          <span id="bg-color-val" style="font-size:12px;">#000000</span>
        </div>
      </div>
    </div>

    <!-- 字體與特效 -->
    <div class="row-group">
      <div class="form-group">
        <label for="font-family">字體風格：</label>
        <select id="font-family">
          <option value="sans-serif">標準黑體</option>
          <option value="serif">經典明體</option>
          <option value="monospace">等寬字體</option>
        </select>
      </div>
      <div class="form-group">
        <label for="effect-style">視覺特效：</label>
        <select id="effect-style">
          <option value="none">無特效</option>
          <option value="glow" selected>霓虹發光</option>
          <option value="blink">閃爍效果</option>
          <option value="rainbow">彩虹漸層</option>
        </select>
      </div>
    </div>

    <!-- 方向與鏡像 -->
    <div class="row-group">
      <div class="form-group">
        <label for="direction">滾動方向：</label>
        <select id="direction">
          <option value="left" selected>右向左 (←)</option>
          <option value="right">左向右 (→)</option>
          <option value="up">下向上 (↑)</option>
          <option value="down">上向下 (↓)</option>
          <option value="static">固定置中</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mirror-toggle">鏡像翻轉：</label>
        <select id="mirror-toggle">
          <option value="false" selected>正常顯示</option>
          <option value="true">左右鏡像</option>
        </select>
      </div>
    </div>

    <!-- 速度與大小 -->
    <div class="row-group">
      <div class="form-group">
        <label for="font-size">內容大小 (vh)：</label>
        <input type="number" id="font-size" value="25" min="5" max="90">
      </div>
      <div class="form-group">
        <label for="speed">滾動速度 (秒)：</label>
        <input type="number" id="speed" value="10" min="1" max="60">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="start-btn">開啟全螢幕跑馬燈</button>
      <button class="btn-secondary" id="share-btn">複製分享連結</button>
    </div>

    <p class="tip">
      🔄 循環播放機制：<br>
      主題 $\rightarrow$ 0.1秒黑屏 $\rightarrow$ 內容跑完一輪 $\rightarrow$ 0.1秒黑屏 $\rightarrow$ 重複主題...
    </p>
  </div>

  <!-- 全螢幕跑馬燈區域 -->
  <div id="marquee-fullscreen">
    <div id="intro-title"></div>
    <div class="marquee-content" id="marquee-text"></div>
  </div>

  <script>
    const controls = document.getElementById('controls');
    const introTextInput = document.getElementById('intro-text');
    const introColorInput = document.getElementById('intro-color');
    const introColorVal = document.getElementById('intro-color-val');
    const introDurationInput = document.getElementById('intro-duration');
    const textInput = document.getElementById('text-input');
    const textColorInput = document.getElementById('text-color');
    const textColorVal = document.getElementById('text-color-val');
    const bgColorInput = document.getElementById('bg-color');
    const bgColorVal = document.getElementById('bg-color-val');
    const fontFamilyInput = document.getElementById('font-family');
    const effectStyleInput = document.getElementById('effect-style');
    const directionInput = document.getElementById('direction');
    const mirrorToggle = document.getElementById('mirror-toggle');
    const fontSizeInput = document.getElementById('font-size');
    const speedInput = document.getElementById('speed');

    const startBtn = document.getElementById('start-btn');
    const shareBtn = document.getElementById('share-btn');
    const fullscreenDiv = document.getElementById('marquee-fullscreen');
    const introTitle = document.getElementById('intro-title');
    const marqueeText = document.getElementById('marquee-text');

    let currentFontSize = 25;
    let isFullscreen = false;
    let mainTimer = null;

    introColorInput.addEventListener('input', e => introColorVal.textContent = e.target.value);
    textColorInput.addEventListener('input', e => textColorVal.textContent = e.target.value);
    bgColorInput.addEventListener('input', e => bgColorVal.textContent = e.target.value);

    function getSettings() {
      return {
        introText: introTextInput.value,
        introColor: introColorInput.value,
        introDuration: introDurationInput.value,
        text: textInput.value,
        textColor: textColorInput.value,
        bgColor: bgColorInput.value,
        fontFamily: fontFamilyInput.value,
        effect: effectStyleInput.value,
        direction: directionInput.value,
        mirror: mirrorToggle.value,
        fontSize: fontSizeInput.value,
        speed: speedInput.value
      };
    }

    function saveSettings() {
      localStorage.setItem('marquee_settings_pro', JSON.stringify(getSettings()));
    }

    function loadSettings() {
      const saved = localStorage.getItem('marquee_settings_pro');
      if (saved) {
        try {
          const s = JSON.parse(saved);
          introTextInput.value = s.introText !== undefined ? s.introText : '號外';
          introColorInput.value = introColorVal.textContent = s.introColor || '#ff0055';
          introDurationInput.value = s.introDuration || 2;
          textInput.value = s.text || '';
          textColorInput.value = textColorVal.textContent = s.textColor || '#ffff00';
          bgColorInput.value = bgColorVal.textContent = s.bgColor || '#000000';
          fontFamilyInput.value = s.fontFamily || 'sans-serif';
          effectStyleInput.value = s.effect || 'glow';
          directionInput.value = s.direction || 'left';
          mirrorToggle.value = s.mirror || 'false';
          fontSizeInput.value = s.fontSize || 25;
          speedInput.value = s.speed || 10;
        } catch(e) {}
      }
    }

    startBtn.addEventListener('click', launchMarquee);

    function launchMarquee() {
      saveSettings();
      const s = getSettings();
      isFullscreen = true;

      clearAllTimers();

      fullscreenDiv.style.backgroundColor = s.bgColor;
      fullscreenDiv.style.display = 'block';
      controls.classList.add('hidden');

      if (fullscreenDiv.requestFullscreen) {
        fullscreenDiv.requestFullscreen();
      } else if (fullscreenDiv.webkitRequestFullscreen) {
        fullscreenDiv.webkitRequestFullscreen();
      }

      // 開始循環播放流程
      runLoopCycle(s);
    }

    // 主循環控制函式
    function runLoopCycle(s) {
      if (!isFullscreen) return;

      const introText = s.introText.trim();
      const introDuration = (parseFloat(s.introDuration) || 2) * 1000;

      if (introText) {
        // 【步驟 1】：顯示主題
        marqueeText.style.display = 'none';
        marqueeText.style.animationName = 'none';

        introTitle.style.display = 'block';
        introTitle.textContent = introText;
        introTitle.style.color = s.introColor;
        introTitle.style.fontFamily = s.fontFamily;

        introTitle.className = '';
        if (s.effect !== 'none') introTitle.classList.add(`effect-${s.effect}`);

        // 主題顯示結束後，進入步驟 2
        mainTimer = setTimeout(() => {
          introTitle.style.display = 'none';

          // 【步驟 2】：黑屏 0.1 秒
          mainTimer = setTimeout(() => {
            // 【步驟 3】：顯示並播放內容跑馬燈
            startMainMarquee(s);
          }, 100);

        }, introDuration);

      } else {
        // 如果無主題，直接播放內容
        introTitle.style.display = 'none';
        startMainMarquee(s);
      }
    }

    // 啟動內容跑馬燈（單次完整播完後通知循環）
    function startMainMarquee(s) {
      if (!isFullscreen) return;

      marqueeText.innerHTML = s.text.trim() ? s.text.replace(/\n/g, '<br>') : "請輸入文字";
      marqueeText.style.color = s.textColor;
      marqueeText.style.fontFamily = s.fontFamily;
      
      currentFontSize = parseInt(s.fontSize) || 25;
      updateFontSize();

      marqueeText.className = 'marquee-content';

      if (s.effect !== 'none') marqueeText.classList.add(`effect-${s.effect}`);
      if (s.mirror === 'true') marqueeText.classList.add('mirror');

      const dir = s.direction;
      const speedSec = parseFloat(s.speed) || 10;
      const speed = speedSec + 's';

      marqueeText.style.display = 'block';

      // 監聽動畫播完一輪事件 (animationend) 或是使用精確倒數
      // 為了支援所有動畫模式，我們精準計算單次動畫時間
      let totalAnimTimeMs = speedSec * 1000;

      if (dir === 'static') {
        marqueeText.classList.add('dir-static');
        // 固定置中模式預設展示 5 秒後換下一輪主題
        totalAnimTimeMs = 5000; 
      } else if (dir === 'left' || dir === 'right') {
        requestAnimationFrame(() => {
          const textWidth = marqueeText.offsetWidth;
          const keyframesName = (dir === 'left') ? 'scroll-left-loop' : 'scroll-right-loop';
          
          let styleSheet = document.getElementById('dynamic-marquee-style');
          if (!styleSheet) {
            styleSheet = document.createElement('style');
            styleSheet.id = 'dynamic-marquee-style';
            document.head.appendChild(styleSheet);
          }

          if (dir === 'left') {
            styleSheet.innerHTML = `
              @keyframes ${keyframesName} {
                0% { transform: translate(100vw, -50%); }
                100% { transform: translate(-${textWidth}px, -50%); }
              }
            `;
          } else {
            styleSheet.innerHTML = `
              @keyframes ${keyframesName} {
                0% { transform: translate(-${textWidth}px, -50%); }
                100% { transform: translate(100vw, -50%); }
              }
            `;
          }

          // 設置動畫只播放一次 (1 次 = 1 個循環)
          marqueeText.style.animationName = keyframesName;
          marqueeText.style.animationDuration = speed;
          marqueeText.style.animationTimingFunction = 'linear';
          marqueeText.style.animationIterationCount = '1';
        });
      } else {
        marqueeText.style.animationName = `move-${dir}`;
        marqueeText.style.animationDuration = speed;
        marqueeText.style.animationTimingFunction = 'linear';
        marqueeText.style.animationIterationCount = '1';
      }

      // 【步驟 4】：當內容跑完一輪後 $\rightarrow$ 黑屏 0.1 秒 $\rightarrow$ 重新開始下一輪循環
      mainTimer = setTimeout(() => {
        marqueeText.style.display = 'none';
        marqueeText.style.animationName = 'none';

        // 黑屏 0.1 秒
        mainTimer = setTimeout(() => {
          // 重新觸發主題與內容的完整循環
          runLoopCycle(s);
        }, 100);

      }, totalAnimTimeMs);
    }

    function updateFontSize() {
      marqueeText.style.fontSize = `${currentFontSize}vh`;
    }

    function clearAllTimers() {
      if (mainTimer) clearTimeout(mainTimer);
    }

    fullscreenDiv.addEventListener('click', () => {
      exitMarquee();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFullscreen) exitMarquee();
    });

    function exitMarquee() {
      isFullscreen = false;
      clearAllTimers();
      
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      fullscreenDiv.style.display = 'none';
      introTitle.style.display = 'none';
      marqueeText.style.display = 'none';
      controls.classList.remove('hidden');
    }

    loadSettings();
  </script>
</body>
</html>
