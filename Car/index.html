<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honda Fit e:HEV 油耗管理</title>
  
  <!-- 手機 App Icon 與 PWA 設定 -->
  <link rel="icon" href="https://cpaizo.github.io/Car/fit.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="https://cpaizo.github.io/Car/fit.jpg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油耗管理">
  <link rel="manifest" href="manifest.json">

  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* 日式 Honda 沉穩車廠風色彩配置 */
    :root {
      --honda-red: #E40521;
      --honda-dark: #1c1c1e;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-main: #2c2c2e;
      --border-color: #d1d1d6;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, sans-serif; 
      background: var(--bg-color); 
      margin: 0; 
      padding: 12px; 
      color: var(--text-main); 
    }

    /* 頂部車廠風標題列 */
    .app-header { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      margin-bottom: 14px; 
      background: var(--card-bg); 
      padding: 12px; 
      border-radius: 10px; 
      border-top: 4px solid var(--honda-red);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
    }
    .app-logo { 
      width: 38px; 
      height: 38px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 2px solid var(--honda-red);
    }
    h2 { 
      font-size: 1.1rem; 
      color: var(--honda-dark); 
      margin: 0; 
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    /* 手機分頁 Tab (日式極簡風格) */
    .tab-bar { 
      display: flex; 
      background: var(--card-bg); 
      border-radius: 8px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); 
      margin-bottom: 14px; 
      overflow: hidden; 
      border: 1px solid var(--border-color);
    }
    .tab-btn { 
      flex: 1; 
      padding: 10px 2px; 
      text-align: center; 
      background: none; 
      border: none; 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: #636366; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .tab-btn.active { 
      background: var(--honda-red); 
      color: #fff; 
    }
    
    /* 區塊內容 */
    .section-pane { 
      display: none; 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
      margin-bottom: 20px; 
      border: 1px solid rgba(0,0,0,0.03);
    }
    .section-pane.active { display: block; }
    
    h3 {
      font-size: 0.95rem;
      color: var(--honda-dark);
      margin-top: 0;
      margin-bottom: 14px;
      border-left: 3px solid var(--honda-red);
      padding-left: 8px;
    }

    /* 表單樣式 */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #3a3a3c; font-weight: 600; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; background: #fafafa; }
    input:focus { border-color: var(--honda-red); outline: none; background: #fff; }
    
    button.submit-btn { 
      width: 100%; 
      background: var(--honda-red); 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 6px; 
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 2px 6px rgba(228, 5, 33, 0.3);
    }
    button.submit-btn:active { background: #b5041a; }

    /* 表格樣式 */
    .table-container { overflow-x: auto; max-height: 420px; border-radius: 6px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: center; }
    th { background: var(--honda-dark); color: white; padding: 10px 6px; position: sticky; top: 0; z-index: 1; font-weight: 600; }
    
    .chart-box { position: relative; height: 260px; width: 100%; }
    .loading-text { text-align: center; color: #8e8e93; padding: 20px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="app-header">
    <img src="https://cpaizo.github.io/Car/fit.jpg" class="app-logo" alt="App Icon">
    <h2>Honda Fit e:HEV 油耗管理</h2>
  </div>

  <!-- 分頁按鈕列 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab(event, 'pane-form')">📝 記帳</button>
    <button class="tab-btn" onclick="switchTab(event, 'pane-chart1')">📉 油耗</button>
    <button class="tab-btn" onclick="switchTab(event, 'pane-chart2')">🚗 里程</button>
    <button class="tab-btn" onclick="switchTab(event, 'pane-chart3')">📊 月統計</button>
    <button class="tab-btn" onclick="switchTab(event, 'pane-table')">📋 明細</button>
  </div>

  <!-- 1. 快速記帳分頁 -->
  <div id="pane-form" class="section-pane active">
    <h3>新增加油紀錄</h3>
    <div class="form-group">
      <label>加油時間</label>
      <input type="datetime-local" id="input-date">
    </div>
    <div class="form-group">
      <label>當前總里程 (km)</label>
      <input type="number" step="0.1" id="input-odo" placeholder="例如: 3482">
    </div>
    <div class="form-group">
      <label>公升數 (L)</label>
      <input type="number" step="0.01" id="input-liters" placeholder="例如: 31.95">
    </div>
    <div class="form-group">
      <label>油價單價 (元/L)</label>
      <input type="number" step="0.1" id="input-price" placeholder="例如: 30.1">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="submitData()">送出紀錄</button>
  </div>

  <!-- 2. 油耗趨勢圖分頁 -->
  <div id="pane-chart1" class="section-pane">
    <h3>平均油耗趨勢 (km/L)</h3>
    <div class="chart-box">
      <canvas id="fuelChart"></canvas>
    </div>
  </div>

  <!-- 3. 總里程摘要分頁 -->
  <div id="pane-chart2" class="section-pane">
    <h3>目前車輛總里程</h3>
    <div id="odoSummary">載入中...</div>
  </div>

  <!-- 4. 每月開車里程數長條圖分頁 -->
  <div id="pane-chart3" class="section-pane">
    <h3>每月開車里程數統計</h3>
    <div class="chart-box">
      <canvas id="monthlyKmChart"></canvas>
    </div>
  </div>

  <!-- 5. 歷史明細表格分頁 -->
  <div id="pane-table" class="section-pane">
    <h3>歷史紀錄明細</h3>
    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>總里程</th>
            <th>公升</th>
            <th>油耗</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" class="loading-text">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 引入獨立的 app.js 邏輯 -->
  <script src="app.js"></script>
</body>
</html>
