<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上競賽題目對照表生成器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #1a365d;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            font-size: 1.4rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2d3748;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
        }
        textarea {
            height: 160px;
            resize: vertical;
            font-family: monospace;
            line-height: 1.4;
        }
        .hint {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 4px;
        }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 25px;
            display: none;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .copy-btn {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
            background-color: #38a169;
        }
        .copy-btn:hover {
            background-color: #2f855a;
        }
        pre {
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 競賽題目對照表生成器</h2>

    <div class="form-group">
        <label for="groupSelect">1. 請選擇組別：</label>
        <select id="groupSelect">
            <option value="group1">第 1 組 (Mz & Mx)</option>
            <option value="group2">第 2 組 (Tr & Th)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="inputData">2. 請貼上抽籤題目資料：</label>
        <textarea id="inputData" placeholder="例如：
No. 1 (Q#4)
【EN】Energy-Saving & Carbon-Reduction Symphony | 【中】節能減碳交響樂
No. 2 (Q#6)
【EN】The Rock of Protecting Life | 【中】守護生命的磐石"></textarea>
        <div class="hint">系統會自動擷取 (Q#數字)、英文題目與中文題目。</div>
    </div>

    <button onclick="generateMapping()">確定產生對照表</button>

    <div class="result-box" id="resultBox">
        <div class="result-header">
            <label>生成結果：</label>
            <button class="copy-btn" onclick="copyResult()">一鍵複製內容</button>
        </div>
        <pre id="outputContent"></pre>
    </div>
</div>

<script>
    // 預設填入抽籤題目範例
    document.getElementById('inputData').value = 
`No. 1 (Q#4)
【EN】Energy-Saving & Carbon-Reduction Symphony | 【中】節能減碳交響樂
No. 2 (Q#6)
【EN】The Rock of Protecting Life | 【中】守護生命的磐石
No. 3 (Q#10)
【EN】Great Love Lights Up the Dark Night | 【中】大愛點亮黑夜
No. 4 (Q#11)
【EN】Eco Light-Switching Hero | 【中】隨手關燈小尖兵
No. 5 (Q#12)
【EN】Kindness Supplies Sorter | 【中】愛心物資分類手`;

    function generateMapping() {
        const groupType = document.getElementById('groupSelect').value;
        const rawText = document.getElementById('inputData').value;

        if (!rawText.trim()) {
            alert('請輸入題目資料！');
            return;
        }

        const lines = rawText.split('\n');
        let currentQ = '';
        let items = [];

        lines.forEach(line => {
            const qMatch = line.match(/\(Q#(\d+)\)/);
            if (qMatch) {
                currentQ = `(Q#${qMatch[1]})`;
            }

            const enZhMatch = line.match(/(?:【EN】)?(.+?)\s*\|\s*(?:【中】)?(.+)/);
            if (enZhMatch && currentQ) {
                items.push({
                    q: currentQ,
                    en: enZhMatch[1].replace(/【EN】/g, '').trim(),
                    zh: enZhMatch[2].replace(/【中】/g, '').trim()
                });
                currentQ = '';
            }
        });

        if (items.length === 0) {
            alert('無法解析題目格式，請確認資料格式！');
            return;
        }

        let teams = [];
        if (groupType === 'group1') {
            teams = [
                { code: 'Mz', name: 'Mozambique' },
                { code: 'Mx', name: 'Mexico' }
            ];
        } else {
            teams = [
                { code: 'Tr', name: 'Turkey' },
                { code: 'Th', name: 'Thailand' }
            ];
        }

        let resultText = '';

        teams.forEach((team, teamIndex) => {
            resultText += `【${team.code} 隊】${team.name} 對照表\n`;
            items.forEach((item, index) => {
                resultText += `${team.code}${index + 1} ➔ ${item.q} ${item.en} | ${item.zh}\n`;
            });
            if (teamIndex < teams.length - 1) {
                resultText += '\n';
            }
        });

        document.getElementById('outputContent').textContent = resultText;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyResult() {
        const content = document.getElementById('outputContent').textContent;
        navigator.clipboard.writeText(content).then(() => {
            alert('對照表已複製到剪貼簿！');
        }).catch(err => {
            alert('複製失敗，請手動選取複製。');
        });
    }
</script>

</body>
</html>
