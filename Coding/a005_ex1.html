<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班級永續行動選擇模擬器｜有限資源取捨互動網頁</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --ink: #1e293b;
      --muted: #52606d;
      --primary: #0f766e;
      --primary-soft: #f0fdfa;
      --sky: #0369a1;
      --accent: #d97706;
      --accent-soft: #fffbeb;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --border: #e6dfd3;
      --radius: 18px;
      --shadow: 0 10px 28px rgba(30, 41, 59, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      font-size: 17px;
    }

    .wrap {
      max-width: 960px;
      margin: 28px auto 32px;
      padding: 0 18px;
    }

    .header {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 26px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 4px 0 8px;
      font-size: 1.78rem;
      color: var(--primary);
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .budget-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .budget-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .budget-box span {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .budget-box strong {
      font-size: 1.5rem;
      color: var(--ink);
    }

    .budget-box.highlight strong {
      color: var(--primary);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .opt-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .opt-card.selected {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.12);
    }

    .opt-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .opt-title {
      font-weight: 800;
      font-size: 1.06rem;
    }

    .cost-pill {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #fde68a;
      font-size: 0.84rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .opt-desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .opt-impact {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }

    .summary-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
    }

    .alert-msg {
      display: none;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .alert-msg.show {
      display: block;
    }

    .picked-list {
      margin: 8px 0 14px;
      padding-left: 20px;
    }

    .reset-btn {
      background: #fff;
      color: var(--muted);
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .site-footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 18px 56px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      line-height: 1.8;
    }

    .site-footer p {
      margin: 4px 0;
    }

    .site-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div style="font-size:0.86rem; font-weight:700; color:var(--primary);">🌱 單元 05 · 有限資源選擇模擬器</div>
      <h1>班級永續行動方案挑選</h1>
      <p>班級共有 <strong>12 點</strong>永續預算，請點選你想推行的行動方案，看看怎麼搭配最有意義！</p>
    </header>

    <section class="budget-bar">
      <div class="budget-box highlight">
        <span>剩餘永續點數</span>
        <strong id="remainPts">12 點</strong>
      </div>
      <div class="budget-box">
        <span>已使用點數</span>
        <strong id="usedPts">0 / 12 點</strong>
      </div>
      <div class="budget-box">
        <span>累計永續成效</span>
        <strong id="ecoScore">0 分</strong>
      </div>
      <div class="budget-box">
        <span>累計生活便利度</span>
        <strong id="convScore">0 分</strong>
      </div>
    </section>

    <main class="options-grid" id="optionsGrid"></main>

    <section class="summary-card">
      <div class="alert-msg" id="alertMsg"></div>
      <strong>📋 目前選擇的永續方案：</strong>
      <ul class="picked-list" id="pickedList">
        <li>尚未選擇任何方案，點選上方卡片開始規劃吧！</li>
      </ul>
      <button class="reset-btn" onclick="resetChoices()">🔄 重新選擇</button>
    </section>
  </div>

  <footer class="site-footer">
    <p>© 2026 CPAIZO STDUIO 版權所有</p>
    <p>歡迎教師於課堂教學與非營利研習使用，請勿未經同意轉售或作商業用途；教學交流或問題回報請聯繫：<a href="mailto:cpaizo.email@gmail.com">cpaizo.email@gmail.com</a></p>
  </footer>

  <script>
    const TOTAL_BUDGET = 12;
    const ACTIONS = [
      { id: "cup", title: "自備環保杯與餐具角", cost: 4, eco: 4, conv: 2, desc: "鼓勵同學帶水壺與餐具，減少一次性杯碗使用。" },
      { id: "sort", title: "班級回收分類升級站", cost: 3, eco: 3, conv: 3, desc: "清楚標示紙類、塑膠與一般垃圾，提升回收正確率。" },
      { id: "light", title: "下課隨手關燈與電扇小隊長", cost: 2, eco: 3, conv: 3, desc: "離開教室或光線充足時主動關閉多餘電源。" },
      { id: "paper", title: "雙面用紙與草稿回收盒", cost: 2, eco: 2, conv: 4, desc: "練習單面列印紙再做計算草稿，省紙又方便。" },
      { id: "plant", title: "窗台綠意植栽照顧計畫", cost: 5, eco: 4, conv: 1, desc: "布置綠植美化環境，但需每天安排輪值澆水照顧。" },
      { id: "walk", title: "上下學綠色通勤鼓勵卡", cost: 4, eco: 4, conv: 2, desc: "鼓勵步行、腳踏車或大眾運輸，減碳兼顧運動。" }
    ];

    let selectedIds = new Set();

    function toggleAction(id) {
      const item = ACTIONS.find((a) => a.id === id);
      if (!item) return;

      const alertEl = document.getElementById("alertMsg");
      alertEl.classList.remove("show");

      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        const currentUsed = getUsedPoints();
        if (currentUsed + item.cost > TOTAL_BUDGET) {
          alertEl.textContent = `⚠️ 剩餘點數不足！選擇「${item.title}」需要 ${item.cost} 點，但目前只剩 ${TOTAL_BUDGET - currentUsed} 點。請先取消部分項目或改選其他方案。`;
          alertEl.classList.add("show");
          return;
        }
        selectedIds.add(id);
      }

      renderAll();
    }

    function resetChoices() {
      selectedIds.clear();
      document.getElementById("alertMsg").classList.remove("show");
      renderAll();
    }

    function getUsedPoints() {
      let sum = 0;
      selectedIds.forEach((id) => {
        const found = ACTIONS.find((a) => a.id === id);
        if (found) sum += found.cost;
      });
      return sum;
    }

    function renderAll() {
      const used = getUsedPoints();
      const remain = TOTAL_BUDGET - used;

      let ecoSum = 0;
      let convSum = 0;
      const pickedItems = [];

      ACTIONS.forEach((act) => {
        if (selectedIds.has(act.id)) {
          ecoSum += act.eco;
          convSum += act.conv;
          pickedItems.push(act);
        }
      });

      document.getElementById("remainPts").textContent = `${remain} 點`;
      document.getElementById("usedPts").textContent = `${used} / ${TOTAL_BUDGET} 點`;
      document.getElementById("ecoScore").textContent = `${ecoSum} 分`;
      document.getElementById("convScore").textContent = `${convSum} 分`;

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = ACTIONS.map((act) => {
        const isSel = selectedIds.has(act.id);
        return `
          <div class="opt-card ${isSel ? "selected" : ""}" onclick="toggleAction('${act.id}')">
            <div>
              <div class="opt-top">
                <div class="opt-title">${isSel ? "✅ " : ""}${act.title}</div>
                <span class="cost-pill">${act.cost} 點</span>
              </div>
              <p class="opt-desc">${act.desc}</p>
            </div>
            <div class="opt-impact">永續 +${act.eco}｜便利 +${act.conv}</div>
          </div>
        `;
      }).join("");

      const listEl = document.getElementById("pickedList");
      if (pickedItems.length === 0) {
        listEl.innerHTML = "<li>尚未選擇任何方案，點選上方卡片開始規劃吧！</li>";
      } else {
        listEl.innerHTML = pickedItems
          .map((p) => `<li><strong>${p.title}</strong>（花費 ${p.cost} 點、永續 +${p.eco}、便利 +${p.conv}）</li>`)
          .join("");
      }
    }

    renderAll();
  </script>
</body>
</html>
